name: Protect certain files to avoid further changes

on:
  push:
    branches:
      - 'master'
      - '202[2-9][0-9][0-9]'
  pull_request:
    branches:
      - 'master'
      - '202[2-9][0-9][0-9]'

permissions:
  contents: read

jobs:
  check-file:
    if: ${{ github.event.deleted != true }}
    runs-on: [self-hosted, linux, bazel-x64]
    steps:
      - name: Check protected files
        working-directory: ${{ runner.temp }}
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for commit in "$BASE_SHA" "$HEAD_SHA"; do
            if [[ ! "$commit" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Error: Missing or invalid event commit."
              exit 1
            fi
          done

          # Compare trees without checking out files from a PR on the runner.
          GIT_DIR=$(mktemp -d "${RUNNER_TEMP}/protected-files.XXXXXXXX")
          export GIT_DIR
          trap 'rm -rf -- "$GIT_DIR"' EXIT
          git init --bare --quiet
          commits=("$HEAD_SHA")
          if [[ "$BASE_SHA" == 0000000000000000000000000000000000000000 ]]; then
            # A new branch has no previous tree; protected files count as additions.
            BASE_SHA=$(git hash-object -w -t tree --stdin < /dev/null)
          else
            commits+=("$BASE_SHA")
          fi
          git -c credential.helper= -c 'credential.helper=!f() { echo username=x-access-token; echo "password=$GH_TOKEN"; }; f' \
            fetch --quiet --no-tags --depth=1 --filter=blob:none \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "${commits[@]}"

          protected_files=('src/sonic-config-engine/minigraph.py' 'files/build_templates/init_cfg.json.j2')
          changed_files=$(git diff --name-only --no-renames "$BASE_SHA" "$HEAD_SHA" -- "${protected_files[@]}")
          if [[ -n "$changed_files" ]]; then
            echo "Error: You are trying to modify protected files:"
            printf '%s\n' "$changed_files"
            exit 1
          fi
          echo "No changes detected in protected files"
