name: Protect certain files to avoid further changes

on:
  push:
    branches:
      - 'master'
      - '202[2-9][0-9][0-9]'
  pull_request:
    branches:
      - 'master'
      - '202[2-9][0-9][0-9]'

jobs:
  check-file:
    if: ${{ github.event.deleted != true }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Check protected files
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for commit in "$BASE_SHA" "$HEAD_SHA"; do
            if [[ ! "$commit" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Error: Missing or invalid event commit."
              exit 1
            fi
          done

          # Checkout contains the tested PR merge or the pushed commit.
          git cat-file -e "${HEAD_SHA}^{commit}"
          if [[ "$BASE_SHA" == 0000000000000000000000000000000000000000 ]]; then
            # A new branch has no previous tree; protected files count as additions.
            BASE_SHA=$(git hash-object -w -t tree --stdin < /dev/null)
          else
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            git cat-file -e "${BASE_SHA}^{commit}"
          fi

          protected_files=('src/sonic-config-engine/minigraph.py' 'files/build_templates/init_cfg.json.j2')
          changed_files=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- "${protected_files[@]}")
          if [[ -n "$changed_files" ]]; then
            echo "Error: You are trying to modify protected files:"
            printf '%s\n' "$changed_files"
            exit 1
          fi
          echo "No changes detected in protected files"
