name: Semgrep

on:
  pull_request: {}
  push:
    branches:
      - master
      - '201[7-9][0-1][0-9]'
      - '202[0-9][0-1][0-9]'

jobs:
  semgrep:
    # Temporary: PR #64 runs only the native installer until it passes.
    if: ${{ github.head_ref != 'codex/vs-oci-build-session' && github.ref != 'refs/heads/codex/vs-oci-build-session' && (github.repository_owner == 'sonic-net') }}
    name: Semgrep
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep
    steps:
      - uses: actions/checkout@v3
      - run: semgrep ci
        env:
           SEMGREP_RULES: |
             p/default
             r/python.lang.security.audit.dangerous-system-call-audit.dangerous-system-call-audit
             r/c.lang.security.insecure-use-strcat-fn.insecure-use-strcat-fn
             r/c.lang.security.insecure-use-string-copy-fn.insecure-use-string-copy-fn
