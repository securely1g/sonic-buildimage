name: P4 official source connectivity diagnostic

on:
  push:
    branches: [codex/pr64-p4-source-connectivity]

permissions:
  contents: read

jobs:
  probe:
    if: github.repository == 'securely1g/sonic-buildimage' && github.ref == 'refs/heads/codex/pr64-p4-source-connectivity'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the diagnostic parser offline
        run: /usr/bin/python3 -B tools/ci/tests/p4_source_connectivity_test.py
      - name: Fetch original official source packages without repair
        run: /usr/bin/python3 -B tools/ci/p4_source_connectivity.py --output artifacts/p4-source-connectivity
      - name: Preserve public source bytes and diagnostic results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: p4-official-sources-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/p4-source-connectivity/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
