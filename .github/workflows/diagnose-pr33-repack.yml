name: Diagnose PR33 OCI repack

on:
  push:
    branches: [codex/diag-pr33-repack-20261025]

permissions:
  contents: read
  actions: read

concurrency:
  group: diagnose-pr33-repack
  cancel-in-progress: false

jobs:
  syncd-image-test:
    runs-on: [self-hosted, linux, x64, sonic-vs-source-master]
    timeout-minutes: 180
    env:
      SOURCE_SHA: 90fa6735a0c75545f72f8c4d5306f48e829476a8
      BAZEL: bazel
      P4RT_BUILD_WITH_BAZEL_TARS: "y"
      SONIC_CI_CONTAINER_LABEL: io.sonic-buildimage.ci-job=${{ github.repository }}:${{ github.run_id }}:${{ github.run_attempt }}:repack-diagnostic
      SONIC_BAZEL_CACHE_SOURCE: /data/sonic-runner/cache/sonic-buildimage/bazel
      SONIC_DPKG_CACHE_SOURCE: /data/sonic-runner/cache/sonic-buildimage/packages
      SONIC_DPKG_CACHE_METHOD: rwcache
    defaults:
      run:
        shell: bash
        working-directory: vs-${{ github.run_id }}-${{ github.run_attempt }}
    steps:

      - name: Check source-build runner capacity
        working-directory: ${{ github.workspace }}
        run: |
          docker info > /dev/null
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          workspace = Path.cwd().resolve()
          usage = shutil.disk_usage(workspace)
          free_gib = usage.free / 1024**3
          print(f'Workspace: {workspace}; available: {free_gib:.1f} GiB; '
                f'total: {usage.total / 1024**3:.1f} GiB', flush=True)
          if usage.free < 100 * 1024**3:
              raise SystemExit(f'The full Make VS build needs at least 100 GiB free; '
                               f'{workspace} has {free_gib:.1f} GiB available')
          PY

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # An interrupted submodule clone can leave an invalid HEAD that the
          # checkout action's superproject clean/reset cannot repair.
          path: vs-${{ github.run_id }}-${{ github.run_attempt }}
          fetch-depth: 3
          persist-credentials: false
          submodules: recursive

      - name: Verify diagnostic-only changes and record source provenance
        run: |
          mkdir -p artifacts/vs
          python3 - <<'PYCODE'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          changed = set(git('diff', '--name-only', os.environ['SOURCE_SHA'], 'HEAD').splitlines())
          assert changed == {'.github/workflows/diagnose-pr33-repack.yml', 'tools/bazel/oci/image_validation.py'}, sorted(changed)
          assert not git('status', '--porcelain', '--untracked-files=no'), 'Dirty diagnostic source tree'
          paths = ['MODULE.bazel', '.bazelversion', '.bazelrc',
                   'dockers/docker-base-trixie/bazel/draft_sources.json',
                   'platform/vs/docker-syncd-vs/BUILD.bazel', 'tools/bazel/oci/image_validation.py']
          receipt = {
              'source_revision': os.environ['SOURCE_SHA'], 'diagnostic_revision': git('rev-parse', 'HEAD'),
              'tree': git('rev-parse', 'HEAD^{tree}'), 'changed_files': sorted(changed),
              'source_artifact_run': 40147247150, 'source_artifact_id': 12582801254,
              'source_artifact_digest': 'sha256:eed5035469db32f561f0acfa3a64b256f73ffe65a8cac35495123c6c48ac8a8f',
              'files': {name: hashlib.sha256(Path(name).read_bytes()).hexdigest() for name in paths},
              'scope': 'Fresh Syncd runtime/debug archives and strict P4 image test; no VS installer target.',
          }
          Path('artifacts/vs/provenance.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PYCODE

      - name: Check VS build prerequisites
        run: python3 -B tools/ci/runner/preflight.py --workspace "$PWD"

      - name: Prepare persistent agent caches
        run: |
          # Keep ordinary Make writers separate from older root-created cache entries.
          SONIC_BAZEL_CACHE_SOURCE="$SONIC_BAZEL_CACHE_SOURCE/make-uid-$(id -u)"
          install -d -m 0700 "$SONIC_BAZEL_CACHE_SOURCE" "$SONIC_DPKG_CACHE_SOURCE"
          test -w "$SONIC_BAZEL_CACHE_SOURCE"
          test -w "$SONIC_DPKG_CACHE_SOURCE"
          printf 'SONIC_BAZEL_CACHE_SOURCE=%s\n' "$SONIC_BAZEL_CACHE_SOURCE" >> "$GITHUB_ENV"
          printf 'Bazel cache: %s\nMake package cache: %s (%s)\n' \
            "$SONIC_BAZEL_CACHE_SOURCE" "$SONIC_DPKG_CACHE_SOURCE" "$SONIC_DPKG_CACHE_METHOD"

      - name: Download pinned sources retained by the original source job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bazel-repository-inputs
          run-id: 40147247150
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: vs-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/vs/repository-inputs

      - name: Prepare the shared Bazel source-download directory
        run: |
          python3 -B tools/bazel/gzip/source_archive.py \
            --archives-dir artifacts/vs/repository-inputs \
            --output "$SONIC_BAZEL_CACHE_SOURCE/distdir" \
            > artifacts/vs/source-download-receipt.json

      - name: Configure the native VS image
        run: |
          mkdir -p artifacts/vs
          make init 2>&1 | tee artifacts/vs/init.log
          make configure PLATFORM=vs PLATFORM_ARCH=amd64 \
            SONIC_BUILDER_EXTRA_CMDLINE="--label $SONIC_CI_CONTAINER_LABEL -e BAZEL=$BAZEL" \
            2>&1 | tee artifacts/vs/configure.log

      - name: Check nested Docker in both build environments
        timeout-minutes: 10
        run: |
          set -o pipefail
          for build_env in bookworm trixie; do
            make -f Makefile.work BLDENV="$build_env" docker-start \
              SONIC_BUILDER_EXTRA_CMDLINE="--label $SONIC_CI_CONTAINER_LABEL -e BAZEL=$BAZEL" \
              2>&1 | tee "artifacts/vs/docker-start-$build_env.log"
          done

      - name: Prepare source dependencies inside the Trixie build environment
        run: |
          cat > artifacts/vs/prepare-source-dependencies.sh <<'SH'
          # AUTO-GENERATED by .github/workflows/bazel-oci.yml. DO NOT EDIT MANUALLY.
          set -euo pipefail
          python3 -B tools/bazel/ci/prepare_draft_sources.py \
            --manifest dockers/docker-base-trixie/bazel/draft_sources.json \
            --output "$PWD/target/bazel-draft-sources" \
            --receipt artifacts/vs/draft-sources.json \
            --bazel "$BAZEL" --bazelrc-output .bazelrc.user
          SH
          make -f Makefile.work BLDENV=trixie sonic-slave-run \
            SONIC_BUILDER_EXTRA_CMDLINE="--label $SONIC_CI_CONTAINER_LABEL -e BAZEL=$BAZEL" \
            SONIC_RUN_CMDS="bash artifacts/vs/prepare-source-dependencies.sh" \
            2>&1 | tee artifacts/vs/prepare-source-dependencies.log

      - name: Build only the Syncd runtime and debug archives
        env:
          BAZEL_CONTAINER_ARGS: >-
            --distdir=/bazel_cache/distdir/ape-1.0.1
            --distdir=/bazel_cache/distdir/download_utils-1.0.1
            --distdir=/bazel_cache/distdir/rules_coreutils-1.0.1
            --distdir=/bazel_cache/distdir/rules_gzip-1.0.0
            --distdir=/bazel_cache/distdir/toolchain_utils-1.0.2
        run: |
          make target/docker-syncd-vs.gz target/docker-syncd-vs-dbg.gz \
            BUILD_WITH_BAZEL_WHEN_AVAILABLE=y INCLUDE_VS_DASH_SAI=y INCLUDE_FIPS=y VS_VALIDATE_SERVICES=y \
            ENABLE_ASAN=n ENABLE_SYNCD_RPC=n \
            SONIC_BUILDER_EXTRA_CMDLINE="--label $SONIC_CI_CONTAINER_LABEL -e BAZEL=$BAZEL -e BAZEL_CONTAINER_ARGS" \
            2>&1 | tee artifacts/vs/build.log
          sha256sum target/docker-syncd-vs.gz target/docker-syncd-vs-dbg.gz > artifacts/vs/archives-before.sha256

      - name: Run strict image validation and print the bounded OCI inventory diff
        run: |
          cat > artifacts/vs/check-syncd-p4-images.sh <<'SH'
          # AUTO-GENERATED by .github/workflows/bazel-oci.yml. DO NOT EDIT MANUALLY.
          set -euo pipefail
          make -f slave.mk docker-start
          test_status=0
          python3 -B tools/bazel/oci/native_build.py test --config=syncd-dash //tools/bazel/tests:syncd_p4_images_test \
            --nocache_test_results --test_output=all --nozip_undeclared_test_outputs --lockfile_mode=update || test_status=$?
          mkdir -p artifacts/vs/syncd-p4-images
          for file in test.log test.xml test.outputs/validation.json; do
            path="bazel-testlogs/tools/bazel/tests/syncd_p4_images_test/$file"
            if test -f "$path"; then
              cp "$path" "artifacts/vs/syncd-p4-images/$(basename "$file")"
            fi
          done
          printf '%s\n' "$test_status" > artifacts/vs/test-exit-code.txt
          exit "$test_status"
          SH
          make -f Makefile.work BLDENV=trixie sonic-slave-run \
            SONIC_BUILDER_EXTRA_CMDLINE="--label $SONIC_CI_CONTAINER_LABEL -e BAZEL=$BAZEL" \
            SONIC_RUN_CMDS="bash artifacts/vs/check-syncd-p4-images.sh" \
            2>&1 | tee artifacts/vs/syncd-p4-images.log

      - name: Retain bounded diagnostics and verify the test preserved Make archives
        if: always()
        run: |
          mkdir -p artifacts/repack-diagnostic
          python3 - <<'PYCODE'
          import hashlib
          import json
          from pathlib import Path
          output = Path('artifacts/repack-diagnostic')
          inputs = [Path('MODULE.bazel'), Path('MODULE.bazel.lock'), Path('.bazelrc.user'),
                    Path('tools/bazel/oci/image_validation.py')]
          inputs += sorted(Path('target/bazel-manifests').glob('*/manifest.json'))
          hashes = {str(p): hashlib.sha256(p.read_bytes()).hexdigest() for p in inputs if p.is_file()}
          (output / 'final-inputs.json').write_text(json.dumps(hashes, indent=2) + '\n')
          files = list(Path('artifacts/vs').glob('*.log')) + list(Path('artifacts/vs').glob('*.json'))
          files += list(Path('artifacts/vs').glob('*.sha256')) + list(Path('artifacts/vs').glob('*-exit-code.txt'))
          files += list(Path('artifacts/vs/syncd-p4-images').glob('*'))
          files += list(Path('target/bazel-native').glob('action-audit-*.json'))
          for path in files:
              if not path.is_file():
                  continue
              with path.open('rb') as stream:
                  size = path.stat().st_size
                  stream.seek(max(0, size - 16 * 1024 * 1024))
                  (output / path.name).write_bytes(stream.read())
          before = Path('artifacts/vs/provenance.json')
          if before.is_file():
              expected = json.loads(before.read_text())['files']['tools/bazel/oci/image_validation.py']
              assert hashes['tools/bazel/oci/image_validation.py'] == expected, 'Diagnostic Python changed'
          PYCODE
          if test -f artifacts/vs/archives-before.sha256; then
            sha256sum --check artifacts/vs/archives-before.sha256 > artifacts/repack-diagnostic/archives-unchanged.log
          fi

      - name: Remove only this diagnostic job's containers
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          containers=$(docker ps --all --quiet --filter "label=$SONIC_CI_CONTAINER_LABEL")
          if test -n "$containers"; then
            readarray -t ids <<< "$containers"
            if ! docker rm --force "${ids[@]}"; then
              test -z "$(docker ps --all --quiet --filter "label=$SONIC_CI_CONTAINER_LABEL")"
            fi
          fi

      - name: Upload bounded logs, receipts and provenance only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr33-repack-diagnostic
          path: vs-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/repack-diagnostic/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 1
