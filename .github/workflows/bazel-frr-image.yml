name: Bazel FRR images

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      source_revision:
        description: Reviewed immutable source SHA (blank uses this workflow revision)
        type: string
        default: ''
      registry_revision:
        description: Reviewed immutable registry SHA (required with source_revision)
        type: string
        default: ''


permissions:
  contents: read

concurrency:
  group: bazel-frr-image-${{ github.event.pull_request.number || github.ref }}-${{ inputs.source_revision }}-${{ inputs.registry_revision }}
  cancel-in-progress: true

jobs:
  native:
    name: Build and inspect FRR images (AMD64)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      BAZEL: ${{ inputs.registry_revision && 'tools/bazel/ci/review_bazel.sh' || 'tools/bazel/ci/frr_draft_bazel.sh' }}
      SONIC_BAZEL_REGISTRY_REVISION: ${{ inputs.registry_revision }}
    container: debian:trixie-20260918@sha256:9cc080028c43b27d2074d63a5f9caf7166d731494965616c1a6d2827a004585c
    defaults:
      run:
        shell: bash
    steps:
      - name: Validate the optional reviewed source and registry selection
        if: github.event_name == 'workflow_dispatch'
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
          REGISTRY_REVISION: ${{ inputs.registry_revision }}
        run: |
          if [[ -n "$SOURCE_REVISION$REGISTRY_REVISION" ]]; then
            [[ "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]] &&
              [[ "$REGISTRY_REVISION" =~ ^[0-9a-f]{40}$ ]] || {
                echo 'Select both source and registry using full lowercase Git SHAs.' >&2
                exit 2
              }
          fi
      - name: Install execution and verification tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends binutils build-essential ca-certificates gdb git j2cli jq libarchive-tools libxml2 python3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_revision || github.sha }}
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-version: 1.29.0
          bazelisk-cache: true
          repository-cache: true
          disk-cache: frr-image-amd64
          cache-version: "8.5.1"
      - name: Prepare the verified compression source
        run: |
          mkdir -p artifacts/frr
          python3 tools/bazel/gzip/prepare_pigz.py --output "$RUNNER_TEMP/pigz-distdir" > artifacts/frr/pigz-source.json
          python3 - <<'PYCODE'
          import os
          from pathlib import Path
          home = Path.home() / '.bazelrc'
          cache_lines = [line for line in home.read_text().splitlines()
                         if line.startswith(('build --disk_cache=', 'common --repository_cache='))]
          assert len(cache_lines) == 2, 'setup-bazel cache settings are missing'
          user = Path('.bazelrc.user')
          current = user.read_text() if user.exists() else ''
          user.write_text(current + '\n' + '\n'.join(cache_lines) +
                          '\ncommon --distdir=' + os.environ['RUNNER_TEMP'] + '/pigz-distdir\n')
          PYCODE
      - name: Add verified official Debian pool fallbacks
        run: |
          # Prefer the official pools while retaining each original snapshot URL.
          # Bazel still verifies the SHA256 declared by each source repository.
          cat > "$RUNNER_TEMP/frr-downloader.cfg" <<'CONFIG'
          rewrite (snapshot\.debian\.org/archive/debian/[0-9]{8}T[0-9]{6}Z/pool/([^?#]+)) https://deb.debian.org/debian/pool/$2
          rewrite (snapshot\.debian\.org/archive/debian/[0-9]{8}T[0-9]{6}Z/pool/([^?#]+)) https://$1
          rewrite (snapshot\.debian\.org/archive/debian-security/[0-9]{8}T[0-9]{6}Z/pool/([^?#]+)) https://deb.debian.org/debian-security/pool/$2
          rewrite (snapshot\.debian\.org/archive/debian-security/[0-9]{8}T[0-9]{6}Z/pool/([^?#]+)) https://$1
          CONFIG
          printf 'common --experimental_downloader_config=%s\n' "$RUNNER_TEMP/frr-downloader.cfg" >> .bazelrc.user
          cp "$RUNNER_TEMP/frr-downloader.cfg" artifacts/frr/downloader.cfg
      - name: Build runtime and debug images from source owners
        env:
          BAZELISK_GITHUB_TOKEN: ""
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(uname -m)" = x86_64
          test "$(. /etc/os-release; echo "$VERSION_CODENAME")" = trixie
          test ! -e MODULE.bazel.lock
          python3 -B tools/bazel/ci/frr_image.py build --artifacts artifacts/frr --bazel "$BAZEL"
      - name: Validate completed image contents and source symbols
        run: python3 -B tools/bazel/ci/frr_image.py validate --artifacts artifacts/frr
      - name: Check incremental rebuild and restored image digests
        env:
          BAZELISK_GITHUB_TOKEN: ""
        run: |
          python3 -B tools/bazel/ci/frr_image.py incremental --artifacts artifacts/frr --bazel "$BAZEL"
          git diff --exit-code
      - name: Prepare reviewed public evidence
        id: public
        if: always()
        run: |
          python3 - <<'PYCODE'
          import json
          from pathlib import Path
          from tools.bazel.ci.public_artifacts import safe_json, dependency_json, bep_summary
          root = Path('artifacts/frr')
          if (root / 'build-receipt.json').exists():
              receipt = json.loads((root / 'build-receipt.json').read_text())
              public = {key: receipt[key] for key in ('status', 'architecture', 'revision', 'artifacts') if key in receipt}
              safe_json(public)
              (root / 'public-receipt.json').write_text(json.dumps(public, indent=2) + '\n')
          names = ['validation.json', 'action-audit.json', 'incremental.json']
          names += [path.name for path in root.glob('*.validation.json')]
          names += [path.name for path in root.glob('*.packages.json')]
          for name in names:
              path = root / name
              if path.exists():
                  safe_json(json.loads(path.read_text()))
          for name, kind in (('MODULE.bazel.lock', 'lock'), ('module-graph.json', 'graph')):
              path = root / name
              if path.exists():
                  dependency_json(json.loads(path.read_text()), kind)
          summary = {str(path.relative_to(root)): bep_summary(path.read_text().splitlines(), partial=True)
                     for path in root.rglob('*events.json*')}
          safe_json(summary)
          (root / 'build-summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          PYCODE
      - name: Retain images and reviewed build evidence
        if: always() && steps.public.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frr-image-amd64
          path: |
            artifacts/frr/*.gz
            artifacts/frr/*.tar
            artifacts/frr/*.status
            artifacts/frr/*.packages.json
            artifacts/frr/*.validation.json
            artifacts/frr/validation.json
            artifacts/frr/public-receipt.json
            artifacts/frr/action-audit.json
            artifacts/frr/incremental.json
            artifacts/frr/build-summary.json
            artifacts/frr/downloader.cfg
            artifacts/frr/MODULE.bazel.lock
            artifacts/frr/module-graph.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 1

  runtime:
    name: Run installed FRR images (AMD64)
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_revision || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frr-image-amd64
          path: artifacts/frr
      - name: Verify and load only this run's images
        run: |
          python3 - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          from tools.bazel.ci.validate_runtime import load_archive, verify_loaded_image
          directory=Path('artifacts/frr')
          receipt=json.loads((directory/'validation.json').read_text())
          assert receipt['status']=='passed' and receipt['architecture']=='amd64'
          assert receipt['revision']==subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          for name in ['docker-fpm-frr','docker-fpm-frr-dbg']:
              path=directory/(name+'.gz')
              assert hashlib.sha256(path.read_bytes()).hexdigest()==receipt['artifacts'][path.name]['sha256']
              expected=json.loads((directory/(name+'.validation.json')).read_text())
              tag='sonic-frr-validation-'+name+':latest'
              actual,config,_=load_archive(path,tag,expected['config_digest'])
              verify_loaded_image(actual,config,expected['config_digest'])
              assert actual['Os']=='linux' and actual['Architecture']=='amd64'
              assert actual['RootFS']['Layers']==expected['rootfs']['diff_ids']
          assert hashlib.sha256((directory/'test-redis.tar').read_bytes()).hexdigest()==receipt['artifacts']['test-redis.tar']['sha256']
          PY
          mkdir -p artifacts/frr/redis-fixture
          tar --no-same-owner -xf artifacts/frr/test-redis.tar -C artifacts/frr/redis-fixture
      - name: Query private BGPD and installed Python services
        run: |
          set -euo pipefail
          for image in docker-fpm-frr docker-fpm-frr-dbg; do
            probe_args=()
            if [[ "$image" == *-dbg ]]; then probe_args+=(--debug); fi
            docker run --rm --network=none --cap-drop=ALL --security-opt=no-new-privileges \
              --read-only --user=300:300 --group-add=102 --pids-limit=128 --memory=4g --cpus=2 \
              --tmpfs /tmp:rw,nosuid,nodev,noexec,size=256m \
              --mount "type=bind,src=$PWD/dockers/docker-fpm-frr/bazel/runtime_probe.py,dst=/probe/runtime_probe.py,readonly" \
              --mount "type=bind,src=$PWD/artifacts/frr/redis-fixture,dst=/probe/redis,readonly" \
              --mount "type=bind,src=$PWD/artifacts/frr/validation.json,dst=/probe/validation.json,readonly" \
              --entrypoint /usr/bin/python3 "sonic-frr-validation-$image:latest" -B /probe/runtime_probe.py --validation /probe/validation.json "${probe_args[@]}" \
              | tee "artifacts/frr/$image.runtime.json"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: frr-runtime-amd64
          path: artifacts/frr/*.runtime.json
          if-no-files-found: warn
          retention-days: 14
