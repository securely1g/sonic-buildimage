name: Bazel Rust supervisor

on:
  pull_request:
    paths:
      - .github/workflows/bazel-supervisor-rust.yml
      - MODULE.bazel
      - tools/bazel/common.bazelrc
      - tools/bazel/tests/runtime.bzl
      - tools/bazel/ci/libteam_draft_bazel.sh
      - tools/bazel/ci/preserve_setup_bazel_cache.py
      - src/sonic-supervisord-utilities-rs/**
  push:
    branches: [master]
    paths:
      - .github/workflows/bazel-supervisor-rust.yml
      - MODULE.bazel
      - tools/bazel/common.bazelrc
      - tools/bazel/tests/runtime.bzl
      - tools/bazel/ci/libteam_draft_bazel.sh
      - tools/bazel/ci/preserve_setup_bazel_cache.py
      - src/sonic-supervisord-utilities-rs/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bazel-supervisor-rust-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  native:
    name: Rust listener (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: AMD64
            machine: x86_64
            debian_arch: amd64
          - arch: ARM64
            machine: aarch64
            debian_arch: arm64
    runs-on: [self-hosted, Linux, X64, debian-trixie-container]
    timeout-minutes: ${{ matrix.debian_arch == 'arm64' && 240 || 90 }}
    defaults:
      run:
        shell: sonic-ci-shell {0}
    env:
      SONIC_CI_ARCH: ${{ matrix.debian_arch }}
    steps:
      - name: Install native verification tools
        run: |
          sudo -n apt-get update
          sudo -n apt-get install -y --no-install-recommends binutils build-essential ca-certificates gdb git python3

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize Sysmgr's pinned gNOI source
        run: git -c safe.directory="$GITHUB_WORKSPACE" submodule update --init -- src/sonic-sysmgr/gnoi
      - name: Verify native architecture and clean dependency inputs
        env:
          EXPECTED_MACHINE: ${{ matrix.machine }}
          EXPECTED_DEBIAN_ARCH: ${{ matrix.debian_arch }}
        run: |
          test "$(uname -m)" = "$EXPECTED_MACHINE"
          test "$(dpkg --print-architecture)" = "$EXPECTED_DEBIAN_ARCH"
          . /etc/os-release
          test "$ID" = debian
          test "$VERSION_CODENAME" = trixie
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test ! -e MODULE.bazel.lock
          test -z "$(git ls-files -- MODULE.bazel.lock)"

      - name: Configure the verified source mirror
        shell: bash
        run: |
          python3 - <<'PYCFG'
          import hashlib
          import os
          from pathlib import Path
          from urllib.request import urlopen
          url = "https://raw.githubusercontent.com/securely1g/sonic-bazel-registry/97cc502556b7ec3435d2d67b105315bcc18bb47e/ci/source_mirrors.cfg"
          with urlopen(url, timeout=60) as response:
              data = response.read()
          if hashlib.sha256(data).hexdigest() != "ddd6f40504a30e138a62be0d728e1a352391d0f781c927eaf4ea45c44d8a0720":
              raise SystemExit("Source mirror configuration checksum mismatch")
          config = Path(os.environ["RUNNER_TEMP"]) / "sonic-source-mirrors.cfg"
          config.write_bytes(data)
          with Path(".bazelrc.user").open("a") as rc:
              rc.write("common --experimental_downloader_config=" + str(config) + "\n")
          PYCFG
      - name: Audit and test source runtime and debug packages
        env:
          MACHINE: ${{ matrix.machine }}
          BAZEL: ${{ github.workspace }}/tools/bazel/ci/libteam_draft_bazel.sh
        run: |
          set -euo pipefail
          flags=(--jobs=2
            "--platforms=@sonic_build_infra//platforms:${MACHINE}_trixie"
            "--host_platform=@sonic_build_infra//platforms:${MACHINE}_trixie")
          targets=(//src/sonic-supervisord-utilities-rs:unit_tests
            //src/sonic-supervisord-utilities-rs:integration_tests
            //src/sonic-supervisord-utilities-rs:listener_tests
            //src/sonic-supervisord-utilities-rs:package_test)
          audit_flags=()
          for flag in "${flags[@]}"; do audit_flags+=("--bazel-arg=$flag"); done
          python3 tools/bazel/ci/bazel_commands.py --bazel "$BAZEL" "${audit_flags[@]}" \
            --output artifacts/supervisor-rust/action-audit.json "${targets[@]}"
          "$BAZEL" test "${flags[@]}" --test_output=errors "${targets[@]}"
          "$BAZEL" cquery "${flags[@]}" --noimplicit_deps \
            'kind("rust_library rule", deps(//src/sonic-supervisord-utilities-rs:supervisor_library))' \
            > artifacts/supervisor-rust/rust-libraries.txt
          cp MODULE.bazel.lock artifacts/supervisor-rust/MODULE.bazel.lock
          cp -aL bazel-testlogs/src/sonic-supervisord-utilities-rs artifacts/supervisor-rust/tests
          git diff --exit-code

      - name: Retain source and installed-package evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supervisor-rust-${{ matrix.arch }}
          path: artifacts/supervisor-rust/
          if-no-files-found: error
          retention-days: 14
