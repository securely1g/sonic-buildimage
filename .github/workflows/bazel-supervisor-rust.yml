name: Bazel Rust supervisor

on:
  pull_request:
    paths:
      - .github/workflows/bazel-supervisor-rust.yml
      - MODULE.bazel
      - tools/bazel/common.bazelrc
      - tools/bazel/ci/check_listener_install.sh
      - src/sonic-supervisord-utilities-rs/**
      - tools/bazel/ci/check_listener_deb.py
  push:
    branches: [master]
    paths:
      - .github/workflows/bazel-supervisor-rust.yml
      - MODULE.bazel
      - tools/bazel/common.bazelrc
      - tools/bazel/ci/check_listener_install.sh
      - src/sonic-supervisord-utilities-rs/**
      - tools/bazel/ci/check_listener_deb.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bazel-supervisor-rust-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Rust listener (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: AMD64
            runner: ubuntu-24.04
            machine: x86_64
            debian_arch: amd64
          - arch: ARM64
            runner: ubuntu-24.04-arm
            machine: aarch64
            debian_arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    container: debian:trixie-20260918@sha256:9cc080028c43b27d2074d63a5f9caf7166d731494965616c1a6d2827a004585c
    defaults:
      run:
        shell: bash
    steps:
      - name: Install native verification tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends binutils build-essential ca-certificates gdb git python3

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out the landed shared dependency source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: securely1g/sonic-build-infra
          ref: 6d9c70f708d7420e9e2b2cdc906b80cee6b140f1
          path: _rust_dependencies/infra
          persist-credentials: false

      - name: Check out the reviewed Debian metadata tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: securely1g/sonic-build-infra
          ref: 7339c0da8283fdc43dc90feb48136c9b574ee3e7
          path: _package_dependencies/infra
          persist-credentials: false

      - name: Check out Common's reviewed library metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: securely1g/sonic-swss-common
          ref: e4db486d14b726af21ad14a85334a60add07ec22
          path: _package_dependencies/common
          persist-credentials: false

      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-version: 1.29.0
          bazelisk-cache: true
          repository-cache: true
          disk-cache: ${{ github.workflow }}-${{ matrix.arch }}
          cache-version: "8.5.1"

      - name: Select the reviewed Draft package registry
        run: |
          python3 - <<'PYCODE'
          import os, shlex, shutil, subprocess
          from pathlib import Path
          branch = 'codex/image-package-gcc-integration'
          observed = subprocess.check_output(['git', 'ls-remote', 'https://github.com/securely1g/sonic-bazel-registry.git', 'refs/heads/' + branch], text=True).split()[0]
          assert observed == '0a55b33a8dddbea8d39fcdfad2d6208aa0e656b0'
          directory = Path(os.environ['RUNNER_TEMP']) / 'package-registry'
          directory.mkdir()
          rc = directory / 'effective.bazelrc'
          rc.write_text(Path('.bazelrc').read_text().replace(
              'https://raw.githubusercontent.com/securely1g/sonic-bazel-registry/main',
              'https://raw.githubusercontent.com/securely1g/sonic-bazel-registry/' + branch))
          binary = shutil.which('bazel')
          assert binary
          wrapper = directory / 'bazel'
          wrapper.write_text('#!/bin/sh\nexec ' + shlex.quote(binary) + ' --noworkspace_rc --bazelrc=' + shlex.quote(str(rc)) + ' "$@"\n')
          wrapper.chmod(0o755)
          with open(os.environ['GITHUB_PATH'], 'a') as output: output.write(str(directory) + '\n')
          with open(os.environ['GITHUB_ENV'], 'a') as output: output.write('SONIC_NATIVE_BAZEL=' + binary + '\n')
          PYCODE

      - name: Verify native architecture and clean dependency inputs
        env:
          EXPECTED_MACHINE: ${{ matrix.machine }}
          EXPECTED_DEBIAN_ARCH: ${{ matrix.debian_arch }}
        run: |
          test "$(uname -m)" = "$EXPECTED_MACHINE"
          test "$(dpkg --print-architecture)" = "$EXPECTED_DEBIAN_ARCH"
          . /etc/os-release
          test "$ID" = debian
          test "$VERSION_CODENAME" = trixie
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test ! -e MODULE.bazel.lock
          test -z "$(git ls-files -- MODULE.bazel.lock)"

      - name: Audit and test source runtime and debug packages
        env:
          MACHINE: ${{ matrix.machine }}
        run: |
          set -euo pipefail
          flags=(--jobs=4
            "--platforms=@sonic_build_infra//platforms:${MACHINE}_trixie"
            "--host_platform=@sonic_build_infra//platforms:${MACHINE}_trixie"
            "--override_module=sonic-rust-deps=$GITHUB_WORKSPACE/_rust_dependencies/infra/rust/deps")
          targets=(//src/sonic-supervisord-utilities-rs:unit_tests
            //src/sonic-supervisord-utilities-rs:integration_tests
            //src/sonic-supervisord-utilities-rs:listener_tests
            //src/sonic-supervisord-utilities-rs:package_test)
          audit_flags=()
          for flag in "${flags[@]}"; do audit_flags+=("--bazel-arg=$flag"); done
          python3 tools/bazel/ci/bazel_commands.py "${audit_flags[@]}" \
            --output artifacts/supervisor-rust/action-audit.json "${targets[@]}"
          bazel test "${flags[@]}" --test_output=errors "${targets[@]}"
          bazel cquery "${flags[@]}" --noimplicit_deps \
            'kind("rust_library rule", deps(//src/sonic-supervisord-utilities-rs:supervisor_library))' \
            > artifacts/supervisor-rust/rust-libraries.txt
          cp MODULE.bazel.lock artifacts/supervisor-rust/MODULE.bazel.lock
          cp -aL bazel-testlogs/src/sonic-supervisord-utilities-rs artifacts/supervisor-rust/tests
          git diff --exit-code

      - name: Build and inspect the source-owned Debian package
        env:
          MACHINE: ${{ matrix.machine }}
          DEBIAN_ARCH: ${{ matrix.debian_arch }}
        run: |
          set -euo pipefail
          flags=(--jobs=4
            "--platforms=@sonic_build_infra//platforms:${MACHINE}_trixie"
            "--host_platform=@sonic_build_infra//platforms:${MACHINE}_trixie"
            "--override_module=sonic-build-infra=$GITHUB_WORKSPACE/_package_dependencies/infra"
            "--override_module=sonic-swss-common=$GITHUB_WORKSPACE/_package_dependencies/common"
            "--override_module=sonic-rust-deps=$GITHUB_WORKSPACE/_rust_dependencies/infra/rust/deps")
          metadata=//src/sonic-supervisord-utilities-rs/debian:metadata
          evidence=artifacts/supervisor-rust/debian
          mkdir -p "$evidence"
          python3 - <<'PYCODE'
          import json
          import subprocess
          from pathlib import Path
          def git(directory, *args):
              return subprocess.check_output(["git", "-C", directory, *args], text=True).strip()
          infra = "_package_dependencies/infra"
          provenance = {
              "metadata_tools_commit": git(infra, "rev-parse", "HEAD"),
              "combined_infra_tree": git(infra, "write-tree"),
              "common_commit": git("_package_dependencies/common", "rev-parse", "HEAD"),
              "rust_dependencies_commit": git("_rust_dependencies/infra", "rev-parse", "HEAD"),
          }
          Path("artifacts/supervisor-rust/debian/prerequisites.json").write_text(json.dumps(provenance, indent=2) + "\n")
          PYCODE
          audit_flags=()
          for flag in "${flags[@]}"; do audit_flags+=("--bazel-arg=$flag"); done
          python3 tools/bazel/ci/bazel_commands.py "${audit_flags[@]}" \
            --output "$evidence/action-audit.json" "$metadata"
          bazel build "${flags[@]}" "$metadata"
          bazel cquery "${flags[@]}" --output=files "$metadata" > "$evidence/outputs.txt"
          while IFS= read -r output; do cp "$output" "$evidence/"; done < "$evidence/outputs.txt"
          python3 _package_dependencies/infra/deb/check_control.py \
            --input "$evidence/binary.control" --output "$evidence/checked.control" \
            --package sonic-supervisord-utilities-rs --version 1.0.0 --architecture "$DEBIAN_ARCH"
          # Record and build the explicitly approved package-producing action.
          bazel aquery "${flags[@]}" --output=jsonproto \
            'mnemonic("DebAssemble", deps(//src/sonic-supervisord-utilities-rs/debian:package))' \
            > "$evidence/proposed-deb-action.json"
          package=//src/sonic-supervisord-utilities-rs/debian:package
          # A cached DEB does not require Bazel to materialize its input TAR.
          # Request the TAR as an output because the archive check reads it.
          data_target=//src/sonic-supervisord-utilities-rs/debian:package_data
          bazel build "${flags[@]}" "$package" "$data_target"
          deb=$(bazel cquery "${flags[@]}" --output=files "$package")
          data=$(bazel cquery "${flags[@]}" --output=files "$data_target")
          cp "$deb" "$evidence/"
          python3 tools/bazel/ci/check_listener_deb.py --deb "$deb" --data "$data" \
            --control "$evidence/checked.control" --architecture "$DEBIAN_ARCH" \
            --output "$evidence/package.json"
          cp MODULE.bazel.lock "$evidence/MODULE.bazel.lock"
          git diff --exit-code

      - name: Build the real Common dependency package
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/artifacts/supervisor-rust/debian/dependencies"
          mkdir -p "$evidence"
          cd _package_dependencies/common
          # Validate pending producer registrations without changing the tracked main RC.
          python3 - "$RUNNER_TEMP/common-package.bazelrc" <<'PYCODE'
          import sys
          from pathlib import Path
          config = Path('.bazelrc').read_text().replace(
              'https://raw.githubusercontent.com/securely1g/sonic-bazel-registry/main',
              'https://raw.githubusercontent.com/securely1g/sonic-bazel-registry/codex/image-package-gcc-integration')
          Path(sys.argv[1]).write_text('\n'.join(line for line in config.splitlines() if not line.startswith('try-import ')) + '\n')
          PYCODE
          observed=$(git ls-remote https://github.com/securely1g/sonic-bazel-registry.git refs/heads/codex/image-package-gcc-integration | cut -f1)
          test "$observed" = 0a55b33a8dddbea8d39fcdfad2d6208aa0e656b0
          printf '%s\n' "$observed" > "$evidence/registry-revision.txt"
          cp "$RUNNER_TEMP/common-package.bazelrc" "$evidence/effective.bazelrc"
          machine=$(uname -m)
          startup=(--output_base="$RUNNER_TEMP/common-debian" --noworkspace_rc --bazelrc="$RUNNER_TEMP/common-package.bazelrc")
          flags=(--jobs=4 "--platforms=@sonic_build_infra//platforms:${machine}_trixie"
            "--host_platform=@sonic_build_infra//platforms:${machine}_trixie")
          "$SONIC_NATIVE_BAZEL" "${startup[@]}" build "${flags[@]}" \
            //debian:libswsscommon_check //debian:libswsscommon_deb @libyang//:libyang3_deb
          for target in //debian:libswsscommon_check //debian:libswsscommon_deb @libyang//:libyang3_deb; do
            output=$("$SONIC_NATIVE_BAZEL" "${startup[@]}" cquery "${flags[@]}" --output=files "$target")
            cp "$output" "$evidence/"
          done
          cp MODULE.bazel.lock "$evidence/MODULE.bazel.lock"

      - name: Retain source and installed-package evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supervisor-rust-${{ matrix.arch }}
          path: artifacts/supervisor-rust/
          if-no-files-found: error
          retention-days: 14

  installed-package:
    name: Installed listener packages (${{ matrix.architecture }})
    needs: native
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            artifact_arch: AMD64
            runner: ubuntu-24.04
          - architecture: arm64
            artifact_arch: ARM64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: debian:trixie-20260918@sha256:9cc080028c43b27d2074d63a5f9caf7166d731494965616c1a6d2827a004585c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: supervisor-rust-${{ matrix.artifact_arch }}
          path: packages
      - name: Install, reinstall, remove and purge with real dependencies
        env:
          SONIC_DEB_TEST_CONTAINER: 1
        run: bash tools/bazel/ci/check_listener_install.sh packages/debian
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: listener-installation-${{ matrix.architecture }}
          path: packages/debian/installation.json
          if-no-files-found: warn
