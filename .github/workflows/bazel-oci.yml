      - name: Checkout the immutable cache payload observer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: ${{ steps.paths.outputs.control }}
          clean: false
          persist-credentials: false
      - name: Check controller identity and pure cache observation tests
        env:
          CONTROL: ${{ steps.paths.outputs.control }}
          GIT_NO_LAZY_FETCH: '1'
          GIT_NO_REPLACE_OBJECTS: '1'
          GIT_OPTIONAL_LOCKS: '0'
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/$CONTROL"
          test "$(git -c protocol.allow=never rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -B -m unittest -v tools.bazel.tests.vs_cache_inspection_test tools.bazel.tests.vs_cache_payloads_test tools.bazel.tests.vs_worker_inspection_test tools.bazel.tests.vs_reuse_plan_test
      - name: Observe selected cache archives without extraction or restore
        id: observe
        env:
          EXPECTED_WORKER: ${{ steps.paths.outputs.worker }}
          CONTROL: ${{ steps.paths.outputs.control }}
          RECEIPT: ${{ steps.paths.outputs.receipt }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/$CONTROL"
          python3 -B -m tools.bazel.ci.vs_cache_payloads \
            --worker "$EXPECTED_WORKER" \
            --selection tools/bazel/ci/vs_cache_payload_selection.json \
            --selection-sha256 10694722750c97d60abd0892289c3a42c3479f3a2858a912983c4f6cb8c93388 \
            --output "$RUNNER_TEMP/$RECEIPT"
