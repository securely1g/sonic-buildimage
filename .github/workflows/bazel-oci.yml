          SONIC_BAZEL_REGISTRY_REVISION: e6ef022c94dd2fdeeac364dfd591f9701cd37c29
          USE_BAZEL_VERSION: '8.5.1'
          HOME: ${{ steps.paths.outputs.root }}/scratch/home
          BAZELISK_HOME: ${{ steps.paths.outputs.root }}/scratch/bazelisk
          TMPDIR: ${{ steps.paths.outputs.root }}/scratch/temporary
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -I -S -B "$POLICY_ROOT/control/tools/bazel/ci/build_vs_swss_installed_policy.py" cache \
            --plan "$POLICY_ROOT/control/tools/bazel/ci/vs_swss_installed_policy_inputs.json" \
            --source "$POLICY_ROOT/source" --native "$POLICY_ROOT/native" \
            --scratch "$POLICY_ROOT/scratch" --output "$POLICY_ROOT/policies" \
            --archives "$POLICY_ROOT/inputs" --mirrors "$POLICY_ROOT/catalog/ci/source_mirrors.cfg"
      - name: Audit and build the existing SWSS installed-image policy
        timeout-minutes: 120
        env:
