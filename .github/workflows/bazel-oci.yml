          import hashlib, json, os, signal, sys
          from pathlib import Path
          root = Path(os.environ['OBS_ROOT'])
          sys.path.insert(0, str(root / 'inspection'))
          from tools.bazel.ci.observe_original_archive import observe
          plan = json.loads((root / 'outputs/original-inputs.json').read_text())
          def deadline(_signum, _frame):
              raise TimeoutError('Archive observation deadline')
          signal.signal(signal.SIGALRM, deadline)
          signal.alarm(420)
          try:
              for expected in plan['archives']:
                  path = root / 'inputs' / str(expected['artifact_id']) / expected['member']
                  if path.lstat().st_size != expected['bytes']:
                      raise ValueError('Original archive member size differs')
