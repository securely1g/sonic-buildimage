          test "$(git -c protocol.allow=never rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -B - <<'PY_SOURCE'
          import hashlib, json
          from pathlib import Path
          expected = json.loads('''{"tools/bazel/ci/image_worker_receipt.py": "e7595ca7ac9d52f99ff5c58cb6357346530e7393d84e08d23c40d1c9b27e0199", "tools/bazel/ci/native_payload_inventory.py": "161b7eba3a3ae6712a37fedb8cce3597557b32ed7adde53f39597d4781769faf", "tools/bazel/ci/native_payload_inventory_gearbox_input.json": "665c8b74ed882793a2e892526bb0942cb254305729d2a519cca1e5f287e6dee2", "tools/bazel/ci/native_payload_inventory_input.json": "09ad533fe596ca431dc1cabcffa27bfb6b804b0673e7fad5c8c12cf1859f9fce", "tools/bazel/ci/native_payload_inventory_syncd_input.json": "b27977dd2498a294f903281279538a1936b3ebd1eafd8a526bf56e1deab762ad", "tools/bazel/ci/native_payload_recovery.py": "c951cde2610346d162d9c060d0334a5aef6434921b460dbbbd4d23e30967574c", "tools/bazel/ci/p4rt_receipt_semantics.py": "0f402b44ca9c15ef0006d20381e796636d54a4ecea4a9a54553e594f2403b661", "tools/bazel/ci/p4rt_sdk_receipt_semantics.py": "d9f46296577e1f0f94bbe0ab2e0aadb65bed400e6b477c9e56223ac21b22e5b9", "tools/bazel/ci/public_artifacts.py": "74d05c44670861437b75e6370d018eee139f1c86acdedd46dcacb64a63b11ff9", "tools/bazel/ci/source_worker_preflight.py": "62b2b764c4473144321584cedc87d152ba5059f68fa67966c24e79c1a5a16897", "tools/bazel/ci/syncd_receipt_semantics.py": "15b896c21160189113b13e0a0ea36715f81e79c40c473861c36552a686751663", "tools/bazel/ci/vs_cache_inspection.py": "03beddcf6d73233988b6eef92c69dfdfcc70dbb6a10421edc4e921a9709c451c", "tools/bazel/tests/native_payload_inventory_test.py": "b0d6e4a813d5dd3d5320a0a0ca1307f072032bca4600c40ce65550810865fb43", "tools/bazel/tests/native_payload_recovery_test.py": "5ed593a7537bd41cb2721035ce2faba9ba43aa0706dc929dd5d74492343dca11", "tools/bazel/tests/native_policy_evidence_test.py": "2efce7f475e65a52180fbd56fcc7828d85113ad16789afeb28dad8c6581db467", "tools/bazel/tests/syncd_resource_semantics_test.py": "8d8e786946b8ad785750d74469c78ac5e89b950c34b348420f03c32e15821536"}''')
          for name, digest in expected.items():
              if hashlib.sha256(Path(name).read_bytes()).hexdigest() != digest:
                  raise SystemExit('Original inspection source binding differs')
          PY_SOURCE
          python3 -B -m unittest -v \
            tools.bazel.tests.native_payload_recovery_test \
            tools.bazel.tests.native_policy_evidence_test \
            tools.bazel.tests.native_payload_inventory_test \
            tools.bazel.tests.syncd_resource_semantics_test
      - name: Stream and inventory the selected original failed native upload
        id: inspect
        env:
          CONTROL: ${{ steps.paths.outputs.control }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/$CONTROL"
          python3 -B -m tools.bazel.ci.native_payload_inventory
      - name: Retain only bounded original identities and member inventory
        if: always() && (steps.inspect.outcome == 'success' || steps.inspect.outcome == 'failure')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: original-${{ env.NATIVE_INVENTORY_IMAGE }}-payload-inventory-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/${{ steps.paths.outputs.output }}/summary.json
            ${{ runner.temp }}/${{ steps.paths.outputs.output }}/admission.json
            ${{ runner.temp }}/${{ steps.paths.outputs.output }}/member-inventory.json
            ${{ runner.temp }}/${{ steps.paths.outputs.output }}/public-evidence-map.json
            ${{ runner.temp }}/${{ steps.paths.outputs.output }}/public-semantic-review.json
            ${{ runner.temp }}/${{ steps.paths.outputs.output }}/public-evidence-*.data
            ${{ runner.temp }}/${{ steps.paths.outputs.output }}/original-run.json
            ${{ runner.temp }}/${{ steps.paths.outputs.output }}/original-run-response.data
            ${{ runner.temp }}/${{ steps.paths.outputs.output }}/original-run-response.json
            ${{ runner.temp }}/${{ steps.paths.outputs.output }}/original-job.json
            ${{ runner.temp }}/${{ steps.paths.outputs.output }}/original-job-response.data
            ${{ runner.temp }}/${{ steps.paths.outputs.output }}/original-job-response.json
            ${{ runner.temp }}/${{ steps.paths.outputs.output }}/original-artifact.json
            ${{ runner.temp }}/${{ steps.paths.outputs.output }}/original-artifact-response.data
            ${{ runner.temp }}/${{ steps.paths.outputs.output }}/original-artifact-response.json
          if-no-files-found: error
          retention-days: 14

