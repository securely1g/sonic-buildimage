        fi
    - name: baseline verify packaged content and write timing record
      run: |
        export PYTHONPATH=$PWD
        python3 - baseline <<'PY'
        import hashlib,json,os,sys,subprocess,tarfile,zipfile
        from pathlib import Path
        from scripts.validate_sonic_version import read_installer_version
        arm=sys.argv[1]
        out=Path('artifacts/vs/paired-layout'); out.mkdir(parents=True,exist_ok=True)
        binpath=Path('target/sonic-vs.bin')
        def digest(f):
            h=hashlib.sha256()
            for chunk in iter(lambda:f.read(4*1024*1024),b''): h.update(chunk)
            return h.hexdigest()
        metadata=read_installer_version(binpath, expect_boot_bundle=True)
        with binpath.open('rb') as stream:
            marker=b'\nexit_marker\n'; header=stream.read(65536); assert marker in header; stream.seek(header.index(marker)+len(marker))
            with tarfile.open(fileobj=stream,mode='r:') as archive:
                with archive.extractfile('installer/fs.zip') as payload, zipfile.ZipFile(payload) as fs:
                    name='sonic-images.tar.gz'
                    def bundle(): return fs.open(name) if name in fs.namelist() else archive.extractfile('installer/'+name)
                    with bundle() as source:
                        bundle_sha=digest(source)
                    with bundle() as source,tarfile.open(fileobj=source,mode='r|gz') as images:
                        manifest=json.load(images.extractfile(images.next()))
                        tags={tag:item['Config'].rsplit('/',1)[1] for item in manifest for tag in item['RepoTags']}
        with binpath.open('rb') as stream: installer_sha=digest(stream)
        (out/'images.json').write_text(json.dumps(tags,sort_keys=True,indent=2)+'\n')
        with (out/'manifest.json').open('w') as fp: json.dump(manifest,fp,sort_keys=True)
        summ=Path('artifacts/vs/image-timings/summary.json')
        arc=sorted(x.name for x in Path('target').glob('docker*.gz') if x.is_file())
        record={'arm':arm,'runner':os.environ['RUNNER_NAME'],'source':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'seconds':float((out/'seconds').read_text()),'sonic_image_version':os.environ['SONIC_IMAGE_VERSION'],'installer_version':metadata,'installer_size':binpath.stat().st_size,'installer_sha256':installer_sha,'bundle_sha256':bundle_sha,'image_count':len(manifest),'tags':len(tags),'archives':arc}
        if summ.exists():
            data=json.loads(summ.read_text())
            rows=data.get('container_breakdown',{}).get('rows',[])
            record['image_actions']={k: sum(r.get(k,0) for r in rows) for k in ('compress_seconds','archive_seconds','export_seconds')}
            record['image_summary_rows']=len(rows)
        for receipt in sorted(Path('artifacts/vs/image-timings/boot-bundle').glob('*.json')):
            record.setdefault('boot_receipts',[]).append(json.loads(receipt.read_text()))
        (out/'result.json').write_text(json.dumps(record,sort_keys=True,indent=2)+'\n')
        print(json.dumps(record,sort_keys=True)[:2400])
        assert len(manifest)==28 and len(tags)==56
        PY
        mkdir -p "$RUNNER_TEMP/layout-results-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
        cp artifacts/vs/paired-layout/result.json "$RUNNER_TEMP/layout-results-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/baseline.json"
    - name: baseline upload timings and receipts
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: baseline-vs-installer-measurement
        path: |-
          vs-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/vs/paired-layout
          vs-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/vs/image-timings
          vs-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/vs/build.log
        retention-days: 14
        if-no-files-found: warn
        compression-level: 1
    - name: Compare measured builds
      run: |-
        python3 - <<'PY'
        import os,json,pathlib
        root=pathlib.Path(os.environ['RUNNER_TEMP'])/('layout-results-'+os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT'])
        base,cand=[json.loads((root/(x+'.json')).read_text()) for x in ('baseline','candidate')]
        assert base['runner']==cand['runner'] and base['sonic_image_version']==cand['sonic_image_version']
        delta=base['seconds']-cand['seconds']
        print('Runner, baseline seconds, candidate seconds, delta seconds, percent, identical boot bundle',base['runner'],base['seconds'],cand['seconds'],delta,100*delta/base['seconds'],base['bundle_sha256']==cand['bundle_sha256'])
        PY
    - name: baseline Remove only this job's build containers
      if: always()
      working-directory: ${{ github.workspace }}
      run: |
        set -euo pipefail
        containers=$(docker ps --all --quiet --filter "label=$SONIC_CI_CONTAINER_LABEL")
        while IFS= read -r container; do
          test -n "$container" || continue
          if ! docker rm --force "$container"; then
            remaining=$(docker ps --all --quiet \
              --filter "label=$SONIC_CI_CONTAINER_LABEL" --filter "id=$container")
            if test -n "$remaining"; then
              printf 'Unable to remove job container: %s\n' "$container" >&2
              exit 1
            fi
            printf 'Job container already removed: %s\n' "$container"
          fi
        done <<< "$containers"
    - name: baseline Remove only this run's checkout
      if: always()
      working-directory: ${{ github.workspace }}
      run: |
        set -euo pipefail
        checkout="$GITHUB_WORKSPACE/vs-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
        if test -L "$checkout"; then
          printf 'Refusing redirected VS checkout: %s\n' "$checkout" >&2
          exit 1
        fi
        if test ! -e "$checkout"; then
          printf 'No VS checkout to remove: %s\n' "$checkout"
          exit 0
        fi
        python3 -B "$checkout/tools/bazel/ci/cleanup_vs_workspace.py" \
          --workspace "$GITHUB_WORKSPACE" \
          --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
    - name: baseline remove only private per-arm cache directories
      if: always()
      working-directory: ${{ github.workspace }}
      run: |-
        set -euo pipefail
        for dir in "$RUNNER_TEMP/vs-layout-bench-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-baseline" "$RUNNER_TEMP/vs-layout-host-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-baseline"; do
          test ! -L "$dir"
          sudo -n rm -rf --one-file-system -- "$dir"
        done
