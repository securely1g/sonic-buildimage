    runs-on: [self-hosted, linux, x64, sonic-slave-container-k3s]
    permissions:
      contents: read
      actions: read
    timeout-minutes: 12
    concurrency:
      group: vs-binary-config-${{ github.run_id }}-${{ github.run_attempt }}
