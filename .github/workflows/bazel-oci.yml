          python3 -I -S -B - <<'PY_COPY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['OBS_ROOT'])
          expected = {
              'control/tools/bazel/ci/observe_original_socat.py': 'da41bb8bd78caa23aa4ac57ee4a5be63ce4f294647987a5714d66fda2bf11efe',
              'control/tools/bazel/ci/observe_vs_host_binaries.py': 'ad0af004e1d84ca178798b4d16fee7062275d1d36b1e7dfa8cd61771a271304c',
              'control/tools/bazel/ci/recover_vs_original_inputs.py': '6699855d87b685f9b23a4b4c0a12084ec3100b45a59a8b575a06925f447988a5',
              'control/tools/bazel/ci/vs_original_binary_artifacts.json': '8334736fa50eb466d3d25761e41fc236a62cd11038eb99658821481543c05965',
              'control/tools/bazel/ci/vs_socat_original_binary_comparison.json': '30696e01cb3b9a1c05bc94cbe42a425d3e2d566322f413feb12762037a6290ba',
              'control/tools/bazel/tests/observe_original_socat_test.py': 'f79a198d335f941cd7be737a8218fbb52b1aef638cd107a66182278807daa300',
          }
          for name, digest in expected.items():
              source = root / name
              if not source.is_file() or source.is_symlink():
                  raise SystemExit('Expected a regular reviewed source file')
              raw = source.read_bytes()
              if hashlib.sha256(raw).hexdigest() != digest:
                  raise SystemExit('Metadata observation source identity differs')
              relative = Path(name).relative_to(Path(name).parts[0])
              destination = root / 'inspection' / relative
              destination.parent.mkdir(parents=True, exist_ok=True)
              with destination.open('xb') as output:
                  output.write(raw)
          plan = json.loads((root / 'inspection/tools/bazel/ci/vs_original_binary_artifacts.json').read_bytes())
          plan['artifacts'] = [row for row in plan['artifacts'] if row['id'] == 14030424431]
          if len(plan['artifacts']) != 1:
              raise SystemExit('Expected exactly the original host artifact')
          with (root / 'outputs/original-inputs.json').open('x') as output:
              json.dump(plan, output, indent=2)
