name: VS installer 27 versus 28 direct OCI inputs

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  vs_container:
    name: VS installer in SONiC slave (AMD64)
    permissions:
      contents: read
      actions: read
    runs-on: [self-hosted, linux, bazel-x64, vs, dhcp-oci-28-benchmark-2170]
    timeout-minutes: 720
    defaults:
      run:
        shell: bash
        working-directory: vs-${{ github.run_id }}-${{ github.run_attempt }}
    env:
      SONIC_CI_CONTAINER_LABEL: io.sonic-buildimage.ci-job=${{ github.repository }}:${{ github.run_id }}:${{ github.run_attempt }}:vs
      BAZEL: bazel
      # Use the explicitly selected gRPC service, not the legacy HTTPS override.
      BAZEL_REMOTE_AUTH: ""
      SONIC_BAZEL_REMOTE_CACHE: grpc://172.16.0.4:9092
      SONIC_BAZEL_REMOTE_UPLOAD: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && 'y' || 'n' }}
      SONIC_CONFIG_USE_DOCKER_CACHE: "y"
      SONIC_DPKG_CACHE_METHOD: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && 'rwcache' || 'rcache' }}
      SONIC_DPKG_CACHE_SOURCE: /nfs/dpkg_cache/vs
      SONIC_BUILD_JOBS: "1"
      SONIC_ENABLE_DEBUG_LAYER: ${{ inputs.enable_debug_layer && 'y' || 'n' }}
      ENABLE_DOCKER_BASE_PULL: "y"
      REGISTRY_SERVER: sonicdev-microsoft.azurecr.io
      ACR_REGISTRY_NAME: sonicdev
      AZURE_SUBSCRIPTION_ID: ${{ vars.ACR_SUBSCRIPTION_ID }}
      REGISTRY_PORT: "443"
      INCLUDE_FIPS: "y"
      SONIC_VERSION_CONTROL_COMPONENTS: py2,py3,web,git,docker
      MIRROR_SNAPSHOT: "y"
      SONIC_BUILD_SLAVE_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
      SONIC_BUILD_VARS: P4LANG_SOURCE_BASE_URL=file:/sonic/artifacts/vs/p4-source-inputs/sources
      PREFER_DEBIAN_REPO: "y"
      SONIC_VS_REUSE_BAZEL_PRODUCERS: "1"
      SONIC_VS_VALIDATION_BUNDLES: "1"
      # Make schedules one recipe; Bazel schedules all selected container targets.
      # Let Bazel choose its job count and CPU/memory scheduling budgets.
      # Debug exports need the space otherwise used by a duplicate local action
      # cache. Keep the output base and shared remote/repository caches available.
      BAZEL_CONTAINER_ARGS: >-
        ${{ inputs.enable_debug_layer && '--disk_cache=' || '' }}
        --remote_local_fallback
        --incompatible_remote_local_fallback_for_remote_cache
        --experimental_remote_downloader=grpc://172.16.0.4:9092
        --experimental_remote_downloader_local_fallback
        --distdir=/bazel_cache/distdir/ape-1.0.1
        --distdir=/bazel_cache/distdir/download_utils-1.0.1
        --distdir=/bazel_cache/distdir/rules_coreutils-1.0.1
        --distdir=/bazel_cache/distdir/rules_gzip-1.0.0
        --distdir=/bazel_cache/distdir/toolchain_utils-1.0.2
    steps:
      - name: Checkout repository and pinned submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: vs-${{ github.run_id }}-${{ github.run_attempt }}
          persist-credentials: false
          submodules: recursive

      - name: Download verified source archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: '44964137718'
          artifact-ids: '14731210897'
          merge-multiple: true
          path: vs-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/vs/repository-inputs

      - name: Initialize private Docker configuration
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/docker-config-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          set -euo pipefail
          install -d -m 0700 "$DOCKER_CONFIG"
          printf 'DOCKER_CONFIG=%s\n' "$DOCKER_CONFIG" >> "$GITHUB_ENV"

      - name: Configure Bazel action memory budget
        run: python3 -B tools/bazel/ci/resources.py --configure

      - name: Validate shared NFS package cache
        run: bash tools/ci/runner/nfs_package_cache.sh

      - name: Reclaim unused images and build cache
        run: |
          set -euo pipefail
          docker system df
          docker image prune --all --force
          docker builder prune --all --force
          docker system df

      - name: Reclaim local build caches
        run: python3 -B -m tools.bazel.ci.cleanup_runner_bazel_cache --runner-workspace "${{ runner.workspace }}" --remove-package-cache

      - name: Check host-agent build prerequisites
        run: python3 -B tools/ci/runner/preflight.py --host-agent --workspace "$PWD" --build-target sonic-vs.bin

      - name: Download the pinned P4 source inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: '44964137718'
          artifact-ids: '14731111117'
          merge-multiple: true
          path: vs-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/vs/p4-source-inputs

      - name: Verify P4 source bytes before native Make
        run: |
          python3 -B tools/ci/p4_source_inputs.py \
            --manifest src/p4lang/source-inputs.json \
            --directory artifacts/vs/p4-source-inputs/sources \
            --receipt artifacts/vs/p4-source-inputs-verified.json

      - name: Configure persistent caches
        env:
          SONIC_BAZEL_CACHE_SOURCE: ${{ runner.workspace }}/vs-cache/bazel
        run: |
          set -euo pipefail
          install -d -m 0700 "$SONIC_BAZEL_CACHE_SOURCE"
          test -w "$SONIC_BAZEL_CACHE_SOURCE"
          for cache in repository_cache disk_cache; do
            directory="$SONIC_BAZEL_CACHE_SOURCE/$cache"
            if test -d "$directory"; then
              blocked=$(find "$directory" -type d ! -writable -print -quit)
              if test -n "$blocked"; then
                printf 'Unwritable cache directory: %s\n' "$blocked" >&2
                exit 1
              fi
            fi
          done
          python3 -B tools/bazel/gzip/source_archive.py \
            --archives-dir artifacts/vs/repository-inputs \
            --output "$SONIC_BAZEL_CACHE_SOURCE/distdir" > artifacts/vs/source-download-receipt.json
          printf 'SONIC_BAZEL_CACHE_SOURCE=%s\nSONIC_DPKG_CACHE_SOURCE=%s\n' \
            "$SONIC_BAZEL_CACHE_SOURCE" "$SONIC_DPKG_CACHE_SOURCE" >> "$GITHUB_ENV"

      - name: Authenticate to the slave image registry
        env:
          AZURE_CONFIG_DIR: ${{ runner.temp }}/vs-azure-cli
        run: bash tools/ci/runner/azure_acr_login.sh "${ACR_REGISTRY_NAME:?}"

      - name: Prepare the host-driven SONiC slave
        run: |
          set -euo pipefail
          make init 2>&1 | tee artifacts/vs/init.log
          make configure PLATFORM=vs PLATFORM_ARCH=amd64 \
            SONIC_BUILDER_EXTRA_CMDLINE="--label $SONIC_CI_CONTAINER_LABEL" \
            2>&1 | tee artifacts/vs/configure.log
          for build_env in bookworm trixie; do
            make -f Makefile.work BLDENV="$build_env" docker-start \
              SONIC_BUILDER_EXTRA_CMDLINE="--label $SONIC_CI_CONTAINER_LABEL" \
              2>&1 | tee "artifacts/vs/docker-start-$build_env.log"
          done
          make -f Makefile.work BLDENV=trixie sonic-slave-run \
            SONIC_BUILDER_EXTRA_CMDLINE="--label $SONIC_CI_CONTAINER_LABEL" \
            SONIC_RUN_CMDS='python3 -B tools/bazel/ci/check_kernel_sandbox.py' \
            2>&1 | tee artifacts/vs/kernel-sandbox.log

      - name: Set the VS builder action memory budget
        run: |
          memory_option=$(python3 -B tools/bazel/ci/resources.py) || exit
          printf 'BAZEL_CONTAINER_ARGS=%s %s\n' "${BAZEL_CONTAINER_ARGS:-}" "$memory_option" >> "$GITHUB_ENV"

      - name: Prepare private VS host-base cache
        id: host_base_dir
        continue-on-error: true
        run: |
          set -euo pipefail
          snapshot="${GITHUB_WORKSPACE:?}/.sonic-vs-host-base-cache"
          rm -rf --one-file-system -- "$snapshot"
          install -d -m 0700 -- "$snapshot" artifacts/vs/host-base-transfer

      - name: Find a retained host base from this PR or master
        id: host_base_source
        if: steps.host_base_dir.outcome == 'success'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -B tools/bazel/ci/vs_host_base_snapshot.py

      - name: Download the previous VS host-base snapshot
        id: host_base_download
        if: steps.host_base_source.outputs.read_artifact_id != ''
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.host_base_source.outputs.read_run_id }}
          artifact-ids: ${{ steps.host_base_source.outputs.read_artifact_id }}
          merge-multiple: true
          path: vs-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/vs/host-base-transfer/download

      - name: Restore the VS host-base cache for Make
        if: steps.host_base_download.outcome == 'success'
        continue-on-error: true
        run: |
          python3 -B tools/bazel/ci/vs_host_base_transfer.py restore \
            "$GITHUB_WORKSPACE/.sonic-vs-host-base-cache" artifacts/vs/host-base-transfer/download

      - name: Find the VS kernel index from a master push
        id: kernel_index_source
        continue-on-error: true
        timeout-minutes: 2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          rm -rf -- artifacts/vs/kernel-cache-download
          python3 -B -m tools.bazel.ci.vs_kernel_cache_snapshot

      - name: Download the trusted VS kernel index
        id: kernel_index_download
        if: steps.kernel_index_source.outputs.artifact_id != ''
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.kernel_index_source.outputs.run_id }}
          artifact-ids: ${{ steps.kernel_index_source.outputs.artifact_id }}
          merge-multiple: true
          path: vs-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/vs/kernel-cache-download

      - name: Build sonic-vs.bin through the host Make wrapper
        id: native_build
        env:
          # The labeled cleanup step removes the stopped builder after artifact publication.
          SONIC_VS_DEFER_BUILDER_CLEANUP: "n"
          DOCKER_LOAD_ON_BOOT: "y"
          SONIC_VS_IMAGE_TIMINGS: "1"
          SONIC_VS_RETRY_GO_FETCH: "1"
          SONIC_VS_KERNEL_REMOTE_REUSE: "1"
          KERNEL_INDEX_DOWNLOAD: ${{ steps.kernel_index_download.outcome }}
          HOST_BASE_DIR: ${{ steps.host_base_dir.outcome }}
          TERM: dumb
        run: |
          set -euo pipefail
          # Accept only the index downloaded for this attempt, even if the checkout contains one.
          rm -rf -- artifacts/vs/kernel-cache-input artifacts/vs/kernel-cache-output
          index=artifacts/vs/kernel-cache-download/index.json
          if [[ "${KERNEL_INDEX_DOWNLOAD:-}" == success && -f "$index" && ! -L "$index" ]]; then
            install -D -m 0644 -- "$index" artifacts/vs/kernel-cache-input/index.json
          fi
          if [[ ${HOST_BASE_DIR:-} == success ]]; then
            export SONIC_HOSTBASE_CACHE_SOURCE="$GITHUB_WORKSPACE/.sonic-vs-host-base-cache"
          fi
          mkdir -p artifacts/vs/image-timings
          mkdir -p artifacts/vs/direct-bench
          test "$RUNNER_NAME" = sonic-baz000004-vs-4eda8531
          echo "Runner: $RUNNER_NAME" >> "$GITHUB_STEP_SUMMARY"
          first_sha=$(git rev-parse --short=9 HEAD)
          for sequence in a b; do
            export SONIC_IMAGE_VERSION="oci-bench-${sequence}-${first_sha}"
            if [[ $sequence == b ]]; then
              test -s target/sonic-vs.bin
              rm -- target/sonic-vs.bin
            fi
            echo "Building $SONIC_IMAGE_VERSION"
            bash tools/bazel/ci/build_vs.sh 2>&1 | tee "artifacts/vs/direct-bench/build-$sequence.log"
            test -s target/sonic-vs.bin
            df -h .
          done
          test -s target/sonic-vs.bin
          test -s target/sonic-vs.bin.dockers
          test "$(git rev-parse HEAD)" = "$(cat artifacts/vs/build-revision.txt)"

      - name: Publish paired step 3 benchmark receipts
        id: evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: vs-dhcp-28-direct-benchmark
          path: vs-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/vs/direct-bench/
          if-no-files-found: warn
          retention-days: 14
      - name: Remove only this job's build containers
        id: vs_container_cleanup
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          containers=$(docker ps --all --quiet --filter "label=$SONIC_CI_CONTAINER_LABEL")
          while IFS= read -r container; do
            test -n "$container" || continue
            if ! docker rm --force "$container"; then
              remaining=$(docker ps --all --quiet \
                --filter "label=$SONIC_CI_CONTAINER_LABEL" --filter "id=$container")
              if test -n "$remaining"; then
                printf 'Unable to remove job container: %s\n' "$container" >&2
                exit 1
              fi
              printf 'Job container already removed: %s\n' "$container"
            fi
          done <<< "$containers"

      - name: Log out of the slave image registry
        if: always()
        working-directory: ${{ runner.temp }}
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/docker-config-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          set -euo pipefail
          status=0
          docker logout "$REGISTRY_SERVER:$REGISTRY_PORT" || status=$?
          rm -f -- "${DOCKER_CONFIG:?}/config.json"
          exit "$status"

      - name: Remove only this run's checkout
        if: always() && steps.vs_container_cleanup.outcome == 'success' && steps.evidence.outcome == 'success'
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          checkout="$GITHUB_WORKSPACE/vs-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          if test -L "$checkout"; then
            printf 'Refusing redirected VS checkout: %s\n' "$checkout" >&2
            exit 1
          fi
          if test ! -e "$checkout"; then
            printf 'No VS checkout to remove: %s\n' "$checkout"
            exit 0
          fi
          python3 -B "$checkout/tools/bazel/ci/cleanup_vs_workspace.py" \
            --workspace "$GITHUB_WORKSPACE" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
