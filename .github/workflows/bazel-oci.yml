      if: env.GEARBOX_WORKER_RECEIPT != 'true'
    - name: Review public gearbox evidence
      id: gearbox_public
      if: (always() && steps.gearbox_build.outcome != 'skipped') && env.GEARBOX_WORKER_RECEIPT != 'true'
      run: "python3 - <<'PYCODE'\nimport json\nfrom pathlib import Path\nfrom tools.bazel.ci.public_artifacts import safe_json, dependency_json\nroot = Path('artifacts/gbsyncd')\nfor path in root.glob('*.json'):\n    if path.name not in ('build-receipt.json', 'module-graph.json'):\n        value = json.loads(path.read_text())\n        if path.name == 'policy.json':\n            # This is checked-in image configuration, not a captured\n            # process environment. Permit only this public constant.\n            assert value['image_validation'].pop('environment') == {'DEBIAN_FRONTEND': 'noninteractive'}\n        safe_json(value)\nfor name, kind in (('MODULE.bazel.lock', 'lock'), ('module-graph.json', 'graph')):\n    path = root / name\n    if path.exists():\n        dependency_json(json.loads(path.read_text()), kind)\nreceipt = root / 'build-receipt.json'\nif receipt.exists():\n    source = json.loads(receipt.read_text())\n    public = {key: source[key] for key in ('status', 'revision',\
        \ 'architecture', 'image_version', 'artifacts', 'review_registry_revision', 'tested_revision_parents') if key in source}\n    safe_json(public)\n    (root / 'public-receipt.json').write_text(json.dumps(public, indent=2) + '\\n')\nPYCODE\n"
    - name: Retain gearbox archives and source evidence
      if: (always() && steps.gearbox_public.outcome == 'success') && env.GEARBOX_WORKER_RECEIPT != 'true'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: gbsyncd-source-amd64
        path: 'artifacts/gbsyncd/*.gz

          artifacts/gbsyncd/*.tar

          artifacts/gbsyncd/validation.json

          artifacts/gbsyncd/source-contract.json

          artifacts/gbsyncd/source-receipt.json

          artifacts/gbsyncd/policy.json

          artifacts/gbsyncd/runtime-apt.json

          artifacts/gbsyncd/debug-apt.json

          artifacts/gbsyncd/runtime-packages.json

          artifacts/gbsyncd/debug-packages.json

          artifacts/gbsyncd/base-packages.json

          artifacts/gbsyncd/config-engine-packages.json

          artifacts/gbsyncd/*.status

          artifacts/gbsyncd/public-receipt.json

          artifacts/gbsyncd/action-audit.json

          artifacts/gbsyncd/incremental.json

          artifacts/gbsyncd/MODULE.bazel.lock

          artifacts/gbsyncd/module-graph.json

          '
        if-no-files-found: error
        retention-days: 14
        compression-level: 1
    - name: Retain the tested PR source context
      if: always() && github.event_name == 'pull_request' && (steps.source_context.outcome == 'success' || steps.source_context_fallback.outcome == 'success')
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: source-context-${{ github.job }}-${{ strategy.job-index || 0 }}-${{ github.run_attempt }}
        path: ${{ env.SONIC_RECEIPT_WORKSPACE || github.workspace }}/artifacts/source-context/context.json
        if-no-files-found: error
        retention-days: 14
    permissions:
      contents: read
      actions: read

  dash_engine_native:
    if: github.event_name != 'workflow_dispatch' || inputs.source_image == 'none'
    name: Build and inspect DASH engine images (AMD64)
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    container: *native_container
    env: *native_bazel
    defaults: *native_shell
    steps:
      - *native_space
      - *native_tools
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 64
      - name: Verify the tested PR source context
        id: source_context
        if: github.event_name == 'pull_request'
        run: |
          git config --global --add safe.directory "$PWD"
          python3 -B -m tools.bazel.ci.image_worker_receipt source-context --directory artifacts/source-context
      - *native_architecture
      - *native_gnoi
      - *native_p4rt_owner
      - *native_p4rt_tools
      - *native_github_reader
      - *native_bazelisk
      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-version: ""
          bazelisk-cache: true
          repository-cache: true
          disk-cache: oci-dash-engine-amd64
          cache-version: "8.5.1"

      - *native_mirror
      - *native_caches
      - *native_pigz
      - *native_rule_sources
      - name: Build DASH engine runtime and debug images from source owners
        id: dash_engine_build
        env:
          BAZELISK_GITHUB_TOKEN: ""
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CI_BASE_SHA: ${{ steps.source_context.outputs.tested_base || github.event.pull_request.base.sha }}
        run: python3 -B tools/bazel/ci/dash_engine_image.py build --bazel "$BAZEL" --artifacts artifacts/dash-engine
      - name: Validate DASH engine payloads and matching symbols
        run: python3 -B tools/bazel/ci/dash_engine_image.py validate --artifacts artifacts/dash-engine
      - name: Validate nnpy in the selected image dependency graph
        run: |
          options=(--jobs=2 --local_resources=cpu=2 --local_resources=memory=8000
            --platforms=@sonic_build_infra//platforms:x86_64_trixie
            --host_platform=@sonic_build_infra//platforms:x86_64_trixie)
          audit=()
          for option in "${options[@]}"; do audit+=("--bazel-arg=$option"); done
          python3 tools/bazel/ci/bazel_commands.py --bazel "$BAZEL" "${audit[@]}" \
            --output artifacts/dash-engine/owner-action-audit.json @nnpy//:package_test
          "$BAZEL" test "${options[@]}" --test_output=errors @nnpy//:package_test
          mkdir -p artifacts/dash-engine/tests
          test -s bazel-testlogs/external/nnpy+/package_test/test.xml
          cp bazel-testlogs/external/nnpy+/package_test/test.xml artifacts/dash-engine/tests/test.xml
      - name: Verify DASH engine no-op, startup edit and restored archives
        run: python3 -B tools/bazel/ci/dash_engine_image.py incremental --bazel "$BAZEL" --artifacts artifacts/dash-engine
      - name: Review public DASH engine evidence
        id: dash_engine_public
        if: always() && steps.dash_engine_build.outcome != 'skipped'
        run: python3 -B tools/bazel/ci/dash_engine_public.py --artifacts artifacts/dash-engine
      - name: Retain reviewed DASH incremental diagnostics
        if: always() && steps.dash_engine_public.outcome == 'success' && hashFiles('artifacts/dash-engine/incremental.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dash-engine-incremental-amd64
          path: artifacts/dash-engine/incremental.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 1
      - name: Retain DASH engine archives and source evidence
        if: always() && steps.dash_engine_public.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dash-engine-source-amd64
          path: |
            artifacts/dash-engine/bazelisk-bootstrap.json
            artifacts/dash-engine/rule-sources.json
            artifacts/dash-engine/*.gz
            artifacts/dash-engine/*.tar
            artifacts/dash-engine/*.status
            artifacts/dash-engine/*-apt.json
            artifacts/dash-engine/*.packages.json
            artifacts/dash-engine/*.validation.json
            artifacts/dash-engine/validation.json
            artifacts/dash-engine/public-receipt.json
            artifacts/dash-engine/layout-identities.json
            artifacts/dash-engine/action-audit.json
            artifacts/dash-engine/owner-action-audit.json
            artifacts/dash-engine/incremental.json
            artifacts/dash-engine/MODULE.bazel.lock
            artifacts/dash-engine/module-graph.json
            artifacts/dash-engine/tests/test.xml
          if-no-files-found: error
          retention-days: 14
          compression-level: 1

      - name: Retain the tested PR source context
        if: always() && github.event_name == 'pull_request' && (steps.source_context.outcome == 'success')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: source-context-${{ github.job }}-${{ strategy.job-index || 0 }}-${{ github.run_attempt }}
          path: artifacts/source-context/context.json
          if-no-files-found: error
          retention-days: 14
  p4rt_native:
    if: github.event_name != 'workflow_dispatch' || inputs.source_image == 'none'
    name: Build and inspect P4RT images (AMD64)
    runs-on: *receipt_metadata_runner
    timeout-minutes: 300
    container: *receipt_metadata_container
    env:
      BAZEL: ${{ github.workspace }}/tools/bazel/ci/libteam_draft_bazel.sh
      P4RT_WORKER_RECEIPT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    defaults: *native_shell
    permissions:
      contents: read
      actions: read
    steps:
      - name: Install only receipt verification tools
        if: env.P4RT_WORKER_RECEIPT == 'true'
        run: *receipt_metadata_tools
      - name: Checkout the normal CI merge for receipt verification
        if: env.P4RT_WORKER_RECEIPT == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: 'false'
          fetch-depth: 64
          path: ${{ env.SONIC_RECEIPT_CHECKOUT }}
      - name: Verify the tested PR source context
        working-directory: ${{ env.SONIC_RECEIPT_WORKSPACE }}
        id: source_context
        if: github.event_name == 'pull_request' && (env.P4RT_WORKER_RECEIPT == 'true')
        run: |
          git config --global --add safe.directory "$PWD"
          python3 -B -m tools.bazel.ci.image_worker_receipt source-context --directory artifacts/source-context
      - name: Preserve the original normal CI request
        working-directory: ${{ env.SONIC_RECEIPT_WORKSPACE }}
        if: env.P4RT_WORKER_RECEIPT == 'true'
        id: p4rt_request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$PWD"
          python3 -B -m tools.bazel.ci.image_worker_receipt origin \
            --contract tools/bazel/ci/p4rt_worker_contract.json \
            --directory "$SONIC_RECEIPT_SCRATCH/p4rt-ci-request"
      - name: Upload the original P4RT worker request
        if: env.P4RT_WORKER_RECEIPT == 'true' && steps.p4rt_request.outputs.new_request == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.p4rt_request.outputs.request_name }}
          path: ${{ env.SONIC_RECEIPT_SCRATCH }}/p4rt-ci-request/request.json
          if-no-files-found: error
          retention-days: '14'
      - name: Download the immutable original P4RT request
        if: env.P4RT_WORKER_RECEIPT == 'true' && steps.p4rt_request.outputs.new_request == 'false'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ steps.p4rt_request.outputs.request_artifact }}
          merge-multiple: 'true'
          run-id: ${{ steps.p4rt_request.outputs.request_run }}
          github-token: ${{ github.token }}
          repository: securely1g/sonic-buildimage
          path: ${{ env.SONIC_RECEIPT_SCRATCH }}/p4rt-ci-request
      - name: Require exact successful worker evidence for this CI merge
        working-directory: ${{ env.SONIC_RECEIPT_WORKSPACE }}
        if: env.P4RT_WORKER_RECEIPT == 'true'
        id: p4rt_acceptance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -B -m tools.bazel.ci.image_worker_receipt discover \
            --contract tools/bazel/ci/p4rt_worker_contract.json \
            --directory "$SONIC_RECEIPT_SCRATCH/p4rt-ci-request"
      - name: Download only the small public P4RT JSON receipts
        if: env.P4RT_WORKER_RECEIPT == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ steps.p4rt_acceptance.outputs.artifact }}
          merge-multiple: 'true'
          run-id: ${{ steps.p4rt_acceptance.outputs.worker_run }}
          github-token: ${{ github.token }}
          repository: securely1g/sonic-buildimage
          path: ${{ env.SONIC_RECEIPT_SCRATCH }}/p4rt-ci-evidence
      - name: Verify all original P4RT acceptance checks
        working-directory: ${{ env.SONIC_RECEIPT_WORKSPACE }}
        if: env.P4RT_WORKER_RECEIPT == 'true'
        run: |
          python3 -B -m tools.bazel.ci.image_worker_receipt verify \
            --contract tools/bazel/ci/p4rt_worker_contract.json \
            --directory "$SONIC_RECEIPT_SCRATCH/p4rt-ci-request" \
            --public "$SONIC_RECEIPT_SCRATCH/p4rt-ci-evidence" \
            --output "$SONIC_RECEIPT_SCRATCH/p4rt-ci-verified.json"
      - name: Retain the verified CI handoff summary
        if: env.P4RT_WORKER_RECEIPT == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: p4rt-ci-p4rt_native-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.SONIC_RECEIPT_SCRATCH }}/p4rt-ci-verified.json
          if-no-files-found: error
          retention-days: '14'
      - name: Allocate source-build space on this disposable runner
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          df -h / "$GITHUB_WORKSPACE"
          du -sh /runner-unused/android /runner-unused/dotnet /runner-unused/ghc
          # These host SDKs are not inputs to the pinned Trixie build. Preserve
          # all Bazel caches, the workspace, retained outputs and execution tools.
          find /runner-unused/android /runner-unused/dotnet /runner-unused/ghc \
            -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          df -h / "$GITHUB_WORKSPACE"
        if: env.P4RT_WORKER_RECEIPT != 'true'
      - name: Install execution tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            autoconf automake binutils binutils-gold build-essential busybox ca-certificates file gdb git j2cli jq libarchive-tools libtool libxml2 pkg-config python3 python3-jinja2 tar unzip zstd
          for tool in bsdtar gdb readelf objcopy; do command -v "$tool"; done
        if: env.P4RT_WORKER_RECEIPT != 'true'
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: 'false'
          fetch-depth: 64
        if: env.P4RT_WORKER_RECEIPT != 'true'
      - name: Verify the tested PR source context
        id: source_context_fallback
        if: github.event_name == 'pull_request' && (env.P4RT_WORKER_RECEIPT != 'true')
        run: |
          git config --global --add safe.directory "$PWD"
          python3 -B -m tools.bazel.ci.image_worker_receipt source-context --directory artifacts/source-context
      - name: Check native architecture and generated dependency state
        run: |
          test "$(uname -m)" = "x86_64"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test ! -e MODULE.bazel.lock
          test -z "$(git ls-files -- MODULE.bazel.lock)"
          git check-ignore MODULE.bazel.lock
        if: env.P4RT_WORKER_RECEIPT != 'true'
      - name: Initialize Sysmgr's pinned gNOI source
        run: git -c safe.directory="$GITHUB_WORKSPACE" submodule update --init -- src/sonic-sysmgr/gnoi
        if: env.P4RT_WORKER_RECEIPT != 'true'
      - name: Initialize P4RT's pinned source owner
        run: git submodule update --init -- src/sonic-p4rt/sonic-pins
        if: env.P4RT_WORKER_RECEIPT != 'true'
      - name: Install P4RT source execution dependencies
        run: |
          apt-get install -y --no-install-recommends bison flex libfl-dev libgmp-dev patch zip \
            libarchive-tools libhiredis-dev libnl-3-dev libnl-genl-3-dev libnl-nf-3-dev \
            libnl-route-3-dev libzmq3-dev libboost-serialization-dev nlohmann-json3-dev uuid-dev
          git config --global --add safe.directory "$GITHUB_WORKSPACE/src/sonic-p4rt/sonic-pins"
        if: env.P4RT_WORKER_RECEIPT != 'true'
      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86
        with:
          bazelisk-version: 1.29.0
          bazelisk-cache: 'true'
          repository-cache: 'true'
          disk-cache: oci-p4rt-amd64
          cache-version: 8.5.1
        if: env.P4RT_WORKER_RECEIPT != 'true'
      - name: Configure the verified source mirror
        run: |
          python3 - <<'PYCFG'
          import hashlib
          import os
          from pathlib import Path
          from urllib.request import urlopen
          # Load the merged registry configuration. Bazel verifies each archive against its pinned checksum.
          url = "https://raw.githubusercontent.com/securely1g/sonic-bazel-registry/97cc502556b7ec3435d2d67b105315bcc18bb47e/ci/source_mirrors.cfg"
          with urlopen(url, timeout=60) as response:
              data = response.read()
          expected = "ddd6f40504a30e138a62be0d728e1a352391d0f781c927eaf4ea45c44d8a0720"
          if hashlib.sha256(data).hexdigest() != expected:
              raise SystemExit("Source mirror configuration checksum mismatch")
          config = Path(os.environ["RUNNER_TEMP"]) / "sonic-source-mirrors.cfg"
          config.write_bytes(data)
          with Path(".bazelrc.user").open("a") as rc:
              rc.write("common --experimental_downloader_config=" + str(config) + "\n")
          PYCFG
        if: env.P4RT_WORKER_RECEIPT != 'true'
      - name: Preserve configured caches for Draft validation
        run: python3 -B tools/bazel/ci/lldp_draft_cache.py
        if: env.P4RT_WORKER_RECEIPT != 'true'
      - name: Prepare the checksum-pinned pigz source archive
        run: |
          mkdir -p artifacts/source-downloads
          python3 -B tools/bazel/gzip/prepare_pigz.py \
            --output "$PWD/artifacts/source-downloads" | tee artifacts/pigz-source.json
          # common.bazelrc imports this ignored file, including through Draft wrappers.
          printf 'common --distdir=%s\n' "$PWD/artifacts/source-downloads" >> .bazelrc.user
          # Draft wrappers disable the home rc; share setup-bazel caches with them.
          python3 - <<'PYCODE'
          from pathlib import Path
          home = Path.home() / '.bazelrc'
          cache_lines = [line for line in home.read_text().splitlines()
                         if line.startswith(('build --disk_cache=', 'common --repository_cache='))]
          assert len(cache_lines) == 2, 'setup-bazel cache settings are missing'
          user = Path('.bazelrc.user')
          user.write_text(user.read_text() + '\n'.join(cache_lines) + '\n')
          PYCODE
        if: env.P4RT_WORKER_RECEIPT != 'true'
      - name: Bound P4RT build phases and verify execution tools
        run: |
          for tool in bsdtar gdb readelf objcopy make git python3 zip bison flex g++ pkg-config; do
            command -v "$tool" >/dev/null
          done
          python3 - <<'PYLAUNCH'
          import os, shlex, shutil
          from pathlib import Path
          real = shutil.which("bazel")
          if not real:
              raise SystemExit("Bazelisk is unavailable")
          directory = Path(os.environ["RUNNER_TEMP"]) / "p4rt-bounded-bazel"
          directory.mkdir(exist_ok=True)
          for name, heap in (("root", "3g"), ("owner", "2g")):
              path = directory / name
              path.write_text("#!/bin/sh\nset -eu\n"
                  'if [ "$#" -eq 1 ] && [ "$1" = --version ]; then\n'
                  "  exec " + shlex.quote(real) + ' "$@"\nfi\n'
                  "exec " + shlex.quote(real) + " --host_jvm_args=-Xmx" + heap + ' "$@"\n')
              path.chmod(0o755)
          with Path(os.environ["GITHUB_ENV"]).open("a") as output:
              output.write("BAZEL_REAL=" + str(directory / "root") + "\n")
              output.write("P4RT_OWNER_BAZEL=" + str(directory / "owner") + "\n")
          PYLAUNCH
        if: env.P4RT_WORKER_RECEIPT != 'true'
      - name: Prepare matching Common SDK and source-owned P4RT TARs
        run: |
          python3 -B tools/bazel/ci/p4rt_image.py prepare-owner --bazel "$BAZEL" \
            --directory artifacts/p4rt --owner-source src/sonic-p4rt/sonic-pins \
            --owner-revision "$(git rev-parse HEAD:src/sonic-p4rt/sonic-pins)" \
            --owner-output-base "$RUNNER_TEMP/p4rt-bazel-6" --owner-bazel "$P4RT_OWNER_BAZEL" --jobs 2
        if: env.P4RT_WORKER_RECEIPT != 'true'
      - name: Build P4RT runtime and debug images
        run: |
          python3 -B tools/bazel/ci/p4rt_image.py build --bazel "$BAZEL" \
            --directory artifacts/p4rt --owner-source src/sonic-p4rt/sonic-pins \
            --owner-revision "$(git rev-parse HEAD:src/sonic-p4rt/sonic-pins)" \
            --owner-output-base "$RUNNER_TEMP/p4rt-bazel-6"
        if: env.P4RT_WORKER_RECEIPT != 'true'
      - name: Validate P4RT image contents and cache reuse
        run: |
          python3 -B tools/bazel/ci/p4rt_validate.py validate --directory artifacts/p4rt \
            --owner-source src/sonic-p4rt/sonic-pins --bazel "$BAZEL"
          python3 -B tools/bazel/ci/p4rt_validate.py incremental --directory artifacts/p4rt \
            --owner-source src/sonic-p4rt/sonic-pins --bazel "$BAZEL"
        if: env.P4RT_WORKER_RECEIPT != 'true'
      - name: Run all original P4RT tests against the selected image SDK
        run: |
          for phase in prepare-owner-runtime owner-tests; do
            python3 -B tools/bazel/ci/p4rt_image.py "$phase" --bazel "$BAZEL" \
              --directory artifacts/p4rt --owner-source src/sonic-p4rt/sonic-pins \
              --owner-revision "$(git rev-parse HEAD:src/sonic-p4rt/sonic-pins)" \
              --owner-output-base "$RUNNER_TEMP/p4rt-bazel-6" --owner-bazel "$P4RT_OWNER_BAZEL" --jobs 2
          done
        if: env.P4RT_WORKER_RECEIPT != 'true'
      - name: Prepare reviewed P4RT public evidence
        id: p4rt_public
        if: (always()) && env.P4RT_WORKER_RECEIPT != 'true'
        run: python3 -B tools/bazel/ci/p4rt_public.py --directory artifacts/p4rt
      - name: Retain P4RT images and acceptance evidence
        if: (always() && steps.p4rt_public.outcome == 'success') && env.P4RT_WORKER_RECEIPT != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: p4rt-images-amd64-${{ github.sha }}
          path: artifacts/p4rt/public
          if-no-files-found: error
          retention-days: '14'
          compression-level: '0'

      - name: Retain the tested PR source context
        if: always() && github.event_name == 'pull_request' && (steps.source_context.outcome == 'success' || steps.source_context_fallback.outcome == 'success')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: source-context-${{ github.job }}-${{ strategy.job-index || 0 }}-${{ github.run_attempt }}
          path: ${{ env.SONIC_RECEIPT_WORKSPACE || github.workspace }}/artifacts/source-context/context.json
          if-no-files-found: error
          retention-days: 14
  syncd_native:
    if: github.event_name != 'workflow_dispatch' || inputs.source_image == 'none'
    name: Build and inspect syncd images (AMD64)
    runs-on: *receipt_metadata_runner
    timeout-minutes: 300
    container: *receipt_metadata_container
    env:
      BAZEL: ${{ github.workspace }}/tools/bazel/ci/libteam_draft_bazel.sh
      SYNCD_WORKER_RECEIPT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      actions: read
    steps:
    - name: Install only receipt verification tools
      if: env.SYNCD_WORKER_RECEIPT == 'true'
      run: *receipt_metadata_tools
    - name: Checkout the normal CI merge for receipt verification
      if: env.SYNCD_WORKER_RECEIPT == 'true'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: 'false'
        fetch-depth: 64
        path: ${{ env.SONIC_RECEIPT_CHECKOUT }}
    - name: Verify the tested PR source context
      working-directory: ${{ env.SONIC_RECEIPT_WORKSPACE }}
      id: source_context
      if: github.event_name == 'pull_request' && (env.SYNCD_WORKER_RECEIPT == 'true')
      run: |
        git config --global --add safe.directory "$PWD"
        python3 -B -m tools.bazel.ci.image_worker_receipt source-context --directory artifacts/source-context
    - name: Preserve the original normal CI request
      working-directory: ${{ env.SONIC_RECEIPT_WORKSPACE }}
      if: env.SYNCD_WORKER_RECEIPT == 'true'
      id: syncd_request
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        git config --global --add safe.directory "$PWD"
        python3 -B -m tools.bazel.ci.image_worker_receipt origin \
          --contract tools/bazel/ci/syncd_worker_contract.json \
          --directory "$SONIC_RECEIPT_SCRATCH/syncd-ci-request"
    - name: Upload the original Syncd worker request
      if: env.SYNCD_WORKER_RECEIPT == 'true' && steps.syncd_request.outputs.new_request == 'true'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ${{ steps.syncd_request.outputs.request_name }}
        path: ${{ env.SONIC_RECEIPT_SCRATCH }}/syncd-ci-request/request.json
        if-no-files-found: error
        retention-days: '14'
    - name: Download the immutable original Syncd request
      if: env.SYNCD_WORKER_RECEIPT == 'true' && steps.syncd_request.outputs.new_request == 'false'
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        artifact-ids: ${{ steps.syncd_request.outputs.request_artifact }}
        merge-multiple: 'true'
        run-id: ${{ steps.syncd_request.outputs.request_run }}
        github-token: ${{ github.token }}
        repository: securely1g/sonic-buildimage
        path: ${{ env.SONIC_RECEIPT_SCRATCH }}/syncd-ci-request
    - name: Require exact successful worker evidence for this CI merge
      working-directory: ${{ env.SONIC_RECEIPT_WORKSPACE }}
      if: env.SYNCD_WORKER_RECEIPT == 'true'
      id: syncd_acceptance
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        python3 -B -m tools.bazel.ci.image_worker_receipt discover \
          --contract tools/bazel/ci/syncd_worker_contract.json \
          --directory "$SONIC_RECEIPT_SCRATCH/syncd-ci-request"
    - name: Download only the small public Syncd JSON receipts
      if: env.SYNCD_WORKER_RECEIPT == 'true'
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        artifact-ids: ${{ steps.syncd_acceptance.outputs.artifact }}
        merge-multiple: 'true'
        run-id: ${{ steps.syncd_acceptance.outputs.worker_run }}
        github-token: ${{ github.token }}
        repository: securely1g/sonic-buildimage
        path: ${{ env.SONIC_RECEIPT_SCRATCH }}/syncd-ci-evidence
    - name: Verify all original Syncd acceptance checks
      working-directory: ${{ env.SONIC_RECEIPT_WORKSPACE }}
      if: env.SYNCD_WORKER_RECEIPT == 'true'
      run: |
        python3 -B -m tools.bazel.ci.image_worker_receipt verify \
          --contract tools/bazel/ci/syncd_worker_contract.json \
          --directory "$SONIC_RECEIPT_SCRATCH/syncd-ci-request" \
          --public "$SONIC_RECEIPT_SCRATCH/syncd-ci-evidence" \
          --output "$SONIC_RECEIPT_SCRATCH/syncd-ci-verified.json"
    - name: Retain the verified CI handoff summary
      if: env.SYNCD_WORKER_RECEIPT == 'true'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: syncd-ci-syncd_native-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ env.SONIC_RECEIPT_SCRATCH }}/syncd-ci-verified.json
        if-no-files-found: error
        retention-days: '14'
    - name: Allocate source-build space on this disposable runner
      run: |
        test "$RUNNER_ENVIRONMENT" = github-hosted
        df -h / "$GITHUB_WORKSPACE"
        du -sh /runner-unused/android /runner-unused/dotnet /runner-unused/ghc
        # These host SDKs are not inputs to the pinned Trixie build. Preserve
        # all Bazel caches, the workspace, retained outputs and execution tools.
        find /runner-unused/android /runner-unused/dotnet /runner-unused/ghc \
          -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
        df -h / "$GITHUB_WORKSPACE"
      if: env.SYNCD_WORKER_RECEIPT != 'true'
    - name: Install execution tools
      run: |
        apt-get update
        apt-get install -y --no-install-recommends \
          autoconf automake binutils binutils-gold build-essential busybox ca-certificates file gdb git j2cli jq libarchive-tools libtool libxml2 pkg-config python3 python3-jinja2 tar unzip zstd
        for tool in bsdtar gdb readelf objcopy; do command -v "$tool"; done
      if: env.SYNCD_WORKER_RECEIPT != 'true'
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 64
      if: env.SYNCD_WORKER_RECEIPT != 'true'
    - name: Verify the tested PR source context
      id: source_context_fallback
      if: github.event_name == 'pull_request' && (env.SYNCD_WORKER_RECEIPT != 'true')
      run: |
        git config --global --add safe.directory "$PWD"
        python3 -B -m tools.bazel.ci.image_worker_receipt source-context --directory artifacts/source-context
    - name: Check native architecture and generated dependency state
      run: |
        test "$(uname -m)" = "x86_64"
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        test ! -e MODULE.bazel.lock
        test -z "$(git ls-files -- MODULE.bazel.lock)"
        git check-ignore MODULE.bazel.lock
      if: env.SYNCD_WORKER_RECEIPT != 'true'
    - name: Initialize Sysmgr's pinned gNOI source
      run: git -c safe.directory="$GITHUB_WORKSPACE" submodule update --init -- src/sonic-sysmgr/gnoi
      if: env.SYNCD_WORKER_RECEIPT != 'true'
    - name: Initialize P4RT's pinned source owner
      run: git submodule update --init -- src/sonic-p4rt/sonic-pins
      if: env.SYNCD_WORKER_RECEIPT != 'true'
    - name: Install P4RT source execution dependencies
      run: |
        apt-get install -y --no-install-recommends bison flex libfl-dev libgmp-dev patch zip \
          libarchive-tools libhiredis-dev libnl-3-dev libnl-genl-3-dev libnl-nf-3-dev \
          libnl-route-3-dev libzmq3-dev libboost-serialization-dev nlohmann-json3-dev uuid-dev
        git config --global --add safe.directory "$GITHUB_WORKSPACE/src/sonic-p4rt/sonic-pins"
      if: env.SYNCD_WORKER_RECEIPT != 'true'
    - name: Set up Bazel
      uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86
      with:
        bazelisk-version: 1.29.0
        bazelisk-cache: true
        repository-cache: true
        disk-cache: oci-syncd-amd64
        cache-version: 8.5.1
      if: env.SYNCD_WORKER_RECEIPT != 'true'
    - name: Configure the verified source mirror
      run: |
        python3 - <<'PYCFG'
        import hashlib
        import os
        from pathlib import Path
        from urllib.request import urlopen
        # Load the merged registry configuration. Bazel verifies each archive against its pinned checksum.
        url = "https://raw.githubusercontent.com/securely1g/sonic-bazel-registry/97cc502556b7ec3435d2d67b105315bcc18bb47e/ci/source_mirrors.cfg"
        with urlopen(url, timeout=60) as response:
            data = response.read()
        expected = "ddd6f40504a30e138a62be0d728e1a352391d0f781c927eaf4ea45c44d8a0720"
        if hashlib.sha256(data).hexdigest() != expected:
            raise SystemExit("Source mirror configuration checksum mismatch")
        config = Path(os.environ["RUNNER_TEMP"]) / "sonic-source-mirrors.cfg"
        config.write_bytes(data)
        with Path(".bazelrc.user").open("a") as rc:
            rc.write("common --experimental_downloader_config=" + str(config) + "\n")
        PYCFG
      if: env.SYNCD_WORKER_RECEIPT != 'true'
    - name: Preserve configured caches for Draft validation
      run: python3 -B tools/bazel/ci/lldp_draft_cache.py
      if: env.SYNCD_WORKER_RECEIPT != 'true'
    - name: Prepare the checksum-pinned pigz source archive
      run: |
        mkdir -p artifacts/source-downloads
        python3 -B tools/bazel/gzip/prepare_pigz.py \
          --output "$PWD/artifacts/source-downloads" | tee artifacts/pigz-source.json
        # common.bazelrc imports this ignored file, including through Draft wrappers.
        printf 'common --distdir=%s\n' "$PWD/artifacts/source-downloads" >> .bazelrc.user
        # Draft wrappers disable the home rc; share setup-bazel caches with them.
        python3 - <<'PYCODE'
        from pathlib import Path
        home = Path.home() / '.bazelrc'
        cache_lines = [line for line in home.read_text().splitlines()
                       if line.startswith(('build --disk_cache=', 'common --repository_cache='))]
        assert len(cache_lines) == 2, 'setup-bazel cache settings are missing'
        user = Path('.bazelrc.user')
        user.write_text(user.read_text() + '\n'.join(cache_lines) + '\n')
        PYCODE
      if: env.SYNCD_WORKER_RECEIPT != 'true'
    - name: Build syncd runtime and debug images from source packages
      id: syncd_build
      env:
        BAZELISK_GITHUB_TOKEN: ''
        CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        CI_BASE_SHA: ${{ steps.source_context_fallback.outputs.tested_base || steps.source_context.outputs.tested_base || github.event.pull_request.base.sha }}
      run: python3 -B tools/bazel/ci/syncd_image.py build --bazel "$BAZEL" --artifacts artifacts/syncd
      if: env.SYNCD_WORKER_RECEIPT != 'true'
    - name: Validate syncd installed contents and complete source symbols
      run: python3 -B tools/bazel/ci/syncd_image.py validate --artifacts artifacts/syncd
      if: env.SYNCD_WORKER_RECEIPT != 'true'
    - name: Verify syncd no-op, configuration edit and restored archives
      run: python3 -B tools/bazel/ci/syncd_image.py incremental --bazel "$BAZEL" --artifacts artifacts/syncd
      if: env.SYNCD_WORKER_RECEIPT != 'true'
    - name: Review public syncd evidence
      id: syncd_public
      if: (always() && steps.syncd_build.outcome != 'skipped') && env.SYNCD_WORKER_RECEIPT != 'true'
      run: |
        python3 - <<'PYCODE'
        import json
        from pathlib import Path
        from tools.bazel.ci.public_artifacts import safe_json, dependency_json
        root = Path('artifacts/syncd')
        for path in root.glob('*.json'):
            if path.name not in ('build-receipt.json', 'module-graph.json'):
                value = json.loads(path.read_text())
                if path.name == 'policy.json':
                    # This is checked-in image configuration, not a captured
                    # process environment. Permit only this public constant.
                    assert value['image_validation'].pop('environment') == {'DEBIAN_FRONTEND': 'noninteractive'}
                safe_json(value)
        for name, kind in (('MODULE.bazel.lock', 'lock'), ('module-graph.json', 'graph')):
            path = root / name
            if path.exists():
                dependency_json(json.loads(path.read_text()), kind)
        receipt = root / 'build-receipt.json'
        if receipt.exists():
            source = json.loads(receipt.read_text())
            public = {key: source[key] for key in ('status', 'revision', 'architecture', 'image_version', 'artifacts', 'review_registry_revision', 'tested_revision_parents') if key in source}
            safe_json(public)
            (root / 'public-receipt.json').write_text(json.dumps(public, indent=2) + '\n')
        PYCODE
    - name: Retain syncd archives and source evidence
      if: (always() && steps.syncd_public.outcome == 'success') && env.SYNCD_WORKER_RECEIPT != 'true'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: syncd-source-amd64
        path: |
          artifacts/syncd/*.gz
          artifacts/syncd/*.tar
          artifacts/syncd/validation.json
          artifacts/syncd/source-contract.json
          artifacts/syncd/source-receipt.json
          artifacts/syncd/policy.json
          artifacts/syncd/runtime-apt.json
          artifacts/syncd/debug-apt.json
          artifacts/syncd/runtime-packages.json
          artifacts/syncd/debug-packages.json
          artifacts/syncd/base-packages.json
          artifacts/syncd/config-engine-packages.json
          artifacts/syncd/*.status
          artifacts/syncd/public-receipt.json
          artifacts/syncd/action-audit.json
          artifacts/syncd/incremental.json
          artifacts/syncd/MODULE.bazel.lock
          artifacts/syncd/module-graph.json
        if-no-files-found: error
        retention-days: 14
        compression-level: 1

    - name: Retain the tested PR source context
      if: always() && github.event_name == 'pull_request' && (steps.source_context.outcome == 'success' || steps.source_context_fallback.outcome == 'success')
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: source-context-${{ github.job }}-${{ strategy.job-index || 0 }}-${{ github.run_attempt }}
        path: ${{ env.SONIC_RECEIPT_WORKSPACE || github.workspace }}/artifacts/source-context/context.json
        if-no-files-found: error
        retention-days: 14
  teamd_native:
    if: github.event_name != 'workflow_dispatch' || inputs.source_image == 'none'
    name: Build and inspect Teamd images (AMD64)
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    container: *native_container
    env: *native_bazel
    defaults: *native_shell
    steps:
      - *native_space
      - *native_tools
      - *native_checkout
      - *native_architecture
      - *native_gnoi
      - *native_p4rt_owner
      - *native_p4rt_tools
      - *native_github_reader
      - *native_bazelisk
      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-version: ""
          bazelisk-cache: true
          repository-cache: true
          disk-cache: oci-teamd-amd64
          cache-version: "8.5.1"

      - *native_mirror
      - *native_caches
      - *native_pigz
      - *native_rule_sources
      - name: Build Teamd runtime and debug images from source owners
        env:
          BAZELISK_GITHUB_TOKEN: ""
        run: |
          test "$(. /etc/os-release; echo "$VERSION_CODENAME")" = trixie
          python3 -B tools/bazel/ci/teamd_image.py build --artifacts artifacts/teamd
      - name: Validate Teamd image contents and source symbols
        run: python3 -B tools/bazel/ci/teamd_image.py validate --artifacts artifacts/teamd
      - name: Check Teamd incremental rebuild and restored image digests
        env:
          BAZELISK_GITHUB_TOKEN: ""
        run: |
          python3 -B tools/bazel/ci/teamd_image.py incremental --artifacts artifacts/teamd
          git diff --exit-code
      - name: Prepare reviewed Teamd evidence
        id: teamd_public
        if: always()
        run: |
          python3 - <<'PYCODE'
          import json
          from pathlib import Path
          from tools.bazel.ci.public_artifacts import safe_json, dependency_json, bep_summary
          root = Path('artifacts/teamd')
          root.mkdir(parents=True, exist_ok=True)
          if (root / 'build-receipt.json').exists():
              receipt = json.loads((root / 'build-receipt.json').read_text())
              public = {key: receipt[key] for key in ('status', 'architecture', 'revision', 'artifacts') if key in receipt}
              safe_json(public)
              (root / 'public-receipt.json').write_text(json.dumps(public, indent=2) + '\n')
          names = ['bazelisk-bootstrap.json', 'rule-sources.json', 'validation.json', 'action-audit.json', 'incremental.json', 'runtime-apt.json', 'debug-apt.json']
          names += [path.name for path in root.glob('*.validation.json')]
          names += [path.name for path in root.glob('*.packages.json')]
          for name in names:
              path = root / name
              if path.exists():
                  safe_json(json.loads(path.read_text()))
          for name, kind in (('MODULE.bazel.lock', 'lock'), ('module-graph.json', 'graph')):
              path = root / name
              if path.exists():
                  dependency_json(json.loads(path.read_text()), kind)
          summary = {str(path.relative_to(root)): bep_summary(path.read_text().splitlines(), partial=True)
                     for path in root.rglob('*events.json*')}
          safe_json(summary)
          (root / 'build-summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          PYCODE
      - name: Retain Teamd images and reviewed build evidence
        if: always() && steps.teamd_public.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: teamd-image-amd64
          path: |
            artifacts/teamd/bazelisk-bootstrap.json
            artifacts/teamd/rule-sources.json
            artifacts/teamd/*.gz
            artifacts/teamd/*.tar
            artifacts/teamd/*.status
            artifacts/teamd/*.packages.json
            artifacts/teamd/*.validation.json
            artifacts/teamd/validation.json
            artifacts/teamd/public-receipt.json
            artifacts/teamd/runtime-apt.json
            artifacts/teamd/debug-apt.json
            artifacts/teamd/action-audit.json
            artifacts/teamd/incremental.json
            artifacts/teamd/build-summary.json
            artifacts/teamd/MODULE.bazel.lock
            artifacts/teamd/module-graph.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 1

  swss_layer_runtime:
    name: Load and run the shared SWSS image (AMD64)
    needs: swss_layer_native
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: swss-layer-amd64
          path: artifacts/swss-layer
      - name: Verify and load this run's archive
        run: |
          python3 - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          from tools.bazel.ci.validate_runtime import load_archive, verify_loaded_image
          root = Path('artifacts/swss-layer')
          receipt = json.loads((root / 'public-receipt.json').read_text())
          assert receipt['status'] == 'passed' and receipt['architecture'] == 'amd64'
          assert receipt['revision'] == subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          name = 'docker-swss-layer-trixie.gz'
          assert hashlib.sha256((root / name).read_bytes()).hexdigest() == receipt['artifacts'][name]['sha256']
          report = json.loads((root / 'validation.json').read_text())
          actual, config, _ = load_archive(root / name, report['archive']['tag'], report['config_digest'])
          verify_loaded_image(actual, config, report['config_digest'])
          assert actual['Architecture'] == report['architecture'] == 'amd64'
          assert actual['RootFS']['Layers'] == report['rootfs']['diff_ids']
          PY
      - name: Verify installed source hashes and complete loader closure
        run: |
          set -o pipefail
          docker run --rm --network=none --cap-drop=ALL --security-opt=no-new-privileges \
            --read-only --pids-limit=128 --memory=4g --cpus=2 \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=128m \
            --mount "type=bind,src=$PWD/tools/bazel/oci/swss_layer_runtime.py,dst=/probe/swss_layer_runtime.py,readonly" \
            --mount "type=bind,src=$PWD/tools/bazel/oci/runtime_smoke.py,dst=/probe/runtime_smoke.py,readonly" \
            --mount "type=bind,src=$PWD/artifacts/swss-layer/validation.json,dst=/probe/validation.json,readonly" \
            --entrypoint /usr/bin/python3 docker-swss-layer-trixie:latest \
            -B /probe/swss_layer_runtime.py /probe/validation.json | tee artifacts/swss-layer/runtime-smoke.json
      - name: Retain installed-image evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: swss-layer-runtime-amd64
          path: artifacts/swss-layer/runtime-smoke.json
          if-no-files-found: warn
          retention-days: 14

  teamd_runtime:
    name: Run installed Teamd images (AMD64)
    needs: teamd_native
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: teamd-image-amd64
          path: artifacts/teamd
      - name: Verify and load only this run's images
        run: |
          python3 - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          from tools.bazel.ci.validate_runtime import load_archive, verify_loaded_image
          directory=Path('artifacts/teamd')
          receipt=json.loads((directory/'validation.json').read_text())
          assert receipt['status']=='passed' and receipt['architecture']=='amd64'
          assert receipt['revision']==subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          for name in ['docker-teamd','docker-teamd-dbg']:
              path=directory/(name+'.gz')
              assert hashlib.sha256(path.read_bytes()).hexdigest()==receipt['artifacts'][path.name]['sha256']
              expected=json.loads((directory/(name+'.validation.json')).read_text())
              tag='sonic-teamd-validation-'+name+':latest'
              actual,config,_=load_archive(path,tag,expected['config_digest'])
              verify_loaded_image(actual,config,expected['config_digest'])
              assert actual['Os']=='linux' and actual['Architecture']=='amd64'
              assert actual['RootFS']['Layers']==expected['rootfs']['diff_ids']
          assert hashlib.sha256((directory/'test-redis.tar').read_bytes()).hexdigest()==receipt['artifacts']['test-redis.tar']['sha256']
          PY
          mkdir -p artifacts/teamd/redis-fixture
          tar --no-same-owner -xf artifacts/teamd/test-redis.tar -C artifacts/teamd/redis-fixture
      - name: Enable the kernel team driver on this isolated CI worker
        run: |
          test -d /sys/module/team || sudo modprobe team
          test -d /sys/module/team_mode_loadbalance || sudo modprobe team_mode_loadbalance
      - name: Exercise real Teamd control and inherited SWSS services
        run: |
          set -euo pipefail
          for image in docker-teamd docker-teamd-dbg; do
            probe_args=()
            if [[ "$image" == *-dbg ]]; then probe_args+=(--debug); fi
            # teamdctl resolves the interface through PF_PACKET/SOCK_DGRAM;
            # that read-only ioctl socket requires NET_RAW as well as NET_ADMIN.
            docker run --rm --network=none --cap-drop=ALL --cap-add=NET_ADMIN --cap-add=NET_RAW --security-opt=no-new-privileges \
              --read-only --pids-limit=128 --memory=4g --cpus=2 \
              --tmpfs /tmp:rw,nosuid,nodev,noexec,size=256m \
              --tmpfs /run/teamd:rw,nosuid,nodev,noexec,size=16m \
              --tmpfs /var/warmboot:rw,nosuid,nodev,noexec,size=16m \
              --mount type=volume,dst=/run/redis \
              --mount "type=bind,src=$PWD/dockers/docker-teamd/bazel/runtime_probe.py,dst=/probe/runtime_probe.py,readonly" \
              --mount "type=bind,src=$PWD/tools/bazel/oci/runtime_smoke.py,dst=/probe/runtime_smoke.py,readonly" \
              --mount "type=bind,src=$PWD/artifacts/teamd/redis-fixture,dst=/probe/redis,readonly" \
              --mount "type=bind,src=$PWD/artifacts/teamd/validation.json,dst=/probe/validation.json,readonly" \
              --entrypoint /usr/bin/python3 "sonic-teamd-validation-$image:latest" -B /probe/runtime_probe.py --validation /probe/validation.json "${probe_args[@]}" \
              | tee "artifacts/teamd/$image.runtime.json"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: teamd-runtime-amd64
          path: artifacts/teamd/*.runtime.json
          if-no-files-found: warn
          retention-days: 14

