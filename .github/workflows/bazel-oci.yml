        SONIC_BAZEL_CACHE_SOURCE: ${{ github.workspace }}/clean-host-${{ github.run_id }}-${{ github.run_attempt }}/b/vs-${{ github.run_id }}-${{ github.run_attempt }}/bazel
        ROLE: b
        SONIC_IMAGE_VERSION: host-clean-b-b9b024847e02
        SONIC_CI_CONTAINER_LABEL: io.sonic-buildimage.ci-job=${{ github.repository }}:${{ github.run_id }}:${{ github.run_attempt }}:vs-clean-b
        SONIC_HOSTBASE_CACHE_SOURCE: ${{ github.workspace }}/clean-host-${{ github.run_id }}-${{ github.run_attempt }}/b/vs-${{ github.run_id }}-${{ github.run_attempt }}/host
        SONIC_BAZEL_REPO_CONTENTS_SOURCE: ${{ github.workspace }}/clean-host-${{ github.run_id }}-${{ github.run_attempt }}/b/vs-${{ github.run_id }}-${{ github.run_attempt }}/contents
      run: |
        set -euo pipefail
        test -d "$SONIC_BAZEL_CACHE_SOURCE"
        test -w "$SONIC_BAZEL_CACHE_SOURCE"
        for cache in repository_cache disk_cache; do
          directory="$SONIC_BAZEL_CACHE_SOURCE/$cache"
          if test -d "$directory"; then
            blocked=$(find "$directory" -type d ! -writable -print -quit)
            if test -n "$blocked"; then
              printf 'Unwritable cache directory: %s\n' "$blocked" >&2
              exit 1
            fi
          fi
        done
        python3 -B tools/bazel/gzip/source_archive.py \
          --archives-dir artifacts/vs/repository-inputs \
          --output "$SONIC_BAZEL_CACHE_SOURCE/distdir" > artifacts/vs/source-download-receipt.json
        printf 'SONIC_BAZEL_CACHE_SOURCE=%s\nSONIC_DPKG_CACHE_SOURCE=%s\n' \
          "$SONIC_BAZEL_CACHE_SOURCE" "$SONIC_DPKG_CACHE_SOURCE" >> "$GITHUB_ENV"
      working-directory: clean-host-${{ github.run_id }}-${{ github.run_attempt }}/b/vs-${{ github.run_id }}-${{ github.run_attempt }}/source
      shell: bash
    - name: Consumer B — Authenticate to the slave image registry
      env:
        AZURE_CONFIG_DIR: ${{ runner.temp }}/vs-azure-cli
        ROLE: b
        SONIC_IMAGE_VERSION: host-clean-b-b9b024847e02
        SONIC_CI_CONTAINER_LABEL: io.sonic-buildimage.ci-job=${{ github.repository }}:${{ github.run_id }}:${{ github.run_attempt }}:vs-clean-b
        SONIC_BAZEL_CACHE_SOURCE: ${{ github.workspace }}/clean-host-${{ github.run_id }}-${{ github.run_attempt }}/b/vs-${{ github.run_id }}-${{ github.run_attempt }}/bazel
        SONIC_HOSTBASE_CACHE_SOURCE: ${{ github.workspace }}/clean-host-${{ github.run_id }}-${{ github.run_attempt }}/b/vs-${{ github.run_id }}-${{ github.run_attempt }}/host
        SONIC_BAZEL_REPO_CONTENTS_SOURCE: ${{ github.workspace }}/clean-host-${{ github.run_id }}-${{ github.run_attempt }}/b/vs-${{ github.run_id }}-${{ github.run_attempt }}/contents
      run: bash tools/ci/runner/azure_acr_login.sh "${ACR_REGISTRY_NAME:?}"
      working-directory: clean-host-${{ github.run_id }}-${{ github.run_attempt }}/b/vs-${{ github.run_id }}-${{ github.run_attempt }}/source
      shell: bash
    - name: Consumer B — Prepare the host-driven SONiC slave
      run: |
        set -euo pipefail
        make init 2>&1 | tee artifacts/vs/init.log
        make configure PLATFORM=vs PLATFORM_ARCH=amd64 \
          SONIC_BUILDER_EXTRA_CMDLINE="--label $SONIC_CI_CONTAINER_LABEL" \
          2>&1 | tee artifacts/vs/configure.log
        for build_env in bookworm trixie; do
          make -f Makefile.work BLDENV="$build_env" docker-start \
            SONIC_BUILDER_EXTRA_CMDLINE="--label $SONIC_CI_CONTAINER_LABEL" \
            2>&1 | tee "artifacts/vs/docker-start-$build_env.log"
        done
        make -f Makefile.work BLDENV=trixie sonic-slave-run \
          SONIC_BUILDER_EXTRA_CMDLINE="--label $SONIC_CI_CONTAINER_LABEL" \
          SONIC_RUN_CMDS='python3 -B tools/bazel/ci/check_kernel_sandbox.py' \
          2>&1 | tee artifacts/vs/kernel-sandbox.log
      working-directory: clean-host-${{ github.run_id }}-${{ github.run_attempt }}/b/vs-${{ github.run_id }}-${{ github.run_attempt }}/source
      shell: bash
      env:
        ROLE: b
        SONIC_IMAGE_VERSION: host-clean-b-b9b024847e02
        SONIC_CI_CONTAINER_LABEL: io.sonic-buildimage.ci-job=${{ github.repository }}:${{ github.run_id }}:${{ github.run_attempt }}:vs-clean-b
        SONIC_BAZEL_CACHE_SOURCE: ${{ github.workspace }}/clean-host-${{ github.run_id }}-${{ github.run_attempt }}/b/vs-${{ github.run_id }}-${{ github.run_attempt }}/bazel
        SONIC_HOSTBASE_CACHE_SOURCE: ${{ github.workspace }}/clean-host-${{ github.run_id }}-${{ github.run_attempt }}/b/vs-${{ github.run_id }}-${{ github.run_attempt }}/host
        SONIC_BAZEL_REPO_CONTENTS_SOURCE: ${{ github.workspace }}/clean-host-${{ github.run_id }}-${{ github.run_attempt }}/b/vs-${{ github.run_id }}-${{ github.run_attempt }}/contents
    - name: Consumer B — Set the VS builder action memory budget
      run: |
        memory_option=$(python3 -B tools/bazel/ci/resources.py) || exit
        printf 'BAZEL_CONTAINER_ARGS=%s %s\n' "${BAZEL_CONTAINER_ARGS:-}" "$memory_option" >> "$GITHUB_ENV"
      env:
        BAZEL_CONTAINER_ARGS: --repo_contents_cache=/bazel_repo_contents_cache --remote_local_fallback --incompatible_remote_local_fallback_for_remote_cache --experimental_remote_downloader=grpc://172.16.0.4:9092 --experimental_remote_downloader_local_fallback --distdir=/bazel_cache/distdir/ape-1.0.1 --distdir=/bazel_cache/distdir/download_utils-1.0.1 --distdir=/bazel_cache/distdir/rules_coreutils-1.0.1 --distdir=/bazel_cache/distdir/rules_gzip-1.0.0 --distdir=/bazel_cache/distdir/toolchain_utils-1.0.2
        ROLE: b
        SONIC_IMAGE_VERSION: host-clean-b-b9b024847e02
        SONIC_CI_CONTAINER_LABEL: io.sonic-buildimage.ci-job=${{ github.repository }}:${{ github.run_id }}:${{ github.run_attempt }}:vs-clean-b
        SONIC_BAZEL_CACHE_SOURCE: ${{ github.workspace }}/clean-host-${{ github.run_id }}-${{ github.run_attempt }}/b/vs-${{ github.run_id }}-${{ github.run_attempt }}/bazel
        SONIC_HOSTBASE_CACHE_SOURCE: ${{ github.workspace }}/clean-host-${{ github.run_id }}-${{ github.run_attempt }}/b/vs-${{ github.run_id }}-${{ github.run_attempt }}/host
        SONIC_BAZEL_REPO_CONTENTS_SOURCE: ${{ github.workspace }}/clean-host-${{ github.run_id }}-${{ github.run_attempt }}/b/vs-${{ github.run_id }}-${{ github.run_attempt }}/contents
      working-directory: clean-host-${{ github.run_id }}-${{ github.run_attempt }}/b/vs-${{ github.run_id }}-${{ github.run_attempt }}/source
      shell: bash
    - name: Consumer B — Find the VS kernel index from a master push
      id: b_kernel_index_source
      continue-on-error: true
      timeout-minutes: 2
      env:
        GITHUB_TOKEN: ${{ github.token }}
        ROLE: b
        SONIC_IMAGE_VERSION: host-clean-b-b9b024847e02
        SONIC_CI_CONTAINER_LABEL: io.sonic-buildimage.ci-job=${{ github.repository }}:${{ github.run_id }}:${{ github.run_attempt }}:vs-clean-b
        SONIC_BAZEL_CACHE_SOURCE: ${{ github.workspace }}/clean-host-${{ github.run_id }}-${{ github.run_attempt }}/b/vs-${{ github.run_id }}-${{ github.run_attempt }}/bazel
        SONIC_HOSTBASE_CACHE_SOURCE: ${{ github.workspace }}/clean-host-${{ github.run_id }}-${{ github.run_attempt }}/b/vs-${{ github.run_id }}-${{ github.run_attempt }}/host
        SONIC_BAZEL_REPO_CONTENTS_SOURCE: ${{ github.workspace }}/clean-host-${{ github.run_id }}-${{ github.run_attempt }}/b/vs-${{ github.run_id }}-${{ github.run_attempt }}/contents
      run: |
        rm -rf -- artifacts/vs/kernel-cache-download
        python3 -B -m tools.bazel.ci.vs_kernel_cache_snapshot
      working-directory: clean-host-${{ github.run_id }}-${{ github.run_attempt }}/b/vs-${{ github.run_id }}-${{ github.run_attempt }}/source
      shell: bash
    - name: Consumer B — Download the trusted VS kernel index
      id: b_kernel_index_download
      if: steps.b_kernel_index_source.outputs.artifact_id != ''
      continue-on-error: true
      timeout-minutes: 2
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        github-token: ${{ github.token }}
        run-id: ${{ steps.b_kernel_index_source.outputs.run_id }}
        artifact-ids: ${{ steps.b_kernel_index_source.outputs.artifact_id }}
        merge-multiple: true
        path: clean-host-${{ github.run_id }}-${{ github.run_attempt }}/b/vs-${{ github.run_id }}-${{ github.run_attempt }}/source/artifacts/vs/kernel-cache-download
    - name: Consumer B — Restore only the two cache entries independently produced by A
      run: |
        set -euo pipefail
        for type in base configured; do
          python3 -B tools/bazel/ci/vs_host_base_transfer.py restore "$SONIC_HOSTBASE_CACHE_SOURCE" "$PAIR_ROOT/handoff/$type"
        done
        test -z "$(find target -type f \( -name '*.deb' -o -name '*.whl' -o -name '*.squashfs' -o -name '*.bin' \) -print -quit 2>/dev/null)"
      working-directory: clean-host-${{ github.run_id }}-${{ github.run_attempt }}/b/vs-${{ github.run_id }}-${{ github.run_attempt }}/source
      shell: bash
      env:
        ROLE: b
        SONIC_IMAGE_VERSION: host-clean-b-b9b024847e02
        SONIC_CI_CONTAINER_LABEL: io.sonic-buildimage.ci-job=${{ github.repository }}:${{ github.run_id }}:${{ github.run_attempt }}:vs-clean-b
        SONIC_BAZEL_CACHE_SOURCE: ${{ github.workspace }}/clean-host-${{ github.run_id }}-${{ github.run_attempt }}/b/vs-${{ github.run_id }}-${{ github.run_attempt }}/bazel
        SONIC_HOSTBASE_CACHE_SOURCE: ${{ github.workspace }}/clean-host-${{ github.run_id }}-${{ github.run_attempt }}/b/vs-${{ github.run_id }}-${{ github.run_attempt }}/host
        SONIC_BAZEL_REPO_CONTENTS_SOURCE: ${{ github.workspace }}/clean-host-${{ github.run_id }}-${{ github.run_attempt }}/b/vs-${{ github.run_id }}-${{ github.run_attempt }}/contents
    - name: Consumer B — Build sonic-vs.bin through the host Make wrapper
      id: b_native_build
      env:
        SONIC_VS_DEFER_BUILDER_CLEANUP: y
        DOCKER_LOAD_ON_BOOT: y
        SONIC_VS_IMAGE_TIMINGS: '1'
        SONIC_VS_RETRY_GO_FETCH: '1'
        SONIC_VS_KERNEL_REMOTE_REUSE: '1'
        KERNEL_INDEX_DOWNLOAD: ${{ steps.b_kernel_index_download.outcome }}
        SONIC_VS_RFS_HANDOFF: '1'
        SONIC_VS_FAST_ASSEMBLY: '1'
        TERM: dumb
        SONIC_VS_CONFIGURED_HOST_CACHE: y
        ROLE: b
        SONIC_IMAGE_VERSION: host-clean-b-b9b024847e02
        SONIC_CI_CONTAINER_LABEL: io.sonic-buildimage.ci-job=${{ github.repository }}:${{ github.run_id }}:${{ github.run_attempt }}:vs-clean-b
        SONIC_BAZEL_CACHE_SOURCE: ${{ github.workspace }}/clean-host-${{ github.run_id }}-${{ github.run_attempt }}/b/vs-${{ github.run_id }}-${{ github.run_attempt }}/bazel
        SONIC_HOSTBASE_CACHE_SOURCE: ${{ github.workspace }}/clean-host-${{ github.run_id }}-${{ github.run_attempt }}/b/vs-${{ github.run_id }}-${{ github.run_attempt }}/host
        SONIC_BAZEL_REPO_CONTENTS_SOURCE: ${{ github.workspace }}/clean-host-${{ github.run_id }}-${{ github.run_attempt }}/b/vs-${{ github.run_id }}-${{ github.run_attempt }}/contents
      run: |
        set -euo pipefail
        # Accept only the index downloaded for this attempt, even if the checkout contains one.
        rm -rf -- artifacts/vs/kernel-cache-input artifacts/vs/kernel-cache-output
        index=artifacts/vs/kernel-cache-download/index.json
        if [[ "${KERNEL_INDEX_DOWNLOAD:-}" == success && -f "$index" && ! -L "$index" ]]; then
          install -D -m 0644 -- "$index" artifacts/vs/kernel-cache-input/index.json
        fi
        mkdir -p artifacts/vs/image-timings
        bash tools/bazel/ci/build_vs.sh > artifacts/vs/build.log 2>&1
        test -s target/sonic-vs.bin
        test -s target/sonic-vs.bin.dockers
        test "$(git rev-parse HEAD)" = "$(cat artifacts/vs/build-revision.txt)"
      working-directory: clean-host-${{ github.run_id }}-${{ github.run_attempt }}/b/vs-${{ github.run_id }}-${{ github.run_attempt }}/source
      shell: bash
    - name: Consumer B — Build the compatibility device DEB independently of the installer TAR
      run: |
        set -euo pipefail
        pkg=target/debs/trixie/sonic-device-data_1.0-1_all.deb
        test ! -e "$pkg"
        make "$pkg" NOBOOKWORM=1 BUILD_WITH_BAZEL_WHEN_AVAILABLE=y INCLUDE_VS_DASH_SAI=y INCLUDE_FIPS=y ENABLE_ASAN=n ENABLE_SYNCD_RPC=n DOCKER_LOAD_ON_BOOT=y SONIC_BUILDER_EXTRA_CMDLINE="--label $SONIC_CI_CONTAINER_LABEL" > artifacts/vs/legacy-device.log 2>&1
        test -s "$pkg"
      id: b_legacy
      working-directory: clean-host-${{ github.run_id }}-${{ github.run_attempt }}/b/vs-${{ github.run_id }}-${{ github.run_attempt }}/source
      shell: bash
      env:
        ROLE: b
        SONIC_IMAGE_VERSION: host-clean-b-b9b024847e02
        SONIC_CI_CONTAINER_LABEL: io.sonic-buildimage.ci-job=${{ github.repository }}:${{ github.run_id }}:${{ github.run_attempt }}:vs-clean-b
        SONIC_BAZEL_CACHE_SOURCE: ${{ github.workspace }}/clean-host-${{ github.run_id }}-${{ github.run_attempt }}/b/vs-${{ github.run_id }}-${{ github.run_attempt }}/bazel
        SONIC_HOSTBASE_CACHE_SOURCE: ${{ github.workspace }}/clean-host-${{ github.run_id }}-${{ github.run_attempt }}/b/vs-${{ github.run_id }}-${{ github.run_attempt }}/host
        SONIC_BAZEL_REPO_CONTENTS_SOURCE: ${{ github.workspace }}/clean-host-${{ github.run_id }}-${{ github.run_attempt }}/b/vs-${{ github.run_id }}-${{ github.run_attempt }}/contents
    - name: Consumer B — Validate installed release, packages and clean cache receipts
      run: |
        python3 -B "$GITHUB_WORKSPACE/clean-host-tools-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/.github/clean-proof/verify.py" b
      id: b_verify
      working-directory: clean-host-${{ github.run_id }}-${{ github.run_attempt }}/b/vs-${{ github.run_id }}-${{ github.run_attempt }}/source
      shell: bash
      env:
        ROLE: b
        SONIC_IMAGE_VERSION: host-clean-b-b9b024847e02
        SONIC_CI_CONTAINER_LABEL: io.sonic-buildimage.ci-job=${{ github.repository }}:${{ github.run_id }}:${{ github.run_attempt }}:vs-clean-b
        SONIC_BAZEL_CACHE_SOURCE: ${{ github.workspace }}/clean-host-${{ github.run_id }}-${{ github.run_attempt }}/b/vs-${{ github.run_id }}-${{ github.run_attempt }}/bazel
        SONIC_HOSTBASE_CACHE_SOURCE: ${{ github.workspace }}/clean-host-${{ github.run_id }}-${{ github.run_attempt }}/b/vs-${{ github.run_id }}-${{ github.run_attempt }}/host
        SONIC_BAZEL_REPO_CONTENTS_SOURCE: ${{ github.workspace }}/clean-host-${{ github.run_id }}-${{ github.run_attempt }}/b/vs-${{ github.run_id }}-${{ github.run_attempt }}/contents
    - name: Consumer B — Capture bounded diagnostics for a failed native build
      run: |
        set -euo pipefail
        mkdir -p "$PAIR_ROOT/evidence/b"
        python3 -B "$GITHUB_WORKSPACE/clean-host-tools-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/.github/clean-proof/errors.py" b
      if: failure() && steps.b_native_build.outcome != 'skipped'
      working-directory: clean-host-${{ github.run_id }}-${{ github.run_attempt }}/b/vs-${{ github.run_id }}-${{ github.run_attempt }}/source
      shell: bash
      env:
        ROLE: b
        SONIC_IMAGE_VERSION: host-clean-b-b9b024847e02
        SONIC_CI_CONTAINER_LABEL: io.sonic-buildimage.ci-job=${{ github.repository }}:${{ github.run_id }}:${{ github.run_attempt }}:vs-clean-b
        SONIC_BAZEL_CACHE_SOURCE: ${{ github.workspace }}/clean-host-${{ github.run_id }}-${{ github.run_attempt }}/b/vs-${{ github.run_id }}-${{ github.run_attempt }}/bazel
        SONIC_HOSTBASE_CACHE_SOURCE: ${{ github.workspace }}/clean-host-${{ github.run_id }}-${{ github.run_attempt }}/b/vs-${{ github.run_id }}-${{ github.run_attempt }}/host
        SONIC_BAZEL_REPO_CONTENTS_SOURCE: ${{ github.workspace }}/clean-host-${{ github.run_id }}-${{ github.run_attempt }}/b/vs-${{ github.run_id }}-${{ github.run_attempt }}/contents
    - name: Consumer B — Publish only hash and installer metadata
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: clean-host-b-${{ github.run_attempt }}
        path: clean-host-${{ github.run_id }}-${{ github.run_attempt }}/evidence/b
        retention-days: 14
        if-no-files-found: warn
    - name: Consumer B — Remove only this job's build containers
      id: b_vs_container_cleanup
      if: always()
      working-directory: ${{ github.workspace }}
      run: |
        set -euo pipefail
        containers=$(docker ps --all --quiet --filter "label=$SONIC_CI_CONTAINER_LABEL")
        while IFS= read -r container; do
          test -n "$container" || continue
          if ! docker rm --force "$container"; then
            remaining=$(docker ps --all --quiet \
              --filter "label=$SONIC_CI_CONTAINER_LABEL" --filter "id=$container")
            if test -n "$remaining"; then
              printf 'Unable to remove job container: %s\n' "$container" >&2
              exit 1
            fi
            printf 'Job container already removed: %s\n' "$container"
          fi
        done <<< "$containers"
      shell: bash
      env:
        ROLE: b
        SONIC_IMAGE_VERSION: host-clean-b-b9b024847e02
        SONIC_CI_CONTAINER_LABEL: io.sonic-buildimage.ci-job=${{ github.repository }}:${{ github.run_id }}:${{ github.run_attempt }}:vs-clean-b
        SONIC_BAZEL_CACHE_SOURCE: ${{ github.workspace }}/clean-host-${{ github.run_id }}-${{ github.run_attempt }}/b/vs-${{ github.run_id }}-${{ github.run_attempt }}/bazel
        SONIC_HOSTBASE_CACHE_SOURCE: ${{ github.workspace }}/clean-host-${{ github.run_id }}-${{ github.run_attempt }}/b/vs-${{ github.run_id }}-${{ github.run_attempt }}/host
        SONIC_BAZEL_REPO_CONTENTS_SOURCE: ${{ github.workspace }}/clean-host-${{ github.run_id }}-${{ github.run_attempt }}/b/vs-${{ github.run_id }}-${{ github.run_attempt }}/contents
    - name: Consumer B — Log out of the slave image registry
      if: always()
      working-directory: ${{ runner.temp }}
      env:
        DOCKER_CONFIG: ${{ github.workspace }}/clean-host-${{ github.run_id }}-${{ github.run_attempt }}/b/vs-${{ github.run_id }}-${{ github.run_attempt }}/registry-login
        ROLE: b
        SONIC_IMAGE_VERSION: host-clean-b-b9b024847e02
        SONIC_CI_CONTAINER_LABEL: io.sonic-buildimage.ci-job=${{ github.repository }}:${{ github.run_id }}:${{ github.run_attempt }}:vs-clean-b
        SONIC_BAZEL_CACHE_SOURCE: ${{ github.workspace }}/clean-host-${{ github.run_id }}-${{ github.run_attempt }}/b/vs-${{ github.run_id }}-${{ github.run_attempt }}/bazel
        SONIC_HOSTBASE_CACHE_SOURCE: ${{ github.workspace }}/clean-host-${{ github.run_id }}-${{ github.run_attempt }}/b/vs-${{ github.run_id }}-${{ github.run_attempt }}/host
        SONIC_BAZEL_REPO_CONTENTS_SOURCE: ${{ github.workspace }}/clean-host-${{ github.run_id }}-${{ github.run_attempt }}/b/vs-${{ github.run_id }}-${{ github.run_attempt }}/contents
      run: |
        set -euo pipefail
        status=0
        docker logout "$REGISTRY_SERVER:$REGISTRY_PORT" || status=$?
        rm -f -- "${DOCKER_CONFIG:?}/config.json"
        exit "$status"
      shell: bash
    - name: Consumer B — Free the checkout and all other local build state
      run: |
        set -euo pipefail
        workspace="$PAIR_ROOT/$ROLE"
        checkout="$workspace/vs-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
        script="$checkout/source/tools/bazel/ci/cleanup_vs_workspace.py"
        if [[ -f $script && ! -L $script ]]; then
          cd "$GITHUB_WORKSPACE"
          python3 -B "$script" --workspace "$workspace" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
        fi
      if: always()
      working-directory: ${{ github.workspace }}
      shell: bash
      env:
        ROLE: b
        SONIC_IMAGE_VERSION: host-clean-b-b9b024847e02
        SONIC_CI_CONTAINER_LABEL: io.sonic-buildimage.ci-job=${{ github.repository }}:${{ github.run_id }}:${{ github.run_attempt }}:vs-clean-b
        SONIC_BAZEL_CACHE_SOURCE: ${{ github.workspace }}/clean-host-${{ github.run_id }}-${{ github.run_attempt }}/b/vs-${{ github.run_id }}-${{ github.run_attempt }}/bazel
        SONIC_HOSTBASE_CACHE_SOURCE: ${{ github.workspace }}/clean-host-${{ github.run_id }}-${{ github.run_attempt }}/b/vs-${{ github.run_id }}-${{ github.run_attempt }}/host
        SONIC_BAZEL_REPO_CONTENTS_SOURCE: ${{ github.workspace }}/clean-host-${{ github.run_id }}-${{ github.run_attempt }}/b/vs-${{ github.run_id }}-${{ github.run_attempt }}/contents
    - name: Publish the independent-build comparison
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: clean-host-comparison-${{ github.run_attempt }}
        path: clean-host-${{ github.run_id }}-${{ github.run_attempt }}/evidence
        retention-days: 14
        if-no-files-found: warn
    - name: Remove the job-private snapshots
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        [[ "$PAIR_ROOT" == "$GITHUB_WORKSPACE/clean-host-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" && -d "$PAIR_ROOT" && ! -L "$PAIR_ROOT" ]]
        rm -rf --one-file-system -- "$PAIR_ROOT/handoff"
