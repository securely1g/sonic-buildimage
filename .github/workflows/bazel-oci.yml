          test "$(git -C "$LAYER11_ROOT/source" rev-parse 'HEAD^{tree}')" = 'e1db41673e6da5095579e71aff25cddb08e26c3e'
          python3 -I -S -B - <<'PY_LAYER_SEALS'
          import hashlib, json, os, runpy, sys
          from pathlib import Path
          root = Path(os.environ['LAYER11_ROOT'])
          expected = {'tools/bazel/ci/final_native_layer11_test.py': 'edf20ec23565de8423721f0c2c14c23017ead45051c5672fbc88cd76bd5b335a', 'tools/bazel/ci/observe_final_native_layer11.py': '10dbcb6620b8b98208e1747cd257ea203eaedc8aaf9883e193c08ac652999627', 'tools/bazel/ci/observe_final_native_provenance.py': '4faa375fced471d30574c984e79c4433bd27d5d1abf87b44cd75a5b6e0c16a9c', 'tools/bazel/ci/observe_original_archive.py': '19f55eef22052643ca4eadd62af2620e97821511d932ba8f700a00724d09e20f', 'tools/bazel/ci/observe_vs_original_installed_policy.py': 'dba576f3229df618e1b3afbfa33bcd1a70f861cba1bd41c45b072811520fcfa6', 'tools/bazel/ci/recover_final_native_archives.py': '8440a5cb118f8eb51971039d91aff5944cee785c34def52b3a2129a86616b86c', 'tools/bazel/ci/recover_vs_original_inputs.py': '6699855d87b685f9b23a4b4c0a12084ec3100b45a59a8b575a06925f447988a5', 'tools/bazel/ci/vs_final_native_layer11_audit.json': '6f4cf23ed7f5d6d0c817c32fa8a9a54bc68f23b2c5e12097d3b1dd568d6772b8', 'tools/bazel/ci/vs_final_native_layer11_inputs.json': '987d5cf4c93d921f733209bf701d71cf12dc72e0b30079375f254537bcc59190', 'tools/bazel/ci/vs_native_api_provenance_inputs.json': '9f26b6dcd24c111b1baa1974e90258ff9a1a3eb78c1e0e079a017994f2dff3e8'}
          for relative, digest in expected.items():
              path = root / 'observer' / relative
              if path.is_symlink() or not path.is_file() or path.stat().st_size > 2 * 1024**2 or hashlib.sha256(path.read_bytes()).hexdigest() != digest:
                  raise SystemExit('Reviewed audit control differs')
          plan = json.loads((root / 'observer/tools/bazel/ci/vs_final_native_layer11_audit.json').read_bytes())
          for relative, identity in plan['source_owners'].items():
              path = root / 'source' / relative
              if path.is_symlink() or not path.is_file() or path.stat().st_size != identity['bytes'] or hashlib.sha256(path.read_bytes()).hexdigest() != identity['sha256']:
                  raise SystemExit('Original final206 inventory owner differs')
          sys.path[:0] = [str(root / 'source'), str(root / 'observer')]
          test = root / 'observer/tools/bazel/ci/final_native_layer11_test.py'
          sys.argv = [str(test), 'OriginalLayerInventoryTests']
          runpy.run_path(str(test), run_name='__main__')
