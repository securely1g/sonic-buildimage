          done
          python3 - <<'PYLAUNCH'
          import os, shlex, shutil
          from pathlib import Path
          real = shutil.which("bazel")
          if not real:
              raise SystemExit("Bazelisk is unavailable")
          directory = Path(os.environ["RUNNER_TEMP"]) / "p4rt-bounded-bazel"
          directory.mkdir(exist_ok=True)
          for name, heap in (("root", "3g"), ("owner", "2g")):
              path = directory / name
              path.write_text("#!/bin/sh\nset -eu\n"
                  'if [ "$#" -eq 1 ] && [ "$1" = --version ]; then\n'
                  "  exec " + shlex.quote(real) + ' "$@"\nfi\n'
                  "exec " + shlex.quote(real) + " --host_jvm_args=-Xmx" + heap + ' "$@"\n')
              path.chmod(0o755)
          with Path(os.environ["GITHUB_ENV"]).open("a") as output:
