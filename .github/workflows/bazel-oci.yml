  vs_native_layer11:
    name: Compare original final206 Python and YANG layer metadata (K3s)
    if: github.event_name == 'workflow_dispatch' && inputs.source_image == 'vs-native-layer11' && inputs.source_worker_pool == 'sonic-slave-container-k3s' && inputs.skip_vs && github.repository == 'securely1g/sonic-buildimage' && github.actor == 'securely1g' && github.triggering_actor == 'securely1g'
    runs-on: [self-hosted, linux, x64, sonic-slave-container-k3s]
    permissions:
      contents: read
      actions: read
    timeout-minutes: 55
    concurrency:
      group: vs-native-layer11-${{ github.run_id }}-${{ github.run_attempt }}
      cancel-in-progress: false
    steps:
      - name: Reserve fresh temporary original-layer observation paths
        id: paths
        env:
          EXPECTED_WORKER: ${{ runner.name }}
          SOURCE_REVISION: ${{ inputs.source_revision }}
          REGISTRY_REVISION: ${{ inputs.registry_revision }}
          SOURCE_CI_REQUEST: ${{ inputs.source_ci_request }}
          SOURCE_INPUTS_RUN: ${{ inputs.source_inputs_run }}
          REGISTRY_CONSUMER: ${{ inputs.registry_consumer }}
        run: |
          python3 -I -S -B - <<'PY_LAYER_PATHS'
          import os, re, shutil
          from pathlib import Path
          if any(os.environ.get(key) for key in ('SOURCE_REVISION', 'REGISTRY_REVISION', 'SOURCE_CI_REQUEST', 'SOURCE_INPUTS_RUN')) or os.environ['REGISTRY_CONSUMER'] != 'none':
              raise SystemExit('Original layer audit accepts no replacement inputs')
          run, attempt, worker = (os.environ[key] for key in ('GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'EXPECTED_WORKER'))
          if not all(re.fullmatch(r'[1-9][0-9]*', item) for item in (run, attempt)) or worker != os.environ['RUNNER_NAME'] or not re.fullmatch(r'ks-[a-z0-9](?:[a-z0-9-]{0,58}[a-z0-9])?', worker):
              raise SystemExit('Unexpected current runner identity')
          workspace = Path(os.environ['GITHUB_WORKSPACE'])
          if workspace.resolve() != workspace or not workspace.is_relative_to('/actions/_work') or os.getuid() != 1000:
              raise SystemExit('Expected the current K3s worker workspace')
          if shutil.disk_usage(workspace).free < 12 * 1024**3:
              raise SystemExit('Original layer audit requires12GiB temporary space')
          name = f'vs-native-layer11-{run}-{attempt}-{worker}'
          root = workspace / name
          if os.path.lexists(root):
              raise SystemExit('Preserve existing original-layer observation')
          root.mkdir(mode=0o700)
          for child in ('temporary', 'inputs'):
              (root / child).mkdir(mode=0o700)
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write(f'relative={name}\nroot={root}\n')
          with Path(os.environ['GITHUB_ENV']).open('a') as output:
              output.write(f'LAYER11_ROOT={root}\nTMPDIR={root / "temporary"}\n')
