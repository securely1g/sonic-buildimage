          if-no-files-found: error
          compression-level: 0
      - name: Retain safe source-input and resource facts
        if: always() && steps.paths.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
