name: VS canary runner lifecycle inventory

on:
  workflow_dispatch:

permissions: {}

jobs:
  inventory:
    runs-on: [self-hosted, Linux, X64, vs, vs-lifecycle-probe-2174]
    timeout-minutes: 3
    steps:
      - name: Identify the canary's management plane and listener type
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import re
          import subprocess
          import urllib.error
          import urllib.request

          if os.environ["RUNNER_NAME"] != "sonic-baz00000B-vs-a9115f67":
              raise SystemExit("Unexpected runner")

          def fingerprint(value):
              return hashlib.sha256(value.strip().lower().encode()).hexdigest()

          def installed_service_names():
              proc = subprocess.run(
                  ["systemctl", "list-unit-files", "--type=service",
                   "--no-pager", "--no-legend", "--plain"],
                  check=False, capture_output=True, text=True, timeout=10,
              )
              if proc.returncode:
                  return []
              return [row.split()[0] for row in proc.stdout.splitlines() if row.strip()]

          # Compare specific, non-secret Azure inventory fields with the operator's
          # authorized subscription inventory offline. Keep resource names out of logs.
          opener = urllib.request.build_opener(urllib.request.ProxyHandler({}))
          result = {}
          for field in ("subscriptionId", "resourceGroupName", "vmScaleSetName"):
              url = f"http://169.254.169.254/metadata/instance/compute/{field}?api-version=2021-02-01&format=text"
              req = urllib.request.Request(url, headers={"Metadata": "true"})
              try:
                  with opener.open(req, timeout=3) as response:
                      value = response.read(512).decode().strip()
              except (OSError, UnicodeError, urllib.error.URLError):
                  value = ""
              result[f"{field}_sha256"] = fingerprint(value) if value else None

          units = installed_service_names()
          listeners = [name for name in units if name.startswith("actions.runner.")]
          result["github_listener_units"] = len(listeners)
          result["matching_supervisor_units"] = sum(
              re.search(r"(sonic|runner).*(supervis|lifecycle|cleanup)", name, re.I) is not None
              for name in units)
          result["azure_linux_agent_unit"] = any(
              name in ("walinuxagent.service", "waagent.service") for name in units)
          result["cloud_init_unit"] = "cloud-init.service" in units
          result["runner_install_under_azureuser"] = pathlib.Path(
              "/home/azureuser/actions-runner/Runner.Listener").is_file() or pathlib.Path(
              "/home/azureuser/actions-runner/bin/Runner.Listener").is_file()
          print("VS_CANARY_INVENTORY " + json.dumps(result, sort_keys=True))
          PY
