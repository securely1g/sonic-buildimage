  vs_native_api_provenance:
    name: Retain original final206 P4RT API provenance (K3s)
    if: github.event_name == 'workflow_dispatch' && inputs.source_image == 'vs-native-provenance' && inputs.source_worker_pool == 'sonic-slave-container-k3s' && inputs.skip_vs && github.repository == 'securely1g/sonic-buildimage' && github.actor == 'securely1g' && github.triggering_actor == 'securely1g'
    runs-on: [self-hosted, linux, x64, sonic-slave-container-k3s]
    permissions:
      contents: read
      actions: read
    timeout-minutes: 15
    concurrency:
      group: vs-native-provenance-${{ github.run_id }}-${{ github.run_attempt }}
      cancel-in-progress: false
    steps:
      - name: Reserve fresh temporary metadata paths
        id: paths
        env:
          EXPECTED_WORKER: ${{ runner.name }}
          SOURCE_REVISION: ${{ inputs.source_revision }}
          REGISTRY_REVISION: ${{ inputs.registry_revision }}
          SOURCE_CI_REQUEST: ${{ inputs.source_ci_request }}
          SOURCE_INPUTS_RUN: ${{ inputs.source_inputs_run }}
          REGISTRY_CONSUMER: ${{ inputs.registry_consumer }}
        run: |
          python3 -I -S -B - <<'PY_NATIVE_PATHS'
          import os, re, shutil
          from pathlib import Path
          if any(os.environ.get(key) for key in ('SOURCE_REVISION', 'REGISTRY_REVISION', 'SOURCE_CI_REQUEST', 'SOURCE_INPUTS_RUN')) or os.environ['REGISTRY_CONSUMER'] != 'none':
              raise SystemExit('Original API observation accepts no replacement inputs')
          run, attempt, worker = (os.environ[key] for key in ('GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'EXPECTED_WORKER'))
          if not all(re.fullmatch(r'[1-9][0-9]*', item) for item in (run, attempt)) or worker != os.environ['RUNNER_NAME'] or not re.fullmatch(r'ks-[a-z0-9](?:[a-z0-9-]{0,58}[a-z0-9])?', worker):
              raise SystemExit('Unexpected current runner identity')
          workspace = Path(os.environ['GITHUB_WORKSPACE'])
          if workspace.resolve() != workspace or not workspace.is_relative_to('/actions/_work') or os.getuid() != 1000:
              raise SystemExit('Expected the current K3s worker workspace')
          if shutil.disk_usage(workspace).free < 256 * 1024**2:
              raise SystemExit('Original API observation requires256MiB temporary space')
          name = f'vs-native-provenance-{run}-{attempt}-{worker}'
          root = workspace / name
          if os.path.lexists(root):
              raise SystemExit('Preserve existing provenance observation')
          root.mkdir(mode=0o700)
          for child in ('output', 'temporary', 'requests'):
              (root / child).mkdir(mode=0o700)
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write(f'relative={name}\nroot={root}\n')
          with Path(os.environ['GITHUB_ENV']).open('a') as output:
              output.write(f'PROVENANCE_ROOT={root}\nTMPDIR={root / "temporary"}\n')
          PY_NATIVE_PATHS
      - name: Checkout the reviewed observer caller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: ${{ steps.paths.outputs.relative }}/observer
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            tools/bazel/ci/observe_final_native_provenance.py
            tools/bazel/ci/vs_native_api_provenance_p4rt_inputs.json
            tools/bazel/ci/native_api_provenance_p4rt_test.py
            tools/bazel/ci/vs_native_api_provenance_p4rt_test_inputs.json
      - name: Checkout the original final206 receipt owner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 3a06e4ec7627390967730b78a34dc00c86bb34dd
          path: ${{ steps.paths.outputs.relative }}/source
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            tools/bazel/ci/image_worker_receipt.py
            tools/bazel/ci/public_artifacts.py
            tools/bazel/ci/p4rt_receipt_semantics.py
            tools/bazel/ci/p4rt_sdk_receipt_semantics.py
            tools/bazel/ci/p4rt_worker_contract.json
      - name: Verify fixed owner and mocked metadata boundaries
        run: |
          test "$(git -C "$PROVENANCE_ROOT/source" rev-parse HEAD)" = '3a06e4ec7627390967730b78a34dc00c86bb34dd'
          test "$(git -C "$PROVENANCE_ROOT/source" rev-parse 'HEAD^{tree}')" = 'e1db41673e6da5095579e71aff25cddb08e26c3e'
          python3 -I -S -B - <<'PY_NATIVE_SEALS'
          import hashlib, json, os, runpy, sys
          from pathlib import Path
          root = Path(os.environ['PROVENANCE_ROOT'])
          expected = {'tools/bazel/ci/native_api_provenance_p4rt_test.py': 'eadc991e62498492dfdc42224817c10b9853bf96223818d19167098a5266a05f', 'tools/bazel/ci/observe_final_native_provenance.py': '4faa375fced471d30574c984e79c4433bd27d5d1abf87b44cd75a5b6e0c16a9c', 'tools/bazel/ci/vs_native_api_provenance_p4rt_inputs.json': '476ed64bb2eecec1cfc5e6919ba11a862339077bdbe87b222d3c368a4f493ddb', 'tools/bazel/ci/vs_native_api_provenance_p4rt_test_inputs.json': 'b3ccf8f988704df700dce2d5d07c5f0981a5381fcbbd941e5115e459f1676382'}
          for relative, digest in expected.items():
              path = root / 'observer' / relative
              if path.is_symlink() or not path.is_file() or path.stat().st_size > 2 * 1024**2 or hashlib.sha256(path.read_bytes()).hexdigest() != digest:
                  raise SystemExit('Reviewed observer source differs')
          plan = json.loads((root / 'observer/tools/bazel/ci/vs_native_api_provenance_p4rt_inputs.json').read_bytes())
          for relative, identity in plan['owner_sources'].items():
              path = root / 'source' / relative
              if path.is_symlink() or not path.is_file() or path.stat().st_size != identity['bytes'] or hashlib.sha256(path.read_bytes()).hexdigest() != identity['sha256']:
                  raise SystemExit('Original final206 receipt owner differs')
          sys.path[:0] = [str(root / 'source'), str(root / 'observer')]
          test = root / 'observer/tools/bazel/ci/native_api_provenance_p4rt_test.py'
          sys.argv = [str(test), 'NativeProvenanceObservationTest']
          runpy.run_path(str(test), run_name='__main__')
          PY_NATIVE_SEALS
      - name: Authenticate the original P4RT normal-CI request artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -I -S -B - <<'PY_P4RT_ORIGIN'
          import json, os, sys
          from pathlib import Path
          root = Path(os.environ['PROVENANCE_ROOT'])
          sys.path[:0] = [str(root / 'source'), str(root / 'observer')]
          from tools.bazel.ci import observe_final_native_provenance as observe
          plan_path = root / 'observer/tools/bazel/ci/vs_native_api_provenance_p4rt_inputs.json'
          plan = json.loads(observe.checked_bytes(plan_path, {'bytes': 2617, 'sha256': '476ed64bb2eecec1cfc5e6919ba11a862339077bdbe87b222d3c368a4f493ddb'}))
          owner = observe.load_owner(root / 'source', plan)
          observe.authenticate_origin(owner, plan, 'p4rt', root / 'output/p4rt')
          PY_P4RT_ORIGIN
      - name: Download the exact original P4RT request
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          repository: securely1g/sonic-buildimage
          run-id: 43472962459
          artifact-ids: 14061533960
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ steps.paths.outputs.root }}/requests/p4rt
          merge-multiple: true
          digest-mismatch: error
      - name: Retain genuine original API objects under the actual observer identity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -I -S -B - <<'PY_P4RT_CAPTURE'
          import json, os, sys
          from pathlib import Path
          root = Path(os.environ['PROVENANCE_ROOT'])
          sys.path[:0] = [str(root / 'source'), str(root / 'observer')]
          from tools.bazel.ci import observe_final_native_provenance as observe
          plan_path = root / 'observer/tools/bazel/ci/vs_native_api_provenance_p4rt_inputs.json'
          plan = json.loads(observe.checked_bytes(plan_path, {'bytes': 2617, 'sha256': '476ed64bb2eecec1cfc5e6919ba11a862339077bdbe87b222d3c368a4f493ddb'}))
          owner = observe.load_owner(root / 'source', plan)
          observe.capture(owner, plan, 'p4rt', root / 'source', root / 'requests/p4rt/request.json', root / 'output/p4rt')
          PY_P4RT_CAPTURE
      - name: Upload original native API provenance and observer lineage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: vs-original-native-api-provenance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.paths.outputs.root }}/output
          if-no-files-found: error
          compression-level: 9
          retention-days: 14
  vs_coherent_installed_policies:
    name: Build coherent SWSS and Syncd installed-image policies (AMD64)
    if: github.event_name == 'workflow_dispatch' && inputs.source_image == 'vs-coherent-installed-policies' && inputs.source_worker_pool == 'sonic-slave-container-k3s' && inputs.skip_vs && github.repository == 'securely1g/sonic-buildimage' && github.actor == 'securely1g' && github.triggering_actor == 'securely1g'
    runs-on: [self-hosted, linux, x64, sonic-slave-container-k3s]
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
    concurrency:
      group: vs-coherent-installed-policies-${{ github.run_id }}-${{ github.run_attempt }}
      cancel-in-progress: false
    steps:
      - name: Allocate fresh policy build scratch
        id: paths
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKER: ${{ runner.name }}
          INPUT_SOURCE_REVISION: ${{ inputs.source_revision }}
          INPUT_REGISTRY_REVISION: ${{ inputs.registry_revision }}
          INPUT_SOURCE_CI_REQUEST: ${{ inputs.source_ci_request }}
          INPUT_SOURCE_INPUTS_RUN: ${{ inputs.source_inputs_run }}
          INPUT_REGISTRY_CONSUMER: ${{ inputs.registry_consumer }}
        run: |
          python3 -I -S -B - <<'PYTHON'
          import os, re, shutil
          from pathlib import Path
          if any(os.environ.get(key) for key in ('INPUT_SOURCE_REVISION', 'INPUT_REGISTRY_REVISION',
                  'INPUT_SOURCE_CI_REQUEST', 'INPUT_SOURCE_INPUTS_RUN')):
              raise SystemExit('This fixed policy job does not accept revision or source-input overrides')
          if os.environ.get('INPUT_REGISTRY_CONSUMER') != 'none':
              raise SystemExit('This job does not select a registry consumer')
          run, attempt, worker = (os.environ[key] for key in ('RUN_ID', 'RUN_ATTEMPT', 'WORKER'))
          if not all(re.fullmatch(r'[1-9][0-9]*', value) for value in (run, attempt)):
              raise SystemExit('Invalid run identity')
          if worker != os.environ.get('RUNNER_NAME') or not re.fullmatch(r'ks-[a-z0-9](?:[a-z0-9-]{0,58}[a-z0-9])?', worker):
              raise SystemExit('Unexpected K3s worker identity')
          workspace = Path(os.environ['GITHUB_WORKSPACE'])
          if workspace.resolve(strict=True) != workspace or not workspace.is_relative_to('/actions/_work') or os.getuid() != 1000:
              raise SystemExit('Unexpected worker workspace or user')
          if shutil.disk_usage(workspace).free < 180 * 1024**3:
              raise SystemExit('The policy build needs 180 GiB of free scratch')
          root = workspace / ('vs-coherent-installed-policies-' + run + '-' + attempt + '-' + worker)
          if os.path.lexists(root):
              raise SystemExit('Policy scratch already exists')
          root.mkdir(mode=0o700)
          for name in ('scratch', 'scratch/home', 'scratch/bazelisk', 'scratch/temporary', 'inputs', 'evidence'):
              (root / name).mkdir(mode=0o700)
          values = {'root': str(root)}
          values.update({name: str((root / name).relative_to(workspace)) for name in ('control', 'source', 'native', 'catalog')})
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as stream:
              for name, value in values.items():
                  stream.write(name + '=' + value + '\n')
          PYTHON
      - name: Check out the reviewed policy caller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: ${{ steps.paths.outputs.control }}
          persist-credentials: false
          clean: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/bazel/ci/build_vs_swss_installed_policy.py
            /tools/bazel/ci/build_vs_coherent_installed_policies.py
            /tools/bazel/ci/vs_coherent_installed_policy_inputs.json
            /tools/bazel/tests/vs_coherent_installed_policy_test.py
            /tools/bazel/ci/vs_original_metadata/kernel-context-744d.json
      - name: Check out the final VS source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: c02d93956919e4ea6886f347be4ac0ab6e3e36f0
          path: ${{ steps.paths.outputs.source }}
          persist-credentials: false
          clean: false
          fetch-depth: 1
          submodules: false
      - name: Verify the fixed caller and its focused fixtures
        env:
          POLICY_ROOT: ${{ steps.paths.outputs.root }}
          COHORT_REVIEW_RC_OWNER: ${{ steps.paths.outputs.root }}/source/tools/bazel/ci/review_bazel_rc.py
        run: |
          python3 -I -S -B - <<'PYTHON'
          import hashlib, json, os
