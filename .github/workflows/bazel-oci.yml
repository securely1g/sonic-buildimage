# Disposable backfill driver; do not merge this workflow into master.
name: Historical master VS installer backfill
run-name: VS installer backfill ${{ inputs.source_sha }}
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Original cancelled master revision (source remains unchanged)
        required: true
        type: choice
        options:
          - 8bf48af011622657a73570a54d1a660b821bb30a
          - 13d750dee1750ee1c325e0fea9b7b4eaaf10cb14
          - 2dc503aaecfb0d3c317608aaeabc68a108e32b97
permissions:
  contents: read
  actions: read
jobs:
  backfill:
    name: Historical Make VS installer (AMD64)
    runs-on: [self-hosted, linux, x64, sonic-vs-bin]
    timeout-minutes: 720
    # Also serialize against the normal native-slave image build. These host
    # runners must not introduce another concurrent full-image memory consumer.
    concurrency:
      group: sonic-slave-container-vs
      cancel-in-progress: false
      queue: max
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      SONIC_CI_CONTAINER_LABEL: io.sonic-buildimage.ci-job=${{ github.repository }}:${{ github.run_id }}:${{ github.run_attempt }}:master-backfill
      SONIC_BAZEL_CACHE_SOURCE: /data/sonic-runner/cache/sonic-buildimage/bazel
      SONIC_DPKG_CACHE_SOURCE: /data/sonic-runner/cache/sonic-buildimage/packages
      SONIC_DPKG_CACHE_METHOD: rwcache
      SONIC_CONFIG_USE_DOCKER_CACHE: "y"
      SONIC_BUILD_MEMORY: "20g"
      SONIC_BUILD_MEMORY_SWAP: "20g"
      DEFAULT_CONTAINER_REGISTRY: ""
      # The installer bootstraps CA certificates after its first signed APT update.
      MIRROR_URLS: http://deb.debian.org/debian/
      MIRROR_SECURITY_URLS: http://deb.debian.org/debian-security/
      BAZEL: bazel
      BAZEL_CONTAINER_ARGS: >-
        --jobs=4
        --local_resources=cpu=4
        --local_resources=memory=10000
        --distdir=/bazel_cache/distdir/ape-1.0.1
        --distdir=/bazel_cache/distdir/download_utils-1.0.1
        --distdir=/bazel_cache/distdir/rules_coreutils-1.0.1
        --distdir=/bazel_cache/distdir/rules_gzip-1.0.0
        --distdir=/bazel_cache/distdir/toolchain_utils-1.0.2
    defaults:
      run:
        shell: bash
        working-directory: vs-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout the reviewed backfill driver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: control-${{ github.run_id }}-${{ github.run_attempt }}
          persist-credentials: false

      - name: Verify original run and pinned download artifact
        id: inputs
        working-directory: ${{ github.workspace }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 -B "control-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/tools/ci/historical_vs_backfill.py" inputs \
            --source-sha "$SOURCE_SHA" --output "evidence-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --github-output "$GITHUB_OUTPUT"

      - name: Checkout the exact historical source and pinned submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          path: vs-${{ github.run_id }}-${{ github.run_attempt }}
          persist-credentials: false
          submodules: recursive

      - name: Verify historical checkout identity
        run: |
          mkdir -p artifacts/vs
          python3 -B "$GITHUB_WORKSPACE/control-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/tools/ci/historical_vs_backfill.py" identity \
            --source-sha "$SOURCE_SHA" --workspace "$PWD" --output artifacts/vs/source-before.json
          test ! -e target/sonic-vs.bin

      - name: Check ONIE host prerequisites with the separate current driver
        run: |
          python3 -B "$GITHUB_WORKSPACE/control-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/tools/ci/runner/preflight.py" \
            --workspace "$PWD" --build-target sonic-vs.bin 2>&1 | tee artifacts/vs/preflight.log

      - name: Prepare persistent agent caches
        run: |
          SONIC_BAZEL_CACHE_SOURCE="$SONIC_BAZEL_CACHE_SOURCE/make-uid-$(id -u)"
          install -d -m 0700 "$SONIC_BAZEL_CACHE_SOURCE" "$SONIC_DPKG_CACHE_SOURCE"
          test -w "$SONIC_BAZEL_CACHE_SOURCE"
          test -w "$SONIC_DPKG_CACHE_SOURCE"
          for cache in repository_cache disk_cache kernel-linux-sandbox/repository_cache kernel-linux-sandbox/disk_cache; do
            cache_path="$SONIC_BAZEL_CACHE_SOURCE/$cache"
            if test -d "$cache_path"; then
              blocked=$(find "$cache_path" -type d ! -writable -print -quit)
              if test -n "$blocked"; then
                stat -c 'Unwritable cache: %n (uid=%u gid=%g mode=%a)' "$blocked" >&2
                exit 1
              fi
            fi
          done
          printf 'SONIC_BAZEL_CACHE_SOURCE=%s\n' "$SONIC_BAZEL_CACHE_SOURCE" >> "$GITHUB_ENV"

      - name: Download the original run's verified source inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.inputs.outputs.artifact_id }}
          run-id: ${{ steps.inputs.outputs.run_id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: vs-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/vs/repository-inputs

      - name: Verify and stage sources using the historical integrity pins
        run: |
          python3 -B tools/bazel/gzip/source_archive.py \
            --archives-dir artifacts/vs/repository-inputs \
            --output "$SONIC_BAZEL_CACHE_SOURCE/distdir" \
            > artifacts/vs/source-download-receipt.json

      - name: Initialize and configure the original Make source
        run: |
          make init 2>&1 | tee artifacts/vs/init.log
          make configure PLATFORM=vs PLATFORM_ARCH=amd64 \
            SONIC_CONFIG_BUILD_JOBS=1 SONIC_CONFIG_MAKE_JOBS=4 \
            SONIC_BUILDER_EXTRA_CMDLINE="--label $SONIC_CI_CONTAINER_LABEL -e BAZEL=$BAZEL" \
            2>&1 | tee artifacts/vs/configure.log

      - name: Check the original nested Docker setup
        timeout-minutes: 10
        run: |
          for build_env in bookworm trixie; do
            make -f Makefile.work BLDENV="$build_env" docker-start \
              SONIC_CONFIG_BUILD_JOBS=1 SONIC_CONFIG_MAKE_JOBS=4 \
              SONIC_BUILDER_EXTRA_CMDLINE="--label $SONIC_CI_CONTAINER_LABEL -e BAZEL=$BAZEL" \
              2>&1 | tee "artifacts/vs/docker-start-$build_env.log"
          done

      - name: Build the historical ONIE installer
        id: build
        run: |
          make target/sonic-vs.bin \
            BUILD_WITH_BAZEL_WHEN_AVAILABLE=y INCLUDE_VS_DASH_SAI=y INCLUDE_FIPS=y \
            ENABLE_ASAN=n ENABLE_SYNCD_RPC=n \
            SONIC_CONFIG_BUILD_JOBS=1 SONIC_CONFIG_MAKE_JOBS=4 \
            SONIC_BUILDER_EXTRA_CMDLINE="--label $SONIC_CI_CONTAINER_LABEL -e BAZEL=$BAZEL -e BAZEL_CONTAINER_ARGS" \
            2>&1 | tee artifacts/vs/build.log
          test -s target/sonic-vs.bin
          sha256sum target/sonic-vs.bin > artifacts/vs/sonic-vs.bin.sha256

      - name: Verify the installer embeds the historical source identity
        run: |
          # The historical slave already provides PyYAML and unsquashfs. Mount
          # the current read-only validator separately; never patch the source.
          control="$GITHUB_WORKSPACE/control-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          expected_commit=$(git rev-parse --short HEAD)
          make -f Makefile.work BLDENV=trixie sonic-slave-run \
            DOCKER_ROOT="$PWD/target/docker-backfill-metadata" \
            SONIC_CONFIG_BUILD_JOBS=1 SONIC_CONFIG_MAKE_JOBS=4 \
            SONIC_BUILDER_EXTRA_CMDLINE="--label $SONIC_CI_CONTAINER_LABEL --mount type=bind,source=$control,target=/ci-control,readonly" \
            SONIC_RUN_CMDS="python3 -B /ci-control/scripts/validate_sonic_version.py \
              --installer --expected-commit-id $expected_commit --secure-upgrade-mode no_sign \
              --json-output artifacts/vs/sonic-version.json target/sonic-vs.bin" \
            2>&1 | tee artifacts/vs/installer-version.log

      - name: Verify source identity after the build
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          python3 -B "$GITHUB_WORKSPACE/control-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/tools/ci/historical_vs_backfill.py" identity \
            --source-sha "$SOURCE_SHA" --workspace "$PWD" --output artifacts/vs/source-after.json \
            --after-build
          printf '%s\n' 'Built target/sonic-vs.bin from the original source revision. This backfill does not create or boot a KVM disk, or claim the newer PR #54 runtime-validation coverage.' >> "$GITHUB_STEP_SUMMARY"
          printf 'Source: `%s`; driver: `%s`.\n' "$SOURCE_SHA" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the historical installer and checksum
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonic-vs-bin-${{ inputs.source_sha }}
          path: |
            vs-${{ github.run_id }}-${{ github.run_attempt }}/target/sonic-vs.bin
            vs-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/vs/sonic-vs.bin.sha256
            vs-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/vs/source-*.json
            vs-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/vs/sonic-version.json
            evidence-${{ github.run_id }}-${{ github.run_attempt }}/inputs.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Remove only this job's remaining build containers
        if: always()
        timeout-minutes: 2
        working-directory: ${{ github.workspace }}
        run: |
          containers=$(docker ps --all --quiet --filter "label=$SONIC_CI_CONTAINER_LABEL")
          if test -n "$containers"; then
            readarray -t container_ids <<< "$containers"
            logs="vs-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/artifacts/vs"
            mkdir -p "$logs"
            for container_id in "${container_ids[@]}"; do
              docker logs "$container_id" > "$logs/container-$container_id.log" 2>&1 || true
            done
            if ! docker rm --force "${container_ids[@]}"; then
              # A --rm builder may exit between listing and removal.
              remaining=$(docker ps --all --quiet --filter "label=$SONIC_CI_CONTAINER_LABEL")
              test -z "$remaining"
            fi
          fi

      - name: Retain build evidence on success or failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonic-vs-backfill-evidence-${{ inputs.source_sha }}
          path: |
            evidence-${{ github.run_id }}-${{ github.run_attempt }}/
            vs-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/vs/*.json
            vs-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/vs/*.log
            vs-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/vs/*.sha256
            vs-${{ github.run_id }}-${{ github.run_attempt }}/target/*.log
          if-no-files-found: error
          retention-days: 14
          compression-level: 1
