    steps:
      - name: Require metadata-only scope and a fresh private directory
        id: paths
        timeout-minutes: 1
        env:
          EXPECTED_WORKER: ${{ runner.name }}
          SOURCE_REVISION: ${{ inputs.source_revision }}
          REGISTRY_REVISION: ${{ inputs.registry_revision }}
          SOURCE_CI_REQUEST: ${{ inputs.source_ci_request }}
          SOURCE_INPUTS_RUN: ${{ inputs.source_inputs_run }}
          REGISTRY_CONSUMER: ${{ inputs.registry_consumer }}
        run: |
          python3 -I -S -B - <<'PY_PATHS'
          import os, re
          from pathlib import Path
          if any(os.environ.get(key) for key in ('SOURCE_REVISION', 'REGISTRY_REVISION', 'SOURCE_CI_REQUEST', 'SOURCE_INPUTS_RUN')) or os.environ['REGISTRY_CONSUMER'] != 'none':
              raise SystemExit('Metadata transport accepts no native or replacement-source inputs')
          run, attempt, worker = (os.environ[key] for key in ('GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'EXPECTED_WORKER'))
          if not all(re.fullmatch(r'[1-9][0-9]*', item) for item in (run, attempt)) or worker != os.environ['RUNNER_NAME'] or not re.fullmatch(r'ks-[a-z0-9](?:[a-z0-9-]{0,58}[a-z0-9])?', worker):
              raise SystemExit('Unexpected current runner identity')
          workspace = Path(os.environ['GITHUB_WORKSPACE'])
          if workspace.resolve() != workspace or not workspace.is_relative_to('/actions/_work') or os.getuid() != 1000:
              raise SystemExit('Expected the current private K3s workspace')
          name = f'vs-kernel-metadata-{run}-{attempt}-{worker}'
          root = workspace / name
          if os.path.lexists(root):
              raise SystemExit('Preserve existing metadata transport work')
          root.mkdir(mode=0o700)
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write(f'root={root}\ncontrol={name}/control\n')
          PY_PATHS
      - name: Checkout only the exact recovered metadata and lineage
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: ${{ steps.paths.outputs.control }}
          clean: false
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: tools/bazel/ci/original-kernel-metadata/*.json
      - name: Verify unchanged original metadata bytes
        id: verified
        timeout-minutes: 1
        env:
          OBS_ROOT: ${{ steps.paths.outputs.root }}
        run: |
          set -euo pipefail
          test "$(git -C "$OBS_ROOT/control" -c protocol.allow=never rev-parse HEAD)" = "$GITHUB_SHA"
          git -C "$OBS_ROOT/control" -c protocol.allow=never diff --exit-code --ignore-submodules=none HEAD
          python3 -I -S -B - <<'PY_VERIFY'
          import hashlib, json, os, stat
          from pathlib import Path
          root = Path(os.environ['OBS_ROOT']) / 'control/tools/bazel/ci/original-kernel-metadata'
          expected = {'kernel-packages.json': {'bytes': 92529, 'sha256': '79d293bb00859b94435ed865b794c364233eb018984c87cd8b0745eb7861d6d0'}, 'kernel-provenance.json': {'bytes': 2358, 'sha256': '5394ec6d65b8448b78531fc38be3a18caad4e298f83524eaa9269eaa5c1f019f'}, 'original-summary.json': {'bytes': 1829, 'sha256': '1dc020a4ee82a61f3b5370328ef475723635fd7e6f7f75b67f70ea7b01b39c50'}, 'lineage.json': {'bytes': 1280, 'sha256': '95074ef4d920928daf4d3970377d070211697878b0b14675b0e6d0918d760655'}}
          if root.resolve() != root or set(p.name for p in root.iterdir()) != set(expected):
              raise SystemExit('Unexpected metadata member set or path')
          for name, wanted in expected.items():
              path = root / name
              fd = os.open(path, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
              with os.fdopen(fd, 'rb') as stream:
                  before = os.fstat(stream.fileno())
                  if not stat.S_ISREG(before.st_mode) or before.st_size != wanted['bytes']:
                      raise SystemExit('Original metadata is not the expected bounded regular file')
                  raw = stream.read(wanted['bytes'] + 1)
                  after = os.fstat(stream.fileno())
              identity = lambda info: (info.st_dev, info.st_ino, info.st_size, info.st_mtime_ns, info.st_ctime_ns)
              if identity(before) != identity(after) or identity(after) != identity(path.lstat()) or len(raw) != wanted['bytes'] or hashlib.sha256(raw).hexdigest() != wanted['sha256']:
