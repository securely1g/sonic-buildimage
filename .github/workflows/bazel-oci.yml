  gearbox_runtime:
    name: Load and run gearbox images (AMD64)
    needs: gearbox_native
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - name: Checkout the normal CI merge for receipt verification
      if: env.GEARBOX_WORKER_RECEIPT == 'true'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: 'false'
        fetch-depth: 64
    - name: Verify the tested PR source context
      id: source_context
      if: github.event_name == 'pull_request' && (env.GEARBOX_WORKER_RECEIPT == 'true')
      run: |
        git config --global --add safe.directory "$PWD"
        python3 -B -m tools.bazel.ci.image_worker_receipt source-context --directory artifacts/source-context
    - name: Preserve the original normal CI request
      if: env.GEARBOX_WORKER_RECEIPT == 'true'
      id: gearbox_request
      env:
        GH_TOKEN: ${{ github.token }}
      run: "git config --global --add safe.directory \"$GITHUB_WORKSPACE\"\npython3 -B -m tools.bazel.ci.image_worker_receipt origin \\\n  --contract tools/bazel/ci/gearbox_worker_contract.json \\\n  --directory \"$RUNNER_TEMP/gearbox-ci-request\" --existing-only\n"
    - name: Download the immutable original Gearbox request
      if: env.GEARBOX_WORKER_RECEIPT == 'true' && steps.gearbox_request.outputs.new_request == 'false'
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        artifact-ids: ${{ steps.gearbox_request.outputs.request_artifact }}
        merge-multiple: 'true'
        run-id: ${{ steps.gearbox_request.outputs.request_run }}
        github-token: ${{ github.token }}
        repository: securely1g/sonic-buildimage
        path: ${{ runner.temp }}/gearbox-ci-request
    - name: Require exact successful worker evidence for this CI merge
      if: env.GEARBOX_WORKER_RECEIPT == 'true'
      id: gearbox_acceptance
      env:
        GH_TOKEN: ${{ github.token }}
      run: "python3 -B -m tools.bazel.ci.image_worker_receipt discover \\\n  --contract tools/bazel/ci/gearbox_worker_contract.json \\\n  --directory \"$RUNNER_TEMP/gearbox-ci-request\"\n"
    - name: Download only the small public Gearbox JSON receipts
      if: env.GEARBOX_WORKER_RECEIPT == 'true'
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        artifact-ids: ${{ steps.gearbox_acceptance.outputs.artifact }}
        merge-multiple: 'true'
        run-id: ${{ steps.gearbox_acceptance.outputs.worker_run }}
        github-token: ${{ github.token }}
        repository: securely1g/sonic-buildimage
        path: ${{ runner.temp }}/gearbox-ci-evidence
    - name: Verify all original Gearbox acceptance checks
      if: env.GEARBOX_WORKER_RECEIPT == 'true'
      run: "python3 -B -m tools.bazel.ci.image_worker_receipt verify \\\n  --contract tools/bazel/ci/gearbox_worker_contract.json \\\n  --directory \"$RUNNER_TEMP/gearbox-ci-request\" \\\n  --public \"$RUNNER_TEMP/gearbox-ci-evidence\" \\\n  --output \"$RUNNER_TEMP/gearbox-ci-verified.json\"\n"
    - name: Retain the verified CI handoff summary
      if: env.GEARBOX_WORKER_RECEIPT == 'true'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: gearbox-ci-gearbox_runtime-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/gearbox-ci-verified.json
        if-no-files-found: error
        retention-days: '14'
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 64
      if: env.GEARBOX_WORKER_RECEIPT != 'true'
    - name: Verify the tested PR source context
      id: source_context_fallback
      if: github.event_name == 'pull_request' && (env.GEARBOX_WORKER_RECEIPT != 'true')
      run: |
        git config --global --add safe.directory "$PWD"
        python3 -B -m tools.bazel.ci.image_worker_receipt source-context --directory artifacts/source-context
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: gbsyncd-source-amd64
        path: artifacts/gbsyncd
      if: env.GEARBOX_WORKER_RECEIPT != 'true'
    - name: Exercise installed gearbox manager, context and private Redis
      run: python3 -B tools/bazel/ci/gbsyncd_loaded.py --artifacts artifacts/gbsyncd
      if: env.GEARBOX_WORKER_RECEIPT != 'true'
    - name: Retain installed gearbox evidence
      if: (always()) && env.GEARBOX_WORKER_RECEIPT != 'true'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: gbsyncd-runtime-amd64
        path: artifacts/gbsyncd/*.runtime.json
        if-no-files-found: warn
        retention-days: 14
    - name: Retain the tested PR source context
      if: always() && github.event_name == 'pull_request' && (steps.source_context.outcome == 'success' || steps.source_context_fallback.outcome == 'success')
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: source-context-${{ github.job }}-${{ strategy.job-index || 0 }}-${{ github.run_attempt }}
        path: artifacts/source-context/context.json
        if-no-files-found: error
        retention-days: 14
    env:
      GEARBOX_WORKER_RECEIPT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: read
      actions: read

