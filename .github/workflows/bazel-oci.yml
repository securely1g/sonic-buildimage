      - name: Check out the existing verified source-download configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: securely1g/sonic-bazel-registry
          ref: 97cc502556b7ec3435d2d67b105315bcc18bb47e
          path: ${{ steps.paths.outputs.catalog }}
