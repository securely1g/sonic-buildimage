name: Bazel OCI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      source_image:
        description: Dedicated source-image worker task
        type: choice
        options: [none, preflight, sysmgr, dash-ha, orchagent, sflow, otel, syncd, gearbox, dash-engine, gnmi, gnmi-no-dialout, teamd]
        default: none
      source_revision:
        description: Reviewed 40-character source commit for an image task
        type: string
        default: ''
      source_worker:
        description: Dedicated worker for an image pilot
        type: choice
        options: [sonic-slave-lgh114-1, sonic-slave-lgh114-2, sonic-slave-lgh114-3, sonic-slave-lgh114-4]
        default: sonic-slave-lgh114-1
      source_inputs_run:
        description: Optional successful source-download run in this repository
        type: string
        default: ''
      skip_vs:
        description: Skip the full VS image build
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  # Preserve long VS builds across PR revisions and isolate explicit retries.
  group: bazel-oci-${{ github.run_attempt == '1' && github.event.pull_request.number || format('run-{0}', github.run_id) }}-${{ github.sha }}
  cancel-in-progress: true

env:
  BAZEL: bazel

jobs:
  source_image_inputs:
    name: Fetch pinned source-image downloads
    if: github.event_name == 'workflow_dispatch' && contains(fromJSON('["sysmgr", "dash-ha", "orchagent", "sflow", "otel", "syncd", "gearbox", "dash-engine", "gnmi", "gnmi-no-dialout", "teamd"]'), inputs.source_image) && inputs.source_inputs_run == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout reviewed source-download verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bazel for repository downloads only
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-version: 1.29.0
          bazelisk-cache: true
          repository-cache: true
          disk-cache: false
          cache-version: "8.5.1"
      - name: Retain the same verified GitLab sources used by the VS workflow
        run: |
          mkdir -p artifacts/source-image-inputs
          bazel fetch --repo=@@ape+ --repo=@@download_utils+ \
            --repo=@@rules_coreutils+ --repo=@@rules_gzip+ --repo=@@toolchain_utils+
          bazel mod graph --output=json > artifacts/source-image-inputs/module-graph.json
          python3 -B tools/bazel/gzip/source_archive.py \
            --repository-cache "$(bazel info repository_cache)" \
            --module-graph artifacts/source-image-inputs/module-graph.json \
            --output artifacts/source-image-inputs > artifacts/source-image-inputs/receipt.json
      - name: Upload verified source downloads
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-image-inputs
          path: |
            artifacts/source-image-inputs/*/src.tar.gz
            artifacts/source-image-inputs/receipt.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  source_image:
    needs: source_image_inputs
    name: Source image (${{ inputs.source_image }})
    if: always() && !cancelled() && (needs.source_image_inputs.result == 'success' || (needs.source_image_inputs.result == 'skipped' && inputs.source_inputs_run != '')) && github.event_name == 'workflow_dispatch' && contains(fromJSON('["sysmgr", "dash-ha", "orchagent", "sflow", "otel", "syncd", "gearbox", "dash-engine", "gnmi", "gnmi-no-dialout", "teamd"]'), inputs.source_image)
    runs-on: [sonic-slave-container-dpool, '${{ inputs.source_worker }}']
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash
    env:
      SELECTED_IMAGE: ${{ inputs.source_image }}
      SOURCE_REVISION: ${{ inputs.source_revision }}
      SOURCE_INPUTS_RUN: ${{ inputs.source_inputs_run }}
    steps:
      - name: Checkout reviewed dispatcher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: control
          persist-credentials: false
      - name: Validate the fixed image selection
        run: |
          python3 -B control/tools/bazel/ci/source_image_worker.py selection \
            --image "$SELECTED_IMAGE" --revision "$SOURCE_REVISION" \
            --workspace "$GITHUB_WORKSPACE/source" --artifacts "$RUNNER_TEMP/source-image-artifacts"
      - name: Verify Teamd kernel prerequisites without host changes
        id: teamd_kernel
        if: inputs.source_image == 'teamd'
        run: |
          python3 -B control/tools/bazel/ci/source_image_worker.py kernel-preflight \
            --image "$SELECTED_IMAGE" --revision "$SOURCE_REVISION" \
            --workspace "$GITHUB_WORKSPACE/source" --artifacts "$RUNNER_TEMP/source-image-artifacts"
      - name: Checkout the exact reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_revision }}
          path: source
          persist-credentials: false
      - name: Verify the existing successful source-download producer
        if: inputs.source_inputs_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -B control/tools/bazel/ci/source_image_worker.py verify-input-run \
            --image "$SELECTED_IMAGE" --revision "$SOURCE_REVISION" \
            --workspace "$GITHUB_WORKSPACE/source" --artifacts "$RUNNER_TEMP/source-image-artifacts"
      - name: Reuse the existing source-download artifact
        if: inputs.source_inputs_run != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bazel-repository-inputs
          run-id: ${{ inputs.source_inputs_run }}
          github-token: ${{ github.token }}
          repository: securely1g/sonic-buildimage
          path: ${{ runner.temp }}/source-image-inputs
      - name: Download the verified source archives
        if: inputs.source_inputs_run == ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: source-image-inputs
          path: ${{ runner.temp }}/source-image-inputs
      - name: Prepare private Docker and persistent worker caches
        id: prepare
        run: |
          python3 -B control/tools/bazel/ci/source_image_worker.py prepare \
            --image "$SELECTED_IMAGE" --revision "$SOURCE_REVISION" \
            --workspace "$GITHUB_WORKSPACE/source" --artifacts "$RUNNER_TEMP/source-image-artifacts"
      - name: Build source runtime and debug images
        run: |
          python3 -B control/tools/bazel/ci/source_image_worker.py build \
            --image "$SELECTED_IMAGE" --revision "$SOURCE_REVISION" \
            --workspace "$GITHUB_WORKSPACE/source" --artifacts "$RUNNER_TEMP/source-image-artifacts"
      - name: Validate image contents and symbols
        run: |
          python3 -B control/tools/bazel/ci/source_image_worker.py validate \
            --image "$SELECTED_IMAGE" --revision "$SOURCE_REVISION" \
            --workspace "$GITHUB_WORKSPACE/source" --artifacts "$RUNNER_TEMP/source-image-artifacts"
      - name: Verify incremental rebuild and restoration
        run: |
          python3 -B control/tools/bazel/ci/source_image_worker.py incremental \
            --image "$SELECTED_IMAGE" --revision "$SOURCE_REVISION" \
            --workspace "$GITHUB_WORKSPACE/source" --artifacts "$RUNNER_TEMP/source-image-artifacts"
      - name: Validate the installed services in private containers
        run: |
          python3 -B control/tools/bazel/ci/source_image_worker.py loaded \
            --image "$SELECTED_IMAGE" --revision "$SOURCE_REVISION" \
            --workspace "$GITHUB_WORKSPACE/source" --artifacts "$RUNNER_TEMP/source-image-artifacts"
      - name: Prepare declared artifacts and public evidence
        id: public_artifacts
        if: always() && (steps.prepare.outcome != 'skipped' || (inputs.source_image == 'teamd' && steps.teamd_kernel.outcome != 'skipped'))
        run: |
          python3 -B control/tools/bazel/ci/source_image_worker.py publish \
            --image "$SELECTED_IMAGE" --revision "$SOURCE_REVISION" \
            --workspace "$GITHUB_WORKSPACE/source" --artifacts "$RUNNER_TEMP/source-image-artifacts"
      - name: Upload source images and acceptance receipts
        if: always() && steps.public_artifacts.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-image-${{ inputs.source_image }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/source-image-artifacts/public/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Stop only this job's private Docker daemon
        if: always() && steps.prepare.outcome != 'skipped'
        run: |
          python3 -B control/tools/bazel/ci/source_image_worker.py stop \
            --image "$SELECTED_IMAGE" --revision "$SOURCE_REVISION" \
            --workspace "$GITHUB_WORKSPACE/source" --artifacts "$RUNNER_TEMP/source-image-artifacts"

  source_worker_preflight:
    name: Source worker preflight (${{ matrix.worker }})
    if: github.event_name == 'workflow_dispatch' && inputs.source_image == 'preflight'
    runs-on: [sonic-slave-container-dpool, '${{ matrix.worker }}']
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        worker: [sonic-slave-lgh114-1, sonic-slave-lgh114-2, sonic-slave-lgh114-3, sonic-slave-lgh114-4]
    steps:
      - name: Checkout dispatcher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Measure this worker's resources and namespace capabilities
        env:
          EXPECTED_WORKER: ${{ matrix.worker }}
        run: |
          python3 -B tools/bazel/ci/source_worker_preflight.py \
            --worker "$EXPECTED_WORKER" --output artifacts/source-worker/preflight.json
      - name: Retain measured resource evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-worker-${{ matrix.worker }}-${{ github.run_id }}
          path: artifacts/source-worker/preflight.json
          if-no-files-found: error
          retention-days: 14

  archive:
    if: github.event_name != 'workflow_dispatch' || inputs.source_image == 'none'
    name: Container archive (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.architecture == 'amd64' && 300 || 60 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: AMD64 build
            architecture: amd64
            machine: x86_64
            runner: [self-hosted, linux, bazel-x64]
            platform: x86_64_trixie
            disk_cache: swss-layer-amd64
          - name: ARM64
            architecture: arm64
            machine: aarch64
            runner: [self-hosted, linux, bazel-arm64]
            platform: aarch64_trixie
            disk_cache: buildimage-gzip-arm64
    container:
      image: debian:trixie-20260918@sha256:9cc080028c43b27d2074d63a5f9caf7166d731494965616c1a6d2827a004585c
    env:
      # Shared CI entry point with the canonical registry; the full Make VS job is separate.
      BAZEL: ${{ github.workspace }}/tools/bazel/ci/libteam_draft_bazel.sh
    defaults:
      run:
        shell: bash
    steps:
      - name: Install execution tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            autoconf automake binutils binutils-gold build-essential busybox ca-certificates gdb git j2cli jq libarchive-tools libtool libxml2 pkg-config python3 python3-jinja2 python3-yaml tar unzip zstd
          for tool in bsdtar gdb readelf objcopy; do
            command -v "$tool"
          done

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bind the tested checkout identity
        id: checkout_identity
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 -B tools/bazel/ci/checkout_identity.py \
            --expected-revision "$GITHUB_SHA" --event-name "$GITHUB_EVENT_NAME" \
            --head-sha "$EVENT_HEAD_SHA" --event-base-sha "$EVENT_BASE_SHA" \
            --github-output "$GITHUB_OUTPUT"

      - name: Configure remote cache uploads
        env:
          UPLOAD_CACHE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        run: |
          printf '\nbuild --remote_upload_local_results=%s\n' \
            "$UPLOAD_CACHE" >> .bazelrc.user

      - name: Check native architecture and generated dependency state
        run: |
          test "$(uname -m)" = "${{ matrix.machine }}"
          test ! -e MODULE.bazel.lock
          test -z "$(git ls-files -- MODULE.bazel.lock)"
          git check-ignore MODULE.bazel.lock

      - name: Initialize Sysmgr's pinned gNOI source
        run: git -c safe.directory="$GITHUB_WORKSPACE" submodule update --init -- src/sonic-sysmgr/gnoi
      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-version: 1.29.0
          bazelisk-cache: true
          repository-cache: true
          disk-cache: ${{ matrix.disk_cache }}
          cache-version: "8.5.1"
      - name: Preserve setup-bazel caches for source checks
        run: python3 tools/bazel/ci/preserve_setup_bazel_cache.py --private-remote-cache
      - name: Restore default Bazel startup ownership
        run: python3 tools/bazel/ci/repair_bazel_startup.py

      - name: Configure shared source download mirrors
        run: |
          python3 -B tools/bazel/ci/source_mirrors.py \
            --output "$RUNNER_TEMP/sonic-source-mirrors.cfg"
          # common.bazelrc imports this ignored file, including through Draft wrappers.
          printf 'common --downloader_config=%s\n' "$RUNNER_TEMP/sonic-source-mirrors.cfg" >> .bazelrc.user

      - name: Check Make OCI bases and reproducible Docker archives
        run: |
          set -euo pipefail
          mkdir -p artifacts/archive
          git rev-parse HEAD > artifacts/archive/revision.txt
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
          pull = event.get("pull_request", {})
          commit = subprocess.check_output(["git", "cat-file", "-p", "HEAD"], text=True)
          parents = [line.split()[1] for line in commit.split("\n\n", 1)[0].splitlines()
                     if line.startswith("parent ")]
          evidence = {
              "tested_head": Path("artifacts/archive/revision.txt").read_text().strip(),
              "tested_parents": parents,
              "github_sha": os.environ["GITHUB_SHA"],
              "pull_request_head": pull.get("head", {}).get("sha"),
              "pull_request_base": pull.get("base", {}).get("sha"),
              "architecture": "${{ matrix.architecture }}",
          }
          Path("artifacts/archive/revision.json").write_text(json.dumps(evidence, indent=2) + "\n")
          PY
          "$BAZEL" --version | tee artifacts/archive/bazel-version.txt
          test "$(cat artifacts/archive/bazel-version.txt)" = "bazel $(cat .bazelversion)"
          python3 -B tools/bazel/ci/bazel_commands.py --bazel "$BAZEL" \
            --bazel-arg=--platforms=@sonic_build_infra//platforms:${{ matrix.platform }} \
            --bazel-arg=--host_platform=@sonic_build_infra//platforms:${{ matrix.platform }} \
            --bazel-arg=--jobs=4 --bazel-arg=--local_resources=cpu=4 \
            --bazel-arg=--local_resources=memory=10000 \
            --output artifacts/archive/action-audit.json \
            //tools/bazel/tests:sonic_docker_archive_test \
            //tools/bazel/tests:oci_base_layout_test \
            //tools/bazel/tests:prepare_oci_base_test \
            //tools/bazel/tests:oci_base_consumer_test \
            //tools/bazel/tests:select_apt_payloads_test \
            //tools/bazel/tests:source_contract_test \
            //tools/bazel/tests:oci_license_filter_test \
            //tools/bazel/tests:test_dpkg_patterns_up_to_date \
            //tools/bazel/oci/tests:imported_symbols_test \
            //tools/bazel/oci/tests:native_symbols_test \
            //tools/bazel/oci/tests:normalize_layer_test \
            //tools/bazel/oci/tests:normalize_layer_rule_test \
            //tools/bazel/tests:archive-fixture.gz \
            //tools/bazel/tests:oci-consumer-first.gz
          "$BAZEL" test --platforms=@sonic_build_infra//platforms:${{ matrix.platform }} \
            --host_platform=@sonic_build_infra//platforms:${{ matrix.platform }} \
            --jobs=4 --local_resources=cpu=4 --local_resources=memory=10000 \
            --lockfile_mode=update --nocache_test_results --test_output=all \
            --build_event_json_file="$PWD/artifacts/archive/test-events.jsonl" \
            //tools/bazel/tests:sonic_docker_archive_test \
            //tools/bazel/tests:oci_base_layout_test \
            //tools/bazel/tests:prepare_oci_base_test \
            //tools/bazel/tests:oci_base_consumer_test \
            //tools/bazel/tests:select_apt_payloads_test \
            //tools/bazel/tests:source_contract_test \
            //tools/bazel/tests:oci_license_filter_test \
            //tools/bazel/tests:test_dpkg_patterns_up_to_date \
            //tools/bazel/oci/tests:imported_symbols_test \
            //tools/bazel/oci/tests:native_symbols_test \
            //tools/bazel/oci/tests:normalize_layer_test \
            //tools/bazel/oci/tests:normalize_layer_rule_test \
            2>&1 | tee artifacts/archive/test.log
          output=$("$BAZEL" cquery --platforms=@sonic_build_infra//platforms:${{ matrix.platform }} \
            --host_platform=@sonic_build_infra//platforms:${{ matrix.platform }} \
            --output=files //tools/bazel/tests:archive-fixture.gz)
          test -s "$output"
          cp "$output" artifacts/archive/archive-fixture.gz
          # The fixture test verifies that this payload equals the original Docker tar.
          python3 -c 'import gzip; from pathlib import Path; p = Path("artifacts/archive"); (p / "archive-fixture.tar").write_bytes(gzip.decompress((p / "archive-fixture.gz").read_bytes()))'
          sha256sum artifacts/archive/archive-fixture.* > artifacts/archive/archive-sha256.txt

      - name: Check shared Make rules with unrelated container targets
        run: |
          python3 -B -m unittest discover -s tools/bazel/tests -p '*_test.py'
          python3 -B tools/bazel/ci/verify_make_archive.py \
            --artifacts artifacts/archive/make-export \
            --bazel "$BAZEL" \
            --bazel-arg=--platforms=@sonic_build_infra//platforms:${{ matrix.platform }} \
            --bazel-arg=--host_platform=@sonic_build_infra//platforms:${{ matrix.platform }} \
            --bazel-arg=--jobs=4 \
            --bazel-arg=--local_resources=cpu=4 \
            --bazel-arg=--local_resources=memory=10000

      - name: Test Python packages and check startup generation
        run: |
          set -euo pipefail
          mkdir -p artifacts/config-engine
          # Render SWSS metadata on either host; this does not build an ARM64 image.
          make -f tools/bazel/prepare_manifests.mk \
            MANIFEST_METADATA=rules/docker-orchagent.mk \
            BUILD_WITH_BAZEL_WHEN_AVAILABLE=y BLDENV=trixie CONFIGURED_PLATFORM=vs \
            CONFIGURED_ARCH=amd64 ENABLE_ASAN=n DBG_IMAGE_MARK=dbg DOCKERS_PATH=dockers \
            2>&1 | tee artifacts/config-engine/make-manifests.log
          python3 -B tools/bazel/ci/bazel_commands.py --bazel "$BAZEL" \
            --bazel-arg=--platforms=@sonic_build_infra//platforms:${{ matrix.platform }} \
            --bazel-arg=--host_platform=@sonic_build_infra//platforms:${{ matrix.platform }} \
            --bazel-arg=--jobs=4 --bazel-arg=--local_resources=cpu=4 \
            --bazel-arg=--local_resources=memory=10000 \
            --output artifacts/config-engine/action-audit.json \
            //tools/bazel/tests:apt_selection_test \
            //tools/bazel/tests:sonic_py_common_test \
            //tools/bazel/tests:sonic_yang_mgmt_full_test \
            //tools/bazel/tests:sonic_yang_mgmt_wheel_test \
            //tools/bazel/tests:sonic_py_common_full_test \
            //tools/bazel/tests:sonic_config_engine_full_test \
            //tools/bazel/tests:sonic_python_wheels_test \
            //tools/bazel/tests:containercfgd_full_test \
            //tools/bazel/tests:containercfgd_wheel_test \
            //tools/bazel/tests:supervisor_python_full_test \
            //tools/bazel/tests:supervisor_python_wheel_test \
            //tools/bazel/tests:installed_wheel_fixture_test \
            //tools/bazel/tests:wheel_contract_test \
            //src/sonic-config-engine:sonic_cfggen_cli_test \
            //tools/bazel/tests:manifest_labels_test \
            //tools/bazel/tests:manifest_labels_action_test \
            //tools/bazel/tests:cfggen_template_test \
            //tools/bazel/tests:swss_render_test \
            //src/sonic-yang-mgmt:sonic_yang_mgmt_wheel \
            //src/sonic-py-common:sonic_py_common_wheel \
            //src/sonic-config-engine:sonic_config_engine_wheel \
            //src/sonic-containercfgd:sonic_containercfgd_wheel \
            //src/sonic-supervisord-utilities:sonic_supervisord_utilities_wheel \
            //dockers/docker-orchagent/config:docker_init
          "$BAZEL" test --platforms=@sonic_build_infra//platforms:${{ matrix.platform }} \
            --host_platform=@sonic_build_infra//platforms:${{ matrix.platform }} \
            --jobs=4 --local_resources=cpu=4 --local_resources=memory=10000 \
            --nocache_test_results --test_output=all \
            --build_event_json_file="$PWD/artifacts/config-engine/test-events.jsonl" \
            //tools/bazel/tests:apt_selection_test \
            //tools/bazel/tests:sonic_py_common_test \
            //tools/bazel/tests:sonic_yang_mgmt_full_test \
            //tools/bazel/tests:sonic_yang_mgmt_wheel_test \
            //tools/bazel/tests:sonic_py_common_full_test \
            //tools/bazel/tests:sonic_config_engine_full_test \
            //tools/bazel/tests:sonic_python_wheels_test \
            //tools/bazel/tests:containercfgd_full_test \
            //tools/bazel/tests:containercfgd_wheel_test \
            //tools/bazel/tests:supervisor_python_full_test \
            //tools/bazel/tests:supervisor_python_wheel_test \
            //tools/bazel/tests:installed_wheel_fixture_test \
            //tools/bazel/tests:wheel_contract_test \
            //src/sonic-config-engine:sonic_cfggen_cli_test \
            //tools/bazel/tests:manifest_labels_test \
            //tools/bazel/tests:manifest_labels_action_test \
            //tools/bazel/tests:cfggen_template_test \
            //tools/bazel/tests:swss_render_test \
            2>&1 | tee artifacts/config-engine/test.log
          output=$("$BAZEL" cquery --platforms=@sonic_build_infra//platforms:${{ matrix.platform }} \
            --host_platform=@sonic_build_infra//platforms:${{ matrix.platform }} \
            --output=files //dockers/docker-orchagent/config:docker_init)
          test -s "$output"
          bash -n "$output"
          cp "$output" artifacts/config-engine/docker-init.sh
          sha256sum artifacts/config-engine/docker-init.sh > artifacts/config-engine/sha256.txt
          git diff --exit-code

      - name: Retain wheels and required Python test evidence
        run: |
          python3 -B tools/bazel/ci/python_packages.py \
            --artifacts artifacts/config-engine \
            --revision artifacts/archive/revision.json \
            --architecture "${{ matrix.architecture }}" \
            --bazel "$BAZEL" \
            --bazel-arg=--platforms=@sonic_build_infra//platforms:${{ matrix.platform }} \
            --bazel-arg=--host_platform=@sonic_build_infra//platforms:${{ matrix.platform }} \
            --bazel-arg=--jobs=4 \
            --bazel-arg=--local_resources=cpu=4 \
            --bazel-arg=--local_resources=memory=10000
          git diff --exit-code

      - name: Check local cache reuse across fresh checkouts
        run: |
          python3 -B tools/bazel/ci/verify_agent_cache.py \
            --artifacts artifacts/archive/agent-cache \
            --bazel "$BAZEL" \
            --bazel-arg=--experimental_downloader_config="$RUNNER_TEMP/sonic-source-mirrors.cfg" \
            --repository-cache "$("$BAZEL" info repository_cache)" \
            --bazel-arg=--platforms=@sonic_build_infra//platforms:${{ matrix.platform }} \
            --bazel-arg=--host_platform=@sonic_build_infra//platforms:${{ matrix.platform }} \
            --bazel-arg=--jobs=4 \
            --bazel-arg=--local_resources=cpu=4 \
            --bazel-arg=--local_resources=memory=10000

      - name: Retain generated module lock and graph
        run: |
          python3 -B - <<'PY'
          import json
          from pathlib import Path
          import os
          from tools.bazel.ci import resolution
          directory = Path("artifacts/archive").resolve()
          evidence = resolution.collect(Path.cwd(), directory, bazel=[os.environ["BAZEL"]])
          (directory / "resolution.json").write_text(json.dumps(evidence, indent=2) + "\n")
          PY

      - name: Prepare public artifact list
        id: public_artifacts
        if: always()
        env:
          CI_JOB_STATUS: ${{ job.status }}
          CI_HEAD_SHA: ${{ steps.checkout_identity.outputs.head_sha }}
          CI_BASE_SHA: ${{ steps.checkout_identity.outputs.base_sha }}
        run: |
          python3 -B tools/bazel/ci/public_artifacts.py archive \
            --workspace "$PWD" --upload-root "$GITHUB_WORKSPACE" \
            --job-status "$CI_JOB_STATUS" --revision "$(git rev-parse HEAD)" \
            --architecture "${{ matrix.architecture }}" \
            --head-sha "$CI_HEAD_SHA" --base-sha "$CI_BASE_SHA" \
            --github-output "$GITHUB_OUTPUT"

      - name: Upload public archive evidence
        if: always() && steps.public_artifacts.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-archive-${{ matrix.architecture }}
          path: ${{ steps.public_artifacts.outputs.paths }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 1

      - name: Build Eventd runtime and debug images
        id: eventd_build
        if: matrix.architecture == 'amd64'
        run: |
          available_bytes=$(df --output=avail --block-size=1 /github/home | tail -n 1)
          if (( available_bytes < 45 * 1024 * 1024 * 1024 )); then
            echo 'Eventd image validation requires 45 GiB of free build space.' >&2
            exit 1
          fi
          python3 -B tools/bazel/ci/eventd_image.py build --bazel "$BAZEL" --artifacts artifacts/eventd

      - name: Validate Eventd image contents, matching symbols and incremental reuse
        if: matrix.architecture == 'amd64'
        run: |
          python3 -B tools/bazel/ci/eventd_image.py validate --artifacts artifacts/eventd
          python3 -B tools/bazel/ci/eventd_image.py incremental --bazel "$BAZEL" --artifacts artifacts/eventd
          git diff --exit-code

      - name: Prepare Eventd archives and public evidence
        id: eventd_public
        if: always() && matrix.architecture == 'amd64' && steps.eventd_build.outcome != 'skipped'
        run: python3 -B tools/bazel/ci/eventd_image.py publish --artifacts artifacts/eventd

      - name: Upload Eventd archives and public evidence
        if: always() && steps.eventd_public.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eventd-image-amd64
          path: |
            artifacts/eventd/public/*.gz
            artifacts/eventd/public/*.tar
            artifacts/eventd/public/public-receipt.json
            artifacts/eventd/public/validation.json
            artifacts/eventd/public/incremental.json
            artifacts/eventd/public/action-audit.json
            artifacts/eventd/public/debug-packages.json
            artifacts/eventd/public/build-summary.json
            artifacts/eventd/public/MODULE.bazel.lock
            artifacts/eventd/public/module-graph.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Preserve completed archive evidence before Sysmgr acceptance
        if: matrix.architecture == 'amd64'
        run: |
          # Generic archive evidence has already been uploaded above. Keep it
          # outside the checkout while the source-only image fence runs.
          if [[ -d artifacts ]]; then
            umask 077
            preserved="$(mktemp -d "$RUNNER_TEMP/pre-sysmgr-artifacts.XXXXXXXX")"
            mv artifacts "$preserved/artifacts"
            printf 'Completed archive evidence preserved at %s/artifacts\n' "$preserved"
          fi

      - name: Build Sysmgr runtime and debug images
        id: sysmgr_build
        if: matrix.architecture == 'amd64'
        env:
          CI_HEAD_SHA: ${{ steps.checkout_identity.outputs.head_sha }}
          CI_BASE_SHA: ${{ steps.checkout_identity.outputs.base_sha }}
        run: |
          python3 -B tools/bazel/ci/sysmgr_image.py build --bazel "$BAZEL" --artifacts artifacts/sysmgr
      - name: Validate Sysmgr image contents and cache reuse
        if: matrix.architecture == 'amd64'
        env:
          CI_HEAD_SHA: ${{ steps.checkout_identity.outputs.head_sha }}
          CI_BASE_SHA: ${{ steps.checkout_identity.outputs.base_sha }}
        run: |
          python3 -B tools/bazel/ci/sysmgr_image.py validate --artifacts artifacts/sysmgr
          python3 -B tools/bazel/ci/sysmgr_image.py incremental --bazel "$BAZEL" --artifacts artifacts/sysmgr
      - name: Prepare reviewed public evidence
        id: sysmgr_public
        if: always() && matrix.architecture == 'amd64' && (steps.sysmgr_build.outcome == 'success' || steps.sysmgr_build.outcome == 'failure')
        run: |
          python3 - <<'PYCODE'
          import json
          from pathlib import Path
          from tools.bazel.ci.public_artifacts import safe_json, dependency_json, bep_summary
          root = Path('artifacts/sysmgr')
          root.mkdir(parents=True, exist_ok=True)
          if (root / 'build-receipt.json').exists():
              receipt = json.loads((root / 'build-receipt.json').read_text())
              public = {key: receipt[key] for key in ('status', 'architecture', 'revision', 'artifacts') if key in receipt}
              safe_json(public)
              (root / 'public-receipt.json').write_text(json.dumps(public, indent=2) + '\n')
          names = ['validation.json', 'action-audit.json', 'incremental.json', 'runtime-apt.json', 'debug-apt.json']
          names += [path.name for path in root.glob('*.validation.json')]
          names += [path.name for path in root.glob('*.packages.json')]
          for name in names:
              path = root / name
              if path.exists():
                  safe_json(json.loads(path.read_text()))
          for name, kind in (('MODULE.bazel.lock', 'lock'), ('module-graph.json', 'graph')):
              path = root / name
              if path.exists():
                  dependency_json(json.loads(path.read_text()), kind)
          summary = {str(path.relative_to(root)): bep_summary(path.read_text().splitlines(), partial=True)
                     for path in root.rglob('*events.json*')}
          safe_json(summary)
          (root / 'build-summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          PYCODE
      - name: Retain Sysmgr image artifacts and evidence
        if: always() && matrix.architecture == 'amd64' && steps.sysmgr_public.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sysmgr-images-amd64-${{ github.sha }}
          path: |
            artifacts/sysmgr/*.gz
            artifacts/sysmgr/*.tar
            artifacts/sysmgr/dbus-mock
            artifacts/sysmgr/*.packages.json
            artifacts/sysmgr/*.validation.json
            artifacts/sysmgr/validation.json
            artifacts/sysmgr/public-receipt.json
            artifacts/sysmgr/runtime-apt.json
            artifacts/sysmgr/debug-apt.json
            artifacts/sysmgr/action-audit.json
            artifacts/sysmgr/incremental.json
            artifacts/sysmgr/build-summary.json
            artifacts/sysmgr/module-graph.json
            artifacts/sysmgr/*.status
            artifacts/sysmgr/MODULE.bazel.lock
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Preserve completed Sysmgr evidence before SWSS layer acceptance
        if: matrix.architecture == 'amd64'
        run: |
          if [[ -d artifacts ]]; then
            umask 077
            preserved="$(mktemp -d "$RUNNER_TEMP/pre-swss-layer-artifacts.XXXXXXXX")"
            mv artifacts "$preserved/artifacts"
            printf 'Completed Sysmgr evidence preserved at %s/artifacts\n' "$preserved"
          fi

      - name: Build and inspect the shared runtime and symbols
        id: swss_layer_build
        if: matrix.architecture == 'amd64'
        env:
          BAZELISK_GITHUB_TOKEN: ""
        run: |
          mkdir -p artifacts/swss-layer
          cp "$RUNNER_TEMP/sonic-source-mirrors.cfg" artifacts/swss-layer/downloader.cfg
          python3 -B tools/bazel/tests/swss_layer_payload_test.py
          python3 -B tools/bazel/ci/swss_layer.py --bazel "$BAZEL" --artifacts artifacts/swss-layer
      - name: Validate reviewed SWSS consumer contracts
        if: matrix.architecture == 'amd64'
        env:
          BAZELISK_GITHUB_TOKEN: ""
        run: |
          set -euo pipefail
          targets=(@libteam//:consumer_test @sonic_swss//crates/countersyncd:common_rust_test
                   @sonic_swss//bazel:protobuf_runtime_test //tools/bazel/tests:swss_package_contract_test)
          python3 -B tools/bazel/ci/bazel_commands.py --bazel "$BAZEL" \
            --bazel-arg=--platforms=@sonic_build_infra//platforms:x86_64_trixie \
            --bazel-arg=--host_platform=@sonic_build_infra//platforms:x86_64_trixie \
            --output artifacts/swss-layer/consumer-action-audit.json "${targets[@]}"
          "$BAZEL" test --platforms=@sonic_build_infra//platforms:x86_64_trixie \
            --host_platform=@sonic_build_infra//platforms:x86_64_trixie \
            --jobs=4 --local_resources=cpu=4 --local_resources=memory=10000 \
            --nocache_test_results --test_output=all \
            --build_event_json_file="$PWD/artifacts/swss-layer/consumer-events.jsonl" "${targets[@]}"
      - name: Check cached no-op and source edit through the image
        if: matrix.architecture == 'amd64'
        env:
          BAZELISK_GITHUB_TOKEN: ""
        run: |
          python3 -B tools/bazel/ci/swss_image_rebuild.py --bazel "$BAZEL" \
            --runtime-target //dockers/docker-swss-layer-trixie:docker-swss-layer-trixie.gz \
            --symbols-target //dockers/docker-swss-layer-trixie:docker-swss-layer-trixie.debug_symbols \
            --additional-runtime-target //dockers/docker-swss-layer-trixie:source_runtime \
            --unchanged-target //dockers/docker-config-engine-trixie:docker-config-engine-trixie.gz \
            --output artifacts/swss-layer/rebuild
          git diff --exit-code
      - name: Prepare shared SWSS image evidence
        id: swss_layer_public
        if: always() && matrix.architecture == 'amd64' && steps.swss_layer_build.outcome != 'skipped'
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from tools.bazel.ci.public_artifacts import safe_json, dependency_json, bep_summary
          root = Path('artifacts/swss-layer')
          if (root / 'receipt.json').exists():
              receipt = json.loads((root / 'receipt.json').read_text())
              public = {key: receipt[key] for key in ('status', 'architecture', 'revision', 'artifacts') if key in receipt}
              safe_json(public)
              (root / 'public-receipt.json').write_text(json.dumps(public, indent=2) + '\n')
          for name in ('validation.json', 'action-audit.json', 'consumer-action-audit.json', 'apt-selection.json', 'packages.json', 'rebuild/rebuild.json'):
              path = root / name
              if path.exists():
                  safe_json(json.loads(path.read_text()))
          for name, kind in (('MODULE.bazel.lock', 'lock'), ('module-graph.json', 'graph')):
              path = root / name
              if path.exists():
                  dependency_json(json.loads(path.read_text()), kind)
          summary = {str(path.relative_to(root)): bep_summary(path.read_text().splitlines(), partial=True)
                     for path in root.rglob('*events.json*')}
          safe_json(summary)
          (root / 'build-summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          PY
      - name: Retain reviewed artifacts and receipts
        if: always() && matrix.architecture == 'amd64' && steps.swss_layer_public.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: swss-layer-amd64
          path: |
            artifacts/swss-layer/docker-swss-layer-trixie.gz
            artifacts/swss-layer/source-runtime.tar
            artifacts/swss-layer/source-debug.tar
            artifacts/swss-layer/image-debug.tar
            artifacts/swss-layer/public-receipt.json
            artifacts/swss-layer/validation.json
            artifacts/swss-layer/action-audit.json
            artifacts/swss-layer/consumer-action-audit.json
            artifacts/swss-layer/downloader.cfg
            artifacts/swss-layer/apt-selection.json
            artifacts/swss-layer/packages.json
            artifacts/swss-layer/build-summary.json
            artifacts/swss-layer/rebuild/rebuild.json
            artifacts/swss-layer/MODULE.bazel.lock
            artifacts/swss-layer/module-graph.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 1

      - name: Preserve completed SWSS layer evidence before sFlow acceptance
        if: matrix.architecture == 'amd64'
        run: |
          if [[ -d artifacts ]]; then
            umask 077
            preserved="$(mktemp -d "$RUNNER_TEMP/pre-sflow-artifacts.XXXXXXXX")"
            mv artifacts "$preserved/artifacts"
            printf 'Completed SWSS layer evidence preserved at %s/artifacts\n' "$preserved"
          fi

      - name: Build sFlow runtime and debug images from source owners
        id: sflow_build
        if: matrix.architecture == 'amd64'
        env:
          BAZELISK_GITHUB_TOKEN: ""
          CI_HEAD_SHA: ${{ steps.checkout_identity.outputs.head_sha }}
          CI_BASE_SHA: ${{ steps.checkout_identity.outputs.base_sha }}
        run: python3 -B tools/bazel/ci/sflow_image.py build --bazel "$BAZEL" --artifacts artifacts/sflow
      - name: Validate sFlow installed payloads and matching symbols
        if: matrix.architecture == 'amd64'
        env:
          CI_HEAD_SHA: ${{ steps.checkout_identity.outputs.head_sha }}
          CI_BASE_SHA: ${{ steps.checkout_identity.outputs.base_sha }}
        run: python3 -B tools/bazel/ci/sflow_image.py validate --artifacts artifacts/sflow
      - name: Validate sFlow producer contracts
        if: matrix.architecture == 'amd64'
        env:
          BAZELISK_GITHUB_TOKEN: ""
        run: |
          options=(--jobs=2 --local_resources=cpu=2 --local_resources=memory=8000
            --platforms=@sonic_build_infra//platforms:x86_64_trixie
            --host_platform=@sonic_build_infra//platforms:x86_64_trixie)
          "$BAZEL" query 'kind(".*_test rule", @hsflowd//src/json:*)' > artifacts/sflow/owner-test-targets.txt
          mapfile -t original_tests < artifacts/sflow/owner-test-targets.txt
          test "${#original_tests[@]}" -eq 22
          targets=(@hsflowd//:package_test @sflowtool//:package_test @libpsample//:package_test "${original_tests[@]}")
          audit=()
          for option in "${options[@]}"; do audit+=("--bazel-arg=$option"); done
          python3 tools/bazel/ci/bazel_commands.py --bazel "$BAZEL" "${audit[@]}" \
            --output artifacts/sflow/owner-action-audit.json "${targets[@]}"
          "$BAZEL" test "${options[@]}" --test_output=errors \
            --build_event_json_file="$PWD/artifacts/sflow/owner-test-events.jsonl" "${targets[@]}"
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          for owner in ('hsflowd', 'sflowtool', 'libpsample'):
              owner_root = Path('bazel-testlogs/external') / (owner + '+')
              matches = list(owner_root.rglob('test.xml'))
              assert len(matches) == (23 if owner == 'hsflowd' else 1), (owner, matches)
              for xml in matches:
                  directory = Path('artifacts/sflow/tests') / owner / xml.parent.relative_to(owner_root)
                  directory.mkdir(parents=True, exist_ok=True)
                  for name in ('test.xml', 'test.log'):
                      shutil.copyfile(xml.with_name(name), directory / name)
          PY
      - name: Verify sFlow no-op, Python source edit and restored archives
        if: matrix.architecture == 'amd64'
        env:
          CI_HEAD_SHA: ${{ steps.checkout_identity.outputs.head_sha }}
          CI_BASE_SHA: ${{ steps.checkout_identity.outputs.base_sha }}
        run: python3 -B tools/bazel/ci/sflow_image.py incremental --bazel "$BAZEL" --artifacts artifacts/sflow
      - name: Review public sFlow evidence
        id: sflow_public
        if: always() && matrix.architecture == 'amd64' && (steps.sflow_build.outcome == 'success' || steps.sflow_build.outcome == 'failure')
        run: |
          python3 - <<'PYCODE'
          import json
          from pathlib import Path
          from tools.bazel.ci.public_artifacts import safe_json, dependency_json, bep_summary
          root = Path('artifacts/sflow')
          root.mkdir(parents=True, exist_ok=True)
          names = ('validation.json', 'action-audit.json', 'owner-action-audit.json', 'incremental.json', 'runtime-apt.json', 'debug-apt.json', 'sflow.packages.json', 'sflow-debug.packages.json', 'base.packages.json', 'config-engine.packages.json')
          for path in list(root.glob('*.validation.json')) + [root / name for name in names]:
              if path.exists():
                  safe_json(json.loads(path.read_text()))
          for name, kind in (('MODULE.bazel.lock', 'lock'), ('module-graph.json', 'graph')):
              path = root / name
              if path.exists():
                  dependency_json(json.loads(path.read_text()), kind)
          receipt = root / 'build-receipt.json'
          if receipt.exists():
              source = json.loads(receipt.read_text())
              public = {key: source[key] for key in ('status', 'revision', 'architecture', 'artifacts', 'tested_revision_parents') if key in source}
              safe_json(public)
              (root / 'public-receipt.json').write_text(json.dumps(public, indent=2) + '\n')
          summary = {str(path.relative_to(root)): bep_summary(path.read_text().splitlines(), partial=True)
                     for path in root.rglob('*events.json*')}
          safe_json(summary)
          (root / 'build-summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          PYCODE
      - name: Retain sFlow archives and source evidence
        if: always() && matrix.architecture == 'amd64' && steps.sflow_public.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sflow-source-amd64
          path: |
            artifacts/sflow/*.gz
            artifacts/sflow/*.tar
            artifacts/sflow/runtime-apt.json
            artifacts/sflow/debug-apt.json
            artifacts/sflow/sflow.packages.json
            artifacts/sflow/sflow-debug.packages.json
            artifacts/sflow/base.packages.json
            artifacts/sflow/config-engine.packages.json
            artifacts/sflow/sflow.status
            artifacts/sflow/sflow-debug.status
            artifacts/sflow/*.validation.json
            artifacts/sflow/validation.json
            artifacts/sflow/public-receipt.json
            artifacts/sflow/action-audit.json
            artifacts/sflow/owner-action-audit.json
            artifacts/sflow/build-summary.json
            artifacts/sflow/incremental.json
            artifacts/sflow/MODULE.bazel.lock
            artifacts/sflow/module-graph.json
            artifacts/sflow/tests/**/test.xml
            artifacts/sflow/tests/**/test.log
          if-no-files-found: error
          retention-days: 14
          compression-level: 1

  eventd_runtime:
    # Keep the required status on the job that actually loads and tests both archives.
    name: Container archive (AMD64)
    if: always() && (github.event_name != 'workflow_dispatch' || inputs.source_image == 'none')
    needs: archive
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require a successful archive build
        env:
          ARCHIVE_RESULT: ${{ needs.archive.result }}
        run: test "$ARCHIVE_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: eventd-image-amd64
          path: artifacts/eventd
      - name: Verify loaded archives and installed event publishing and database delivery
        run: python3 -B tools/bazel/ci/eventd_loaded.py --artifacts artifacts/eventd
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: eventd-runtime-amd64
          path: |
            artifacts/eventd/*.runtime.json
            artifacts/eventd/loaded-validation.json
          if-no-files-found: warn
          retention-days: 14

  swss_layer_runtime:
    name: Load and run the shared SWSS image (AMD64)
    needs: archive
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bind the tested checkout identity
        id: checkout_identity
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 -B tools/bazel/ci/checkout_identity.py \
            --expected-revision "$GITHUB_SHA" --event-name "$GITHUB_EVENT_NAME" \
            --head-sha "$EVENT_HEAD_SHA" --event-base-sha "$EVENT_BASE_SHA" \
            --github-output "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: swss-layer-amd64
          path: artifacts/swss-layer
      - name: Verify and load this run's archive
        run: |
          python3 - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          from tools.bazel.ci.validate_runtime import load_archive, verify_loaded_image
          root = Path('artifacts/swss-layer')
          receipt = json.loads((root / 'public-receipt.json').read_text())
          assert receipt['status'] == 'passed' and receipt['architecture'] == 'amd64'
          assert receipt['revision'] == subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          name = 'docker-swss-layer-trixie.gz'
          assert hashlib.sha256((root / name).read_bytes()).hexdigest() == receipt['artifacts'][name]['sha256']
          report = json.loads((root / 'validation.json').read_text())
          actual, config, _ = load_archive(root / name, report['archive']['tag'], report['config_digest'])
          verify_loaded_image(actual, config, report['config_digest'])
          assert actual['Architecture'] == report['architecture'] == 'amd64'
          assert actual['RootFS']['Layers'] == report['rootfs']['diff_ids']
          PY
      - name: Verify installed source hashes and complete loader closure
        run: |
          set -o pipefail
          docker run --rm --network=none --cap-drop=ALL --security-opt=no-new-privileges \
            --read-only --pids-limit=128 --memory=4g --cpus=2 \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=128m \
            --mount "type=bind,src=$PWD/tools/bazel/oci/swss_layer_runtime.py,dst=/probe/swss_layer_runtime.py,readonly" \
            --mount "type=bind,src=$PWD/tools/bazel/oci/runtime_smoke.py,dst=/probe/runtime_smoke.py,readonly" \
            --mount "type=bind,src=$PWD/artifacts/swss-layer/validation.json,dst=/probe/validation.json,readonly" \
            --entrypoint /usr/bin/python3 docker-swss-layer-trixie:latest \
            -B /probe/swss_layer_runtime.py /probe/validation.json | tee artifacts/swss-layer/runtime-smoke.json
      - name: Retain installed-image evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: swss-layer-runtime-amd64
          path: artifacts/swss-layer/runtime-smoke.json
          if-no-files-found: warn
          retention-days: 14

      - name: Preserve completed SWSS runtime evidence before sFlow acceptance
        run: |
          if [[ -d artifacts ]]; then
            umask 077
            preserved="$(mktemp -d "$RUNNER_TEMP/pre-sflow-runtime-artifacts.XXXXXXXX")"
            mv artifacts "$preserved/artifacts"
            printf 'Completed SWSS runtime evidence preserved at %s/artifacts\n' "$preserved"
          fi

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sflow-source-amd64
          path: artifacts/sflow
      - name: Exercise installed sFlow manager, mapper and exporter variants
        env:
          CI_HEAD_SHA: ${{ steps.checkout_identity.outputs.head_sha }}
          CI_BASE_SHA: ${{ steps.checkout_identity.outputs.base_sha }}
        run: python3 -B tools/bazel/ci/sflow_loaded.py --artifacts artifacts/sflow
      - name: Retain installed sFlow evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sflow-runtime-amd64
          path: artifacts/sflow/*.runtime.json
          if-no-files-found: error
          retention-days: 14

  sysmgr_runtime:
    name: Load and run Sysmgr images (AMD64)
    needs: archive
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bind the tested checkout identity
        id: checkout_identity
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 -B tools/bazel/ci/checkout_identity.py \
            --expected-revision "$GITHUB_SHA" --event-name "$GITHUB_EVENT_NAME" \
            --head-sha "$EVENT_HEAD_SHA" --event-base-sha "$EVENT_BASE_SHA" \
            --github-output "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sysmgr-images-amd64-${{ github.sha }}
          path: artifacts/sysmgr
      - name: Check installed Sysmgr startup and private Redis-to-D-Bus notifications
        env:
          CI_HEAD_SHA: ${{ steps.checkout_identity.outputs.head_sha }}
          CI_BASE_SHA: ${{ steps.checkout_identity.outputs.base_sha }}
        run: python3 -B tools/bazel/ci/sysmgr_loaded.py --artifacts artifacts/sysmgr
      - name: Retain installed Sysmgr evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sysmgr-installed-amd64-${{ github.sha }}
          path: artifacts/sysmgr/*.runtime.json
          if-no-files-found: error
          retention-days: 14



  checks:
    if: github.event_name != 'workflow_dispatch' || inputs.source_image == 'none'
    name: OCI regression checks (AMD64)
    runs-on: ubuntu-24.04
    outputs:
      p4_sources_artifact_id: ${{ steps.p4_sources_upload.outputs.artifact-id }}
    # No SWSS/Syncd package compilation: those checks reuse the full Make build.
    timeout-minutes: 60
    container:
      image: debian:trixie-20260918@sha256:9cc080028c43b27d2074d63a5f9caf7166d731494965616c1a6d2827a004585c
      # Reap any Bazel processes used for dependency resolution.
      options: --init
    env:
      # Draft catalog for root-module resolution; the full Make VS job is separate.
      BAZEL: ${{ github.workspace }}/tools/bazel/ci/libteam_draft_bazel.sh
    defaults:
      run:
        shell: bash
    steps:
      - name: Install execution tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            autoconf automake binutils binutils-gold build-essential busybox ca-certificates curl \
            gdb git j2cli jq libtool libxml2 make pigz pkg-config python3 python3-jinja2 python3-yaml redis-server squashfs-tools tar unzip zstd

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check generated dependency state
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test ! -e MODULE.bazel.lock
          test -z "$(git ls-files -- MODULE.bazel.lock)"
          git check-ignore MODULE.bazel.lock

      - name: Check hosted storage
        run: df -h "$GITHUB_WORKSPACE" "$HOME"

      - name: Initialize Sysmgr's pinned gNOI source
        run: git -c safe.directory="$GITHUB_WORKSPACE" submodule update --init -- src/sonic-sysmgr/gnoi
      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-version: 1.29.0
          bazelisk-cache: true
          repository-cache: true
          # This job resolves/downloads dependencies but executes no Bazel builds.
          disk-cache: false
          cache-version: "8.5.1"
      - name: Preserve setup-bazel caches for source checks
        run: python3 tools/bazel/ci/preserve_setup_bazel_cache.py --repository-only

      - name: Configure shared source download mirrors
        run: |
          python3 -B tools/bazel/ci/source_mirrors.py \
            --output "$RUNNER_TEMP/sonic-source-mirrors.cfg"
          # common.bazelrc imports this ignored file, including through Draft wrappers.
          printf 'common --downloader_config=%s\n' "$RUNNER_TEMP/sonic-source-mirrors.cfg" >> .bazelrc.user

      - name: Check Make handoff and archive validation
        run: |
          python3 -B -m unittest discover -s tools/bazel/tests -p '*_test.py'
          python3 -B -m unittest discover -s tools/ci/tests -p '*_test.py'
          python3 -B -m unittest discover -s tools/ci/runner -p '*_test.py'
          python3 -B tools/bazel/ci/configure_runner_cache_test.py
          PYTHONPATH=tools/bazel/registry python3 -B -m unittest discover -s tools/bazel/equivalence_checker -p '*_test.py'
          PYTHONPATH=tools/bazel/registry python3 -B tools/bazel/registry/registry_lib_test.py

      - name: Retain the verified GitLab source downloads
        id: repository_inputs
        run: |
          mkdir -p artifacts/repository-inputs
          test "$("$BAZEL" --version)" = "bazel $(cat .bazelversion)"
          "$BAZEL" fetch --repo=@@ape+ --repo=@@download_utils+ \
            --repo=@@rules_coreutils+ --repo=@@rules_gzip+ --repo=@@toolchain_utils+
          python3 - <<'PYCODE'
          from pathlib import Path
          from tools.bazel.ci import resolution
          import os
          resolution.collect(Path.cwd(), Path("artifacts/repository-inputs"), bazel=[os.environ["BAZEL"]])
          PYCODE
          python3 -B tools/bazel/gzip/source_archive.py \
            --repository-cache "$("$BAZEL" info repository_cache)" \
            --module-graph artifacts/repository-inputs/module-graph.json \
            --output artifacts/repository-inputs \
            > artifacts/repository-inputs/receipt.json

      - name: Prepare repository graph failure receipt
        id: repository_graph_failure
        if: always() && steps.repository_inputs.outcome == 'failure'
        run: |
          python3 - <<'PYDIAG'
          import os
          from pathlib import Path
          from tools.bazel.ci.public_artifacts import load_json, receipt_summary
          failure = Path('artifacts/repository-inputs/module-graph-failure.json')
          if failure.is_symlink() or (failure.exists() and not failure.is_file()):
              raise ValueError('Unsafe graph failure receipt')
          if failure.exists():
              if failure.stat().st_size > 4096:
                  raise ValueError('Oversized graph failure receipt')
              receipt_summary(load_json(failure.read_bytes()), 'resolution')
              with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
                  output.write('present=true\n')
          PYDIAG

      - name: Retain repository graph failure receipt
        if: always() && steps.repository_graph_failure.outcome == 'success' && steps.repository_graph_failure.outputs.present == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repository-graph-failure-amd64
          path: artifacts/repository-inputs/module-graph-failure.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 1

      - name: Retain the native Redis test helper for installed-image checks
        run: |
          mkdir -p artifacts/repository-inputs/test-helpers
          cp /usr/bin/redis-server artifacts/repository-inputs/test-helpers/redis-server
          cp /usr/share/doc/redis-server/copyright artifacts/repository-inputs/test-helpers/redis-copyright
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess
          root = pathlib.Path("artifacts/repository-inputs/test-helpers")
          binary = root / "redis-server"
          receipt = {
              "_generated": {"notice": "AUTO-GENERATED. DO NOT EDIT MANUALLY.",
                             "generator": ".github/workflows/bazel-oci.yml"},
              "purpose": "Isolated test helper; not installed in the Syncd image",
              "architecture": subprocess.check_output(["dpkg", "--print-architecture"], text=True).strip(),
              "package_version": subprocess.check_output(["dpkg-query", "-W", "-f=${Version}", "redis-server"], text=True),
              "sha256": hashlib.sha256(binary.read_bytes()).hexdigest(),
              "version": subprocess.check_output([str(binary.resolve()), "--version"], text=True).strip(),
          }
          assert receipt["architecture"] == "amd64"
          (root / "redis.json").write_text(json.dumps(receipt, indent=2) + "\n")
          PY

      - name: Upload the source downloads for the VS job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bazel-repository-inputs
          path: |
            artifacts/repository-inputs/ape-1.0.1/src.tar.gz
            artifacts/repository-inputs/download_utils-1.0.1/src.tar.gz
            artifacts/repository-inputs/rules_coreutils-1.0.1/src.tar.gz
            artifacts/repository-inputs/rules_gzip-1.0.0/src.tar.gz
            artifacts/repository-inputs/toolchain_utils-1.0.2/src.tar.gz
            artifacts/repository-inputs/receipt.json
            artifacts/repository-inputs/test-helpers/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Fetch pinned P4 source inputs for the native worker
        id: p4_sources_fetch
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
          (github.event_name == 'pull_request' &&
           github.event.pull_request.head.repo.full_name == github.repository) ||
          (github.event_name == 'workflow_dispatch' && !inputs.skip_vs)
        run: |
          python3 -B tools/ci/p4_source_inputs.py --fetch \
            --manifest src/p4lang/source-inputs.json \
            --directory artifacts/p4-source-inputs/sources \
            --receipt artifacts/p4-source-inputs/receipt.json
          echo 'P4 source-byte pins verified. The unchanged upstream P4C descriptor has a known checksum discrepancy; receipt.json records its declared and published hashes separately.' >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve P4 source inputs and verification receipt
        id: p4_sources_upload
        if: always() && (steps.p4_sources_fetch.outcome == 'success' || steps.p4_sources_fetch.outcome == 'failure')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: p4-source-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/p4-source-inputs/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Report validation scope
        run: |
          echo 'Hosted checks cover regressions and dependency resolution; the VS installer uses host-driven Make on the dedicated VS agent.' >> "$GITHUB_STEP_SUMMARY"

  vs:
    name: Make VS with Bazel SWSS (AMD64)
    needs: [checks]
    # Replaced by vs_container below. Keep the legacy recipe available while
    # transitioning, but do not schedule another host-driven Make VS build.
    if: ${{ false }}
    # Use the ONIE pool; checkout still uses this event's ref and SHA.
    runs-on:
      - self-hosted
      - linux
      - x64
      - sonic-vs-bin
    timeout-minutes: 720
    env:
      SONIC_CI_CONTAINER_LABEL: io.sonic-buildimage.ci-job=${{ github.repository }}:${{ github.run_id }}:${{ github.run_attempt }}:vs
      # Use Docker Hub's canonical references with the existing pinned digests.
      DEFAULT_CONTAINER_REGISTRY: ""
      MIRROR_URLS: https://deb.debian.org/debian/
      MIRROR_SECURITY_URLS: https://deb.debian.org/debian-security/
      SONIC_CONFIG_USE_DOCKER_CACHE: "y"
      # Keep build results outside run-specific checkouts and disposable builders.
      SONIC_BAZEL_CACHE_SOURCE: /data/sonic-runner/cache/sonic-buildimage/bazel
      SONIC_DPKG_CACHE_SOURCE: /data/sonic-runner/cache/sonic-buildimage/packages
      SONIC_DPKG_CACHE_METHOD: rwcache
      BAZEL_CONTAINER_ARGS: >-
        --distdir=/bazel_cache/distdir/ape-1.0.1
        --distdir=/bazel_cache/distdir/download_utils-1.0.1
        --distdir=/bazel_cache/distdir/rules_coreutils-1.0.1
        --distdir=/bazel_cache/distdir/rules_gzip-1.0.0
        --distdir=/bazel_cache/distdir/toolchain_utils-1.0.2
        --remote_upload_local_results=${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    defaults:
      run:
        shell: bash
        working-directory: vs-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check source-build runner capacity
        working-directory: ${{ github.workspace }}
        run: |
          docker info > /dev/null
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          workspace = Path.cwd().resolve()
          usage = shutil.disk_usage(workspace)
          free_gib = usage.free / 1024**3
          print(f'Workspace: {workspace}; available: {free_gib:.1f} GiB; '
                f'total: {usage.total / 1024**3:.1f} GiB', flush=True)
          if usage.free < 100 * 1024**3:
              raise SystemExit(f'The full Make VS build needs at least 100 GiB free; '
                               f'{workspace} has {free_gib:.1f} GiB available')
          PY

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # An interrupted submodule clone can leave an invalid HEAD that the
          # checkout action's superproject clean/reset cannot repair.
          path: vs-${{ github.run_id }}-${{ github.run_attempt }}
          persist-credentials: false
          submodules: recursive
      - name: Bind the tested checkout identity
        id: checkout_identity
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 -B tools/bazel/ci/checkout_identity.py \
            --expected-revision "$GITHUB_SHA" --event-name "$GITHUB_EVENT_NAME" \
            --head-sha "$EVENT_HEAD_SHA" --event-base-sha "$EVENT_BASE_SHA" \
            --github-output "$GITHUB_OUTPUT"

      - name: Check VS build prerequisites
        run: python3 -B tools/ci/runner/preflight.py --workspace "$PWD" --build-target sonic-vs.bin

      - name: Prepare persistent agent caches
        run: |
          # Keep ordinary Make writers separate from older root-created cache entries.
          SONIC_BAZEL_CACHE_SOURCE="$SONIC_BAZEL_CACHE_SOURCE/make-uid-$(id -u)"
          install -d -m 0700 "$SONIC_BAZEL_CACHE_SOURCE" "$SONIC_DPKG_CACHE_SOURCE"
          test -w "$SONIC_BAZEL_CACHE_SOURCE"
          test -w "$SONIC_DPKG_CACHE_SOURCE"
          # A writable cache root does not prove old digest directories are writable.
          # Check directories only: cached content files may intentionally be read-only.
          for cache in repository_cache disk_cache kernel-linux-sandbox/repository_cache kernel-linux-sandbox/disk_cache; do
            cache_path="$SONIC_BAZEL_CACHE_SOURCE/$cache"
            if test -d "$cache_path"; then
              blocked=$(find "$cache_path" -type d ! -writable -print -quit)
              if test -n "$blocked"; then
                stat -c 'Unwritable Bazel cache directory: %n (uid=%u gid=%g mode=%a)' "$blocked" >&2
                echo 'Repair this cache directory for the runner user before rebuilding; preserve cached content.' >&2
                exit 1
              fi
            fi
          done
          printf 'SONIC_BAZEL_CACHE_SOURCE=%s\n' "$SONIC_BAZEL_CACHE_SOURCE" >> "$GITHUB_ENV"
          printf 'Bazel cache: %s\nMake package cache: %s (%s)\n' \
            "$SONIC_BAZEL_CACHE_SOURCE" "$SONIC_DPKG_CACHE_SOURCE" "$SONIC_DPKG_CACHE_METHOD"

      - name: Download verified sources from the regression checks
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bazel-repository-inputs
          path: vs-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/vs/repository-inputs

      - name: Prepare the shared Bazel source-download directory
        run: |
          python3 -B tools/bazel/gzip/source_archive.py \
            --archives-dir artifacts/vs/repository-inputs \
            --output "$SONIC_BAZEL_CACHE_SOURCE/distdir" \
            > artifacts/vs/source-download-receipt.json

      - name: Configure the native VS image
        run: |
          mkdir -p artifacts/vs
          make init 2>&1 | tee artifacts/vs/init.log
          make configure PLATFORM=vs PLATFORM_ARCH=amd64 \
            SONIC_BUILDER_EXTRA_CMDLINE="--label $SONIC_CI_CONTAINER_LABEL -e BAZEL=$BAZEL" \
            2>&1 | tee artifacts/vs/configure.log

      - name: Check nested Docker in both build environments
        timeout-minutes: 10
        run: |
          set -o pipefail
          for build_env in bookworm trixie; do
            make -f Makefile.work BLDENV="$build_env" docker-start \
              SONIC_BUILDER_EXTRA_CMDLINE="--label $SONIC_CI_CONTAINER_LABEL -e BAZEL=$BAZEL" \
              2>&1 | tee "artifacts/vs/docker-start-$build_env.log"
          done

      - name: Check native kernel sandbox in Trixie
        timeout-minutes: 5
        run: |
          set -o pipefail
          make -f Makefile.work BLDENV=trixie sonic-slave-run \
            SONIC_BUILDER_EXTRA_CMDLINE="--label $SONIC_CI_CONTAINER_LABEL -e BAZEL=$BAZEL" \
            SONIC_RUN_CMDS='python3 -B tools/bazel/ci/check_kernel_sandbox.py' \
            2>&1 | tee artifacts/vs/kernel-sandbox.log

      - name: Build the VS installer (.bin)
        id: vs_build
        run: |
          set -o pipefail
          bash tools/bazel/ci/build_vs.sh 2>&1 | tee artifacts/vs/build.log

      - name: Validate VS container pairs and P4 debug symbols
        id: vs_validation
        run: |
          set -o pipefail
          bash tools/bazel/ci/validate_vs.sh 2>&1 | tee artifacts/vs/validation.log

      - name: Verify installed base, SWSS and Syncd images
        timeout-minutes: 20
        run: |
          # Make clears DOCKER_ROOT on entry; preserve the completed build's store.
          make -f Makefile.work BLDENV=trixie sonic-slave-run \
            DOCKER_ROOT="$PWD/fsroot.docker.verify-images" \
            SONIC_CONFIG_USE_NATIVE_DOCKERD_FOR_BUILD=n \
            SONIC_BUILDER_EXTRA_CMDLINE="--label $SONIC_CI_CONTAINER_LABEL --cgroupns=private" \
            SONIC_RUN_CMDS="sudo python3 -B tools/bazel/ci/prepare_nested_docker.py && \
              make -f slave.mk docker-start SONIC_CONFIG_USE_NATIVE_DOCKERD_FOR_BUILD=n && \
              python3 -B tools/bazel/ci/validate_runtime.py \
                --images-policy artifacts/vs/swss-installed-images-policy.json \
                --images-policy artifacts/vs/syncd-installed-images-policy.json --target target \
                --output artifacts/vs/installed-images.json" \
            2>&1 | tee artifacts/vs/installed-images.log

      - name: Retain VS runtime and debug archive reuse evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonic-vs-orchagent-reuse-amd64
          path: |
            vs-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/vs/orchagent-reuse.json
            vs-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/vs/runtime-debug-pairs.json
            vs-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/vs/runtime-debug-pairs-timing.json
            vs-${{ github.run_id }}-${{ github.run_attempt }}/target/sonic-vs.bin.dockers
          if-no-files-found: error
          retention-days: 14

      - name: Validate SWSS source packages from the Make build
        id: swss_validation
        if: ${{ !cancelled() && steps.vs_build.outcome == 'success' }}
        run: |
          cat > artifacts/vs/check-swss-source.sh <<'SH'
          set -euo pipefail
          option_lines=$(python3 tools/bazel/build_helpers.py options \
            --cache-directory="${BAZEL_CONTAINER_CACHE_DIR-${BAZEL_SWSS_CACHE_DIR:-}}" \
            --arguments="${BAZEL_CONTAINER_ARGS-${BAZEL_SWSS_ARGS:-}}")
          ci_options=()
          if test -n "$option_lines"; then
            while IFS= read -r option; do ci_options+=("--bazel-arg=$option"); done <<< "$option_lines"
          fi
          python3 -B tools/bazel/ci/container.py --reuse-build \
            --container //dockers/docker-orchagent --source-file rules/docker-orchagent.mk \
            --bazel "$BAZEL" --artifacts artifacts/swss \
            --bazel-arg=--platforms=@sonic_build_infra//platforms:x86_64_trixie \
            --bazel-arg=--host_platform=@sonic_build_infra//platforms:x86_64_trixie \
            "${ci_options[@]}"
          SH
          make -f Makefile.work BLDENV=trixie sonic-slave-run \
            DOCKER_ROOT="$PWD/target/docker-source-validation" \
            SONIC_BUILDER_EXTRA_CMDLINE="--label $SONIC_CI_CONTAINER_LABEL -e BAZEL=$BAZEL -e BAZEL_CONTAINER_ARGS" \
            SONIC_RUN_CMDS="bash artifacts/vs/check-swss-source.sh" \
            2>&1 | tee artifacts/vs/swss-source-validation.log

      - name: Prepare SWSS source artifact list
        id: swss_artifacts
        if: always()
        env:
          CI_JOB_STATUS: ${{ steps.swss_validation.outcome == 'success' && 'success' || 'failure' }}
          CI_HEAD_SHA: ${{ steps.checkout_identity.outputs.head_sha }}
          CI_BASE_SHA: ${{ steps.checkout_identity.outputs.base_sha }}
        run: |
          python3 -B tools/bazel/ci/public_artifacts.py source \
            --workspace "$PWD" --upload-root "$GITHUB_WORKSPACE" \
            --job-status "$CI_JOB_STATUS" --revision "$(git rev-parse HEAD)" \
            --architecture "amd64" \
            --head-sha "$CI_HEAD_SHA" --base-sha "$CI_BASE_SHA" \
            --github-output "$GITHUB_OUTPUT"

      - name: Upload public source layers and evidence
        if: always() && steps.swss_artifacts.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: swss-source-layers-amd64
          path: ${{ steps.swss_artifacts.outputs.paths }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 1

      - name: Validate Syncd source packages from the Make build
        id: syncd_validation
        if: ${{ !cancelled() && steps.vs_build.outcome == 'success' }}
        run: |
          mkdir -p artifacts/syncd-vs
          git rev-parse HEAD > artifacts/syncd-vs/revision.txt
          cat > artifacts/vs/check-syncd-source.sh <<'SH'
          set -euo pipefail
          option_lines=$(python3 tools/bazel/build_helpers.py options \
            --cache-directory="${BAZEL_CONTAINER_CACHE_DIR-${BAZEL_SWSS_CACHE_DIR:-}}" \
            --arguments="${BAZEL_CONTAINER_ARGS-${BAZEL_SWSS_ARGS:-}}")
          ci_options=()
          if test -n "$option_lines"; then
            while IFS= read -r option; do ci_options+=("--bazel-arg=$option"); done <<< "$option_lines"
          fi
          python3 -B tools/bazel/ci/container.py --reuse-build \
            --container //platform/vs/docker-syncd-vs --source-file platform/vs/docker-syncd-vs.mk \
            --bazel "$BAZEL" --artifacts artifacts/syncd-vs/bazel \
            --bazel-arg=--platforms=@sonic_build_infra//platforms:x86_64_trixie \
            --bazel-arg=--host_platform=@sonic_build_infra//platforms:x86_64_trixie \
            --bazel-arg=--config=syncd-dash "${ci_options[@]}"
          python3 -B tools/bazel/ci/bazel_commands.py \
            --bazel "$BAZEL" --bazel-arg=--config=syncd-dash "${ci_options[@]}" \
            --output artifacts/syncd-vs/p4-image-test-analysis.json \
            //tools/bazel/tests:syncd_p4_images_test
          SH
          make -f Makefile.work BLDENV=trixie sonic-slave-run \
            DOCKER_ROOT="$PWD/target/docker-source-validation" \
            SONIC_BUILDER_EXTRA_CMDLINE="--label $SONIC_CI_CONTAINER_LABEL -e BAZEL=$BAZEL -e BAZEL_CONTAINER_ARGS" \
            SONIC_RUN_CMDS="bash artifacts/vs/check-syncd-source.sh" \
            2>&1 | tee artifacts/vs/syncd-source-validation.log
          sha256sum artifacts/syncd-vs/bazel/apt.lock.json \
            platform/vs/docker-syncd-vs/BUILD.bazel > artifacts/syncd-vs/input-locks.sha256

      - name: Prepare Syncd source artifact list
        id: syncd_artifacts
        if: always()
        env:
          CI_JOB_STATUS: ${{ steps.syncd_validation.outcome == 'success' && 'success' || 'failure' }}
          CI_HEAD_SHA: ${{ steps.checkout_identity.outputs.head_sha }}
          CI_BASE_SHA: ${{ steps.checkout_identity.outputs.base_sha }}
        run: |
          python3 -B tools/bazel/ci/public_artifacts.py syncd \
            --workspace "$PWD" --upload-root "$GITHUB_WORKSPACE" \
            --job-status "$CI_JOB_STATUS" --revision "$(git rev-parse HEAD)" \
            --architecture "amd64" \
            --head-sha "$CI_HEAD_SHA" --base-sha "$CI_BASE_SHA" \
            --github-output "$GITHUB_OUTPUT"

      - name: Upload public contract evidence
        if: always() && steps.syncd_artifacts.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: syncd-vs-oci-contracts-amd64
          path: ${{ steps.syncd_artifacts.outputs.paths }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 1


      - name: Remove this job's remaining build containers
        if: always()
        timeout-minutes: 2
        working-directory: ${{ github.workspace }}
        env:
          VS_CHECKOUT: vs-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          # Killing a docker client does not stop its daemon-owned container.
          # Match this repository/run/attempt only; keep the bind-mounted logs.
          containers=$(docker ps --all --quiet --filter "label=$SONIC_CI_CONTAINER_LABEL")
          if test -n "$containers"; then
            readarray -t container_ids <<< "$containers"
            mkdir -p "$VS_CHECKOUT/artifacts/vs"
            for container_id in "${container_ids[@]}"; do
              docker logs "$container_id" > "$VS_CHECKOUT/artifacts/vs/container-$container_id.log" 2>&1 || true
            done
            if ! docker rm --force "${container_ids[@]}"; then
              # --rm containers can disappear between listing and removal.
              remaining=$(docker ps --all --quiet --filter "label=$SONIC_CI_CONTAINER_LABEL")
              test -z "$remaining"
            fi
          fi

      - name: Prepare public artifact list
        id: public_artifacts
        if: always()
        env:
          CI_JOB_STATUS: ${{ job.status }}
          CI_HEAD_SHA: ${{ steps.checkout_identity.outputs.head_sha }}
          CI_BASE_SHA: ${{ steps.checkout_identity.outputs.base_sha }}
        run: |
          python3 -B tools/bazel/ci/public_artifacts.py vs \
            --workspace "$PWD" --upload-root "$GITHUB_WORKSPACE" \
            --job-status "$CI_JOB_STATUS" --revision "$(git rev-parse HEAD)" \
            --architecture "amd64" \
            --head-sha "$CI_HEAD_SHA" --base-sha "$CI_BASE_SHA" \
            --github-output "$GITHUB_OUTPUT"

      - name: Upload public VS build summary
        if: always() && steps.public_artifacts.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonic-vs-build-diagnostics-amd64
          path: ${{ steps.public_artifacts.outputs.paths }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 1

      - name: Retain shared image validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonic-vs-image-validation-amd64
          path: |
            vs-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/vs/swss-images/
            vs-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/vs/syncd-p4-images/
            vs-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/vs/*-installed-images-policy.json
            vs-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/vs/installed-images.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload VS image and OCI container archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonic-vs-make-bazel-swss-amd64
          path: |
            vs-${{ github.run_id }}-${{ github.run_attempt }}/target/sonic-vs.bin
            vs-${{ github.run_id }}-${{ github.run_attempt }}/target/docker-orchagent.gz
            vs-${{ github.run_id }}-${{ github.run_attempt }}/target/docker-orchagent-dbg.gz
            vs-${{ github.run_id }}-${{ github.run_attempt }}/target/docker-syncd-vs.gz
            vs-${{ github.run_id }}-${{ github.run_attempt }}/target/docker-syncd-vs-dbg.gz
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  vs_container:
    name: VS installer in SONiC slave (AMD64)
    needs: [checks]
    if: >-
      (github.event_name != 'workflow_dispatch' || inputs.source_image == 'none') &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && !inputs.skip_vs))
    runs-on: [self-hosted, linux, bazel-x64, vs]
    timeout-minutes: 720
    defaults:
      run:
        shell: bash
        working-directory: vs-${{ github.run_id }}-${{ github.run_attempt }}
    env:
      SONIC_CI_CONTAINER_LABEL: io.sonic-buildimage.ci-job=${{ github.repository }}:${{ github.run_id }}:${{ github.run_attempt }}:vs
      BAZEL: bazel
      # Use the explicitly selected gRPC service, not the legacy HTTPS override.
      BAZEL_REMOTE_AUTH: ""
      SONIC_BAZEL_KERNEL_REMOTE_CACHE: grpc://172.16.0.4:9092
      SONIC_BAZEL_KERNEL_REMOTE_UPLOAD: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && 'y' || 'n' }}
      SONIC_CONFIG_USE_DOCKER_CACHE: "y"
      SONIC_DPKG_CACHE_METHOD: rwcache
      ENABLE_DOCKER_BASE_PULL: "y"
      REGISTRY_SERVER: sonicdev-microsoft.azurecr.io
      ACR_REGISTRY_NAME: sonicdev
      AZURE_SUBSCRIPTION_ID: ${{ vars.ACR_SUBSCRIPTION_ID }}
      REGISTRY_PORT: "443"
      INCLUDE_FIPS: "y"
      SONIC_VERSION_CONTROL_COMPONENTS: py2,py3,web,git,docker
      MIRROR_SNAPSHOT: "y"
      SONIC_BUILD_SLAVE_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
      SONIC_BUILD_VARS: P4LANG_SOURCE_BASE_URL=file:/sonic/artifacts/vs/p4-source-inputs/sources
      PREFER_DEBIAN_REPO: "y"
      BAZEL_CONTAINER_ARGS: >-
        --jobs=4 --local_resources=memory=12288
        --remote_cache=grpc://172.16.0.4:9092
        --experimental_remote_downloader=grpc://172.16.0.4:9092
        --experimental_remote_downloader_local_fallback
        --distdir=/bazel_cache/distdir/ape-1.0.1
        --distdir=/bazel_cache/distdir/download_utils-1.0.1
        --distdir=/bazel_cache/distdir/rules_coreutils-1.0.1
        --distdir=/bazel_cache/distdir/rules_gzip-1.0.0
        --distdir=/bazel_cache/distdir/toolchain_utils-1.0.2
        --remote_upload_local_results=${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    steps:
      - name: Checkout repository and pinned submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: vs-${{ github.run_id }}-${{ github.run_attempt }}
          persist-credentials: false
          submodules: recursive

      - name: Download verified source archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bazel-repository-inputs
          path: vs-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/vs/repository-inputs

      - name: Initialize private Docker configuration
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/docker-config-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          set -euo pipefail
          install -d -m 0700 "$DOCKER_CONFIG"
          printf 'DOCKER_CONFIG=%s\n' "$DOCKER_CONFIG" >> "$GITHUB_ENV"

      - name: Reclaim unused images and build cache
        run: |
          set -euo pipefail
          docker system df
          docker image prune --all --force
          docker builder prune --all --force
          docker system df

      - name: Reclaim local Bazel caches
        run: python3 -B -m tools.bazel.ci.cleanup_runner_bazel_cache --runner-workspace "${{ runner.workspace }}"

      - name: Check host-agent build prerequisites
        run: python3 -B tools/ci/runner/preflight.py --host-agent --workspace "$PWD" --build-target sonic-vs.bin

      - name: Require the P4 source artifact from this producer job
        env:
          P4_SOURCES_ARTIFACT_ID: ${{ needs.checks.outputs.p4_sources_artifact_id }}
        run: '[[ "$P4_SOURCES_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]'

      - name: Download the pinned P4 source inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.checks.outputs.p4_sources_artifact_id }}
          merge-multiple: true
          path: vs-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/vs/p4-source-inputs

      - name: Verify P4 source bytes before native Make
        run: |
          python3 -B tools/ci/p4_source_inputs.py \
            --manifest src/p4lang/source-inputs.json \
            --directory artifacts/vs/p4-source-inputs/sources \
            --receipt artifacts/vs/p4-source-inputs-verified.json

      - name: Configure persistent caches
        env:
          SONIC_BAZEL_CACHE_SOURCE: ${{ runner.workspace }}/vs-cache/bazel
          SONIC_DPKG_CACHE_SOURCE: ${{ runner.workspace }}/vs-cache/packages
        run: |
          set -euo pipefail
          install -d -m 0700 "$SONIC_BAZEL_CACHE_SOURCE" "$SONIC_DPKG_CACHE_SOURCE"
          test -w "$SONIC_BAZEL_CACHE_SOURCE"
          test -w "$SONIC_DPKG_CACHE_SOURCE"
          for cache in repository_cache disk_cache; do
            directory="$SONIC_BAZEL_CACHE_SOURCE/$cache"
            if test -d "$directory"; then
              blocked=$(find "$directory" -type d ! -writable -print -quit)
              if test -n "$blocked"; then
                printf 'Unwritable cache directory: %s\n' "$blocked" >&2
                exit 1
              fi
            fi
          done
          python3 -B tools/bazel/gzip/source_archive.py \
            --archives-dir artifacts/vs/repository-inputs \
            --output "$SONIC_BAZEL_CACHE_SOURCE/distdir" > artifacts/vs/source-download-receipt.json
          printf 'SONIC_BAZEL_CACHE_SOURCE=%s\nSONIC_DPKG_CACHE_SOURCE=%s\n' \
            "$SONIC_BAZEL_CACHE_SOURCE" "$SONIC_DPKG_CACHE_SOURCE" >> "$GITHUB_ENV"

      - name: Authenticate to the slave image registry
        env:
          AZURE_CONFIG_DIR: ${{ runner.temp }}/vs-azure-cli
        run: bash tools/ci/runner/azure_acr_login.sh "${ACR_REGISTRY_NAME:?}"

      - name: Prepare the host-driven SONiC slave
        run: |
          set -euo pipefail
          make init 2>&1 | tee artifacts/vs/init.log
          make configure PLATFORM=vs PLATFORM_ARCH=amd64 \
            SONIC_BUILDER_EXTRA_CMDLINE="--label $SONIC_CI_CONTAINER_LABEL" \
            2>&1 | tee artifacts/vs/configure.log
          for build_env in bookworm trixie; do
            make -f Makefile.work BLDENV="$build_env" docker-start \
              SONIC_BUILDER_EXTRA_CMDLINE="--label $SONIC_CI_CONTAINER_LABEL" \
              2>&1 | tee "artifacts/vs/docker-start-$build_env.log"
          done
          make -f Makefile.work BLDENV=trixie sonic-slave-run \
            SONIC_BUILDER_EXTRA_CMDLINE="--label $SONIC_CI_CONTAINER_LABEL" \
            SONIC_RUN_CMDS='python3 -B tools/bazel/ci/check_kernel_sandbox.py' \
            2>&1 | tee artifacts/vs/kernel-sandbox.log

      - name: Build sonic-vs.bin through the host Make wrapper
        id: native_build
        run: |
          set -euo pipefail
          bash tools/bazel/ci/build_vs.sh 2>&1 | tee artifacts/vs/build.log
          test -s target/sonic-vs.bin
          test -s target/sonic-vs.bin.dockers
          test "$(git rev-parse HEAD)" = "$(cat artifacts/vs/build-revision.txt)"

      - name: Validate the installer and retained container pairs
        run: |
          set -euo pipefail
          python3 -B scripts/validate_sonic_version.py target/sonic-vs.bin \
            --installer --secure-upgrade-mode no_sign \
            --expected-commit-id "$(git rev-parse --short HEAD)" \
            --json-output artifacts/vs/sonic-version.json
          bash tools/bazel/ci/validate_vs.sh 2>&1 | tee artifacts/vs/validation.log
          sha256sum target/sonic-vs.bin target/docker-orchagent{,-dbg}.gz \
            target/docker-syncd-vs{,-dbg}.gz > artifacts/vs/outputs.sha256

      - name: Verify installed base, SWSS and Syncd images
        timeout-minutes: 20
        run: |
          set -euo pipefail
          cat > artifacts/vs/verify-installed-images.sh <<'SH'
          set -euo pipefail
          sudo python3 -B tools/bazel/ci/prepare_nested_docker.py
          make -f slave.mk docker-start SONIC_CONFIG_USE_NATIVE_DOCKERD_FOR_BUILD=n
          python3 -B tools/bazel/ci/validate_runtime.py \
            --images-policy artifacts/vs/swss-installed-images-policy.json \
            --images-policy artifacts/vs/syncd-installed-images-policy.json --target target \
            --output artifacts/vs/installed-images.json \
            2>&1 | tee artifacts/vs/installed-images.log
          # The SWSS linker permits indirect shared-library symbols. Resolve
          # every relocation in the installed image, including Common's libnl symbols.
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --env LD_BIND_NOW=1 --entrypoint /usr/bin/ldd \
            docker-orchagent:latest -r /usr/bin/tlm_teamd 2>&1 | tee artifacts/vs/tlm-teamd-linkage.txt
          if grep -Eq 'not found|undefined symbol|symbol lookup error' artifacts/vs/tlm-teamd-linkage.txt; then
            exit 1
          fi
          SH
          make -f Makefile.work BLDENV=trixie sonic-slave-run \
            DOCKER_ROOT="$PWD/fsroot.docker.verify-images" \
            SONIC_CONFIG_USE_NATIVE_DOCKERD_FOR_BUILD=n \
            SONIC_BUILDER_EXTRA_CMDLINE="--label $SONIC_CI_CONTAINER_LABEL --cgroupns=private" \
            SONIC_RUN_CMDS='bash artifacts/vs/verify-installed-images.sh'

      - name: Publish the installer and matching container archives
        id: vs_installer_upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonic-vs-slave-amd64
          path: |
            vs-${{ github.run_id }}-${{ github.run_attempt }}/target/sonic-vs.bin
            vs-${{ github.run_id }}-${{ github.run_attempt }}/target/sonic-vs.bin.dockers
            vs-${{ github.run_id }}-${{ github.run_attempt }}/target/docker-orchagent.gz
            vs-${{ github.run_id }}-${{ github.run_attempt }}/target/docker-orchagent-dbg.gz
            vs-${{ github.run_id }}-${{ github.run_attempt }}/target/docker-syncd-vs.gz
            vs-${{ github.run_id }}-${{ github.run_attempt }}/target/docker-syncd-vs-dbg.gz
            vs-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/vs/outputs.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Preserve build receipts
        id: vs_receipts_upload
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonic-vs-slave-evidence-amd64
          path: |
            vs-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/vs/*.json
            vs-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/vs/*.txt
            vs-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/vs/*.sha256
            vs-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/vs/syncd-p4-images/validation.json
            vs-${{ github.run_id }}-${{ github.run_attempt }}/MODULE.bazel.lock
          if-no-files-found: warn
          retention-days: 14

      - name: Retain shared image validation evidence
        id: vs_validation_upload
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonic-vs-image-validation-amd64
          path: |
            vs-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/vs/swss-images/
            vs-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/vs/syncd-p4-images/
            vs-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/vs/*-installed-images-policy.json
            vs-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/vs/installed-images.json
          if-no-files-found: warn
          retention-days: 14

      - name: Remove only this job's build containers
        id: vs_container_cleanup
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          containers=$(docker ps --all --quiet --filter "label=$SONIC_CI_CONTAINER_LABEL")
          while IFS= read -r container; do
            test -n "$container" || continue
            if ! docker rm --force "$container"; then
              remaining=$(docker ps --all --quiet \
                --filter "label=$SONIC_CI_CONTAINER_LABEL" --filter "id=$container")
              if test -n "$remaining"; then
                printf 'Unable to remove job container: %s\n' "$container" >&2
                exit 1
              fi
              printf 'Job container already removed: %s\n' "$container"
            fi
          done <<< "$containers"

      - name: Log out of the slave image registry
        if: always()
        working-directory: ${{ runner.temp }}
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/docker-config-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          set -euo pipefail
          status=0
          docker logout "$REGISTRY_SERVER:$REGISTRY_PORT" || status=$?
          rm -f -- "${DOCKER_CONFIG:?}/config.json"
          exit "$status"

      - name: Remove only this run's checkout
        if: >-
          always() && steps.vs_container_cleanup.outcome == 'success' &&
          steps.vs_receipts_upload.outcome == 'success' &&
          steps.vs_validation_upload.outcome == 'success' &&
          (steps.vs_installer_upload.outcome == 'success' ||
           steps.vs_installer_upload.outcome == 'skipped')
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          checkout="$GITHUB_WORKSPACE/vs-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          if test -L "$checkout"; then
            printf 'Refusing redirected VS checkout: %s\n' "$checkout" >&2
            exit 1
          fi
          if test ! -e "$checkout"; then
            printf 'No VS checkout to remove: %s\n' "$checkout"
            exit 0
          fi
          python3 -B "$checkout/tools/bazel/ci/cleanup_vs_workspace.py" \
            --workspace "$GITHUB_WORKSPACE" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"

  gnmi_native:
    name: Build gNMI OCI images and symbols (AMD64)
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    container: debian:trixie-20260918@sha256:9cc080028c43b27d2074d63a5f9caf7166d731494965616c1a6d2827a004585c
    defaults:
      run:
        shell: bash
    env:
      BAZEL: bazel
      BAZELISK_GITHUB_TOKEN: ""
    steps:
      - name: Install execution and inspection tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends binutils binutils-gold build-essential ca-certificates gdb git j2cli jq libarchive-tools libxml2 python3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-version: 1.29.0
          bazelisk-cache: true
          repository-cache: true
          disk-cache: gnmi-image-amd64
          cache-version: "8.5.1"
      - name: Validate Make handoff and version inputs
        run: |
          python3 -B tools/bazel/tests/gnmi_make_test.py
          PYTHONPATH="$PWD" python3 -B tools/bazel/ci/gnmi_image_test.py
      - name: Build gNMI runtime and debug images (dialout enabled)
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 -B tools/bazel/ci/gnmi_image.py build --bazel "$BAZEL" --dialout enabled --artifacts artifacts/gnmi/enabled
      - name: Validate completed gNMI images and symbols (dialout enabled)
        run: python3 -B tools/bazel/ci/gnmi_image.py validate --artifacts artifacts/gnmi/enabled
      - name: Verify no-op and restored image hashes (dialout enabled)
        run: |
          python3 -B tools/bazel/ci/gnmi_image.py incremental --bazel "$BAZEL" --artifacts artifacts/gnmi/enabled
          git diff --exit-code
      - name: Build gNMI runtime and debug images (dialout disabled)
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 -B tools/bazel/ci/gnmi_image.py build --bazel "$BAZEL" --dialout disabled --artifacts artifacts/gnmi/disabled
      - name: Validate completed gNMI images and symbols (dialout disabled)
        run: python3 -B tools/bazel/ci/gnmi_image.py validate --artifacts artifacts/gnmi/disabled
      - name: Verify no-op and restored image hashes (dialout disabled)
        run: |
          python3 -B tools/bazel/ci/gnmi_image.py incremental --bazel "$BAZEL" --artifacts artifacts/gnmi/disabled
          git diff --exit-code
      - name: Prepare public evidence
        id: public_evidence
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from tools.bazel.ci.public_artifacts import safe_json, dependency_json, bep_summary
          for profile in ('enabled', 'disabled'):
              root = Path('artifacts/gnmi') / profile
              root.mkdir(parents=True, exist_ok=True)
              if (root / 'build-receipt.json').exists():
                  receipt = json.loads((root / 'build-receipt.json').read_text())
                  public = {key: receipt[key] for key in ('status', 'architecture', 'revision', 'image_version', 'artifacts') if key in receipt}
                  safe_json(public)
                  (root / 'public-receipt.json').write_text(json.dumps(public, indent=2) + '\n')
              for name in ('validation.json', 'incremental.json', 'action-audit.json', 'debug-packages.json',
                           'packages.json', 'base-packages.json', 'config-engine-packages.json',
                           'runtime-apt.json', 'debug-apt.json'):
                  path = root / name
                  if path.exists():
                      safe_json(json.loads(path.read_text()))
              for name, kind in (('MODULE.bazel.lock', 'lock'), ('module-graph.json', 'graph')):
                  path = root / name
                  if path.exists():
                      dependency_json(json.loads(path.read_text()), kind)
              if (root / 'build-events.jsonl').exists():
                  value = bep_summary((root / 'build-events.jsonl').read_text().splitlines(), partial=True)
                  (root / 'build-summary.json').write_text(json.dumps(value, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.public_evidence.outcome == 'success'
        with:
          name: gnmi-image-amd64
          path: |
            artifacts/gnmi/*/*.gz
            artifacts/gnmi/*/*.tar
            artifacts/gnmi/*/gnmi-installed-probe.py
            artifacts/gnmi/*/public-receipt.json
            artifacts/gnmi/*/validation.json
            artifacts/gnmi/*/incremental.json
            artifacts/gnmi/*/action-audit.json
            artifacts/gnmi/*/debug-packages.json
            artifacts/gnmi/*/packages.json
            artifacts/gnmi/*/base-packages.json
            artifacts/gnmi/*/config-engine-packages.json
            artifacts/gnmi/*/runtime-apt.json
            artifacts/gnmi/*/debug-apt.json
            artifacts/gnmi/*/*.status
            artifacts/gnmi/*/build-summary.json
            artifacts/gnmi/*/MODULE.bazel.lock
            artifacts/gnmi/*/module-graph.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 1

  gnmi_runtime:
    name: Run installed gNMI images (AMD64)
    needs: gnmi_native
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gnmi-image-amd64
          path: artifacts/gnmi
      - name: Verify loaded archives, gNMI services and installed source symbols
        run: |
          for profile in enabled disabled; do
            python3 -B tools/bazel/ci/gnmi_loaded.py --artifacts "artifacts/gnmi/$profile"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: gnmi-runtime-amd64
          path: |
            artifacts/gnmi/*/*.runtime.json
            artifacts/gnmi/*/loaded-validation.json
          if-no-files-found: warn
          retention-days: 14

  gnmi_acceptance:
    name: gNMI acceptance (AMD64)
    if: always() && !cancelled()
    needs: [gnmi_native, gnmi_runtime]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require both image construction and installed-service checks
        env:
          BUILD_RESULT: ${{ needs.gnmi_native.result }}
          RUNTIME_RESULT: ${{ needs.gnmi_runtime.result }}
        run: |
          test "$BUILD_RESULT" = success
          test "$RUNTIME_RESULT" = success
