name: Bazel OCI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      source_image:
        description: Dedicated native source worker task (image or registry consumer)
        type: choice
        options: [none, vs-bitarray-abi-debug, vs-bitarray-registry-qualification, vs-native-elf, vs-native-layer11, vs-coherent-installed-policies, vs-native-provenance, vs-swss-installed-policy, preflight, vs-host-siblings, vs-socat-binary, vs-binary-config, vs-original-inputs, vs-original-objects, vs-legacy-original-objects, vs-apt-policy, vs-apt-hook-source, vs-archive-config, vs-legacy-archives, vs-inspect, vs-tests, vs-inputs, vs-runtime, vs-cache-inspect, vs-cache-payloads, vs-native-cache, vs-mgmt-metadata, vs-mgmt-blobs, vs-remote-cache, vs-cache-transport, vs-cache-dns, vs-cache-config, vs-native-inventory, vs-native-syncd-inventory, vs-native-gearbox-inventory, vs-native-p4rt-loaded, worker-provenance, registry-native, sysmgr, dash-ha, orchagent, sflow, otel, syncd, gearbox, dash-engine, gnmi, gnmi-no-dialout, framework, teamd, database, eventd, lldp, radv, macsec, mux, frr, p4rt]
        default: none
      source_ci_request:
        description: Optional immutable normal-CI request artifact ID for reviewed Syncd, Gearbox or P4RT validation
        type: string
        default: ''
      source_worker_pool:
        description: Native source-worker pool (K3s requires an authenticated normal-CI request)
        type: choice
        options: [sonic-slave-container-dpool, sonic-slave-container-k3s]
        default: sonic-slave-container-dpool
      source_revision:
        description: Reviewed 40-character image source or fixed registry commit
        type: string
        default: ''
      registry_revision:
        description: Optional immutable registry paired with source_revision (image mode only)
        type: string
        default: ''
      registry_consumer:
        description: Fixed ordinary registry consumer (registry-native mode only)
        type: choice
        options: [none, common, fips, sairedis, dash, linkmgrd]
        default: none
      source_worker:
        description: Dedicated worker for an image pilot
        type: choice
        options: [sonic-slave-lgh114-1, sonic-slave-lgh114-2, sonic-slave-lgh114-3, sonic-slave-lgh114-4]
        default: sonic-slave-lgh114-1
      source_inputs_run:
        description: Optional successful source-download run in this repository
        type: string
        default: ''
      skip_vs:
        description: Skip the full VS image build
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  # Preserve long VS builds across source updates; same-revision reruns supersede.
  group: ${{ inputs.source_worker_pool == 'sonic-slave-container-k3s' && format('bazel-oci-k3s-{0}-{1}', github.run_id, github.run_attempt) || format('bazel-oci-{0}-{1}-{2}-{3}', github.event.pull_request.number || github.ref, github.sha, inputs.source_image || 'none', inputs.source_revision) }}
  cancel-in-progress: ${{ inputs.source_worker_pool != 'sonic-slave-container-k3s' }}

env:
  BAZEL: bazel

jobs:
  vs_legacy_original_object_capture:
    name: Capture fixed original legacy Docker bytes (K3s)
    if: github.event_name == 'workflow_dispatch' && inputs.source_image == 'vs-legacy-original-objects' && inputs.source_worker_pool == 'sonic-slave-container-k3s' && inputs.skip_vs && github.repository == 'securely1g/sonic-buildimage' && github.actor == 'securely1g' && github.triggering_actor == 'securely1g'
    runs-on: [self-hosted, linux, x64, sonic-slave-container-k3s]
    permissions:
      contents: read
      actions: read
    timeout-minutes: 30
    concurrency:
      group: vs-legacy-original-objects-${{ github.run_id }}-${{ github.run_attempt }}
      cancel-in-progress: false
    steps:
      - name: Require fixed original object scope and fresh private paths
        id: paths
        env:
          EXPECTED_WORKER: ${{ runner.name }}
          SOURCE_REVISION: ${{ inputs.source_revision }}
          REGISTRY_REVISION: ${{ inputs.registry_revision }}
          SOURCE_CI_REQUEST: ${{ inputs.source_ci_request }}
          SOURCE_INPUTS_RUN: ${{ inputs.source_inputs_run }}
          REGISTRY_CONSUMER: ${{ inputs.registry_consumer }}
        run: |
          python3 -I -S -B - <<'PY_CAPTURE_PATHS'
          import os, re, shutil
          from pathlib import Path
          if any(os.environ.get(key) for key in ('SOURCE_REVISION', 'REGISTRY_REVISION', 'SOURCE_CI_REQUEST', 'SOURCE_INPUTS_RUN')) or os.environ['REGISTRY_CONSUMER'] != 'none':
              raise SystemExit('Original-object capture accepts no native build or replacement-source inputs')
          run, attempt, worker = (os.environ[key] for key in ('GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'EXPECTED_WORKER'))
          if not all(re.fullmatch(r'[1-9][0-9]*', item) for item in (run, attempt)) or worker != os.environ['RUNNER_NAME'] or not re.fullmatch(r'ks-[a-z0-9](?:[a-z0-9-]{0,58}[a-z0-9])?', worker):
              raise SystemExit('Unexpected current runner identity')
          workspace = Path(os.environ['GITHUB_WORKSPACE'])
          if workspace.resolve() != workspace or not workspace.is_relative_to('/actions/_work') or os.getuid() != 1000:
              raise SystemExit('Expected the current private K3s worker workspace')
          # The 34 observed originals total 4.64 GB; preserve staged and retained copies.
          if shutil.disk_usage(workspace).free < 12 * 1024**3:
              raise SystemExit('Original object capture requires 12 GiB free temporary storage')
          name = f'vs-legacy-original-objects-{run}-{attempt}-{worker}'
          root = workspace / name
          if os.path.lexists(root):
              raise SystemExit('Preserve existing original-object capture work')
          root.mkdir(mode=0o700)
          for child in ('outputs', 'temporary'):
              (root / child).mkdir(mode=0o700)
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write(f'root={root}\ncontrol={name}/control\n')
          PY_CAPTURE_PATHS
      - name: Checkout the reviewed original-object capture code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: ${{ steps.paths.outputs.control }}
          clean: false
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            tools/bazel/ci/recover_vs_original_inputs.py
            tools/bazel/ci/capture_vs_original_objects.py
            tools/bazel/tests/capture_vs_original_objects_test.py
            tools/bazel/ci/vs_original_cache_objects.json
            tools/bazel/ci/vs_original_legacy_objects.json
      - name: Verify capture source and nineteen byte-copy fixtures
        working-directory: ${{ github.workspace }}/${{ steps.paths.outputs.control }}
        env:
          CAPTURE_ROOT: ${{ steps.paths.outputs.root }}
        run: |
          set -euo pipefail
          test "$(git -c protocol.allow=never rev-parse HEAD)" = "$GITHUB_SHA"
          git -c protocol.allow=never diff --exit-code --ignore-submodules=none HEAD
          printf '%s\n' \
            '6699855d87b685f9b23a4b4c0a12084ec3100b45a59a8b575a06925f447988a5  tools/bazel/ci/recover_vs_original_inputs.py' \
            '99047aefc9ffcb487aa05d0c2a2c1ebb8841bb1b34950a0571a62e0a068c0ab6  tools/bazel/ci/capture_vs_original_objects.py' \
            '074249b772f8803644cfb413cf813db5769dea536794b1e676bca93f465269bd  tools/bazel/tests/capture_vs_original_objects_test.py' \
            '49bac47857f971e66db7cba347019d37fc7a150b26f339dd5b3a025d43073510  tools/bazel/ci/vs_original_cache_objects.json' \
            '629d690259c61e9f441fdbca486e83b3e9ebb8489807127759b91b39ed2c2742  tools/bazel/ci/vs_original_legacy_objects.json' | sha256sum --check --status
          env -i PATH=/usr/bin:/bin LANG=C.UTF-8 HOME="$CAPTURE_ROOT/temporary" TMPDIR="$CAPTURE_ROOT/temporary" \
            /usr/bin/python3 -I -S -B tools/bazel/tests/capture_vs_original_objects_test.py
      - name: Capture only matching original streams without restoration
        timeout-minutes: 10
        working-directory: ${{ github.workspace }}/${{ steps.paths.outputs.control }}
        env:
          CAPTURE_ROOT: ${{ steps.paths.outputs.root }}
        run: |
          set -euo pipefail
          ulimit -f 262144
          env -i PATH=/usr/bin:/bin LANG=C.UTF-8 HOME="$CAPTURE_ROOT/temporary" TMPDIR="$CAPTURE_ROOT/temporary" \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_RUN_ID="$GITHUB_RUN_ID" \
            GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" GITHUB_SHA="$GITHUB_SHA" RUNNER_NAME="$RUNNER_NAME" \
            /usr/bin/python3 -I -S -B -c 'import runpy,sys; sys.path.insert(0,"."); runpy.run_module("tools.bazel.ci.capture_vs_original_objects",run_name="__main__")' \
              --scope legacy --selection "$PWD/tools/bazel/ci/vs_original_legacy_objects.json" \
              --output-parent "$CAPTURE_ROOT/outputs" --temporary-parent "$CAPTURE_ROOT/temporary"
      - name: Retain the small original-object capture report separately
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vs-legacy-original-objects-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.paths.outputs.root }}/outputs/execution/capture-lineage.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Retain verified original objects and explicit partial-capture lineage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vs-legacy-original-objects-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.paths.outputs.root }}/outputs/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  vs_apt_hook_source_observation:
    name: Encrypt the fixed native APT hook for source review (K3s)
    if: github.event_name == 'workflow_dispatch' && inputs.source_image == 'vs-apt-hook-source' && inputs.source_worker_pool == 'sonic-slave-container-k3s' && inputs.skip_vs && github.repository == 'securely1g/sonic-buildimage' && github.actor == 'securely1g' && github.triggering_actor == 'securely1g'
    runs-on: [self-hosted, linux, x64, sonic-slave-container-k3s]
    permissions:
      contents: read
    timeout-minutes: 5
    concurrency:
      group: vs-apt-hook-source-${{ github.run_id }}-${{ github.run_attempt }}
      cancel-in-progress: false
    steps:
      - name: Require the fixed source review and fresh private paths
        id: paths
        env:
          EXPECTED_WORKER: ${{ runner.name }}
          SOURCE_REVISION: ${{ inputs.source_revision }}
          REGISTRY_REVISION: ${{ inputs.registry_revision }}
          SOURCE_CI_REQUEST: ${{ inputs.source_ci_request }}
          SOURCE_INPUTS_RUN: ${{ inputs.source_inputs_run }}
          REGISTRY_CONSUMER: ${{ inputs.registry_consumer }}
        run: |
          python3 -I -S -B - <<'PY_HOOK_PATHS'
          import os, re, shutil
          from pathlib import Path
          if any(os.environ.get(key) for key in ('SOURCE_REVISION', 'REGISTRY_REVISION', 'SOURCE_CI_REQUEST', 'SOURCE_INPUTS_RUN')) or os.environ['REGISTRY_CONSUMER'] != 'none':
              raise SystemExit('Hook observation accepts no build, replacement source or package inputs')
          run, attempt, worker = (os.environ[key] for key in ('GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'EXPECTED_WORKER'))
          if not all(re.fullmatch(r'[1-9][0-9]*', item) for item in (run, attempt)) or worker != os.environ['RUNNER_NAME'] or not re.fullmatch(r'ks-[a-z0-9](?:[a-z0-9-]{0,58}[a-z0-9])?', worker):
              raise SystemExit('Unexpected current runner identity')
          workspace = Path(os.environ['GITHUB_WORKSPACE'])
          if workspace.resolve() != workspace or not workspace.is_relative_to('/actions/_work') or os.getuid() != 1000:
              raise SystemExit('Expected the current private K3s worker workspace')
          if shutil.disk_usage(workspace).free < 64 * 1024**2:
              raise SystemExit('Hook observation requires 64 MiB temporary storage')
          name = f'vs-apt-hook-source-{run}-{attempt}-{worker}'
          root = workspace / name
          if os.path.lexists(root):
              raise SystemExit('Preserve existing hook observation work')
          root.mkdir(mode=0o700)
          for child in ('outputs', 'temporary'):
              (root / child).mkdir(mode=0o700)
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write(f'root={root}\ncontrol={name}/control\n')
          PY_HOOK_PATHS
      - name: Checkout the reviewed source observation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: ${{ steps.paths.outputs.control }}
          clean: false
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            tools/bazel/ci/native_apt_cache_policy.py
            tools/bazel/ci/observe_native_apt_hook.py
            tools/bazel/tests/observe_native_apt_hook_test.py
            tools/bazel/ci/native_apt_hook_review_recipient.pem
      - name: Verify observation sources and ten confidentiality fixtures
        working-directory: ${{ github.workspace }}/${{ steps.paths.outputs.control }}
        env:
          OBSERVATION_ROOT: ${{ steps.paths.outputs.root }}
        run: |
          set -euo pipefail
          test "$(git -c protocol.allow=never rev-parse HEAD)" = "$GITHUB_SHA"
          git -c protocol.allow=never diff --exit-code --ignore-submodules=none HEAD
          printf '%s\n' \
            'c5393e4ba76c78d6aef3742ae84c69689b28e6064ae91e36ee3a4eb4d6ac0401  tools/bazel/ci/native_apt_cache_policy.py' \
            '5d793e7e4d2843db738b548b5338beba7ed79c2e0e3b2c5465f60fbaa4f9f798  tools/bazel/ci/observe_native_apt_hook.py' \
            '8f2712e8eef04d221aaa047de5ede98a521f862b0187c6ef4b0fd004501d950a  tools/bazel/tests/observe_native_apt_hook_test.py' \
            'f10ae6635ebd8db99ad573a0f67cfd29507e64f03082220145643ea4ba62cf50  tools/bazel/ci/native_apt_hook_review_recipient.pem' | sha256sum --check --status
          test -x /usr/bin/openssl
          env -i PATH=/usr/bin:/bin LANG=C.UTF-8 HOME="$OBSERVATION_ROOT/temporary" TMPDIR="$OBSERVATION_ROOT/temporary" \
            /usr/bin/python3 -I -S -B tools/bazel/tests/observe_native_apt_hook_test.py
      - name: Encrypt only the previously observed job-start script
        timeout-minutes: 1
        working-directory: ${{ github.workspace }}/${{ steps.paths.outputs.control }}
        env:
          OBSERVATION_ROOT: ${{ steps.paths.outputs.root }}
        run: |
          set -euo pipefail
          ulimit -f 256
          env -i PATH=/usr/bin:/bin LANG=C.UTF-8 HOME="$OBSERVATION_ROOT/temporary" TMPDIR="$OBSERVATION_ROOT/temporary" \
            /usr/bin/python3 -I -S -B -c 'import runpy,sys; sys.path.insert(0,"."); runpy.run_module("tools.bazel.ci.observe_native_apt_hook",run_name="__main__")' \
              --recipient "$PWD/tools/bazel/ci/native_apt_hook_review_recipient.pem" \
              --output-parent "$OBSERVATION_ROOT/outputs"
          python3 -I -S -B - <<'PY_HOOK_LINEAGE'
          import json, os
          from pathlib import Path
          root = Path(os.environ['OBSERVATION_ROOT']) / 'outputs/execution'
          value = {key: os.environ[key] for key in ('GITHUB_REPOSITORY', 'GITHUB_SHA', 'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'RUNNER_NAME')}
          value.update(scope='fixed_public_hook_encrypted_for_private_source_review', source_executed=False, policy_admitted=False)
          with (root / 'observation.json').open('x') as output:
              json.dump(value, output, sort_keys=True, indent=2)
              output.write('\n')
          PY_HOOK_LINEAGE
      - name: Retain only encrypted source and public lineage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vs-apt-hook-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.paths.outputs.root }}/outputs/execution
          if-no-files-found: error
          retention-days: 7
          compression-level: 0


  vs_original_object_capture:
    name: Capture fixed original VS object bytes (K3s)
    if: github.event_name == 'workflow_dispatch' && inputs.source_image == 'vs-original-objects' && inputs.source_worker_pool == 'sonic-slave-container-k3s' && inputs.skip_vs && github.repository == 'securely1g/sonic-buildimage' && github.actor == 'securely1g' && github.triggering_actor == 'securely1g'
    runs-on: [self-hosted, linux, x64, sonic-slave-container-k3s]
    permissions:
      contents: read
      actions: read
    timeout-minutes: 10
    concurrency:
      group: vs-original-objects-${{ github.run_id }}-${{ github.run_attempt }}
      cancel-in-progress: false
    steps:
      - name: Require fixed original object scope and fresh private paths
        id: paths
        env:
          EXPECTED_WORKER: ${{ runner.name }}
          SOURCE_REVISION: ${{ inputs.source_revision }}
          REGISTRY_REVISION: ${{ inputs.registry_revision }}
          SOURCE_CI_REQUEST: ${{ inputs.source_ci_request }}
          SOURCE_INPUTS_RUN: ${{ inputs.source_inputs_run }}
          REGISTRY_CONSUMER: ${{ inputs.registry_consumer }}
        run: |
          python3 -I -S -B - <<'PY_CAPTURE_PATHS'
          import os, re, shutil
          from pathlib import Path
          if any(os.environ.get(key) for key in ('SOURCE_REVISION', 'REGISTRY_REVISION', 'SOURCE_CI_REQUEST', 'SOURCE_INPUTS_RUN')) or os.environ['REGISTRY_CONSUMER'] != 'none':
              raise SystemExit('Original-object capture accepts no native build or replacement-source inputs')
          run, attempt, worker = (os.environ[key] for key in ('GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'EXPECTED_WORKER'))
          if not all(re.fullmatch(r'[1-9][0-9]*', item) for item in (run, attempt)) or worker != os.environ['RUNNER_NAME'] or not re.fullmatch(r'ks-[a-z0-9](?:[a-z0-9-]{0,58}[a-z0-9])?', worker):
              raise SystemExit('Unexpected current runner identity')
          workspace = Path(os.environ['GITHUB_WORKSPACE'])
          if workspace.resolve() != workspace or not workspace.is_relative_to('/actions/_work') or os.getuid() != 1000:
              raise SystemExit('Expected the current private K3s worker workspace')
          # The original106 objects total276 MB; allow private staged and retained copies.
          if shutil.disk_usage(workspace).free < 1024**3:
              raise SystemExit('Original object capture requires 1 GiB free temporary storage')
          name = f'vs-original-objects-{run}-{attempt}-{worker}'
          root = workspace / name
          if os.path.lexists(root):
              raise SystemExit('Preserve existing original-object capture work')
          root.mkdir(mode=0o700)
          for child in ('outputs', 'temporary'):
              (root / child).mkdir(mode=0o700)
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write(f'root={root}\ncontrol={name}/control\n')
          PY_CAPTURE_PATHS
      - name: Checkout the reviewed original-object capture code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: ${{ steps.paths.outputs.control }}
          clean: false
          persist-credentials: false
          fetch-depth: 1
      - name: Verify capture source and nineteen byte-copy fixtures
        working-directory: ${{ github.workspace }}/${{ steps.paths.outputs.control }}
        env:
          CAPTURE_ROOT: ${{ steps.paths.outputs.root }}
        run: |
          set -euo pipefail
          test "$(git -c protocol.allow=never rev-parse HEAD)" = "$GITHUB_SHA"
          git -c protocol.allow=never diff --exit-code --ignore-submodules=none HEAD
          printf '%s\n' \
            '6699855d87b685f9b23a4b4c0a12084ec3100b45a59a8b575a06925f447988a5  tools/bazel/ci/recover_vs_original_inputs.py' \
            '99047aefc9ffcb487aa05d0c2a2c1ebb8841bb1b34950a0571a62e0a068c0ab6  tools/bazel/ci/capture_vs_original_objects.py' \
            '074249b772f8803644cfb413cf813db5769dea536794b1e676bca93f465269bd  tools/bazel/tests/capture_vs_original_objects_test.py' \
            '49bac47857f971e66db7cba347019d37fc7a150b26f339dd5b3a025d43073510  tools/bazel/ci/vs_original_cache_objects.json' \
            '629d690259c61e9f441fdbca486e83b3e9ebb8489807127759b91b39ed2c2742  tools/bazel/ci/vs_original_legacy_objects.json' | sha256sum --check --status
          env -i PATH=/usr/bin:/bin LANG=C.UTF-8 HOME="$CAPTURE_ROOT/temporary" TMPDIR="$CAPTURE_ROOT/temporary" \
            /usr/bin/python3 -I -S -B tools/bazel/tests/capture_vs_original_objects_test.py
      - name: Capture only matching original streams without restoration
        timeout-minutes: 5
        working-directory: ${{ github.workspace }}/${{ steps.paths.outputs.control }}
        env:
          CAPTURE_ROOT: ${{ steps.paths.outputs.root }}
        run: |
          set -euo pipefail
          ulimit -f 262144
          env -i PATH=/usr/bin:/bin LANG=C.UTF-8 HOME="$CAPTURE_ROOT/temporary" TMPDIR="$CAPTURE_ROOT/temporary" \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_RUN_ID="$GITHUB_RUN_ID" \
            GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" GITHUB_SHA="$GITHUB_SHA" RUNNER_NAME="$RUNNER_NAME" \
            /usr/bin/python3 -I -S -B -c 'import runpy,sys; sys.path.insert(0,"."); runpy.run_module("tools.bazel.ci.capture_vs_original_objects",run_name="__main__")' \
              --selection "$PWD/tools/bazel/ci/vs_original_cache_objects.json" \
              --output-parent "$CAPTURE_ROOT/outputs" --temporary-parent "$CAPTURE_ROOT/temporary"
      - name: Retain the small original-object capture report separately
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vs-original-objects-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.paths.outputs.root }}/outputs/execution/capture-lineage.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Retain verified original objects and explicit partial-capture lineage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vs-original-objects-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.paths.outputs.root }}/outputs/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  vs_original_input_recovery:
    name: Recover fixed original VS input bytes (K3s)
    if: github.event_name == 'workflow_dispatch' && inputs.source_image == 'vs-original-inputs' && inputs.source_worker_pool == 'sonic-slave-container-k3s' && inputs.skip_vs && github.repository == 'securely1g/sonic-buildimage' && github.actor == 'securely1g' && github.triggering_actor == 'securely1g'
    runs-on: [self-hosted, linux, x64, sonic-slave-container-k3s]
    permissions:
      contents: read
      actions: read
    timeout-minutes: 35
    concurrency:
      group: vs-original-inputs-${{ github.run_id }}-${{ github.run_attempt }}
      cancel-in-progress: false
    steps:
      - name: Require fixed recovery scope and fresh private paths
        id: paths
        env:
          EXPECTED_WORKER: ${{ runner.name }}
          SOURCE_REVISION: ${{ inputs.source_revision }}
          REGISTRY_REVISION: ${{ inputs.registry_revision }}
          SOURCE_CI_REQUEST: ${{ inputs.source_ci_request }}
          SOURCE_INPUTS_RUN: ${{ inputs.source_inputs_run }}
          REGISTRY_CONSUMER: ${{ inputs.registry_consumer }}
        run: |
          python3 -I -S -B - <<'PY_RECOVERY_PATHS'
          import os, re, shutil
          from pathlib import Path
          if any(os.environ.get(key) for key in ('SOURCE_REVISION', 'REGISTRY_REVISION', 'SOURCE_CI_REQUEST', 'SOURCE_INPUTS_RUN')) or os.environ['REGISTRY_CONSUMER'] != 'none':
              raise SystemExit('Original-byte recovery accepts no native build or replacement-source inputs')
          run, attempt, worker = (os.environ[key] for key in ('GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'EXPECTED_WORKER'))
          if not all(re.fullmatch(r'[1-9][0-9]*', item) for item in (run, attempt)) or worker != os.environ['RUNNER_NAME'] or not re.fullmatch(r'ks-[a-z0-9](?:[a-z0-9-]{0,58}[a-z0-9])?', worker):
              raise SystemExit('Unexpected current runner identity')
          workspace = Path(os.environ['GITHUB_WORKSPACE'])
          if workspace.resolve() != workspace or not workspace.is_relative_to('/actions/_work') or os.getuid() != 1000:
              raise SystemExit('Expected the current private K3s worker workspace')
          # Budget the entire 6.57 GB original artifact, not only its installer member.
          if shutil.disk_usage(workspace).free < 64 * 1024**3:
              raise SystemExit('Original artifact extraction requires 64 GiB free temporary storage')
          name = f'vs-original-inputs-{run}-{attempt}-{worker}'
          root = workspace / name
          if os.path.lexists(root):
              raise SystemExit('Preserve existing recovery work')
          root.mkdir(mode=0o700)
          for child in ('inputs', 'outputs', 'temporary'):
              (root / child).mkdir(mode=0o700)
          for child in ('platform', 'device-data'):
              (root / 'inputs' / child).mkdir(mode=0o700)
              (root / 'outputs' / child).mkdir(mode=0o700)
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write(f'root={root}\ncontrol={name}/control\n')
          PY_RECOVERY_PATHS
      - name: Checkout the reviewed recovery code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: ${{ steps.paths.outputs.control }}
          clean: false
          persist-credentials: false
          fetch-depth: 1
      - name: Verify recovery source and eleven archive fixtures
        working-directory: ${{ github.workspace }}/${{ steps.paths.outputs.control }}
        env:
          RECOVERY_ROOT: ${{ steps.paths.outputs.root }}
        run: |
          set -euo pipefail
          test "$(git -c protocol.allow=never rev-parse HEAD)" = "$GITHUB_SHA"
          git -c protocol.allow=never diff --exit-code --ignore-submodules=none HEAD
          printf '%s\n' \
            '6699855d87b685f9b23a4b4c0a12084ec3100b45a59a8b575a06925f447988a5  tools/bazel/ci/recover_vs_original_inputs.py' \
            'a642d9ad620e80cc85d53763ee6b9116b29044256c4d1b0b9b92afa051e97a9c  tools/bazel/tests/recover_vs_original_inputs_test.py' \
            'a9f3521062d967cd4ae1b5715e43e95504d1ce732dd57d747a4bbee1dd2898af  installer/sharch_body.sh' | sha256sum --check --status
          env -i PATH=/usr/bin:/bin LANG=C.UTF-8 HOME="$RECOVERY_ROOT/temporary" TMPDIR="$RECOVERY_ROOT/temporary" \
            /usr/bin/python3 -I -S -B tools/bazel/tests/recover_vs_original_inputs_test.py
      - name: Authenticate the two fixed original artifact producers
        working-directory: ${{ github.workspace }}/${{ steps.paths.outputs.control }}
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_ROOT: ${{ steps.paths.outputs.root }}
        run: |
          python3 -B - <<'PY_ORIGINAL_PRODUCERS'
          import json, os
          from pathlib import Path
          from tools.bazel.ci.image_worker_receipt import api
          originals = [
              dict(kind='platform', artifact=13630197696, run=42504707668, job=128805164461,
                   producer='15c277f89f12bacd240e160c555263e90d2179fc', name='sonic-vs-slave-amd64',
                   bytes=6572856746, digest='sha256:f12177539d7338e98f797e5e5217f98fb2ea108b399239051ce7dc707a4fc540'),
              dict(kind='device-data', artifact=13821942674, run=42945002504, job=130275576933,
                   producer='d8186092711a0385755fffe9ff229632231df4ef', name='vs-management-image-blobs-42945002504-1',
                   bytes=16323589, digest='sha256:41d4042058c8fe4f5a3a7f3e1921fa5b5b952a2007eb9b1ce9106a6217294014'),
          ]
          rows = []
          for expected in originals:
              artifact = api('/actions/artifacts/' + str(expected['artifact']))
              run = api('/actions/runs/' + str(expected['run']) + '/attempts/1')
              job = api('/actions/jobs/' + str(expected['job']))
              assert artifact['id'] == expected['artifact'] and artifact['name'] == expected['name']
              assert artifact['expired'] is False and artifact['size_in_bytes'] == expected['bytes'] and artifact['digest'] == expected['digest']
              assert artifact['workflow_run']['id'] == expected['run'] and artifact['workflow_run']['head_sha'] == expected['producer']
              assert run['repository']['full_name'] == 'securely1g/sonic-buildimage' and run['id'] == expected['run']
              assert run['head_sha'] == expected['producer'] and run['run_attempt'] == 1
              assert run['path'] == '.github/workflows/bazel-oci.yml' and run['workflow_id'] == 380324045
              assert run['event'] == 'workflow_dispatch' and run['status'] == 'completed' and run['conclusion'] == 'success'
              assert job['id'] == expected['job'] and job['run_id'] == expected['run'] and job['run_attempt'] == 1
              assert job['head_sha'] == expected['producer'] and job['status'] == 'completed' and job['conclusion'] == 'success'
              rows.append(dict(expected, original_attempt=1, original_run_conclusion=run['conclusion'], original_job_conclusion=job['conclusion']))
          with (Path(os.environ['RECOVERY_ROOT']) / 'outputs/original-artifact-lineage.json').open('x') as output:
              json.dump(dict(repository='securely1g/sonic-buildimage', originals=rows,
                             transport='pinned upstream actions/download-artifact',
                             current_source_or_full_vs_admission=False), output, indent=2, sort_keys=True)
              output.write('\n')
          PY_ORIGINAL_PRODUCERS
      - name: Download the fixed original installer artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        timeout-minutes: 20
        with:
          github-token: ${{ github.token }}
          repository: securely1g/sonic-buildimage
          run-id: 42504707668
          artifact-ids: '13630197696'
          merge-multiple: true
          digest-mismatch: error
          path: ${{ steps.paths.outputs.root }}/inputs/platform
      - name: Download the fixed original management COPY layer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        timeout-minutes: 5
        with:
          github-token: ${{ github.token }}
          repository: securely1g/sonic-buildimage
          run-id: 42945002504
          artifact-ids: '13821942674'
          merge-multiple: true
          digest-mismatch: error
          path: ${{ steps.paths.outputs.root }}/inputs/device-data
      - name: Recover only the two original package byte streams
        timeout-minutes: 6
        working-directory: ${{ github.workspace }}/${{ steps.paths.outputs.control }}
        env:
          RECOVERY_ROOT: ${{ steps.paths.outputs.root }}
        run: |
          set -euo pipefail
          ulimit -f 65536
          env -i PATH=/usr/bin:/bin LANG=C.UTF-8 HOME="$RECOVERY_ROOT/temporary" TMPDIR="$RECOVERY_ROOT/temporary" \
            /usr/bin/python3 -I -S -B tools/bazel/ci/recover_vs_original_inputs.py platform \
              --input "$RECOVERY_ROOT/inputs/platform/target/sonic-vs.bin" \
              --wrapper "$PWD/installer/sharch_body.sh" \
              --output-parent "$RECOVERY_ROOT/outputs/platform"
          env -i PATH=/usr/bin:/bin LANG=C.UTF-8 HOME="$RECOVERY_ROOT/temporary" TMPDIR="$RECOVERY_ROOT/temporary" \
            /usr/bin/python3 -I -S -B tools/bazel/ci/recover_vs_original_inputs.py device-data \
              --input "$RECOVERY_ROOT/inputs/device-data/layer/stdout.data" \
              --output-parent "$RECOVERY_ROOT/outputs/device-data"
      - name: Record recovery lineage without changing original source identities
        env:
          RECOVERY_ROOT: ${{ steps.paths.outputs.root }}
        run: |
          python3 -I -S -B - <<'PY_RECOVERY_LINEAGE'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['RECOVERY_ROOT']) / 'outputs'
          originals = json.loads((root / 'original-artifact-lineage.json').read_text())['originals']
          packages = []
          for item in originals:
              directory = root / item['kind'] / 'execution'
              receipt = json.loads((directory / 'recovered-original-input.json').read_text())
              assert receipt['status'] == 'ORIGINAL_INPUT_BYTES_RECOVERED_NOT_ADMITTED'
              assert receipt['kind'] == item['kind'] and receipt['original_inputs_unchanged']
              assert all(receipt['original_source_reference'][key] == item[key] for key in ('artifact', 'run', 'job', 'producer'))
              assert all(receipt[key] is False for key in ('installer_execution', 'package_generation', 'package_installation', 'current_source_or_full_vs_admission'))
              paths = list(directory.glob('*.deb'))
              assert len(paths) == 1 and paths[0].is_file() and not paths[0].is_symlink()
              digest = hashlib.sha256(paths[0].read_bytes()).hexdigest()
              assert paths[0].stat().st_size == receipt['original_package']['bytes'] and digest == receipt['original_package']['sha256']
              packages.append(dict(path=str(paths[0].relative_to(root)), bytes=paths[0].stat().st_size,
                                   sha256=digest, original_source_reference=receipt['original_source_reference']))
          with (root / 'recovery-lineage.json').open('x') as output:
              json.dump(dict(status='ORIGINAL_INPUT_BYTES_RECOVERED_NOT_ADMITTED', packages=packages,
                             recovery_job=dict(repository=os.environ['GITHUB_REPOSITORY'], revision=os.environ['GITHUB_SHA'],
                                               run=int(os.environ['GITHUB_RUN_ID']), attempt=int(os.environ['GITHUB_RUN_ATTEMPT'])),
                             package_generation=False, package_installation=False, installer_execution=False,
                             current_source_or_full_vs_admission=False), output, sort_keys=True, indent=2)
              output.write('\n')
          PY_RECOVERY_LINEAGE
      - name: Upload recovered original bytes and lineage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vs-recovered-original-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.paths.outputs.root }}/outputs/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  vs_management_image_blobs:
    name: Original management image blobs (hosted)
    if: github.event_name == 'workflow_dispatch' && inputs.source_image == 'vs-mgmt-blobs' && inputs.skip_vs && github.repository == 'securely1g/sonic-buildimage' && github.actor == 'securely1g' && github.triggering_actor == 'securely1g'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Check blob integrity and bounded client fixtures
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          test "$(git -c protocol.allow=never rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -B -m unittest -v \
            tools.bazel.tests.vs_management_image_metadata_test \
            tools.bazel.tests.vs_management_image_blobs_test
      - name: Download the upstream rules_oci regctl pin
        env:
          BLOB_TOOLS: ${{ runner.temp }}/management-blob-tools-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          mkdir -m 700 "$BLOB_TOOLS"
          env -i PATH=/usr/bin:/bin LANG=C.UTF-8 /usr/bin/curl --disable --fail --show-error --silent --location \
            --proto '=https' --proto-redir '=https' --connect-timeout 15 --max-time 120 --max-filesize 134217728 \
            --output "$BLOB_TOOLS/regctl" \
            'https://github.com/regclient/regclient/releases/download/v0.8.0/regctl-linux-amd64'
          printf '%s  %s\n' '2276edee5a1e5cb89bb4e448e5d023564acd6d84a5419cc92ff262d85dfb8e9a' "$BLOB_TOOLS/regctl" | sha256sum --check --status
          chmod 700 "$BLOB_TOOLS/regctl"
      - name: Capture the original config and selected COPY layer
        id: blobs
        env:
          PYTHONPATH: ${{ github.workspace }}
          BLOB_TOOLS: ${{ runner.temp }}/management-blob-tools-${{ github.run_id }}-${{ github.run_attempt }}
          BLOB_OUTPUT: ${{ runner.temp }}/management-image-blobs-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python3 -B tools/bazel/ci/vs_management_image_blobs.py \
            --regctl "$BLOB_TOOLS/regctl" --output "$BLOB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && (steps.blobs.outcome == 'success' || steps.blobs.outcome == 'failure')
        with:
          name: vs-management-image-blobs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/management-image-blobs-${{ github.run_id }}-${{ github.run_attempt }}/summary.json
            ${{ runner.temp }}/management-image-blobs-${{ github.run_id }}-${{ github.run_attempt }}/tool-identity.json
            ${{ runner.temp }}/management-image-blobs-${{ github.run_id }}-${{ github.run_attempt }}/config/plan.json
            ${{ runner.temp }}/management-image-blobs-${{ github.run_id }}-${{ github.run_attempt }}/config/result.json
            ${{ runner.temp }}/management-image-blobs-${{ github.run_id }}-${{ github.run_attempt }}/config/stdout.data
            ${{ runner.temp }}/management-image-blobs-${{ github.run_id }}-${{ github.run_attempt }}/layer/plan.json
            ${{ runner.temp }}/management-image-blobs-${{ github.run_id }}-${{ github.run_attempt }}/layer/result.json
            ${{ runner.temp }}/management-image-blobs-${{ github.run_id }}-${{ github.run_attempt }}/layer/stdout.data
          retention-days: 7
          compression-level: 0
          if-no-files-found: error


  vs_remote_cache_smoke:
    name: Tiny remote cache qualification (K3s)
    if: github.event_name == 'workflow_dispatch' && inputs.source_image == 'vs-remote-cache' && inputs.source_worker_pool == 'sonic-slave-container-k3s' && inputs.skip_vs && github.repository == 'securely1g/sonic-buildimage' && github.actor == 'securely1g' && github.triggering_actor == 'securely1g'
    runs-on: [self-hosted, linux, x64, sonic-slave-container-k3s]
    timeout-minutes: 20
    concurrency:
      group: vs-remote-cache-smoke-${{ github.run_id }}-${{ github.run_attempt }}
      cancel-in-progress: false
    steps:
      - name: Require separate remote cache scope and fresh paths
        id: paths
        env:
          EXPECTED_WORKER: ${{ runner.name }}
          SOURCE_REVISION: ${{ inputs.source_revision }}
          REGISTRY_REVISION: ${{ inputs.registry_revision }}
          SOURCE_CI_REQUEST: ${{ inputs.source_ci_request }}
          SOURCE_INPUTS_RUN: ${{ inputs.source_inputs_run }}
          REGISTRY_CONSUMER: ${{ inputs.registry_consumer }}
        run: |
          python3 - <<'PY_CACHE_SMOKE_PATHS'
          import os, re
          from pathlib import Path
          if any(os.environ.get(name) for name in ('SOURCE_REVISION', 'REGISTRY_REVISION', 'SOURCE_CI_REQUEST', 'SOURCE_INPUTS_RUN')) or os.environ['REGISTRY_CONSUMER'] != 'none':
              raise SystemExit('Remote cache qualification does not accept a native source request')
          run, attempt, worker = (os.environ[key] for key in ('GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'EXPECTED_WORKER'))
          if not all(re.fullmatch(r'[1-9][0-9]*', value) for value in (run, attempt)) or worker != os.environ['RUNNER_NAME'] or not re.fullmatch(r'ks-[a-z0-9](?:[a-z0-9-]{0,58}[a-z0-9])?', worker):
              raise SystemExit('Unexpected assigned runner identity')
          name = f'vs-remote-cache-control-{run}-{attempt}-{worker}'
          control = Path(os.environ['GITHUB_WORKSPACE']) / name
          native = control.with_name(control.name + '-native')
          receipt = Path(os.environ['RUNNER_TEMP']) / (name + '.json')
          private = Path(os.environ['RUNNER_TEMP']) / f'remote-cache-smoke-{run}-{attempt}'
          if any(os.path.lexists(path) for path in (control, native, receipt, private)):
              raise SystemExit('Preserve existing remote cache qualification paths')
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write(f'worker={worker}\ncontrol={control.name}\nnative={native.name}\nreceipt={receipt.name}\n')
          PY_CACHE_SMOKE_PATHS
      - name: Checkout the immutable cache observer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: ${{ steps.paths.outputs.control }}
          clean: false
          persist-credentials: false
      - name: Checkout the published native cache smoke
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 6ba39f0b058e41eb2db7cc7cf01d62a2d7088bba
          path: ${{ steps.paths.outputs.native }}
          clean: false
          persist-credentials: false
      - name: Check both source identities and 33 pure cache fixtures
        env:
          CONTROL: ${{ steps.paths.outputs.control }}
          NATIVE: ${{ steps.paths.outputs.native }}
          GIT_NO_LAZY_FETCH: '1'
          GIT_NO_REPLACE_OBJECTS: '1'
          GIT_OPTIONAL_LOCKS: '0'
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          test "$(git -C "$GITHUB_WORKSPACE/$CONTROL" -c protocol.allow=never rev-parse HEAD)" = "$GITHUB_SHA"
          cd "$GITHUB_WORKSPACE/$NATIVE"
          test "$(git -c protocol.allow=never rev-parse HEAD)" = "6ba39f0b058e41eb2db7cc7cf01d62a2d7088bba"
          test -z "$(git -c protocol.allow=never status --porcelain --untracked-files=no)"
          printf '%s  %s\n' \
            5a81d8adfeae943497dfaf5d93c78cd5984713a8f37b1006cb1bb318572adbc1 tools/bazel/ci/remote_cache_smoke.py \
            1180871415ad6b787793da5386bcf748f20f8dd2ac9442b12e31ebd4dbc34bbb tools/bazel/tests/remote_cache_smoke_test.py \
            3c8f2a5695d866d6c9a368dadf35308ba5aef81f752c7775046a85e71591ee75 tools/bazel/ci/source_image_worker.py \
            eae654c75ff20d3dbc18a0e8e32bf065fb9b5b136d232548b1cbef5804d9b5db tools/bazel/ci/image_worker_receipt.py | sha256sum --check --status
          python3 -B -m unittest -v tools.bazel.tests.remote_cache_smoke_test
      - name: Qualify remote hits with fresh bases on Bazel 6.4.0 and 8.5.1
        id: smoke
        env:
          NATIVE: ${{ steps.paths.outputs.native }}
          RECEIPT: ${{ steps.paths.outputs.receipt }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/$NATIVE"
          python3 -B -m tools.bazel.ci.remote_cache_smoke \
            --native-revision 6ba39f0b058e41eb2db7cc7cf01d62a2d7088bba \
            --worker-sha256 3c8f2a5695d866d6c9a368dadf35308ba5aef81f752c7775046a85e71591ee75 \
            --expected-managed-origin 'https://lgh115-oai-lgh-bazel-cache.devbox-4.gateway.internal.api.openai.org/' \
            --output "$RUNNER_TEMP/$RECEIPT"
      - name: Retain only the bounded public cache receipt
        if: always() && (steps.smoke.outcome == 'success' || steps.smoke.outcome == 'failure')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vs-remote-cache-${{ steps.paths.outputs.worker }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/${{ steps.paths.outputs.receipt }}
          if-no-files-found: error
          retention-days: 14

