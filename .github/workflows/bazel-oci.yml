              if not path.is_file() or path.is_symlink() or hashlib.sha256(path.read_bytes()).hexdigest() != digest:
                  raise SystemExit('Legacy observation source identity differs')
          with (Path(os.environ['OBS_ROOT']) / 'outputs/source-inputs.json').open('x') as output:
              json.dump({'source': os.environ['GITHUB_SHA'], 'files': expected, 'source_admission': False}, output, indent=2)
          PY_VERIFY
          env -i PATH=/usr/bin:/bin LANG=C.UTF-8 TMPDIR="$OBS_ROOT/temporary"             /usr/bin/python3 -I -S -B -c 'import runpy,sys; sys.path.insert(0,"."); sys.argv=["tools/bazel/tests/vs_cache_payloads_test.py","DockerObjectSelectionTests"]; runpy.run_path(sys.argv[0],run_name="__main__")'
      - name: Observe ten fixed batches sequentially without restoring outputs
        timeout-minutes: 45
        working-directory: ${{ github.workspace }}/${{ steps.paths.outputs.control }}
        env:
          OBS_ROOT: ${{ steps.paths.outputs.root }}
        run: |
          python3 -I -S -B - <<'PY_OBSERVE'
          import hashlib, json, os, subprocess
          from pathlib import Path
          root = Path(os.environ['OBS_ROOT'])
          selections = {'tools/bazel/ci/legacy_archive_observation/selection-01.json': 'a349e82b5feafea668d5289dd87f35729940433a3b65ab5711dca8e5b6b4f501', 'tools/bazel/ci/legacy_archive_observation/selection-02.json': '2ef177e1f96dd70caa0282a5b299348efa13ae706ded1d7efa067e2249873397', 'tools/bazel/ci/legacy_archive_observation/selection-03.json': 'd922119a91bd966df33b7d62514b1ae159ff7724ef67f9a5c723bb1cb557767d', 'tools/bazel/ci/legacy_archive_observation/selection-04.json': 'd123aeeff082db40dfaf8515de887890f968b3971f9fd8154f5e42b3d726c661', 'tools/bazel/ci/legacy_archive_observation/selection-05.json': 'c11709d4a4f63bbc2acbc76c33f74d851d1955444b07ebc38c650c8686e7dcfd', 'tools/bazel/ci/legacy_archive_observation/selection-06.json': '326d943b4468661a7b470b429658c1d7cbd7742bf12b1c9d63552bb7f31bdf24', 'tools/bazel/ci/legacy_archive_observation/selection-07.json': 'df801d948782de2ca0d8d7f04e626bef77044ba59bc223b99537ae9aa3fb94e7', 'tools/bazel/ci/legacy_archive_observation/selection-08.json': '75da8d98d1a509fc8bd05f092177bfa5b62721ec35343085bd259f92391824f4', 'tools/bazel/ci/legacy_archive_observation/selection-09.json': 'cde5ff62379cf6da87d3b11d0bd898e6b0d888d4b72f787e928ff762164eb322', 'tools/bazel/ci/legacy_archive_observation/selection-10.json': 'a78906e4ac3613a0b0798a2d5a65a2578d223e628861472db919ace270406b0a'}
          environment = {key: os.environ[key] for key in ('GITHUB_REPOSITORY', 'GITHUB_EVENT_NAME', 'GITHUB_ACTOR',
                         'GITHUB_TRIGGERING_ACTOR', 'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'GITHUB_SHA',
                         'GITHUB_WORKSPACE', 'RUNNER_NAME')}
          environment.update(PATH='/usr/bin:/bin', LANG='C.UTF-8', TMPDIR=str(root / 'temporary'),
                             RUNNER_TEMP=str(root / 'outputs'))
          for name, digest in selections.items():
              output = root / 'outputs' / (Path(name).stem + '.observation.json')
              subprocess.run(['/usr/bin/python3', '-I', '-S', '-B', '-c',
                              'import runpy,sys; sys.path.insert(0,"."); runpy.run_module("tools.bazel.ci.vs_cache_payloads",run_name="__main__")',
                              '--worker', environment['RUNNER_NAME'], '--selection', name,
                              '--selection-sha256', digest, '--output', str(output)],
                             env=environment, stdin=subprocess.DEVNULL, timeout=270, check=True)
          reports = [json.loads(path.read_text()) for path in sorted((root / 'outputs').glob('selection-*.observation.json'))]
          with (root / 'outputs/summary.json').open('x') as output:
              json.dump({'status': 'ORIGINAL_LEGACY_OBJECT_METADATA_ONLY', 'batches': len(reports),
                         'observed_objects': sum(x['observed_objects'] for x in reports),
