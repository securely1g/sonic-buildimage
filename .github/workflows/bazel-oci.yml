  checks:
    if: github.event_name != 'workflow_dispatch' || inputs.source_image == 'none'
    name: OCI regression checks (AMD64)
    runs-on: ubuntu-24.04
    outputs:
      p4_sources_artifact_id: ${{ steps.p4_sources_upload.outputs.artifact-id }}
    # No SWSS/Syncd package compilation: those checks reuse the full Make build.
    timeout-minutes: 60
    container:
      image: debian:trixie-20260918@sha256:9cc080028c43b27d2074d63a5f9caf7166d731494965616c1a6d2827a004585c
      # Reap any Bazel processes used for dependency resolution.
      options: --init
    env:
      # Draft catalog for root-module resolution; the full Make VS job is separate.
      BAZEL: ${{ github.workspace }}/tools/bazel/ci/libteam_draft_bazel.sh
    defaults:
      run:
        shell: bash
    steps:
      - name: Install execution tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            autoconf automake binutils binutils-gold build-essential busybox ca-certificates curl \
            gdb git j2cli jq libarchive-tools libtool libxml2 make pigz pkg-config python3 python3-jinja2 redis-server squashfs-tools tar unzip zstd

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check generated dependency state
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test ! -e MODULE.bazel.lock
          test -z "$(git ls-files -- MODULE.bazel.lock)"
          git check-ignore MODULE.bazel.lock

      - name: Check hosted storage
        run: df -h "$GITHUB_WORKSPACE" "$HOME"

      - name: Check out the pinned GitHub input reader
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: securely1g/sonic-bazel-registry
          ref: 997796400cc3eefc1f0590b227cd9b74c2141424
          path: .bazel-inputs/github-reader
          sparse-checkout-cone-mode: false
          sparse-checkout: ci/github_sources.py
          persist-credentials: false

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-version: 1.29.0
          bazelisk-cache: true
          repository-cache: true
          # This job resolves/downloads dependencies but executes no Bazel builds.
          disk-cache: false
          cache-version: "8.5.1"

      - name: Configure the verified source mirror
        run: |
          python3 - <<'PYCFG'
          import hashlib
          import os
          from pathlib import Path
          from urllib.request import urlopen
          # Reuse the verified common mirrors, including mirror-first GitLab source filenames.
          url = "https://raw.githubusercontent.com/securely1g/sonic-bazel-registry/997796400cc3eefc1f0590b227cd9b74c2141424/ci/source_mirrors.cfg"
          with urlopen(url, timeout=60) as response:
              data = response.read()
          expected = "a937b05d4197544bac965bb2b96634e12423c7f82b0fd6b13d894bcd087bce3b"
          if hashlib.sha256(data).hexdigest() != expected:
              raise SystemExit("Source mirror configuration checksum mismatch")
          config = Path(os.environ["RUNNER_TEMP"]) / "sonic-source-mirrors.cfg"
          config.write_bytes(data)
          with Path(".bazelrc.user").open("a") as rc:
              rc.write("common --experimental_downloader_config=" + str(config) + "\n")
          PYCFG

      - name: Prepare checksum-pinned Bazel rule archives
        id: rule_sources
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          inputs=.bazel-inputs/github-reader/ci
          python3 -B "$inputs/github_sources.py" \
            --manifest "tools/bazel/ci/sonic-buildimage-rule-inputs.json" \
            --distdir "$PWD/artifacts/source-downloads" \
            --repository-cache "$HOME/.cache/bazel-repo" \
            --cache-dir "$HOME/.cache/sonic-github-sources" \
            --receipt artifacts/rule-inputs/rule-sources.json \
            --github-token-env GITHUB_TOKEN
          printf 'common --distdir=%s\n' "$PWD/artifacts/source-downloads" >> .bazelrc.user

      - name: Retain verified Bazel rule input provenance
        if: always() && steps.rule_sources.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bazel-rule-inputs-${{ github.job }}-${{ strategy.job-index || 0 }}-${{ github.run_attempt }}
          path: artifacts/rule-inputs/rule-sources.json
          if-no-files-found: error
          retention-days: 14

      - name: Check Make handoff and archive validation
        env:
          SOURCE_ONLY_NO_DEBS: ${{ github.event_name == 'pull_request' && (github.event.pull_request.number == 5 || github.event.pull_request.number == 51 || github.event.pull_request.number == 61 || (github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'frr-native-bazel') || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/libteam-current-native-inputs') || (github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/dash-engine-review-catalog') || contains(fromJSON('["codex/image-environment","codex/config-engine-amd64","codex/swss-native-closure","codex/swss-layer-amd64","codex/bazel-snmp","codex/eventd-oci-amd64","codex/database-oci-amd64","codex/radv-oci-amd64","codex/lldp-oci-amd64","codex/frr-oci-amd64","codex/teamd-oci-amd64","codex/orchagent-source-amd64","codex/review-registry-catalog","codex/final23-integration-staging","codex/sflow-oci-amd64","codex/otel-oci-amd64","codex/dash-ha-oci-amd64","codex/sysmgr-source-image","codex/mux-oci-amd64","codex/gbsyncd-oci-amd64","codex/dash-engine-source-image","codex/gnmi-ci-wiring","codex/p4rt-source-image","codex/syncd-source-completion","codex/source-image-worker-dispatch","codex/mgmt-framework-image"]'), github.head_ref)) }}
        run: |
          # Source-only branches skip the DEB-generating kernel fixtures.
          if [[ "$SOURCE_ONLY_NO_DEBS" == true ]]; then
            for test in tools/bazel/tests/*_test.py; do
              case "$test" in
                */kernel_test.py|*/kernel_artifacts_test.py|*/kernel_sbom_test.py)
                  echo "Skip DEB-generating kernel fixtures: $test" ;;
                *) PYTHONPATH="$PWD" python3 -B -m unittest discover -s tools/bazel/tests -p "$(basename "$test")" ;;
              esac
            done
          else
            python3 -B -m unittest discover -s tools/bazel/tests -p '*_test.py'
          fi
          python3 -B -m unittest tools.bazel.ci.p4rt_worker_receipt_test \
            tools.bazel.ci.image_worker_receipt_test tools.bazel.ci.syncd_receipt_semantics_test
          python3 -B -m unittest discover -s tools/ci/tests -p '*_test.py'
          python3 -B -m unittest discover -s tools/ci/runner -p '*_test.py'
          python3 -B tools/bazel/ci/configure_runner_cache_test.py

      - name: Retain the verified GitLab source downloads
        run: |
          mkdir -p artifacts/repository-inputs
          test "$("$BAZEL" --version)" = "bazel $(cat .bazelversion)"
          "$BAZEL" fetch --repo=@@ape+ --repo=@@download_utils+ \
            --repo=@@rules_coreutils+ --repo=@@rules_gzip+ --repo=@@toolchain_utils+
          python3 - <<'PYCODE'
          from pathlib import Path
          from tools.bazel.ci import resolution
          import os
          resolution.collect(Path.cwd(), Path("artifacts/repository-inputs"), bazel=[os.environ["BAZEL"]])
          PYCODE
          python3 -B tools/bazel/gzip/source_archive.py \
            --repository-cache "$("$BAZEL" info repository_cache)" \
            --module-graph artifacts/repository-inputs/module-graph.json \
            --output artifacts/repository-inputs \
            > artifacts/repository-inputs/receipt.json

      - name: Retain the native Redis test helper for installed-image checks
        run: |
          mkdir -p artifacts/repository-inputs/test-helpers
          cp /usr/bin/redis-server artifacts/repository-inputs/test-helpers/redis-server
          cp /usr/share/doc/redis-server/copyright artifacts/repository-inputs/test-helpers/redis-copyright
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess
          root = pathlib.Path("artifacts/repository-inputs/test-helpers")
          binary = root / "redis-server"
          receipt = {
              "_generated": {"notice": "AUTO-GENERATED. DO NOT EDIT MANUALLY.",
                             "generator": ".github/workflows/bazel-oci.yml"},
              "purpose": "Isolated test helper; not installed in the Syncd image",
              "architecture": subprocess.check_output(["dpkg", "--print-architecture"], text=True).strip(),
              "package_version": subprocess.check_output(["dpkg-query", "-W", "-f=${Version}", "redis-server"], text=True),
              "sha256": hashlib.sha256(binary.read_bytes()).hexdigest(),
              "version": subprocess.check_output([str(binary.resolve()), "--version"], text=True).strip(),
          }
          assert receipt["architecture"] == "amd64"
          (root / "redis.json").write_text(json.dumps(receipt, indent=2) + "\n")
          PY

      - name: Upload the source downloads for the VS job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bazel-repository-inputs
          path: |
            artifacts/repository-inputs/ape-1.0.1/src.tar.gz
            artifacts/repository-inputs/download_utils-1.0.1/src.tar.gz
            artifacts/repository-inputs/rules_coreutils-1.0.1/src.tar.gz
            artifacts/repository-inputs/rules_gzip-1.0.0/src.tar.gz
            artifacts/repository-inputs/toolchain_utils-1.0.2/src.tar.gz
            artifacts/repository-inputs/receipt.json
            artifacts/repository-inputs/test-helpers/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Fetch pinned P4 source inputs for the native worker
        id: p4_sources_fetch
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
          (github.event_name == 'pull_request' &&
           github.event.pull_request.head.repo.full_name == github.repository) ||
          (github.event_name == 'workflow_dispatch' && !inputs.skip_vs)
        run: |
          python3 -B tools/ci/p4_source_inputs.py --fetch \
            --manifest src/p4lang/source-inputs.json \
            --directory artifacts/p4-source-inputs/sources \
            --receipt artifacts/p4-source-inputs/receipt.json
          echo 'P4 source-byte pins verified. The unchanged upstream P4C descriptor has a known checksum discrepancy; receipt.json records its declared and published hashes separately.' >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve P4 source inputs and verification receipt
        id: p4_sources_upload
        if: always() && (steps.p4_sources_fetch.outcome == 'success' || steps.p4_sources_fetch.outcome == 'failure')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: p4-source-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/p4-source-inputs/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Report validation scope
        run: |
          echo 'Hosted checks cover regressions and dependency resolution; the VS installer builds directly in the SONiC slave container job.' >> "$GITHUB_STEP_SUMMARY"

  vs:
    name: Make VS with Bazel SWSS (AMD64)
    needs: [checks]
    # Replaced by vs_container below. Keep the legacy recipe available while
    # transitioning, but do not schedule another host-driven Make VS build.
    if: ${{ false }}
    # Use the ONIE pool; checkout still uses this event's ref and SHA.
    runs-on:
      - self-hosted
      - linux
      - x64
      - sonic-vs-bin
    timeout-minutes: 720
    env:
      SONIC_CI_CONTAINER_LABEL: io.sonic-buildimage.ci-job=${{ github.repository }}:${{ github.run_id }}:${{ github.run_attempt }}:vs
      # Use Docker Hub's canonical references with the existing pinned digests.
      DEFAULT_CONTAINER_REGISTRY: ""
      MIRROR_URLS: https://deb.debian.org/debian/
      MIRROR_SECURITY_URLS: https://deb.debian.org/debian-security/
      SONIC_CONFIG_USE_DOCKER_CACHE: "y"
      # Keep build results outside run-specific checkouts and disposable builders.
      SONIC_BAZEL_CACHE_SOURCE: /data/sonic-runner/cache/sonic-buildimage/bazel
      SONIC_DPKG_CACHE_SOURCE: /data/sonic-runner/cache/sonic-buildimage/packages
      SONIC_DPKG_CACHE_METHOD: rwcache
      BAZEL_CONTAINER_ARGS: >-
        --distdir=/bazel_cache/distdir/ape-1.0.1
        --distdir=/bazel_cache/distdir/download_utils-1.0.1
        --distdir=/bazel_cache/distdir/rules_coreutils-1.0.1
        --distdir=/bazel_cache/distdir/rules_gzip-1.0.0
        --distdir=/bazel_cache/distdir/toolchain_utils-1.0.2
    defaults:
      run:
        shell: bash
        working-directory: vs-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check source-build runner capacity
        working-directory: ${{ github.workspace }}
        run: |
          docker info > /dev/null
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          workspace = Path.cwd().resolve()
          usage = shutil.disk_usage(workspace)
          free_gib = usage.free / 1024**3
          print(f'Workspace: {workspace}; available: {free_gib:.1f} GiB; '
                f'total: {usage.total / 1024**3:.1f} GiB', flush=True)
          if usage.free < 100 * 1024**3:
              raise SystemExit(f'The full Make VS build needs at least 100 GiB free; '
                               f'{workspace} has {free_gib:.1f} GiB available')
          PY

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # An interrupted submodule clone can leave an invalid HEAD that the
          # checkout action's superproject clean/reset cannot repair.
          path: vs-${{ github.run_id }}-${{ github.run_attempt }}
          persist-credentials: false
          submodules: recursive

          fetch-depth: 64
      - name: Verify the tested PR source context
        id: source_context
        if: github.event_name == 'pull_request'
        run: |
          git config --global --add safe.directory "$PWD"
          python3 -B -m tools.bazel.ci.image_worker_receipt source-context --directory artifacts/source-context
      - name: Check VS build prerequisites
        run: python3 -B tools/ci/runner/preflight.py --workspace "$PWD" --build-target sonic-vs.bin

      - name: Prepare persistent agent caches
        run: |
          # Keep ordinary Make writers separate from older root-created cache entries.
          SONIC_BAZEL_CACHE_SOURCE="$SONIC_BAZEL_CACHE_SOURCE/make-uid-$(id -u)"
          install -d -m 0700 "$SONIC_BAZEL_CACHE_SOURCE" "$SONIC_DPKG_CACHE_SOURCE"
          test -w "$SONIC_BAZEL_CACHE_SOURCE"
          test -w "$SONIC_DPKG_CACHE_SOURCE"
          # A writable cache root does not prove old digest directories are writable.
          # Check directories only: cached content files may intentionally be read-only.
          for cache in repository_cache disk_cache kernel-linux-sandbox/repository_cache kernel-linux-sandbox/disk_cache; do
            cache_path="$SONIC_BAZEL_CACHE_SOURCE/$cache"
            if test -d "$cache_path"; then
              blocked=$(find "$cache_path" -type d ! -writable -print -quit)
              if test -n "$blocked"; then
                stat -c 'Unwritable Bazel cache directory: %n (uid=%u gid=%g mode=%a)' "$blocked" >&2
                echo 'Repair this cache directory for the runner user before rebuilding; preserve cached content.' >&2
                exit 1
              fi
            fi
          done
          printf 'SONIC_BAZEL_CACHE_SOURCE=%s\n' "$SONIC_BAZEL_CACHE_SOURCE" >> "$GITHUB_ENV"
          printf 'Bazel cache: %s\nMake package cache: %s (%s)\n' \
            "$SONIC_BAZEL_CACHE_SOURCE" "$SONIC_DPKG_CACHE_SOURCE" "$SONIC_DPKG_CACHE_METHOD"

      - name: Download verified sources from the hosted checks
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bazel-repository-inputs
          path: vs-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/vs/repository-inputs

      - name: Prepare the shared Bazel source-download directory
        run: |
          python3 -B tools/bazel/gzip/source_archive.py \
            --archives-dir artifacts/vs/repository-inputs \
            --output "$SONIC_BAZEL_CACHE_SOURCE/distdir" \
            > artifacts/vs/source-download-receipt.json

      - name: Configure the native VS image
        run: |
          mkdir -p artifacts/vs
          make init 2>&1 | tee artifacts/vs/init.log
          make configure PLATFORM=vs PLATFORM_ARCH=amd64 \
            SONIC_BUILDER_EXTRA_CMDLINE="--label $SONIC_CI_CONTAINER_LABEL -e BAZEL=$BAZEL" \
            2>&1 | tee artifacts/vs/configure.log

      - name: Check nested Docker in both build environments
        timeout-minutes: 10
        run: |
          set -o pipefail
          for build_env in bookworm trixie; do
            make -f Makefile.work BLDENV="$build_env" docker-start \
              SONIC_BUILDER_EXTRA_CMDLINE="--label $SONIC_CI_CONTAINER_LABEL -e BAZEL=$BAZEL" \
              2>&1 | tee "artifacts/vs/docker-start-$build_env.log"
          done

      - name: Check native kernel sandbox in Trixie
        timeout-minutes: 5
        run: |
          set -o pipefail
          make -f Makefile.work BLDENV=trixie sonic-slave-run \
            SONIC_BUILDER_EXTRA_CMDLINE="--label $SONIC_CI_CONTAINER_LABEL -e BAZEL=$BAZEL" \
            SONIC_RUN_CMDS='python3 -B tools/bazel/ci/check_kernel_sandbox.py' \
            2>&1 | tee artifacts/vs/kernel-sandbox.log

      - name: Build the VS installer (.bin)
        id: vs_build
        run: |
          set -o pipefail
          bash tools/bazel/ci/build_vs.sh 2>&1 | tee artifacts/vs/build.log

      - name: Validate VS container pairs and P4 debug symbols
        id: vs_validation
        run: |
          set -o pipefail
          bash tools/bazel/ci/validate_vs.sh 2>&1 | tee artifacts/vs/validation.log

      - name: Verify installed base, SWSS and Syncd images
        timeout-minutes: 20
        run: |
          # Make clears DOCKER_ROOT on entry; preserve the completed build's store.
          make -f Makefile.work BLDENV=trixie sonic-slave-run \
            DOCKER_ROOT="$PWD/fsroot.docker.verify-images" \
            SONIC_CONFIG_USE_NATIVE_DOCKERD_FOR_BUILD=n \
            SONIC_BUILDER_EXTRA_CMDLINE="--label $SONIC_CI_CONTAINER_LABEL --cgroupns=private" \
            SONIC_RUN_CMDS="sudo python3 -B tools/bazel/ci/prepare_nested_docker.py && \
              make -f slave.mk docker-start SONIC_CONFIG_USE_NATIVE_DOCKERD_FOR_BUILD=n && \
              python3 -B tools/bazel/ci/validate_runtime.py \
                --images-policy artifacts/vs/swss-installed-images-policy.json \
                --images-policy artifacts/vs/syncd-installed-images-policy.json --target target \
                --output artifacts/vs/installed-images.json" \
            2>&1 | tee artifacts/vs/installed-images.log

      - name: Retain VS runtime and debug archive reuse evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonic-vs-orchagent-reuse-amd64
          path: |
            vs-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/vs/orchagent-reuse.json
            vs-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/vs/runtime-debug-pairs.json
            vs-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/vs/runtime-debug-pairs-timing.json
            vs-${{ github.run_id }}-${{ github.run_attempt }}/target/sonic-vs.bin.dockers
          if-no-files-found: error
          retention-days: 14

      - name: Validate SWSS source packages from the Make build
        id: swss_validation
        if: ${{ !cancelled() && steps.vs_build.outcome == 'success' }}
        run: |
          cat > artifacts/vs/check-swss-source.sh <<'SH'
          set -euo pipefail
          option_lines=$(python3 tools/bazel/build_helpers.py options \
            --cache-directory="${BAZEL_CONTAINER_CACHE_DIR-${BAZEL_SWSS_CACHE_DIR:-}}" \
            --arguments="${BAZEL_CONTAINER_ARGS-${BAZEL_SWSS_ARGS:-}}")
          ci_options=()
          if test -n "$option_lines"; then
            while IFS= read -r option; do ci_options+=("--bazel-arg=$option"); done <<< "$option_lines"
          fi
          python3 -B tools/bazel/ci/container.py --reuse-build \
            --container //dockers/docker-orchagent --source-file rules/docker-orchagent.mk \
            --bazel "$BAZEL" --artifacts artifacts/swss \
            --bazel-arg=--platforms=@sonic_build_infra//platforms:x86_64_trixie \
            --bazel-arg=--host_platform=@sonic_build_infra//platforms:x86_64_trixie \
            "${ci_options[@]}"
          SH
          make -f Makefile.work BLDENV=trixie sonic-slave-run \
            DOCKER_ROOT="$PWD/target/docker-source-validation" \
            SONIC_BUILDER_EXTRA_CMDLINE="--label $SONIC_CI_CONTAINER_LABEL -e BAZEL=$BAZEL -e BAZEL_CONTAINER_ARGS" \
            SONIC_RUN_CMDS="bash artifacts/vs/check-swss-source.sh" \
            2>&1 | tee artifacts/vs/swss-source-validation.log

      - name: Prepare SWSS source artifact list
        id: swss_artifacts
        if: always()
        env:
          CI_JOB_STATUS: ${{ steps.swss_validation.outcome == 'success' && 'success' || 'failure' }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CI_BASE_SHA: ${{ steps.source_context.outputs.tested_base || github.event.pull_request.base.sha }}
        run: |
          python3 -B tools/bazel/ci/public_artifacts.py source \
            --workspace "$PWD" --upload-root "$GITHUB_WORKSPACE" \
            --job-status "$CI_JOB_STATUS" --revision "$(git rev-parse HEAD)" \
            --architecture "amd64" \
            --head-sha "$CI_HEAD_SHA" --base-sha "$CI_BASE_SHA" \
            --github-output "$GITHUB_OUTPUT"

      - name: Upload public source layers and evidence
        if: always() && steps.swss_artifacts.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: swss-source-layers-amd64
          path: ${{ steps.swss_artifacts.outputs.paths }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 1

      - name: Validate Syncd source packages from the Make build
        id: syncd_validation
        if: ${{ !cancelled() && steps.vs_build.outcome == 'success' }}
        run: |
          mkdir -p artifacts/syncd-vs
          git rev-parse HEAD > artifacts/syncd-vs/revision.txt
          sha256sum platform/vs/docker-syncd-vs/bazel/apt.lock.json \
            platform/vs/docker-syncd-vs/BUILD.bazel > artifacts/syncd-vs/input-locks.sha256
          cat > artifacts/vs/check-syncd-source.sh <<'SH'
          set -euo pipefail
          option_lines=$(python3 tools/bazel/build_helpers.py options \
            --cache-directory="${BAZEL_CONTAINER_CACHE_DIR-${BAZEL_SWSS_CACHE_DIR:-}}" \
            --arguments="${BAZEL_CONTAINER_ARGS-${BAZEL_SWSS_ARGS:-}}")
          ci_options=()
          if test -n "$option_lines"; then
            while IFS= read -r option; do ci_options+=("--bazel-arg=$option"); done <<< "$option_lines"
          fi
          python3 -B tools/bazel/ci/container.py --reuse-build \
            --container //platform/vs/docker-syncd-vs --source-file platform/vs/docker-syncd-vs.mk \
            --bazel "$BAZEL" --artifacts artifacts/syncd-vs/bazel \
            --bazel-arg=--platforms=@sonic_build_infra//platforms:x86_64_trixie \
            --bazel-arg=--host_platform=@sonic_build_infra//platforms:x86_64_trixie \
            --bazel-arg=--config=syncd-dash "${ci_options[@]}"
          python3 -B tools/bazel/ci/bazel_commands.py \
            --bazel "$BAZEL" --bazel-arg=--config=syncd-dash "${ci_options[@]}" \
            --output artifacts/syncd-vs/p4-image-test-analysis.json \
            //tools/bazel/tests:syncd_p4_images_test
          SH
          make -f Makefile.work BLDENV=trixie sonic-slave-run \
            DOCKER_ROOT="$PWD/target/docker-source-validation" \
            SONIC_BUILDER_EXTRA_CMDLINE="--label $SONIC_CI_CONTAINER_LABEL -e BAZEL=$BAZEL -e BAZEL_CONTAINER_ARGS" \
            SONIC_RUN_CMDS="bash artifacts/vs/check-syncd-source.sh" \
            2>&1 | tee artifacts/vs/syncd-source-validation.log

      - name: Prepare Syncd source artifact list
        id: syncd_artifacts
        if: always()
        env:
          CI_JOB_STATUS: ${{ steps.syncd_validation.outcome == 'success' && 'success' || 'failure' }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CI_BASE_SHA: ${{ steps.source_context.outputs.tested_base || github.event.pull_request.base.sha }}
        run: |
          python3 -B tools/bazel/ci/public_artifacts.py syncd \
            --workspace "$PWD" --upload-root "$GITHUB_WORKSPACE" \
            --job-status "$CI_JOB_STATUS" --revision "$(git rev-parse HEAD)" \
            --architecture "amd64" \
            --head-sha "$CI_HEAD_SHA" --base-sha "$CI_BASE_SHA" \
            --github-output "$GITHUB_OUTPUT"

      - name: Upload public contract evidence
        if: always() && steps.syncd_artifacts.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: syncd-vs-oci-contracts-amd64
          path: ${{ steps.syncd_artifacts.outputs.paths }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 1


      - name: Remove this job's remaining build containers
        if: always()
        timeout-minutes: 2
        working-directory: ${{ github.workspace }}
        env:
          VS_CHECKOUT: vs-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          # Killing a docker client does not stop its daemon-owned container.
          # Match this repository/run/attempt only; keep the bind-mounted logs.
          containers=$(docker ps --all --quiet --filter "label=$SONIC_CI_CONTAINER_LABEL")
          if test -n "$containers"; then
            readarray -t container_ids <<< "$containers"
            mkdir -p "$VS_CHECKOUT/artifacts/vs"
            for container_id in "${container_ids[@]}"; do
              docker logs "$container_id" > "$VS_CHECKOUT/artifacts/vs/container-$container_id.log" 2>&1 || true
            done
            if ! docker rm --force "${container_ids[@]}"; then
              # --rm containers can disappear between listing and removal.
              remaining=$(docker ps --all --quiet --filter "label=$SONIC_CI_CONTAINER_LABEL")
              test -z "$remaining"
            fi
          fi

      - name: Prepare public artifact list
        id: public_artifacts
        if: always()
        env:
          CI_JOB_STATUS: ${{ job.status }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CI_BASE_SHA: ${{ steps.source_context.outputs.tested_base || github.event.pull_request.base.sha }}
        run: |
          python3 -B tools/bazel/ci/public_artifacts.py vs \
            --workspace "$PWD" --upload-root "$GITHUB_WORKSPACE" \
            --job-status "$CI_JOB_STATUS" --revision "$(git rev-parse HEAD)" \
            --architecture "amd64" \
            --head-sha "$CI_HEAD_SHA" --base-sha "$CI_BASE_SHA" \
            --github-output "$GITHUB_OUTPUT"

      - name: Upload public VS build summary
        if: always() && steps.public_artifacts.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonic-vs-build-diagnostics-amd64
          path: ${{ steps.public_artifacts.outputs.paths }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 1

      - name: Retain shared image validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonic-vs-image-validation-amd64
          path: |
            vs-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/vs/swss-images/
            vs-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/vs/syncd-p4-images/
            vs-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/vs/*-installed-images-policy.json
            vs-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/vs/installed-images.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload VS image and OCI container archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonic-vs-make-bazel-swss-amd64
          path: |
            vs-${{ github.run_id }}-${{ github.run_attempt }}/target/sonic-vs.bin
            vs-${{ github.run_id }}-${{ github.run_attempt }}/target/docker-orchagent.gz
            vs-${{ github.run_id }}-${{ github.run_attempt }}/target/docker-orchagent-dbg.gz
            vs-${{ github.run_id }}-${{ github.run_attempt }}/target/docker-syncd-vs.gz
            vs-${{ github.run_id }}-${{ github.run_attempt }}/target/docker-syncd-vs-dbg.gz
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Retain the tested PR source context
        if: always() && github.event_name == 'pull_request' && (steps.source_context.outcome == 'success')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: source-context-${{ github.job }}-${{ strategy.job-index || 0 }}-${{ github.run_attempt }}
          path: vs-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/source-context/context.json
          if-no-files-found: error
          retention-days: 14
  vs_container:
    name: VS installer in SONiC slave (AMD64)
    needs: [checks]
    # Source PRs #5/#51/#61 and the SWSS closure follow-up do not build DEBs.
    if: >-
      (github.event_name != 'workflow_dispatch' || inputs.source_image == 'none') &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       (github.event.pull_request.number != 5 && github.event.pull_request.number != 51 && github.event.pull_request.number != 61 && github.head_ref != 'frr-native-bazel' && github.event.pull_request.head.ref != 'codex/libteam-current-native-inputs' && !(github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/dash-engine-review-catalog') && !contains(fromJSON('["codex/image-environment","codex/config-engine-amd64","codex/swss-native-closure","codex/swss-layer-amd64","codex/bazel-snmp","codex/eventd-oci-amd64","codex/database-oci-amd64","codex/radv-oci-amd64","codex/lldp-oci-amd64","codex/frr-oci-amd64","codex/teamd-oci-amd64","codex/orchagent-source-amd64","codex/review-registry-catalog","codex/final23-integration-staging","codex/sflow-oci-amd64","codex/otel-oci-amd64","codex/dash-ha-oci-amd64","codex/sysmgr-source-image","codex/mux-oci-amd64","codex/gbsyncd-oci-amd64","codex/dash-engine-source-image","codex/gnmi-ci-wiring","codex/p4rt-source-image","codex/syncd-source-completion","codex/source-image-worker-dispatch","codex/mgmt-framework-image"]'), github.head_ref))) ||
      (github.event_name == 'workflow_dispatch' && !inputs.skip_vs))
    runs-on: [self-hosted, linux, x64, sonic-slave-container]
    timeout-minutes: 720
    # The four registered slots share lgh4. Only one full native build may
    # consume its memory at a time; each worker still handles one job and exits.
    concurrency:
      group: sonic-slave-container-vs
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    env:
      EXPECTED_MANAGER_REVISION: 549469bac66bc9fad6bafcc8a39b946b5527dd40
      SONIC_BUILD_GIT_NAME: Guohan Lu
      SONIC_BUILD_GIT_EMAIL: securely1g@gmail.com
      PREFER_DEBIAN_REPO: "y"
      # Direct slave.mk bypasses the outer Make retry wrapper. Retry only
      # native Docker builds; strict APT refreshes keep failed indexes uncached.
      DOCKER_BUILD: ./scripts/run_with_retry docker build
      SONIC_BUILD_RETRY_COUNT: "2"
      SONIC_BUILD_RETRY_INTERVAL: "10"
      # Contain APT 3.0.3's delayed-retry warning queue (Debian #1117797).
      # The generator removes this temporary policy before image export.
      SONIC_DOCKER_APT_RETRIES: "0"
      BAZEL_CONTAINER_ARGS: >-
        --jobs=4 --local_resources=memory=12288
        --distdir=/bazel_cache/distdir/ape-1.0.1
        --distdir=/bazel_cache/distdir/download_utils-1.0.1
        --distdir=/bazel_cache/distdir/rules_coreutils-1.0.1
        --distdir=/bazel_cache/distdir/rules_gzip-1.0.0
        --distdir=/bazel_cache/distdir/toolchain_utils-1.0.2
    steps:
      - name: Checkout repository and pinned submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Download verified source archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bazel-repository-inputs
          path: artifacts/vs/repository-inputs

      - name: Prepare the privileged SONiC slave
        run: bash tools/bazel/ci/prepare_vs_slave.sh

      - name: Require the P4 source artifact from this producer job
        env:
          P4_SOURCES_ARTIFACT_ID: ${{ needs.checks.outputs.p4_sources_artifact_id }}
        run: '[[ "$P4_SOURCES_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]'

      - name: Download the pinned P4 source inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.checks.outputs.p4_sources_artifact_id }}
          merge-multiple: true
          path: artifacts/vs/p4-source-inputs

      - name: Verify P4 source bytes before native Make
        run: |
          python3 -B tools/ci/p4_source_inputs.py \
            --manifest src/p4lang/source-inputs.json \
            --directory artifacts/vs/p4-source-inputs/sources \
            --receipt artifacts/vs/p4-source-inputs-verified.json

      - name: Configure persistent caches
        env:
          BAZEL_REMOTE_AUTH: ${{ secrets.BAZEL_REMOTE_AUTH }}
        run: |
          python3 -B tools/bazel/ci/configure_runner_cache.py \
            --jobs=4 --local-memory-mb=12288
          python3 -B tools/bazel/gzip/source_archive.py \
            --archives-dir artifacts/vs/repository-inputs \
            --output /bazel_cache/distdir > artifacts/vs/source-download-receipt.json

      - name: Build sonic-vs.bin directly with slave.mk
        id: native_build
        env:
          BAZEL_REMOTE_AUTH: ${{ secrets.BAZEL_REMOTE_AUTH }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/sonic-vs-slave.env"
          cd /sonic
          git rev-parse HEAD > artifacts/vs/build-revision.txt
          make -f slave.mk target/sonic-vs.bin \
            P4LANG_SOURCE_BASE_URL=file:/sonic/artifacts/vs/p4-source-inputs/sources \
            BUILD_WITH_BAZEL_WHEN_AVAILABLE=y \
            INCLUDE_VS_DASH_SAI=y \
            INCLUDE_FIPS=y \
            ENABLE_ASAN=n \
            ENABLE_SYNCD_RPC=n 2>&1 | tee artifacts/vs/build.log
          test -s target/sonic-vs.bin
          test -s target/sonic-vs.bin.dockers
          test "$(git rev-parse HEAD)" = "$(cat artifacts/vs/build-revision.txt)"

      - name: Validate the installer and retained container pairs
        env:
          BAZEL_REMOTE_AUTH: ${{ secrets.BAZEL_REMOTE_AUTH }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/sonic-vs-slave.env"
          cd /sonic
          python3 -B scripts/validate_sonic_version.py target/sonic-vs.bin \
            --installer --secure-upgrade-mode no_sign \
            --expected-commit-id "$(git rev-parse --short HEAD)" \
            --json-output artifacts/vs/sonic-version.json
          python3 -B tools/bazel/ci/vs_archive_reuse.py capture-pairs \
            --workspace "$PWD" --receipt artifacts/vs/runtime-debug-pairs.json \
            --orchagent-receipt artifacts/vs/orchagent-reuse.json
          # Reuse this same slave and its Bazel server for the P4/debug checks.
          bash tools/bazel/ci/verify_vs_oci.sh make -f slave.mk \
            P4LANG_SOURCE_BASE_URL=file:/sonic/artifacts/vs/p4-source-inputs/sources \
            BUILD_WITH_BAZEL_WHEN_AVAILABLE=y INCLUDE_VS_DASH_SAI=y INCLUDE_FIPS=y \
            ENABLE_ASAN=n ENABLE_SYNCD_RPC=n 2>&1 | tee artifacts/vs/validation.log
          python3 -B tools/bazel/ci/vs_archive_reuse.py verify-pairs \
            --workspace "$PWD" --receipt artifacts/vs/runtime-debug-pairs.json \
            --orchagent-receipt artifacts/vs/orchagent-reuse.json
          sha256sum target/sonic-vs.bin target/docker-orchagent{,-dbg}.gz \
            target/docker-syncd-vs{,-dbg}.gz > artifacts/vs/outputs.sha256

      - name: Verify installed base, SWSS and Syncd images
        timeout-minutes: 20
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/sonic-vs-slave.env"
          cd /sonic
          # Reuse the worker-private daemon prepared before the native build.
          python3 -B tools/bazel/ci/validate_runtime.py \
            --images-policy artifacts/vs/swss-installed-images-policy.json \
            --images-policy artifacts/vs/syncd-installed-images-policy.json --target target \
            --output artifacts/vs/installed-images.json \
            2>&1 | tee artifacts/vs/installed-images.log

      - name: Publish the installer and matching container archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonic-vs-slave-amd64
          path: |
            target/sonic-vs.bin
            target/sonic-vs.bin.dockers
            target/docker-orchagent.gz
            target/docker-orchagent-dbg.gz
            target/docker-syncd-vs.gz
            target/docker-syncd-vs-dbg.gz
            artifacts/vs/outputs.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Preserve build receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonic-vs-slave-evidence-amd64
          path: |
            artifacts/vs/*.json
            artifacts/vs/*.txt
            artifacts/vs/*.sha256
            artifacts/vs/syncd-p4-images/validation.json
            MODULE.bazel.lock
          if-no-files-found: warn
          retention-days: 14

      - name: Retain shared image validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonic-vs-image-validation-amd64
          path: |
            artifacts/vs/swss-images/
            artifacts/vs/syncd-p4-images/
            artifacts/vs/*-installed-images-policy.json
            artifacts/vs/installed-images.json
          if-no-files-found: warn
          retention-days: 14

      - name: Stop this worker's private Docker daemon
        if: always()
        run: |
          if test -s "$RUNNER_TEMP/sonic-dockerd.pid"; then
            sudo -n kill -TERM "$(cat "$RUNNER_TEMP/sonic-dockerd.pid")"
          fi

  gnmi_native:
    if: github.event_name != 'workflow_dispatch' || inputs.source_image == 'none'
    name: Build gNMI OCI images and symbols (AMD64)
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    container: debian:trixie-20260918@sha256:9cc080028c43b27d2074d63a5f9caf7166d731494965616c1a6d2827a004585c
    defaults:
      run:
        shell: bash
    env:
      BAZEL: tools/bazel/ci/review_bazel.sh
      SONIC_BAZEL_REGISTRY_REVISION: e6ef022c94dd2fdeeac364dfd591f9701cd37c29
      BAZELISK_GITHUB_TOKEN: ""
    steps:
      - name: Install execution and inspection tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends binutils binutils-gold build-essential ca-certificates file gdb git j2cli jq libarchive-tools libxml2 python3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-version: 1.29.0
          bazelisk-cache: true
          repository-cache: true
          disk-cache: gnmi-image-amd64
          cache-version: "8.5.1"
      - name: Configure the verified source mirror
        run: |
          python3 - <<'PYCFG'
          import hashlib
          import os
          from pathlib import Path
          from urllib.request import urlopen
          # Load the merged registry configuration. Bazel verifies each archive against its pinned checksum.
          url = "https://raw.githubusercontent.com/securely1g/sonic-bazel-registry/97cc502556b7ec3435d2d67b105315bcc18bb47e/ci/source_mirrors.cfg"
          with urlopen(url, timeout=60) as response:
              data = response.read()
          expected = "ddd6f40504a30e138a62be0d728e1a352391d0f781c927eaf4ea45c44d8a0720"
          if hashlib.sha256(data).hexdigest() != expected:
              raise SystemExit("Source mirror configuration checksum mismatch")
          config = Path(os.environ["RUNNER_TEMP"]) / "sonic-source-mirrors.cfg"
          config.write_bytes(data)
          with Path(".bazelrc.user").open("a") as rc:
              rc.write("common --experimental_downloader_config=" + str(config) + "\n")
          PYCFG

      - name: Validate Make handoff and version inputs
        run: |
          python3 -B tools/bazel/tests/gnmi_make_test.py
          PYTHONPATH="$PWD" python3 -B tools/bazel/ci/gnmi_image_test.py
      - name: Build gNMI runtime and debug images (dialout enabled)
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 -B tools/bazel/ci/gnmi_image.py build --bazel "$BAZEL" --dialout enabled --artifacts artifacts/gnmi/enabled
      - name: Validate completed gNMI images and symbols (dialout enabled)
        run: python3 -B tools/bazel/ci/gnmi_image.py validate --artifacts artifacts/gnmi/enabled
      - name: Verify no-op and restored image hashes (dialout enabled)
        run: |
          python3 -B tools/bazel/ci/gnmi_image.py incremental --bazel "$BAZEL" --artifacts artifacts/gnmi/enabled
          git diff --exit-code
      - name: Build gNMI runtime and debug images (dialout disabled)
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 -B tools/bazel/ci/gnmi_image.py build --bazel "$BAZEL" --dialout disabled --artifacts artifacts/gnmi/disabled
      - name: Validate completed gNMI images and symbols (dialout disabled)
        run: python3 -B tools/bazel/ci/gnmi_image.py validate --artifacts artifacts/gnmi/disabled
      - name: Verify no-op and restored image hashes (dialout disabled)
        run: |
          python3 -B tools/bazel/ci/gnmi_image.py incremental --bazel "$BAZEL" --artifacts artifacts/gnmi/disabled
          git diff --exit-code
      - name: Prepare public evidence
        id: public_evidence
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from tools.bazel.ci.public_artifacts import safe_json, dependency_json, bep_summary
          for profile in ('enabled', 'disabled'):
              root = Path('artifacts/gnmi') / profile
              root.mkdir(parents=True, exist_ok=True)
              if (root / 'build-receipt.json').exists():
                  receipt = json.loads((root / 'build-receipt.json').read_text())
                  public = {key: receipt[key] for key in ('status', 'architecture', 'revision', 'image_version', 'artifacts') if key in receipt}
                  safe_json(public)
                  (root / 'public-receipt.json').write_text(json.dumps(public, indent=2) + '\n')
              for name in ('validation.json', 'incremental.json', 'action-audit.json', 'debug-packages.json',
                           'packages.json', 'base-packages.json', 'config-engine-packages.json',
                           'runtime-apt.json', 'debug-apt.json'):
                  path = root / name
                  if path.exists():
                      safe_json(json.loads(path.read_text()))
              for name, kind in (('MODULE.bazel.lock', 'lock'), ('module-graph.json', 'graph')):
                  path = root / name
                  if path.exists():
                      dependency_json(json.loads(path.read_text()), kind)
              if (root / 'build-events.jsonl').exists():
                  value = bep_summary((root / 'build-events.jsonl').read_text().splitlines(), partial=True)
                  (root / 'build-summary.json').write_text(json.dumps(value, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.public_evidence.outcome == 'success'
        with:
          name: gnmi-image-amd64
          path: |
            artifacts/gnmi/*/*.gz
            artifacts/gnmi/*/*.tar
            artifacts/gnmi/*/gnmi-installed-probe.py
            artifacts/gnmi/*/public-receipt.json
            artifacts/gnmi/*/validation.json
            artifacts/gnmi/*/incremental.json
            artifacts/gnmi/*/action-audit.json
            artifacts/gnmi/*/debug-packages.json
            artifacts/gnmi/*/packages.json
            artifacts/gnmi/*/base-packages.json
            artifacts/gnmi/*/config-engine-packages.json
            artifacts/gnmi/*/runtime-apt.json
            artifacts/gnmi/*/debug-apt.json
            artifacts/gnmi/*/*.status
            artifacts/gnmi/*/build-summary.json
            artifacts/gnmi/*/MODULE.bazel.lock
            artifacts/gnmi/*/module-graph.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 1

  gnmi_runtime:
    name: Run installed gNMI images (AMD64)
    needs: gnmi_native
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gnmi-image-amd64
          path: artifacts/gnmi
      - name: Verify loaded archives, gNMI services and installed source symbols
        run: |
          for profile in enabled disabled; do
            python3 -B tools/bazel/ci/gnmi_loaded.py --artifacts "artifacts/gnmi/$profile"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: gnmi-runtime-amd64
          path: |
            artifacts/gnmi/*/*.runtime.json
            artifacts/gnmi/*/loaded-validation.json
          if-no-files-found: warn
          retention-days: 14

  gnmi_acceptance:
    name: gNMI acceptance (AMD64)
    if: always() && !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.source_image == 'none')
    needs: [gnmi_native, gnmi_runtime]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require both image construction and installed-service checks
        env:
          BUILD_RESULT: ${{ needs.gnmi_native.result }}
          RUNTIME_RESULT: ${{ needs.gnmi_runtime.result }}
        run: |
          test "$BUILD_RESULT" = success
          test "$RUNTIME_RESULT" = success

  vs_reuse:
    name: Assemble VS from verified original inputs
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'securely1g/sonic-buildimage' &&
      github.actor == 'securely1g' &&
      inputs.source_image == 'vs-reuse' && !inputs.skip_vs
    runs-on: [sonic-slave-container-k3s]
    timeout-minutes: 180
    permissions:
      actions: read
      contents: read
    env:
      WORKER_POOL: sonic-slave-container-k3s
      VS_SOURCE_HEAD: ${{ inputs.source_revision }}
      VS_TESTED_MERGE: ${{ inputs.source_merge }}
      VS_INVENTORY_REVISION: ${{ inputs.reuse_inventory_revision }}
      VS_INVENTORY_SHA256: ${{ inputs.reuse_inventory_sha256 }}
      VS_NATIVE_REVISION: 6ba39f0b058e41eb2db7cc7cf01d62a2d7088bba
      VS_CLEANUP_REVISION: 4bf648e812f28b05a2683c6cf7559470b0883d2a
      VS_KERNEL_REVISION: 1ea1efba4f9c4c1db52d557f476c79aafaa42991
      VS_REGISTRY_REVISION: e6ef022c94dd2fdeeac364dfd591f9701cd37c29
      VS_MANAGER_REVISION: c650551885f8ad22cbc104082d1f1b6171e67eef
      VS_DOWNLOAD_REVISION: 3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
    steps:
      - name: Allocate fresh source and temporary directories
        shell: bash
        run: |
          set -euo pipefail
          command -v python3
          command -v git
          python3 -I -S -B - <<'PYTHON'
          import os, pathlib, re
          assert os.getuid() == os.geteuid() == os.getgid() == os.getegid() == 1000
          for name in ("VS_SOURCE_HEAD", "VS_TESTED_MERGE", "VS_INVENTORY_REVISION"):
              assert re.fullmatch("[0-9a-f]{40}", os.environ[name]), "Missing immutable source input"
          assert re.fullmatch("[0-9a-f]{64}", os.environ["VS_INVENTORY_SHA256"])
          assert os.environ["VS_SOURCE_HEAD"] == os.environ["GITHUB_SHA"], "Dispatch the maintained source head"
          for name in ("GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT"):
              assert re.fullmatch("[1-9][0-9]*", os.environ[name])
          workspace = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          assert workspace.is_absolute() and workspace.resolve() == workspace
          relative = "vs-reuse-" + os.environ["GITHUB_RUN_ID"] + "-" + os.environ["GITHUB_RUN_ATTEMPT"]
          root = workspace / relative
          root.mkdir(mode=0o700)
          for child in ("temporary", "downloads", "receipts"):
              (root / child).mkdir(mode=0o700)
          values = {"VS_REL": relative, "VS_ROOT": root, "VS_TMP": root / "temporary",
                    "VS_ASSEMBLY": root / "assembly", "VS_CONTROLLER": root / "controller",
                    "VS_INBOX": root / "downloads",
                    "VS_MANIFEST": root / "inventory/tools/bazel/ci/vs_reuse_inputs.json"}
          with open(os.environ["GITHUB_ENV"], "a") as stream:
              for key, value in values.items():
                  assert "\n" not in str(value)
                  stream.write(key + "=" + str(value) + "\n")
          PYTHON
      - name: Reserve the complete assembly and cleanup window
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          github-token: ${{ github.token }}
          script: |
            const jobs = await github.paginate(
              'GET /repos/{owner}/{repo}/actions/runs/{run_id}/attempts/{attempt_number}/jobs',
              {...context.repo, run_id: context.runId,
                attempt_number: Number(process.env.GITHUB_RUN_ATTEMPT), per_page: 100});
            const current = jobs.filter(job =>
              job.name === 'Assemble VS from verified original inputs' &&
              job.runner_name === process.env.RUNNER_NAME && job.status === 'in_progress');
            if (current.length !== 1) throw new Error('Current job start was not identified');
            const started = Date.parse(current[0].started_at);
            if (!Number.isFinite(started) || started > Date.now() + 60 * 1000)
              throw new Error('Current job start time is invalid');
            // The job has 180 minutes. Keep 15 minutes after owned cleanup
            // for publishing the image and structured receipts.
            const deadline = Math.floor(started / 1000) + (180 - 15) * 60;
            if (deadline * 1000 - Date.now() < 128 * 60 * 1000)
              throw new Error('Insufficient time for assembly and cleanup');
            core.exportVariable('VS_JOB_DEADLINE', String(deadline));
      - name: Check out the maintained caller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_revision }}
          path: ${{ env.VS_REL }}/controller
          persist-credentials: false
      - name: Check out the tested merge for image assembly
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_merge }}
          path: ${{ env.VS_REL }}/assembly
          fetch-depth: 64
          submodules: recursive
          persist-credentials: false
      - name: Check out the native admission owner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.VS_NATIVE_REVISION }}
          path: ${{ env.VS_REL }}/native
          persist-credentials: false
      - name: Check out the qualified cleanup controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.VS_CLEANUP_REVISION }}
          path: ${{ env.VS_REL }}/controller-native-cleanup
          persist-credentials: false
      - name: Check out the original kernel producer context
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.VS_KERNEL_REVISION }}
          path: ${{ env.VS_REL }}/kernel-producer
          persist-credentials: false
      - name: Check out the selected registry context
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: securely1g/sonic-bazel-registry
          ref: ${{ env.VS_REGISTRY_REVISION }}
          path: ${{ env.VS_REL }}/registry
          persist-credentials: false
      - name: Check out the independently frozen input inventory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.reuse_inventory_revision }}
          path: ${{ env.VS_REL }}/inventory
          sparse-checkout: tools/bazel/ci/vs_reuse_inputs.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Check out the pinned upstream artifact transport
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: actions/download-artifact
          ref: ${{ env.VS_DOWNLOAD_REVISION }}
          path: ${{ env.VS_REL }}/download-action
          sparse-checkout: |
            dist
            action.yml
            package.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Verify checkout identities and derive the tested image version
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -S -B - <<'PYTHON'
          import hashlib, os, pathlib, subprocess
          root = pathlib.Path(os.environ["VS_ROOT"])
          def git(directory, *args):
              return subprocess.check_output(["git", "-C", str(directory), *args], text=True).rstrip("\n")
          expected = {"controller": "VS_SOURCE_HEAD", "assembly": "VS_TESTED_MERGE",
                      "native": "VS_NATIVE_REVISION", "controller-native-cleanup": "VS_CLEANUP_REVISION",
                      "kernel-producer": "VS_KERNEL_REVISION", "registry": "VS_REGISTRY_REVISION",
                      "inventory": "VS_INVENTORY_REVISION", "download-action": "VS_DOWNLOAD_REVISION"}
          for directory, variable in expected.items():
              assert git(root / directory, "rev-parse", "HEAD") == os.environ[variable]
              assert not git(root / directory, "status", "--porcelain", "--untracked-files=all")
          assembly = root / "assembly"
          parents = git(assembly, "rev-list", "--parents", "-n", "1", "HEAD").split()
          assert len(parents) == 3 and parents[2] == os.environ["VS_SOURCE_HEAD"], "Not the tested PR merge"
          assert all(row.startswith(" ") for row in git(assembly, "submodule", "status", "--recursive").splitlines())
          # build_debian.sh uses this same Git operation for sonic_version.yml.
          short = git(assembly, "rev-parse", "--short", "HEAD")
          assert os.environ["VS_TESTED_MERGE"].startswith(short)
          transport = root / "download-action/dist/index.js"
          assert hashlib.sha256(transport.read_bytes()).hexdigest() == "f2b9b31a73b1952584858e152e912c3825ad8ae061f280edab14b842f40893c7"
          with open(os.environ["GITHUB_ENV"], "a") as stream:
              stream.write("VS_SOURCE_TREE=" + git(assembly, "rev-parse", "HEAD^{tree}") + "\n")
              stream.write("VS_SHORT_COMMIT=" + short + "\n")
          PYTHON
      - name: Admit original artifact metadata and check temporary storage
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RUNNER_TEMP="$VS_TMP" python3 -I -S -B "$VS_CONTROLLER/tools/bazel/ci/vs_reuse_stage.py" admit \
            --workspace "$VS_ASSEMBLY" --manifest "$VS_MANIFEST" \
            --manifest-sha256 "$VS_INVENTORY_SHA256" --merge "$VS_TESTED_MERGE" \
            --source-head "$VS_SOURCE_HEAD" --source-tree "$VS_SOURCE_TREE" \
            --inbox "$VS_INBOX" --output "$VS_ROOT/receipts/original-artifact-admission.json"
      - name: Download original artifacts with the pinned upstream action
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const {spawnSync} = require('node:child_process');
            const admitted = JSON.parse(fs.readFileSync(path.join(process.env.VS_ROOT,
              'receipts/original-artifact-admission.json'), 'utf8'));
            if (admitted.status !== 'ORIGINAL_ARTIFACT_METADATA_ADMITTED_ONLY')
              throw new Error('Original artifact metadata was not admitted');
            // Node24 is supplied by this pinned action. All transport, SHA256
            // verification and ZIP extraction stay in actions/download-artifact.
            for (const group of admitted.download_groups) {
              // Every run shares the job budget. Reserve two hours for the
              // body and eight minutes for the existing owned cleanup.
              const available = Number(process.env.VS_JOB_DEADLINE) * 1000 -
                Date.now() - 128 * 60 * 1000;
              if (!Number.isFinite(available) || available < 1)
                throw new Error('Artifact transfer exhausted the assembly reserve');
              const destination = path.join(process.env.VS_INBOX, group.directory);
              const child = spawnSync(process.execPath,
                [path.join(process.env.VS_ROOT, 'download-action/dist/index.js')], {
                  stdio: 'inherit', timeout: Math.min(60 * 60 * 1000, Math.floor(available)),
                  env: {...process.env,
                    'INPUT_GITHUB-TOKEN': core.getInput('github-token', {required: true}),
                    'INPUT_REPOSITORY': 'securely1g/sonic-buildimage',
                    'INPUT_RUN-ID': String(group.run_id),
                    'INPUT_ARTIFACT-IDS': group.artifact_ids.join(','),
                    'INPUT_NAME': '', 'INPUT_PATTERN': '', 'INPUT_PATH': destination,
                    'INPUT_MERGE-MULTIPLE': 'false', 'INPUT_SKIP-DECOMPRESS': 'false',
                    'INPUT_DIGEST-MISMATCH': 'error'}
                });
              if (child.error || child.status !== 0)
                throw new Error('Pinned upstream artifact download failed');
            }
      - name: Materialize hash-verified original files
        shell: bash
        run: |
          set -euo pipefail
          RUNNER_TEMP="$VS_TMP" python3 -I -S -B "$VS_CONTROLLER/tools/bazel/ci/vs_reuse_stage.py" stage \
            --workspace "$VS_ASSEMBLY" --manifest "$VS_MANIFEST" \
            --manifest-sha256 "$VS_INVENTORY_SHA256" --merge "$VS_TESTED_MERGE" \
            --source-head "$VS_SOURCE_HEAD" --source-tree "$VS_SOURCE_TREE" \
            --inbox "$VS_INBOX" --output "$VS_ROOT/receipts/original-file-staging.json"
      - name: Bind the maintained caller to the tested merge
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -S -B - <<'PYTHON'
          import hashlib, json, os, pathlib
          root = pathlib.Path(os.environ["VS_ROOT"])
          manifest = pathlib.Path(os.environ["VS_MANIFEST"])
          raw = manifest.read_bytes()
          assert hashlib.sha256(raw).hexdigest() == os.environ["VS_INVENTORY_SHA256"]
          inventory = json.loads(raw)
          value = {
              "workspace": str(root / "assembly"), "manifest": str(manifest),
              "manifest_sha256": os.environ["VS_INVENTORY_SHA256"],
              "merge": os.environ["VS_TESTED_MERGE"], "source_head": os.environ["VS_SOURCE_HEAD"],
              "source_tree": os.environ["VS_SOURCE_TREE"],
              "producer": str(root / "kernel-producer"), "registry": str(root / "registry"),
              "native_controller": str(root / "native"),
              "expected_short_commit": os.environ["VS_SHORT_COMMIT"],
              "profile_paths": inventory["groups"]["profile"],
              "manager_revision": os.environ["VS_MANAGER_REVISION"],
          }
          body = (json.dumps(value, sort_keys=True, indent=2) + "\n").encode()
          output = root / "receipts/full-vs-context.json"
          with os.fdopen(os.open(output, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600), "wb") as stream:
              stream.write(body)
          with open(os.environ["GITHUB_ENV"], "a") as stream:
              stream.write("VS_CONTEXT_SHA256=" + hashlib.sha256(body).hexdigest() + "\n")
          PYTHON
      - name: Assemble the image and run separate post-build checks
        shell: bash
        run: |
          set -euo pipefail
          RUNNER_TEMP="$VS_TMP" python3 -I -S -B "$VS_CONTROLLER/tools/bazel/ci/vs_runtime_check.py" \
            --full-vs --worker "$RUNNER_NAME" \
            --full-vs-context "$VS_ROOT/receipts/full-vs-context.json" \
            --full-vs-context-sha256 "$VS_CONTEXT_SHA256" \
            --full-vs-job-deadline "$VS_JOB_DEADLINE" \
            --output "$VS_ROOT/receipts/full-vs-result.json"
      - name: Upload the completed image
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sonic-vs-reused-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.VS_ASSEMBLY }}/target/sonic-vs.bin
          compression-level: 0
          if-no-files-found: error
      - name: Upload structured assembly and validation receipts
        if: always() && env.VS_ROOT != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sonic-vs-reuse-receipts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.VS_ROOT }}/receipts/original-artifact-admission.json
            ${{ env.VS_ROOT }}/receipts/original-file-staging.json
            ${{ env.VS_ROOT }}/receipts/full-vs-result.json
            ${{ env.VS_ASSEMBLY }}/artifacts/vs/sonic-version.json
            ${{ env.VS_ASSEMBLY }}/artifacts/vs/installed-images.json
          if-no-files-found: warn
