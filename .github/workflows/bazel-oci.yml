          from pathlib import Path
          from tools.bazel.ci.public_artifacts import safe_json, dependency_json
          root = Path('artifacts/sflow')
          names = ('bazelisk-bootstrap.json', 'rule-sources.json', 'validation.json', 'action-audit.json', 'owner-action-audit.json', 'incremental.json', 'runtime-apt.json', 'debug-apt.json', 'sflow.packages.json', 'sflow-debug.packages.json', 'base.packages.json', 'config-engine.packages.json')
          for path in list(root.glob('*.validation.json')) + [root / name for name in names]:
              if path.exists():
                  safe_json(json.loads(path.read_text()))
          for name, kind in (('MODULE.bazel.lock', 'lock'), ('module-graph.json', 'graph')):
