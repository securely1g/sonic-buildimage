  gearbox_native:
    if: github.event_name != 'workflow_dispatch' || inputs.source_image == 'none'
    name: Build and inspect gearbox images (AMD64)
    runs-on: &receipt_metadata_runner ${{ (github.event_name == 'pull_request' && github.repository == 'securely1g/sonic-buildimage' && github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'securely1g' && github.triggering_actor == 'securely1g' && ((github.event.pull_request.number == 196 && github.head_ref == 'codex/dash-engine-review-catalog') || (github.event.pull_request.number == 206 && github.head_ref == 'codex/final23-integration-staging'))) && fromJSON('["sonic-slave-container-k3s"]') || fromJSON('["ubuntu-24.04"]') }}
    timeout-minutes: 300
    container: &receipt_metadata_container ${{ !(github.event_name == 'pull_request' && github.repository == 'securely1g/sonic-buildimage' && github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'securely1g' && github.triggering_actor == 'securely1g' && ((github.event.pull_request.number == 196 && github.head_ref == 'codex/dash-engine-review-catalog') || (github.event.pull_request.number == 206 && github.head_ref == 'codex/final23-integration-staging'))) && fromJSON('{"image":"debian:trixie-20260918@sha256:9cc080028c43b27d2074d63a5f9caf7166d731494965616c1a6d2827a004585c","volumes":["/usr/local/lib/android:/runner-unused/android","/usr/share/dotnet:/runner-unused/dotnet","/opt/ghc:/runner-unused/ghc"]}') || '' }}
    env:
      BAZEL: ${{ github.workspace }}/tools/bazel/ci/libteam_draft_bazel.sh
      GEARBOX_WORKER_RECEIPT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    defaults:
      run:
        shell: bash
    steps:
    - name: Install only receipt verification tools
      if: env.GEARBOX_WORKER_RECEIPT == 'true'
      run: &receipt_metadata_tools |
        if [[ "$RUNNER_ENVIRONMENT" == self-hosted ]]; then
          command -v python3 git
        elif [[ "$RUNNER_ENVIRONMENT" == github-hosted ]]; then
          apt-get update
          apt-get install -y --no-install-recommends python3 git ca-certificates
        else
          exit 1
        fi
        python3 - <<'PYRECEIPT'
        import os
        from pathlib import Path
        import re
        workspace = Path(os.environ['GITHUB_WORKSPACE'])
        values = {'SONIC_RECEIPT_CHECKOUT': '.',
                  'SONIC_RECEIPT_WORKSPACE': str(workspace),
                  'SONIC_RECEIPT_SCRATCH': os.environ['RUNNER_TEMP']}
        if os.environ['RUNNER_ENVIRONMENT'] == 'self-hosted':
            run, attempt, job = (os.environ[name] for name in ('GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'GITHUB_JOB'))
            if not all(re.fullmatch(r'[1-9][0-9]*', value) for value in (run, attempt)) or job not in ('gearbox_native', 'syncd_native', 'p4rt_native'):
                raise SystemExit('Unexpected metadata job identity')
            root = workspace / ('ci-receipt-' + run + '-' + attempt + '-' + job)
            if (workspace.resolve() != workspace or not workspace.is_dir() or
                    os.getuid() != 1000 or os.getgid() != 1000 or
                    root.exists() or root.is_symlink()):
                raise SystemExit('Metadata source and scratch paths must be fresh and job-bound')
            root.mkdir(mode=0o700)
            (root / 'scratch').mkdir(mode=0o700)
            values = {'SONIC_RECEIPT_CHECKOUT': root.name + '/source',
                      'SONIC_RECEIPT_WORKSPACE': str(root / 'source'),
                      'SONIC_RECEIPT_SCRATCH': str(root / 'scratch')}
        with Path(os.environ['GITHUB_ENV']).open('a') as output:
            for name, value in values.items():
                output.write(name + '=' + value + '\n')
        PYRECEIPT
    - name: Checkout the normal CI merge for receipt verification
      if: env.GEARBOX_WORKER_RECEIPT == 'true'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: 'false'
        fetch-depth: 64
        path: ${{ env.SONIC_RECEIPT_CHECKOUT }}
    - name: Verify the tested PR source context
      working-directory: ${{ env.SONIC_RECEIPT_WORKSPACE }}
      id: source_context
      if: github.event_name == 'pull_request' && (env.GEARBOX_WORKER_RECEIPT == 'true')
      run: |
        git config --global --add safe.directory "$PWD"
        python3 -B -m tools.bazel.ci.image_worker_receipt source-context --directory artifacts/source-context
    - name: Preserve the original normal CI request
      working-directory: ${{ env.SONIC_RECEIPT_WORKSPACE }}
      if: env.GEARBOX_WORKER_RECEIPT == 'true'
      id: gearbox_request
      env:
        GH_TOKEN: ${{ github.token }}
      run: "git config --global --add safe.directory \"$PWD\"\npython3 -B -m tools.bazel.ci.image_worker_receipt origin \\\n  --contract tools/bazel/ci/gearbox_worker_contract.json \\\n  --directory \"$SONIC_RECEIPT_SCRATCH/gearbox-ci-request\"\n"
    - name: Upload the original Gearbox worker request
      if: env.GEARBOX_WORKER_RECEIPT == 'true' && steps.gearbox_request.outputs.new_request == 'true'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ${{ steps.gearbox_request.outputs.request_name }}
        path: ${{ env.SONIC_RECEIPT_SCRATCH }}/gearbox-ci-request/request.json
        if-no-files-found: error
        retention-days: '14'
    - name: Download the immutable original Gearbox request
      if: env.GEARBOX_WORKER_RECEIPT == 'true' && steps.gearbox_request.outputs.new_request == 'false'
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        artifact-ids: ${{ steps.gearbox_request.outputs.request_artifact }}
        merge-multiple: 'true'
        run-id: ${{ steps.gearbox_request.outputs.request_run }}
        github-token: ${{ github.token }}
        repository: securely1g/sonic-buildimage
        path: ${{ env.SONIC_RECEIPT_SCRATCH }}/gearbox-ci-request
    - name: Require exact successful worker evidence for this CI merge
      working-directory: ${{ env.SONIC_RECEIPT_WORKSPACE }}
      if: env.GEARBOX_WORKER_RECEIPT == 'true'
      id: gearbox_acceptance
      env:
        GH_TOKEN: ${{ github.token }}
      run: "python3 -B -m tools.bazel.ci.image_worker_receipt discover \\\n  --contract tools/bazel/ci/gearbox_worker_contract.json \\\n  --directory \"$SONIC_RECEIPT_SCRATCH/gearbox-ci-request\"\n"
