          expected = {'tools/bazel/ci/legacy_archive_observation/selection-01.json': 'a349e82b5feafea668d5289dd87f35729940433a3b65ab5711dca8e5b6b4f501', 'tools/bazel/ci/legacy_archive_observation/selection-02.json': '2ef177e1f96dd70caa0282a5b299348efa13ae706ded1d7efa067e2249873397', 'tools/bazel/ci/legacy_archive_observation/selection-03.json': 'd922119a91bd966df33b7d62514b1ae159ff7724ef67f9a5c723bb1cb557767d', 'tools/bazel/ci/legacy_archive_observation/selection-04.json': 'd123aeeff082db40dfaf8515de887890f968b3971f9fd8154f5e42b3d726c661', 'tools/bazel/ci/legacy_archive_observation/selection-05.json': 'c11709d4a4f63bbc2acbc76c33f74d851d1955444b07ebc38c650c8686e7dcfd', 'tools/bazel/ci/legacy_archive_observation/selection-06.json': '326d943b4468661a7b470b429658c1d7cbd7742bf12b1c9d63552bb7f31bdf24', 'tools/bazel/ci/legacy_archive_observation/selection-07.json': 'df801d948782de2ca0d8d7f04e626bef77044ba59bc223b99537ae9aa3fb94e7', 'tools/bazel/ci/legacy_archive_observation/selection-08.json': '75da8d98d1a509fc8bd05f092177bfa5b62721ec35343085bd259f92391824f4', 'tools/bazel/ci/legacy_archive_observation/selection-09.json': 'cde5ff62379cf6da87d3b11d0bd898e6b0d888d4b72f787e928ff762164eb322', 'tools/bazel/ci/legacy_archive_observation/selection-10.json': 'a78906e4ac3613a0b0798a2d5a65a2578d223e628861472db919ace270406b0a', 'tools/bazel/ci/vs_cache_inspection.py': '03beddcf6d73233988b6eef92c69dfdfcc70dbb6a10421edc4e921a9709c451c', 'tools/bazel/ci/vs_cache_payloads.py': 'fc2bc373c56a1275817d85349f6d06658f0bdf39fc250d1fd765c8a64a97d931', 'tools/bazel/tests/vs_cache_payloads_test.py': '8a9eaa0d619e6de9cc4314530b58cffb1d122713b8e8f937b748c62b413d0628'}
          for name, digest in expected.items():
