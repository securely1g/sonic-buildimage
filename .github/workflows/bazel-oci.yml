        id: inventory
        if: inputs.source_image == 'vs-inputs'
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
          SOURCE: ${{ steps.inventory_paths.outputs.source }}
          CONTROL: ${{ steps.paths.outputs.control }}
          GIT_NO_LAZY_FETCH: '1'
          GIT_NO_REPLACE_OBJECTS: '1'
          GIT_OPTIONAL_LOCKS: '0'
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/$SOURCE"
          test ! -e target && test ! -L target
          working="$RUNNER_TEMP/$CONTROL-metadata"
          test ! -e "$working" && test ! -L "$working"
          mkdir -m 700 "$working" "$working/packages" target
          env -u MAKEFLAGS -u MFLAGS -u GNUMAKEFLAGS -u MAKEFILES \
            make --no-builtin-rules --no-print-directory -f slave.mk \
              SONIC_VS_INPUT_INVENTORY=y SONIC_DEB_BUILD_POLICY=reuse-only \
              SONIC_BAZEL_KERNEL_PREPARE=verify SONIC_BAZEL_VS_ARCHIVE_PROFILE=final23 \
              BUILD_WITH_BAZEL_WHEN_AVAILABLE=y PLATFORM=vs CONFIGURED_PLATFORM=vs CONFIGURED_ARCH=amd64 \
              CROSS_BUILD_ENVIRON=n MULTIARCH_QEMU_ENVIRON=n INSTALL_DEBUG_TOOLS=n \
              BLDENV=trixie INCLUDE_FIPS=y INCLUDE_VS_DASH_SAI=y ENABLE_ASAN=n ENABLE_SYNCD_RPC=n \
              SONIC_IMAGE_VERSION=bazel-ci SONIC_CONFIG_BUILD_JOBS=1 SONIC_CONFIG_MAKE_JOBS=2 \
              SONIC_DPKG_CACHE_METHOD=none SONIC_DPKG_CACHE_METHOD_OVERRIDE=none \
              SONIC_DPKG_CACHE_SOURCE="$working/packages" SONIC_DPKG_CACHE_DIR="$working/packages" \
              SONIC_BAZEL_CACHE_POLICY=remote-only SONIC_ROOTFS_DOCKER_NETWORK=none \
              BAZEL=/usr/bin/false BAZEL_REAL=/usr/bin/false vs-input-inventory
          test "$(git -c protocol.allow=never rev-parse HEAD)" = "$SOURCE_REVISION"
          test "$(git -c protocol.allow=never rev-parse HEAD^{tree})" = ff5ff0605cd13d90c45fcdff96eeb1b4e38d4e06
          git -c protocol.allow=never diff --exit-code --ignore-submodules=none HEAD
          python3 - <<'PY_CAPTURE_PROVENANCE'
          import hashlib, json, os, stat
          from pathlib import Path
          capture = Path("target/sonic-vs.bin.make-inputs.tsv")
          info = capture.lstat()
          if not stat.S_ISREG(info.st_mode) or not 0 < info.st_size <= 2 * 1024 * 1024:
              raise SystemExit("Configured input capture is absent or out of bounds")
          raw = capture.read_bytes()
          if not raw.startswith(b"sonic-vs-make-inputs-v1\n") or not raw.endswith(b"end\tsonic-vs-make-inputs-v1\n"):
              raise SystemExit("Configured input capture is incomplete")
          value = {
              "schema": 1, "kind": "sonic-vs-configured-declarations-only",
              "source_revision": os.environ["SOURCE_REVISION"],
              "source_tree": "ff5ff0605cd13d90c45fcdff96eeb1b4e38d4e06",
              "worker": os.environ["RUNNER_NAME"],
              "run_id": os.environ["GITHUB_RUN_ID"], "attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "capture": {"path": str(capture), "bytes": len(raw), "sha256": hashlib.sha256(raw).hexdigest()},
              "native_or_full_VS_acceptance": False,
              "scope": "Configured declarations in a fresh checkout. Package glob matches may be empty; no input availability or assembly claim.",
          }
          with Path("target/vs-configured-inputs-provenance.json").open("x") as output:
              json.dump(value, output, indent=2, sort_keys=True)
              output.write("\n")
          PY_CAPTURE_PROVENANCE
      - name: Retain current configured input declarations
        if: always() && steps.inventory.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vs-configured-inputs-${{ steps.paths.outputs.worker }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.inventory_paths.outputs.source }}/target/sonic-vs.bin.make-inputs.tsv
            ${{ steps.inventory_paths.outputs.source }}/target/vs-configured-inputs-provenance.json
          if-no-files-found: error
          retention-days: 14
      - name: Retain the observation without claiming qualification
        if: always() && (steps.observe.outcome == 'success' || steps.observe.outcome == 'failure')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vs-inspection-${{ steps.paths.outputs.worker }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/${{ steps.paths.outputs.receipt }}
          if-no-files-found: error
          retention-days: 14

  vs_runtime_qualification:
    name: VS runtime qualification (K3s)
    if: github.event_name == 'workflow_dispatch' && inputs.source_image == 'vs-runtime' && inputs.source_worker_pool == 'sonic-slave-container-k3s' && inputs.skip_vs && github.repository == 'securely1g/sonic-buildimage' && github.actor == 'securely1g' && github.triggering_actor == 'securely1g'
    runs-on: [self-hosted, linux, x64, sonic-slave-container-k3s]
    timeout-minutes: 30
    concurrency:
      group: sonic-slave-container-k3s-vs
      cancel-in-progress: false
    steps:
      - name: Require separate runtime scope and fresh paths
        id: paths
        env:
          EXPECTED_WORKER: ${{ runner.name }}
          SOURCE_REVISION: ${{ inputs.source_revision }}
          REGISTRY_REVISION: ${{ inputs.registry_revision }}
          SOURCE_CI_REQUEST: ${{ inputs.source_ci_request }}
          SOURCE_INPUTS_RUN: ${{ inputs.source_inputs_run }}
        run: |
          python3 - <<'PY_RUNTIME_PATHS'
          import os, re
          from pathlib import Path
          if any(os.environ.get(name) for name in ('SOURCE_REVISION', 'REGISTRY_REVISION', 'SOURCE_CI_REQUEST', 'SOURCE_INPUTS_RUN')):
              raise SystemExit('Runtime qualification executes its pinned controller helpers, not a native source request')
          run, attempt, worker = (os.environ[k] for k in ('GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'EXPECTED_WORKER'))
          if not all(re.fullmatch(r'[1-9][0-9]*', x) for x in (run, attempt)) or worker != os.environ['RUNNER_NAME'] or not re.fullmatch(r'ks-[a-z0-9](?:[a-z0-9-]{0,58}[a-z0-9])?', worker):
              raise SystemExit('Unexpected assigned runner identity')
          name = f'vs-runtime-control-{run}-{attempt}-{worker}'
          control = Path(os.environ['GITHUB_WORKSPACE']) / name
          native = control.with_name(control.name + "-native-cleanup")
          receipt = Path(os.environ['RUNNER_TEMP']) / (name + '.json')
          if any(path.exists() or path.is_symlink() for path in (control, native, receipt)):
              raise SystemExit('Preserve existing runtime qualification paths')
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write(f'worker={worker}\ncontrol={control.name}\nnative={native.name}\nreceipt={receipt.name}\n')
          PY_RUNTIME_PATHS
      - name: Checkout the immutable runtime controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: ${{ steps.paths.outputs.control }}
          clean: false
          persist-credentials: false
      - name: Checkout the published native stop implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ba575106ea25c3a5f14a428b0326b6a3c891b5ef
          path: ${{ steps.paths.outputs.native }}
          clean: false
          persist-credentials: false
      - name: Check controller identity and pure runtime policy tests
        env:
          CONTROL: ${{ steps.paths.outputs.control }}
          NATIVE: ${{ steps.paths.outputs.native }}
          GIT_NO_LAZY_FETCH: '1'
          GIT_NO_REPLACE_OBJECTS: '1'
          GIT_OPTIONAL_LOCKS: '0'
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/$CONTROL"
          test "$(git -c protocol.allow=never rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C "$GITHUB_WORKSPACE/$NATIVE" -c protocol.allow=never rev-parse HEAD)" = "ba575106ea25c3a5f14a428b0326b6a3c891b5ef"
          test -z "$(git -C "$GITHUB_WORKSPACE/$NATIVE" -c protocol.allow=never status --porcelain --untracked-files=no)"
          python3 -B -m unittest -v tools.bazel.tests.vs_worker_inspection_test tools.bazel.tests.vs_runtime_test
      - name: Qualify sandbox, running container and proved native cleanup
        id: runtime
        env:
          EXPECTED_WORKER: ${{ steps.paths.outputs.worker }}
          CONTROL: ${{ steps.paths.outputs.control }}
          RECEIPT: ${{ steps.paths.outputs.receipt }}
        run: |
          python3 -B "$GITHUB_WORKSPACE/$CONTROL/tools/bazel/ci/vs_runtime_check.py" \
            --worker "$EXPECTED_WORKER" --output "$RUNNER_TEMP/$RECEIPT"
      - name: Retain this worker capability result
        if: always() && (steps.runtime.outcome == 'success' || steps.runtime.outcome == 'failure')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vs-runtime-${{ steps.paths.outputs.worker }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/${{ steps.paths.outputs.receipt }}
          if-no-files-found: error
          retention-days: 14

  registry_native:
    name: Registry native (${{ inputs.registry_consumer }}, AMD64)
    if: github.event_name == 'workflow_dispatch' && github.repository == 'securely1g/sonic-buildimage' && github.actor == 'securely1g' && inputs.source_image == 'registry-native' && contains(fromJSON('["common", "fips", "sairedis", "dash", "linkmgrd"]'), inputs.registry_consumer)
    runs-on: [sonic-slave-container-dpool, '${{ inputs.source_worker }}']
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash
    env:
      REGISTRY_CONSUMER: ${{ inputs.registry_consumer }}
      REGISTRY_REVISION: ${{ inputs.source_revision }}
      EXPECTED_WORKER: ${{ inputs.source_worker }}
      SOURCE_INPUTS_RUN: ${{ inputs.source_inputs_run }}
    steps:
      - name: Checkout reviewed registry worker control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: control
          persist-credentials: false
      - name: Checkout the registry mirror configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: securely1g/sonic-bazel-registry
          ref: 97cc502556b7ec3435d2d67b105315bcc18bb47e
          path: control/.source-mirror-registry
          sparse-checkout: ci
          persist-credentials: false
      - name: Validate the fixed registry dispatch
        run: |
          python3 -B control/tools/bazel/ci/registry_native_worker.py selection \
            --consumer "$REGISTRY_CONSUMER" --revision "$REGISTRY_REVISION" --worker "$EXPECTED_WORKER" \
            --workspace "$GITHUB_WORKSPACE/registry" --artifacts "$RUNNER_TEMP/registry-native-artifacts"
      - name: Checkout the exact reviewed registry
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: securely1g/sonic-bazel-registry
          ref: ${{ inputs.source_revision }}
          path: registry
          persist-credentials: false
      - name: Verify the existing successful source-download producer
        id: inputs
        if: inputs.source_inputs_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -B control/tools/bazel/ci/registry_native_worker.py verify-input-run \
            --consumer "$REGISTRY_CONSUMER" --revision "$REGISTRY_REVISION" --worker "$EXPECTED_WORKER" \
            --workspace "$GITHUB_WORKSPACE/registry" --artifacts "$RUNNER_TEMP/registry-native-artifacts"
      - name: Reuse the existing verified source-download artifact
        if: inputs.source_inputs_run != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bazel-repository-inputs
          run-id: ${{ inputs.source_inputs_run }}
          github-token: ${{ github.token }}
          repository: securely1g/sonic-buildimage
          path: ${{ runner.temp }}/source-image-inputs
      - name: Configure the native registry downloader
        id: prepare_mirrors
        env:
          DEBIAN_MIRROR_ROOT: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'securely1g/sonic-buildimage' && github.actor == 'securely1g' && secrets.DEBIAN_MIRROR_ROOT || '' }}
          DEBIAN_SECURITY_MIRROR_ROOT: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'securely1g/sonic-buildimage' && github.actor == 'securely1g' && secrets.DEBIAN_SECURITY_MIRROR_ROOT || '' }}
        run: |
          python3 -B control/tools/bazel/ci/registry_native_worker.py prepare-mirrors \
            --consumer "$REGISTRY_CONSUMER" --revision "$REGISTRY_REVISION" --worker "$EXPECTED_WORKER" \
            --workspace "$GITHUB_WORKSPACE/registry" --artifacts "$RUNNER_TEMP/registry-native-artifacts"
      - name: Run the original native registry build and tests
        id: native
        run: |
          python3 -B control/tools/bazel/ci/registry_native_worker.py run \
            --consumer "$REGISTRY_CONSUMER" --revision "$REGISTRY_REVISION" --worker "$EXPECTED_WORKER" \
            --workspace "$GITHUB_WORKSPACE/registry" --artifacts "$RUNNER_TEMP/registry-native-artifacts"
      - name: Stage declared native outputs and public receipts
        id: public
        if: always() && steps.native.outcome != 'skipped'
        run: |
          python3 -B control/tools/bazel/ci/registry_native_worker.py publish \
            --consumer "$REGISTRY_CONSUMER" --revision "$REGISTRY_REVISION" --worker "$EXPECTED_WORKER" \
            --workspace "$GITHUB_WORKSPACE/registry" --artifacts "$RUNNER_TEMP/registry-native-artifacts"
      - name: Scan the native registry archive and receipts
        id: scan_mirrors
        if: always() && (steps.native.outcome != 'skipped' || steps.inputs.outcome != 'skipped')
        env:
          DEBIAN_MIRROR_ROOT: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'securely1g/sonic-buildimage' && github.actor == 'securely1g' && secrets.DEBIAN_MIRROR_ROOT || '' }}
          DEBIAN_SECURITY_MIRROR_ROOT: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'securely1g/sonic-buildimage' && github.actor == 'securely1g' && secrets.DEBIAN_SECURITY_MIRROR_ROOT || '' }}
        run: |
          python3 -B control/tools/bazel/ci/registry_native_worker.py scan-mirrors \
            --consumer "$REGISTRY_CONSUMER" --revision "$REGISTRY_REVISION" --worker "$EXPECTED_WORKER" \
            --workspace "$GITHUB_WORKSPACE/registry" --artifacts "$RUNNER_TEMP/registry-native-artifacts"
      - name: Upload ordinary registry consumer evidence
        if: always() && steps.scan_mirrors.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: registry-native-${{ inputs.registry_consumer }}-amd64-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/registry-native-upload/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Remove the native registry mirror configuration
        if: always() && steps.prepare_mirrors.outcome != 'skipped'
        run: |
          python3 -B control/tools/bazel/ci/registry_native_worker.py cleanup-mirrors \
            --consumer "$REGISTRY_CONSUMER" --revision "$REGISTRY_REVISION" --worker "$EXPECTED_WORKER" \
            --workspace "$GITHUB_WORKSPACE/registry" --artifacts "$RUNNER_TEMP/registry-native-artifacts"

  source_image_inputs:
    name: Fetch pinned source-image downloads
    if: github.event_name == 'workflow_dispatch' && contains(fromJSON('["sysmgr", "dash-ha", "orchagent", "sflow", "otel", "syncd", "gearbox", "dash-engine", "gnmi", "gnmi-no-dialout", "framework", "teamd", "database", "eventd", "lldp", "radv", "macsec", "mux", "frr", "p4rt"]'), inputs.source_image) && inputs.source_inputs_run == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout reviewed source-download verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bazel for repository downloads only
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-version: 1.29.0
          bazelisk-cache: true
          repository-cache: true
          disk-cache: false
          cache-version: "8.5.1"
      - name: Retain the same verified GitLab sources used by the VS workflow
        run: |
          mkdir -p artifacts/source-image-inputs
          bazel fetch --repo=@@ape+ --repo=@@download_utils+ \
            --repo=@@rules_coreutils+ --repo=@@rules_gzip+ --repo=@@toolchain_utils+
          bazel mod graph --output=json > artifacts/source-image-inputs/module-graph.json
          python3 -B tools/bazel/gzip/source_archive.py \
            --repository-cache "$(bazel info repository_cache)" \
            --module-graph artifacts/source-image-inputs/module-graph.json \
            --output artifacts/source-image-inputs > artifacts/source-image-inputs/receipt.json
      - name: Upload verified source downloads
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-image-inputs
          path: |
            artifacts/source-image-inputs/*/src.tar.gz
            artifacts/source-image-inputs/receipt.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  source_image:
    needs: source_image_inputs
    name: Source image (${{ inputs.source_image }})
    if: always() && !cancelled() && (needs.source_image_inputs.result == 'success' || (needs.source_image_inputs.result == 'skipped' && inputs.source_inputs_run != '')) && github.event_name == 'workflow_dispatch' && contains(fromJSON('["sysmgr", "dash-ha", "orchagent", "sflow", "otel", "syncd", "gearbox", "dash-engine", "gnmi", "gnmi-no-dialout", "framework", "teamd", "database", "eventd", "lldp", "radv", "macsec", "mux", "frr", "p4rt"]'), inputs.source_image)
    runs-on: ${{ inputs.source_worker_pool == 'sonic-slave-container-k3s' && fromJSON('["sonic-slave-container-k3s"]') || fromJSON(format('["sonic-slave-container-dpool","{0}"]', inputs.source_worker)) }}
    concurrency:
      group: ${{ inputs.source_worker_pool == 'sonic-slave-container-k3s' && format('sonic-source-image-k3s-{0}-{1}', inputs.source_image, inputs.source_ci_request) || format('source-image-native-{0}-{1}', github.run_id, github.run_attempt) }}
      cancel-in-progress: false
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash
    env:
      SOURCE_WORKER_CONFIGURED_MIRRORS: "1"
      WORKER_POOL: ${{ inputs.source_worker_pool }}
      SELECTED_IMAGE: ${{ inputs.source_image }}
      SOURCE_REVISION: ${{ inputs.source_revision }}
      SOURCE_REGISTRY_REVISION: ${{ inputs.registry_revision }}
      SOURCE_INPUTS_RUN: ${{ inputs.source_inputs_run }}
    steps:
      - name: Require fresh native worker paths
        id: worker_paths
        env:
          EXPECTED_WORKER: ${{ inputs.source_worker }}
          ASSIGNED_WORKER: ${{ runner.name }}
          SOURCE_CI_REQUEST: ${{ inputs.source_ci_request }}
        run: |
          python3 - <<'PYCODE'
          import os
          from pathlib import Path
          import re
          run_id, attempt = os.environ["GITHUB_RUN_ID"], os.environ["GITHUB_RUN_ATTEMPT"]
          worker = os.environ["ASSIGNED_WORKER"]
          pool = os.environ.get("WORKER_POOL", "sonic-slave-container-dpool")
          if not all(re.fullmatch(r"[1-9][0-9]*", value) for value in (run_id, attempt)) or os.environ["RUNNER_NAME"] != worker:
              raise SystemExit("Unexpected native run or assigned worker identity")
          if pool == "sonic-slave-container-dpool":
              if not re.fullmatch(r"sonic-slave-lgh114-[1-4]", worker) or os.environ["EXPECTED_WORKER"] != worker:
                  raise SystemExit("Unexpected dedicated worker identity")
          elif pool == "sonic-slave-container-k3s":
              if (not re.fullmatch(r"ks-[a-z0-9](?:[a-z0-9-]{0,58}[a-z0-9])?", worker) or
                      os.environ["SELECTED_IMAGE"] not in ("syncd", "gearbox", "p4rt") or
                      not re.fullmatch(r"[1-9][0-9]*", os.environ.get("SOURCE_CI_REQUEST", "")) or
                      os.environ.get("GITHUB_EVENT_NAME") != "workflow_dispatch" or
                      os.environ.get("GITHUB_REPOSITORY") != "securely1g/sonic-buildimage" or
                      os.environ.get("GITHUB_ACTOR") != "securely1g" or
                      os.environ.get("GITHUB_TRIGGERING_ACTOR") != "securely1g"):
                  raise SystemExit("K3s native work requires a reviewed family and normal-CI request")
          else:
              raise SystemExit("Unknown source-worker pool")
          paths = []
          for kind, root, variable in (("control", "GITHUB_WORKSPACE", "SOURCE_WORKER_CONTROL"), ("source", "GITHUB_WORKSPACE", "SOURCE_WORKER_SOURCE"), ("scratch", "RUNNER_TEMP", "SOURCE_WORKER_SCRATCH")):
              name = f"source-image-{kind}-{run_id}-{attempt}-{worker}"
              path = Path(os.environ[root]) / os.environ.get(variable, name)
              if path.name != name or path.parent != Path(os.environ[root]) or path.exists() or path.is_symlink():
                  raise SystemExit("Native worker paths must be fresh and bound to this run; preserve previous work")
              paths.append((kind, variable, name))
          with open(os.environ["GITHUB_OUTPUT"], "a") as output, open(os.environ["GITHUB_ENV"], "a") as environment:
              output.write("worker=" + worker + "\n")
              for kind, variable, name in paths:
                  output.write(kind + "=" + name + "\n")
                  environment.write(variable + "=" + name + "\n")
          PYCODE
      - name: Checkout reviewed dispatcher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ${{ steps.worker_paths.outputs.control }}
          clean: false
          persist-credentials: false
      - name: Checkout the registry mirror configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: securely1g/sonic-bazel-registry
          ref: c41c7baf15307ad1c8f94d5dca511ef952d28729
          path: ${{ steps.worker_paths.outputs.control }}/.source-mirror-registry
          sparse-checkout: ci
          persist-credentials: false
      - name: Validate the fixed image selection
        run: |
          python3 -B "$GITHUB_WORKSPACE/$SOURCE_WORKER_CONTROL/tools/bazel/ci/source_image_worker.py" selection \
            --image "$SELECTED_IMAGE" --revision "$SOURCE_REVISION" \
            --workspace "$GITHUB_WORKSPACE/$SOURCE_WORKER_SOURCE" --artifacts "$RUNNER_TEMP/$SOURCE_WORKER_SCRATCH/artifacts"
      - name: Verify Teamd kernel prerequisites without host changes
        id: teamd_kernel
        if: inputs.source_image == 'teamd'
        run: |
          python3 -B "$GITHUB_WORKSPACE/$SOURCE_WORKER_CONTROL/tools/bazel/ci/source_image_worker.py" kernel-preflight \
            --image "$SELECTED_IMAGE" --revision "$SOURCE_REVISION" \
            --workspace "$GITHUB_WORKSPACE/$SOURCE_WORKER_SOURCE" --artifacts "$RUNNER_TEMP/$SOURCE_WORKER_SCRATCH/artifacts"
      - name: Checkout the exact reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_revision }}
          path: ${{ steps.worker_paths.outputs.source }}
          clean: false
          persist-credentials: false
      - name: Verify the normal CI request artifact provenance
        if: contains(fromJSON('["syncd", "gearbox", "p4rt"]'), inputs.source_image) && inputs.source_ci_request != ''
        id: source_ci_request
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_ARTIFACT: ${{ inputs.source_ci_request }}
        run: |
          cd "$GITHUB_WORKSPACE/$SOURCE_WORKER_CONTROL"
          python3 -B -m tools.bazel.ci.image_worker_receipt worker-origin \
            --image "$SELECTED_IMAGE" \
            --artifact "$REQUEST_ARTIFACT" \
            --directory "$RUNNER_TEMP/$SOURCE_WORKER_SCRATCH/ci-request"
      - name: Download the immutable normal CI request
        if: contains(fromJSON('["syncd", "gearbox", "p4rt"]'), inputs.source_image) && inputs.source_ci_request != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ steps.source_ci_request.outputs.request_artifact }}
          run-id: ${{ steps.source_ci_request.outputs.request_run }}
          github-token: ${{ github.token }}
          repository: securely1g/sonic-buildimage
          merge-multiple: true
          path: ${{ runner.temp }}/${{ steps.worker_paths.outputs.scratch }}/ci-request/payload
      - name: Bind the exact normal CI merge before native work
        if: contains(fromJSON('["syncd", "gearbox", "p4rt"]'), inputs.source_image) && inputs.source_ci_request != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$GITHUB_WORKSPACE/$SOURCE_WORKER_CONTROL"
          python3 -B -m tools.bazel.ci.image_worker_receipt bind-worker \
            --image "$SELECTED_IMAGE" \
            --workspace "$GITHUB_WORKSPACE/$SOURCE_WORKER_SOURCE" \
            --directory "$RUNNER_TEMP/$SOURCE_WORKER_SCRATCH/ci-request"
      - name: Verify the existing successful source-download producer
        if: inputs.source_inputs_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -B "$GITHUB_WORKSPACE/$SOURCE_WORKER_CONTROL/tools/bazel/ci/source_image_worker.py" verify-input-run \
            --image "$SELECTED_IMAGE" --revision "$SOURCE_REVISION" \
            --workspace "$GITHUB_WORKSPACE/$SOURCE_WORKER_SOURCE" --artifacts "$RUNNER_TEMP/$SOURCE_WORKER_SCRATCH/artifacts"
      - name: Reuse the existing source-download artifact
        if: inputs.source_inputs_run != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bazel-repository-inputs
          run-id: ${{ inputs.source_inputs_run }}
          github-token: ${{ github.token }}
          repository: securely1g/sonic-buildimage
          path: ${{ runner.temp }}/${{ steps.worker_paths.outputs.scratch }}/source-image-inputs
      - name: Download the verified source archives
        if: inputs.source_inputs_run == ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: source-image-inputs
          path: ${{ runner.temp }}/${{ steps.worker_paths.outputs.scratch }}/source-image-inputs
      - name: Configure Debian downloads for the native worker
        id: prepare_mirrors
        env:
          DEBIAN_MIRROR_ROOT: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'securely1g/sonic-buildimage' && github.actor == 'securely1g' && inputs.source_worker_pool != 'sonic-slave-container-k3s' && secrets.DEBIAN_MIRROR_ROOT || '' }}
          DEBIAN_SECURITY_MIRROR_ROOT: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'securely1g/sonic-buildimage' && github.actor == 'securely1g' && inputs.source_worker_pool != 'sonic-slave-container-k3s' && secrets.DEBIAN_SECURITY_MIRROR_ROOT || '' }}
        run: |
          python3 -B "$GITHUB_WORKSPACE/$SOURCE_WORKER_CONTROL/tools/bazel/ci/source_image_worker.py" prepare-mirrors \
            --image "$SELECTED_IMAGE" --revision "$SOURCE_REVISION" \
            --workspace "$GITHUB_WORKSPACE/$SOURCE_WORKER_SOURCE" --artifacts "$RUNNER_TEMP/$SOURCE_WORKER_SCRATCH/artifacts"
      - name: Prepare private Docker and persistent worker caches
        id: prepare
        run: |
          python3 -B "$GITHUB_WORKSPACE/$SOURCE_WORKER_CONTROL/tools/bazel/ci/source_image_worker.py" prepare \
            --image "$SELECTED_IMAGE" --revision "$SOURCE_REVISION" \
            --workspace "$GITHUB_WORKSPACE/$SOURCE_WORKER_SOURCE" --artifacts "$RUNNER_TEMP/$SOURCE_WORKER_SCRATCH/artifacts"
      - name: Prepare the P4RT Common SDK and sealed owner TARs
        if: inputs.source_image == 'p4rt'
        run: |
          python3 -B "$GITHUB_WORKSPACE/$SOURCE_WORKER_CONTROL/tools/bazel/ci/source_image_worker.py" prepare-owner \
            --image "$SELECTED_IMAGE" --revision "$SOURCE_REVISION" \
            --workspace "$GITHUB_WORKSPACE/$SOURCE_WORKER_SOURCE" --artifacts "$RUNNER_TEMP/$SOURCE_WORKER_SCRATCH/artifacts"
      - name: Prepare the P4RT owner test runtime
        if: inputs.source_image == 'p4rt'
        run: |
          python3 -B "$GITHUB_WORKSPACE/$SOURCE_WORKER_CONTROL/tools/bazel/ci/source_image_worker.py" prepare-owner-runtime \
            --image "$SELECTED_IMAGE" --revision "$SOURCE_REVISION" \
            --workspace "$GITHUB_WORKSPACE/$SOURCE_WORKER_SOURCE" --artifacts "$RUNNER_TEMP/$SOURCE_WORKER_SCRATCH/artifacts"
      - name: Test all original and installed P4RT owner targets
        if: inputs.source_image == 'p4rt'
        run: |
          python3 -B "$GITHUB_WORKSPACE/$SOURCE_WORKER_CONTROL/tools/bazel/ci/source_image_worker.py" owner-tests \
            --image "$SELECTED_IMAGE" --revision "$SOURCE_REVISION" \
            --workspace "$GITHUB_WORKSPACE/$SOURCE_WORKER_SOURCE" --artifacts "$RUNNER_TEMP/$SOURCE_WORKER_SCRATCH/artifacts"
      - name: Build source runtime and debug images
        run: |
          python3 -B "$GITHUB_WORKSPACE/$SOURCE_WORKER_CONTROL/tools/bazel/ci/source_image_worker.py" build \
            --image "$SELECTED_IMAGE" --revision "$SOURCE_REVISION" \
            --workspace "$GITHUB_WORKSPACE/$SOURCE_WORKER_SOURCE" --artifacts "$RUNNER_TEMP/$SOURCE_WORKER_SCRATCH/artifacts"
      - name: Validate image contents and symbols
        run: |
          python3 -B "$GITHUB_WORKSPACE/$SOURCE_WORKER_CONTROL/tools/bazel/ci/source_image_worker.py" validate \
            --image "$SELECTED_IMAGE" --revision "$SOURCE_REVISION" \
            --workspace "$GITHUB_WORKSPACE/$SOURCE_WORKER_SOURCE" --artifacts "$RUNNER_TEMP/$SOURCE_WORKER_SCRATCH/artifacts"
      - name: Verify incremental rebuild and restoration
        run: |
          python3 -B "$GITHUB_WORKSPACE/$SOURCE_WORKER_CONTROL/tools/bazel/ci/source_image_worker.py" incremental \
            --image "$SELECTED_IMAGE" --revision "$SOURCE_REVISION" \
            --workspace "$GITHUB_WORKSPACE/$SOURCE_WORKER_SOURCE" --artifacts "$RUNNER_TEMP/$SOURCE_WORKER_SCRATCH/artifacts"
      - name: Validate the installed services in private containers
        run: |
          python3 -B "$GITHUB_WORKSPACE/$SOURCE_WORKER_CONTROL/tools/bazel/ci/source_image_worker.py" loaded \
            --image "$SELECTED_IMAGE" --revision "$SOURCE_REVISION" \
            --workspace "$GITHUB_WORKSPACE/$SOURCE_WORKER_SOURCE" --artifacts "$RUNNER_TEMP/$SOURCE_WORKER_SCRATCH/artifacts"
      - name: Stop only this job's private Docker daemon
        if: always() && steps.prepare.outcome != 'skipped'
        run: |
          python3 -B "$GITHUB_WORKSPACE/$SOURCE_WORKER_CONTROL/tools/bazel/ci/source_image_worker.py" stop \
            --image "$SELECTED_IMAGE" --revision "$SOURCE_REVISION" \
            --workspace "$GITHUB_WORKSPACE/$SOURCE_WORKER_SOURCE" --artifacts "$RUNNER_TEMP/$SOURCE_WORKER_SCRATCH/artifacts"
      - name: Prepare declared artifacts and public evidence
        id: public_artifacts
        if: always() && (steps.prepare.outcome != 'skipped' || (inputs.source_image == 'teamd' && steps.teamd_kernel.outcome != 'skipped'))
        run: |
          python3 -B "$GITHUB_WORKSPACE/$SOURCE_WORKER_CONTROL/tools/bazel/ci/source_image_worker.py" publish \
            --image "$SELECTED_IMAGE" --revision "$SOURCE_REVISION" \
            --workspace "$GITHUB_WORKSPACE/$SOURCE_WORKER_SOURCE" --artifacts "$RUNNER_TEMP/$SOURCE_WORKER_SCRATCH/artifacts"
      - name: Scan staged source-image artifacts for private mirror locations
        id: scan_mirrors
        if: always() && steps.public_artifacts.outcome == 'success'
        env:
          DEBIAN_MIRROR_ROOT: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'securely1g/sonic-buildimage' && github.actor == 'securely1g' && inputs.source_worker_pool != 'sonic-slave-container-k3s' && secrets.DEBIAN_MIRROR_ROOT || '' }}
          DEBIAN_SECURITY_MIRROR_ROOT: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'securely1g/sonic-buildimage' && github.actor == 'securely1g' && inputs.source_worker_pool != 'sonic-slave-container-k3s' && secrets.DEBIAN_SECURITY_MIRROR_ROOT || '' }}
        run: |
          python3 -B "$GITHUB_WORKSPACE/$SOURCE_WORKER_CONTROL/tools/bazel/ci/source_image_worker.py" scan-mirrors \
            --image "$SELECTED_IMAGE" --revision "$SOURCE_REVISION" \
            --workspace "$GITHUB_WORKSPACE/$SOURCE_WORKER_SOURCE" --artifacts "$RUNNER_TEMP/$SOURCE_WORKER_SCRATCH/artifacts"
      - name: Upload source images and acceptance receipts
        if: always() && steps.scan_mirrors.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-image-${{ inputs.source_image }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/${{ steps.worker_paths.outputs.scratch }}/artifacts/public/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Package the normal CI acceptance receipts
        if: contains(fromJSON('["syncd", "gearbox", "p4rt"]'), inputs.source_image) && inputs.source_ci_request != ''
        id: source_ci_acceptance
        run: |
          cd "$GITHUB_WORKSPACE/$SOURCE_WORKER_CONTROL"
          python3 -B -m tools.bazel.ci.image_worker_receipt bundle \
            --image "$SELECTED_IMAGE" \
            --directory "$RUNNER_TEMP/$SOURCE_WORKER_SCRATCH/ci-request" \
            --public "$RUNNER_TEMP/$SOURCE_WORKER_SCRATCH/artifacts/public" \
            --output "$RUNNER_TEMP/$SOURCE_WORKER_SCRATCH/ci-acceptance"
      - name: Upload the normal CI acceptance receipts
        if: contains(fromJSON('["syncd", "gearbox", "p4rt"]'), inputs.source_image) && inputs.source_ci_request != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.source_ci_acceptance.outputs.acceptance_name }}
          path: ${{ runner.temp }}/${{ steps.worker_paths.outputs.scratch }}/ci-acceptance
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Remove this worker's mirror configuration
        if: always() && steps.prepare_mirrors.outcome != 'skipped'
        run: |
          python3 -B "$GITHUB_WORKSPACE/$SOURCE_WORKER_CONTROL/tools/bazel/ci/source_image_worker.py" cleanup-mirrors \
            --image "$SELECTED_IMAGE" --revision "$SOURCE_REVISION" \
            --workspace "$GITHUB_WORKSPACE/$SOURCE_WORKER_SOURCE" --artifacts "$RUNNER_TEMP/$SOURCE_WORKER_SCRATCH/artifacts"

  worker_provenance:
    name: Worker provisioner identity
    if: github.event_name == 'workflow_dispatch' && github.repository == 'securely1g/sonic-buildimage' && github.actor == 'securely1g' && inputs.source_image == 'worker-provenance'
    runs-on: [sonic-slave-container-dpool, '${{ inputs.source_worker }}']
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout reviewed provenance diagnostic
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read fixed worker identity files
        env:
          EXPECTED_WORKER: ${{ inputs.source_worker }}
        run: |
          python3 -B tools/bazel/ci/worker_provenance.py --worker "$EXPECTED_WORKER" --output artifacts/worker-provenance/identity.json
      - name: Retain typed worker identity evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: worker-provenance-${{ inputs.source_worker }}-${{ github.run_id }}
          path: artifacts/worker-provenance/identity.json
          if-no-files-found: error
          retention-days: 14

  source_worker_preflight:
    name: Source worker preflight (${{ matrix.worker }})
    if: github.event_name == 'workflow_dispatch' && inputs.source_image == 'preflight'
    runs-on: [sonic-slave-container-dpool, '${{ matrix.worker }}']
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        worker: [sonic-slave-lgh114-1, sonic-slave-lgh114-2, sonic-slave-lgh114-3, sonic-slave-lgh114-4]
    env:
      PREFLIGHT_CONTROL: source-worker-preflight-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.worker }}
      PREFLIGHT_RECEIPT: source-worker-preflight-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.worker }}.json
    steps:
      - name: Require fresh preflight paths
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re
          run_id, attempt = os.environ["GITHUB_RUN_ID"], os.environ["GITHUB_RUN_ATTEMPT"]
          worker = os.environ["EXPECTED_WORKER"]
          if not all(re.fullmatch(r"[1-9][0-9]*", value) for value in (run_id, attempt)) or not re.fullmatch(r"sonic-slave-lgh114-[1-4]", worker):
              raise SystemExit("Unexpected preflight run or worker identity")
          name = f"source-worker-preflight-{run_id}-{attempt}-{worker}"
          control = Path(os.environ["GITHUB_WORKSPACE"]) / os.environ["PREFLIGHT_CONTROL"]
          receipt = Path(os.environ["RUNNER_TEMP"]) / os.environ["PREFLIGHT_RECEIPT"]
          if control.name != name or control.parent != Path(os.environ["GITHUB_WORKSPACE"]) or receipt != Path(os.environ["RUNNER_TEMP"]) / (name + ".json"):
              raise SystemExit("Preflight paths do not match this run")
          if any(path.exists() or path.is_symlink() for path in (control, receipt)):
              raise SystemExit("Preflight paths already exist; preserve the previous work")
          PY
        env:
          EXPECTED_WORKER: ${{ matrix.worker }}
      - name: Checkout dispatcher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ${{ env.PREFLIGHT_CONTROL }}
          clean: false
          persist-credentials: false
      - name: Measure this worker's resources and namespace capabilities
        id: measure
        env:
          EXPECTED_WORKER: ${{ matrix.worker }}
        run: |
          python3 -B "$GITHUB_WORKSPACE/$PREFLIGHT_CONTROL/tools/bazel/ci/source_worker_preflight.py" \
            --worker "$EXPECTED_WORKER" --output "$RUNNER_TEMP/$PREFLIGHT_RECEIPT"
      - name: Retain measured resource evidence
        if: always() && (steps.measure.outcome == 'success' || steps.measure.outcome == 'failure')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-worker-${{ matrix.worker }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/${{ env.PREFLIGHT_RECEIPT }}
          if-no-files-found: error
          retention-days: 14

  archive:
    if: github.event_name != 'workflow_dispatch' || inputs.source_image == 'none'
    name: Container archive (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: AMD64
            architecture: amd64
            machine: x86_64
            runner: ubuntu-24.04
            platform: x86_64_trixie
          - name: ARM64
            architecture: arm64
            machine: aarch64
            runner: ubuntu-24.04-arm
            platform: aarch64_trixie
    container: debian:trixie-20260918@sha256:9cc080028c43b27d2074d63a5f9caf7166d731494965616c1a6d2827a004585c
    defaults:
      run:
        shell: bash
    steps:
      - name: Install execution tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            autoconf automake binutils binutils-gold build-essential busybox ca-certificates gdb git j2cli jq libtool libxml2 pkg-config python3 python3-jinja2 tar unzip zstd

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check native architecture and generated dependency state
        run: |
          test "$(uname -m)" = "${{ matrix.machine }}"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test ! -e MODULE.bazel.lock
          test -z "$(git ls-files -- MODULE.bazel.lock)"
          git check-ignore MODULE.bazel.lock

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-version: 1.29.0
          bazelisk-cache: true
          repository-cache: true
          disk-cache: buildimage-gzip-${{ matrix.architecture }}
          cache-version: "8.5.1"

      - name: Configure verified Debian payload transport
        run: |
          python3 - <<'PYCFG'
          import hashlib
          import os
          from pathlib import Path
          from urllib.request import urlopen
          url = "https://raw.githubusercontent.com/securely1g/sonic-bazel-registry/97cc502556b7ec3435d2d67b105315bcc18bb47e/ci/source_mirrors.cfg"
          with urlopen(url, timeout=60) as response:
              data = response.read()
          if hashlib.sha256(data).hexdigest() != "ddd6f40504a30e138a62be0d728e1a352391d0f781c927eaf4ea45c44d8a0720":
              raise SystemExit("Source mirror configuration checksum mismatch")
          config = Path(os.environ["RUNNER_TEMP"]) / "base-source-mirrors.cfg"
          config.write_bytes(data)
          with Path(".bazelrc.user").open("a") as rc:
              rc.write("common --experimental_downloader_config=" + str(config) + "\n")
          PYCFG

      - name: Check Make OCI bases and reproducible Docker archives
        run: |
          set -euo pipefail
          mkdir -p artifacts/archive
          git rev-parse HEAD > artifacts/archive/revision.txt
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
          pull = event.get("pull_request", {})
          commit = subprocess.check_output(["git", "cat-file", "-p", "HEAD"], text=True)
          parents = [line.split()[1] for line in commit.split("\n\n", 1)[0].splitlines()
                     if line.startswith("parent ")]
          evidence = {
              "tested_head": Path("artifacts/archive/revision.txt").read_text().strip(),
              "tested_parents": parents,
              "github_sha": os.environ["GITHUB_SHA"],
              "pull_request_head": pull.get("head", {}).get("sha"),
              "pull_request_base": pull.get("base", {}).get("sha"),
              "architecture": "${{ matrix.architecture }}",
          }
          Path("artifacts/archive/revision.json").write_text(json.dumps(evidence, indent=2) + "\n")
          PY
          "$BAZEL" --version | tee artifacts/archive/bazel-version.txt
          test "$(cat artifacts/archive/bazel-version.txt)" = "bazel $(cat .bazelversion)"
          python3 -B tools/bazel/ci/bazel_commands.py --bazel "$BAZEL" \
            --bazel-arg=--platforms=@sonic_build_infra//platforms:${{ matrix.platform }} \
            --bazel-arg=--host_platform=@sonic_build_infra//platforms:${{ matrix.platform }} \
            --bazel-arg=--jobs=4 --bazel-arg=--local_resources=cpu=4 \
            --bazel-arg=--local_resources=memory=10000 \
            --output artifacts/archive/action-audit.json \
            //tools/bazel/tests:sonic_docker_archive_test \
            //tools/bazel/tests:oci_base_layout_test \
            //tools/bazel/tests:prepare_oci_base_test \
            //tools/bazel/tests:oci_base_consumer_test \
            //tools/bazel/tests:select_apt_payloads_test \
            //tools/bazel/tests:source_contract_test \
            //tools/bazel/tests:oci_license_filter_test \
            //tools/bazel/tests:test_dpkg_patterns_up_to_date \
            //tools/bazel/oci/tests:imported_symbols_test \
            //tools/bazel/oci/tests:native_symbols_test \
            //tools/bazel/oci/tests:normalize_layer_test \
            //tools/bazel/oci/tests:normalize_layer_rule_test \
            //tools/bazel/tests:archive-fixture.gz \
            //tools/bazel/tests:oci-consumer-first.gz
          "$BAZEL" test --platforms=@sonic_build_infra//platforms:${{ matrix.platform }} \
            --host_platform=@sonic_build_infra//platforms:${{ matrix.platform }} \
            --jobs=4 --local_resources=cpu=4 --local_resources=memory=10000 \
            --lockfile_mode=update --nocache_test_results --test_output=all \
            --build_event_json_file="$PWD/artifacts/archive/test-events.jsonl" \
            //tools/bazel/tests:sonic_docker_archive_test \
            //tools/bazel/tests:oci_base_layout_test \
            //tools/bazel/tests:prepare_oci_base_test \
            //tools/bazel/tests:oci_base_consumer_test \
            //tools/bazel/tests:select_apt_payloads_test \
            //tools/bazel/tests:source_contract_test \
            //tools/bazel/tests:oci_license_filter_test \
            //tools/bazel/tests:test_dpkg_patterns_up_to_date \
            //tools/bazel/oci/tests:imported_symbols_test \
            //tools/bazel/oci/tests:native_symbols_test \
            //tools/bazel/oci/tests:normalize_layer_test \
            //tools/bazel/oci/tests:normalize_layer_rule_test \
            2>&1 | tee artifacts/archive/test.log
          output=$("$BAZEL" cquery --platforms=@sonic_build_infra//platforms:${{ matrix.platform }} \
            --host_platform=@sonic_build_infra//platforms:${{ matrix.platform }} \
            --output=files //tools/bazel/tests:archive-fixture.gz)
          test -s "$output"
          cp "$output" artifacts/archive/archive-fixture.gz
          # The fixture test verifies that this payload equals the original Docker tar.
          python3 -c 'import gzip; from pathlib import Path; p = Path("artifacts/archive"); (p / "archive-fixture.tar").write_bytes(gzip.decompress((p / "archive-fixture.gz").read_bytes()))'
          sha256sum artifacts/archive/archive-fixture.* > artifacts/archive/archive-sha256.txt

      - name: Check shared Make rules with unrelated container targets
        env:
          SOURCE_ONLY_NO_DEBS: ${{ (github.event_name == 'pull_request' && (github.head_ref == 'codex/registry-native-workers' || github.head_ref == 'codex/framework-native-worker' || github.head_ref == 'codex/orchagent-source-worker-current' || github.head_ref == 'codex/source-image-worker-families' || github.head_ref == 'codex/source-image-worker-p4rt-feature') && github.event.pull_request.head.repo.full_name == github.repository) || github.head_ref == 'codex/image-environment' || github.head_ref == 'codex/source-image-worker-dispatch' }}
        run: |
          if [[ "${SOURCE_ONLY_NO_DEBS:-false}" == true ]]; then
            # This CI-only change does not authorize Debian package generation.
            for test in tools/bazel/tests/*_test.py; do
              case "$test" in
                */kernel_test.py|*/kernel_artifacts_test.py|*/kernel_sbom_test.py) ;;
                *) PYTHONPATH="$PWD" python3 -B "$test" ;;
              esac
            done
          else
            python3 -B -m unittest discover -s tools/bazel/tests -p '*_test.py'
          fi
          python3 -B tools/bazel/ci/verify_make_archive.py \
            --artifacts artifacts/archive/make-export \
            --bazel "$BAZEL" \
            --bazel-arg=--platforms=@sonic_build_infra//platforms:${{ matrix.platform }} \
            --bazel-arg=--host_platform=@sonic_build_infra//platforms:${{ matrix.platform }} \
            --bazel-arg=--jobs=4 \
            --bazel-arg=--local_resources=cpu=4 \
            --bazel-arg=--local_resources=memory=10000

      - name: Test Python packages and check startup generation
        run: |
          set -euo pipefail
          mkdir -p artifacts/config-engine
          # Render SWSS metadata on either host; this does not build an ARM64 image.
          make -f tools/bazel/prepare_manifests.mk \
            MANIFEST_METADATA=rules/docker-orchagent.mk \
            BUILD_WITH_BAZEL_WHEN_AVAILABLE=y BLDENV=trixie CONFIGURED_PLATFORM=vs \
            CONFIGURED_ARCH=amd64 ENABLE_ASAN=n DBG_IMAGE_MARK=dbg DOCKERS_PATH=dockers \
            2>&1 | tee artifacts/config-engine/make-manifests.log
          python3 -B tools/bazel/ci/bazel_commands.py --bazel "$BAZEL" \
            --bazel-arg=--platforms=@sonic_build_infra//platforms:${{ matrix.platform }} \
            --bazel-arg=--host_platform=@sonic_build_infra//platforms:${{ matrix.platform }} \
            --bazel-arg=--jobs=4 --bazel-arg=--local_resources=cpu=4 \
            --bazel-arg=--local_resources=memory=10000 \
            --output artifacts/config-engine/action-audit.json \
            //tools/bazel/tests:apt_selection_test \
            //tools/bazel/tests:sonic_py_common_test \
            //tools/bazel/tests:sonic_yang_mgmt_full_test \
            //tools/bazel/tests:sonic_yang_mgmt_wheel_test \
            //tools/bazel/tests:sonic_py_common_full_test \
            //tools/bazel/tests:sonic_config_engine_full_test \
            //tools/bazel/tests:sonic_python_wheels_test \
            //tools/bazel/tests:containercfgd_full_test \
            //tools/bazel/tests:containercfgd_wheel_test \
            //tools/bazel/tests:supervisor_python_full_test \
            //tools/bazel/tests:supervisor_python_wheel_test \
            //tools/bazel/tests:installed_wheel_fixture_test \
            //tools/bazel/tests:wheel_contract_test \
            //src/sonic-config-engine:sonic_cfggen_cli_test \
            //tools/bazel/tests:manifest_labels_test \
            //tools/bazel/tests:manifest_labels_action_test \
            //tools/bazel/tests:cfggen_template_test \
            //tools/bazel/tests:swss_render_test \
            //src/sonic-yang-mgmt:sonic_yang_mgmt_wheel \
            //src/sonic-py-common:sonic_py_common_wheel \
            //src/sonic-config-engine:sonic_config_engine_wheel \
            //src/sonic-containercfgd:sonic_containercfgd_wheel \
            //src/sonic-supervisord-utilities:sonic_supervisord_utilities_wheel \
            //dockers/docker-orchagent/config:docker_init
          "$BAZEL" test --platforms=@sonic_build_infra//platforms:${{ matrix.platform }} \
            --host_platform=@sonic_build_infra//platforms:${{ matrix.platform }} \
            --jobs=4 --local_resources=cpu=4 --local_resources=memory=10000 \
            --nocache_test_results --test_output=all \
            --build_event_json_file="$PWD/artifacts/config-engine/test-events.jsonl" \
            //tools/bazel/tests:apt_selection_test \
            //tools/bazel/tests:sonic_py_common_test \
            //tools/bazel/tests:sonic_yang_mgmt_full_test \
            //tools/bazel/tests:sonic_yang_mgmt_wheel_test \
            //tools/bazel/tests:sonic_py_common_full_test \
            //tools/bazel/tests:sonic_config_engine_full_test \
            //tools/bazel/tests:sonic_python_wheels_test \
            //tools/bazel/tests:containercfgd_full_test \
            //tools/bazel/tests:containercfgd_wheel_test \
            //tools/bazel/tests:supervisor_python_full_test \
            //tools/bazel/tests:supervisor_python_wheel_test \
            //tools/bazel/tests:installed_wheel_fixture_test \
            //tools/bazel/tests:wheel_contract_test \
            //src/sonic-config-engine:sonic_cfggen_cli_test \
            //tools/bazel/tests:manifest_labels_test \
            //tools/bazel/tests:manifest_labels_action_test \
            //tools/bazel/tests:cfggen_template_test \
            //tools/bazel/tests:swss_render_test \
            2>&1 | tee artifacts/config-engine/test.log
          output=$("$BAZEL" cquery --platforms=@sonic_build_infra//platforms:${{ matrix.platform }} \
            --host_platform=@sonic_build_infra//platforms:${{ matrix.platform }} \
            --output=files //dockers/docker-orchagent/config:docker_init)
          test -s "$output"
          bash -n "$output"
          cp "$output" artifacts/config-engine/docker-init.sh
          sha256sum artifacts/config-engine/docker-init.sh > artifacts/config-engine/sha256.txt
          git diff --exit-code

      - name: Retain wheels and required Python test evidence
        run: |
          python3 -B tools/bazel/ci/python_packages.py \
            --artifacts artifacts/config-engine \
            --revision artifacts/archive/revision.json \
            --architecture "${{ matrix.architecture }}" \
            --bazel "$BAZEL" \
            --bazel-arg=--platforms=@sonic_build_infra//platforms:${{ matrix.platform }} \
            --bazel-arg=--host_platform=@sonic_build_infra//platforms:${{ matrix.platform }} \
            --bazel-arg=--jobs=4 \
            --bazel-arg=--local_resources=cpu=4 \
            --bazel-arg=--local_resources=memory=10000
          git diff --exit-code

      - name: Check local cache reuse across fresh checkouts
        run: |
          python3 -B tools/bazel/ci/verify_agent_cache.py \
            --artifacts artifacts/archive/agent-cache \
            --bazel "$BAZEL" \
            --repository-cache "$("$BAZEL" info repository_cache)" \
            --bazel-arg=--platforms=@sonic_build_infra//platforms:${{ matrix.platform }} \
            --bazel-arg=--host_platform=@sonic_build_infra//platforms:${{ matrix.platform }} \
            --bazel-arg=--jobs=4 \
            --bazel-arg=--local_resources=cpu=4 \
            --bazel-arg=--local_resources=memory=10000

      - name: Retain generated module lock and graph
        run: |
          python3 -B - <<'PY'
          import json
          from pathlib import Path
          import os
          from tools.bazel.ci import resolution
          directory = Path("artifacts/archive").resolve()
          evidence = resolution.collect(Path.cwd(), directory, bazel=[os.environ["BAZEL"]])
          (directory / "resolution.json").write_text(json.dumps(evidence, indent=2) + "\n")
          PY

      - name: Prepare public artifact list
        id: public_artifacts
        if: always()
        env:
          CI_JOB_STATUS: ${{ job.status }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 -B tools/bazel/ci/public_artifacts.py archive \
            --workspace "$PWD" --upload-root "$GITHUB_WORKSPACE" \
            --job-status "$CI_JOB_STATUS" --revision "$(git rev-parse HEAD)" \
            --architecture "${{ matrix.architecture }}" \
            --head-sha "$CI_HEAD_SHA" --base-sha "$CI_BASE_SHA" \
            --github-output "$GITHUB_OUTPUT"

      - name: Upload public archive evidence
        if: always() && steps.public_artifacts.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-archive-${{ matrix.architecture }}
          path: ${{ steps.public_artifacts.outputs.paths }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 1

  checks:
    if: github.event_name != 'workflow_dispatch' || inputs.source_image == 'none'
    name: OCI regression checks (AMD64)
    runs-on: ubuntu-24.04
    outputs:
      p4_sources_artifact_id: ${{ steps.p4_sources_upload.outputs.artifact-id }}
    # No SWSS/Syncd package compilation: those checks reuse the full Make build.
    timeout-minutes: 60
    container:
      image: debian:trixie-20260918@sha256:9cc080028c43b27d2074d63a5f9caf7166d731494965616c1a6d2827a004585c
      # Reap any Bazel processes used for dependency resolution.
      options: --init
    defaults:
      run:
        shell: bash
    steps:
      - name: Install execution tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            autoconf automake binutils binutils-gold build-essential busybox ca-certificates curl \
            gdb git j2cli jq libtool libxml2 make pigz pkg-config python3 python3-jinja2 redis-server squashfs-tools tar unzip zstd

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check generated dependency state
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test ! -e MODULE.bazel.lock
          test -z "$(git ls-files -- MODULE.bazel.lock)"
          git check-ignore MODULE.bazel.lock

      - name: Check hosted storage
        run: df -h "$GITHUB_WORKSPACE" "$HOME"

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-version: 1.29.0
          bazelisk-cache: true
          repository-cache: true
          # This job resolves/downloads dependencies but executes no Bazel builds.
          disk-cache: false
          cache-version: "8.5.1"

      - name: Check Make handoff and archive validation
        env:
          SOURCE_ONLY_NO_DEBS: ${{ (github.event_name == 'pull_request' && (github.head_ref == 'codex/registry-native-workers' || github.head_ref == 'codex/framework-native-worker' || github.head_ref == 'codex/orchagent-source-worker-current' || github.head_ref == 'codex/source-image-worker-families' || github.head_ref == 'codex/source-image-worker-p4rt-feature') && github.event.pull_request.head.repo.full_name == github.repository) || github.head_ref == 'codex/image-environment' || github.head_ref == 'codex/source-image-worker-dispatch' }}
        run: |
          if [[ "${SOURCE_ONLY_NO_DEBS:-false}" == true ]]; then
            # This CI-only change does not authorize Debian package generation.
            for test in tools/bazel/tests/*_test.py; do
              case "$test" in
                */kernel_test.py|*/kernel_artifacts_test.py|*/kernel_sbom_test.py) ;;
                *) PYTHONPATH="$PWD" python3 -B "$test" ;;
              esac
            done
          else
            python3 -B -m unittest discover -s tools/bazel/tests -p '*_test.py'
          fi
          python3 -B -m unittest discover -s tools/ci/tests -p '*_test.py'
          python3 -B -m unittest discover -s tools/ci/runner -p '*_test.py'
          python3 -B tools/bazel/ci/configure_runner_cache_test.py

      - name: Retain the verified GitLab source downloads
        run: |
          mkdir -p artifacts/repository-inputs
          test "$("$BAZEL" --version)" = "bazel $(cat .bazelversion)"
          "$BAZEL" fetch --repo=@@ape+ --repo=@@download_utils+ \
            --repo=@@rules_coreutils+ --repo=@@rules_gzip+ --repo=@@toolchain_utils+
          python3 - <<'PYCODE'
          from pathlib import Path
          from tools.bazel.ci import resolution
          import os
          resolution.collect(Path.cwd(), Path("artifacts/repository-inputs"), bazel=[os.environ["BAZEL"]])
          PYCODE
          python3 -B tools/bazel/gzip/source_archive.py \
            --repository-cache "$("$BAZEL" info repository_cache)" \
            --module-graph artifacts/repository-inputs/module-graph.json \
            --output artifacts/repository-inputs \
            > artifacts/repository-inputs/receipt.json

      - name: Retain the native Redis test helper for installed-image checks
        run: |
          mkdir -p artifacts/repository-inputs/test-helpers
          cp /usr/bin/redis-server artifacts/repository-inputs/test-helpers/redis-server
          cp /usr/share/doc/redis-server/copyright artifacts/repository-inputs/test-helpers/redis-copyright
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess
          root = pathlib.Path("artifacts/repository-inputs/test-helpers")
          binary = root / "redis-server"
          receipt = {
              "_generated": {"notice": "AUTO-GENERATED. DO NOT EDIT MANUALLY.",
                             "generator": ".github/workflows/bazel-oci.yml"},
              "purpose": "Isolated test helper; not installed in the Syncd image",
              "architecture": subprocess.check_output(["dpkg", "--print-architecture"], text=True).strip(),
              "package_version": subprocess.check_output(["dpkg-query", "-W", "-f=${Version}", "redis-server"], text=True),
              "sha256": hashlib.sha256(binary.read_bytes()).hexdigest(),
              "version": subprocess.check_output([str(binary.resolve()), "--version"], text=True).strip(),
          }
          assert receipt["architecture"] == "amd64"
          (root / "redis.json").write_text(json.dumps(receipt, indent=2) + "\n")
          PY

      - name: Upload the source downloads for the VS job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bazel-repository-inputs
          path: |
            artifacts/repository-inputs/ape-1.0.1/src.tar.gz
            artifacts/repository-inputs/download_utils-1.0.1/src.tar.gz
            artifacts/repository-inputs/rules_coreutils-1.0.1/src.tar.gz
            artifacts/repository-inputs/rules_gzip-1.0.0/src.tar.gz
            artifacts/repository-inputs/toolchain_utils-1.0.2/src.tar.gz
            artifacts/repository-inputs/receipt.json
            artifacts/repository-inputs/test-helpers/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Fetch pinned P4 source inputs for the native worker
        id: p4_sources_fetch
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
          (github.event_name == 'pull_request' &&
           github.event.pull_request.head.repo.full_name == github.repository) ||
          (github.event_name == 'workflow_dispatch' && !inputs.skip_vs)
        run: |
          python3 -B tools/ci/p4_source_inputs.py --fetch \
            --manifest src/p4lang/source-inputs.json \
            --directory artifacts/p4-source-inputs/sources \
            --receipt artifacts/p4-source-inputs/receipt.json
          echo 'P4 source-byte pins verified. The unchanged upstream P4C descriptor has a known checksum discrepancy; receipt.json records its declared and published hashes separately.' >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve P4 source inputs and verification receipt
        id: p4_sources_upload
        if: always() && (steps.p4_sources_fetch.outcome == 'success' || steps.p4_sources_fetch.outcome == 'failure')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: p4-source-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/p4-source-inputs/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Report validation scope
        run: |
          echo 'Hosted checks cover regressions and dependency resolution; the VS installer builds directly in the SONiC slave container job.' >> "$GITHUB_STEP_SUMMARY"

  vs:
    name: Make VS with Bazel SWSS (AMD64)
    needs: [checks]
    # Replaced by vs_container below. Keep the legacy recipe available while
    # transitioning, but do not schedule another host-driven Make VS build.
    if: ${{ false }}
    # Use the ONIE pool; checkout still uses this event's ref and SHA.
    runs-on:
      - self-hosted
      - linux
      - x64
      - sonic-vs-bin
    timeout-minutes: 720
    env:
      SONIC_CI_CONTAINER_LABEL: io.sonic-buildimage.ci-job=${{ github.repository }}:${{ github.run_id }}:${{ github.run_attempt }}:vs
      # Use Docker Hub's canonical references with the existing pinned digests.
      DEFAULT_CONTAINER_REGISTRY: ""
      MIRROR_URLS: https://deb.debian.org/debian/
      MIRROR_SECURITY_URLS: https://deb.debian.org/debian-security/
      SONIC_CONFIG_USE_DOCKER_CACHE: "y"
      # Keep build results outside run-specific checkouts and disposable builders.
      SONIC_BAZEL_CACHE_SOURCE: /data/sonic-runner/cache/sonic-buildimage/bazel
      SONIC_DPKG_CACHE_SOURCE: /data/sonic-runner/cache/sonic-buildimage/packages
      SONIC_DPKG_CACHE_METHOD: rwcache
      BAZEL_CONTAINER_ARGS: >-
        --distdir=/bazel_cache/distdir/ape-1.0.1
        --distdir=/bazel_cache/distdir/download_utils-1.0.1
        --distdir=/bazel_cache/distdir/rules_coreutils-1.0.1
        --distdir=/bazel_cache/distdir/rules_gzip-1.0.0
        --distdir=/bazel_cache/distdir/toolchain_utils-1.0.2
    defaults:
      run:
        shell: bash
        working-directory: vs-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check source-build runner capacity
        working-directory: ${{ github.workspace }}
        run: |
          docker info > /dev/null
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          workspace = Path.cwd().resolve()
          usage = shutil.disk_usage(workspace)
          free_gib = usage.free / 1024**3
          print(f'Workspace: {workspace}; available: {free_gib:.1f} GiB; '
                f'total: {usage.total / 1024**3:.1f} GiB', flush=True)
          if usage.free < 100 * 1024**3:
              raise SystemExit(f'The full Make VS build needs at least 100 GiB free; '
                               f'{workspace} has {free_gib:.1f} GiB available')
          PY

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # An interrupted submodule clone can leave an invalid HEAD that the
          # checkout action's superproject clean/reset cannot repair.
          path: vs-${{ github.run_id }}-${{ github.run_attempt }}
          persist-credentials: false
          submodules: recursive

      - name: Check VS build prerequisites
        run: python3 -B tools/ci/runner/preflight.py --workspace "$PWD" --build-target sonic-vs.bin

      - name: Prepare persistent agent caches
        run: |
          # Keep ordinary Make writers separate from older root-created cache entries.
          SONIC_BAZEL_CACHE_SOURCE="$SONIC_BAZEL_CACHE_SOURCE/make-uid-$(id -u)"
          install -d -m 0700 "$SONIC_BAZEL_CACHE_SOURCE" "$SONIC_DPKG_CACHE_SOURCE"
          test -w "$SONIC_BAZEL_CACHE_SOURCE"
          test -w "$SONIC_DPKG_CACHE_SOURCE"
          # A writable cache root does not prove old digest directories are writable.
          # Check directories only: cached content files may intentionally be read-only.
          for cache in repository_cache disk_cache kernel-linux-sandbox/repository_cache kernel-linux-sandbox/disk_cache; do
            cache_path="$SONIC_BAZEL_CACHE_SOURCE/$cache"
            if test -d "$cache_path"; then
              blocked=$(find "$cache_path" -type d ! -writable -print -quit)
              if test -n "$blocked"; then
                stat -c 'Unwritable Bazel cache directory: %n (uid=%u gid=%g mode=%a)' "$blocked" >&2
                echo 'Repair this cache directory for the runner user before rebuilding; preserve cached content.' >&2
                exit 1
              fi
            fi
          done
          printf 'SONIC_BAZEL_CACHE_SOURCE=%s\n' "$SONIC_BAZEL_CACHE_SOURCE" >> "$GITHUB_ENV"
          printf 'Bazel cache: %s\nMake package cache: %s (%s)\n' \
            "$SONIC_BAZEL_CACHE_SOURCE" "$SONIC_DPKG_CACHE_SOURCE" "$SONIC_DPKG_CACHE_METHOD"

      - name: Download verified sources from the hosted checks
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bazel-repository-inputs
          path: vs-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/vs/repository-inputs

      - name: Prepare the shared Bazel source-download directory
        run: |
          python3 -B tools/bazel/gzip/source_archive.py \
            --archives-dir artifacts/vs/repository-inputs \
            --output "$SONIC_BAZEL_CACHE_SOURCE/distdir" \
            > artifacts/vs/source-download-receipt.json

      - name: Configure the native VS image
        run: |
          mkdir -p artifacts/vs
          make init 2>&1 | tee artifacts/vs/init.log
          make configure PLATFORM=vs PLATFORM_ARCH=amd64 \
            SONIC_BUILDER_EXTRA_CMDLINE="--label $SONIC_CI_CONTAINER_LABEL -e BAZEL=$BAZEL" \
            2>&1 | tee artifacts/vs/configure.log

      - name: Check nested Docker in both build environments
        timeout-minutes: 10
        run: |
          set -o pipefail
          for build_env in bookworm trixie; do
            make -f Makefile.work BLDENV="$build_env" docker-start \
              SONIC_BUILDER_EXTRA_CMDLINE="--label $SONIC_CI_CONTAINER_LABEL -e BAZEL=$BAZEL" \
              2>&1 | tee "artifacts/vs/docker-start-$build_env.log"
          done

      - name: Check native kernel sandbox in Trixie
        timeout-minutes: 5
        run: |
          set -o pipefail
          make -f Makefile.work BLDENV=trixie sonic-slave-run \
            SONIC_BUILDER_EXTRA_CMDLINE="--label $SONIC_CI_CONTAINER_LABEL -e BAZEL=$BAZEL" \
            SONIC_RUN_CMDS='python3 -B tools/bazel/ci/check_kernel_sandbox.py' \
            2>&1 | tee artifacts/vs/kernel-sandbox.log

      - name: Build the VS installer (.bin)
        id: vs_build
        run: |
          set -o pipefail
          bash tools/bazel/ci/build_vs.sh 2>&1 | tee artifacts/vs/build.log

      - name: Validate VS container pairs and P4 debug symbols
        id: vs_validation
        run: |
          set -o pipefail
          bash tools/bazel/ci/validate_vs.sh 2>&1 | tee artifacts/vs/validation.log

      - name: Verify installed base, SWSS and Syncd images
        timeout-minutes: 20
        run: |
          # Make clears DOCKER_ROOT on entry; preserve the completed build's store.
          make -f Makefile.work BLDENV=trixie sonic-slave-run \
            DOCKER_ROOT="$PWD/fsroot.docker.verify-images" \
            SONIC_CONFIG_USE_NATIVE_DOCKERD_FOR_BUILD=n \
            SONIC_BUILDER_EXTRA_CMDLINE="--label $SONIC_CI_CONTAINER_LABEL --cgroupns=private" \
            SONIC_RUN_CMDS="sudo python3 -B tools/bazel/ci/prepare_nested_docker.py && \
              make -f slave.mk docker-start SONIC_CONFIG_USE_NATIVE_DOCKERD_FOR_BUILD=n && \
              python3 -B tools/bazel/ci/validate_runtime.py \
                --images-policy artifacts/vs/swss-installed-images-policy.json \
                --images-policy artifacts/vs/syncd-installed-images-policy.json --target target \
                --output artifacts/vs/installed-images.json" \
            2>&1 | tee artifacts/vs/installed-images.log

      - name: Retain VS runtime and debug archive reuse evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonic-vs-orchagent-reuse-amd64
          path: |
            vs-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/vs/orchagent-reuse.json
            vs-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/vs/runtime-debug-pairs.json
            vs-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/vs/runtime-debug-pairs-timing.json
            vs-${{ github.run_id }}-${{ github.run_attempt }}/target/sonic-vs.bin.dockers
          if-no-files-found: error
          retention-days: 14

      - name: Validate SWSS source packages from the Make build
        id: swss_validation
        if: ${{ !cancelled() && steps.vs_build.outcome == 'success' }}
        run: |
          cat > artifacts/vs/check-swss-source.sh <<'SH'
          set -euo pipefail
          option_lines=$(python3 tools/bazel/build_helpers.py options \
            --cache-directory="${BAZEL_CONTAINER_CACHE_DIR-${BAZEL_SWSS_CACHE_DIR:-}}" \
            --arguments="${BAZEL_CONTAINER_ARGS-${BAZEL_SWSS_ARGS:-}}")
          ci_options=()
          if test -n "$option_lines"; then
            while IFS= read -r option; do ci_options+=("--bazel-arg=$option"); done <<< "$option_lines"
          fi
          python3 -B tools/bazel/ci/container.py --reuse-build \
            --container //dockers/docker-orchagent --source-file rules/docker-orchagent.mk \
            --bazel "$BAZEL" --artifacts artifacts/swss \
            --bazel-arg=--platforms=@sonic_build_infra//platforms:x86_64_trixie \
            --bazel-arg=--host_platform=@sonic_build_infra//platforms:x86_64_trixie \
            "${ci_options[@]}"
          SH
          make -f Makefile.work BLDENV=trixie sonic-slave-run \
            DOCKER_ROOT="$PWD/target/docker-source-validation" \
            SONIC_BUILDER_EXTRA_CMDLINE="--label $SONIC_CI_CONTAINER_LABEL -e BAZEL=$BAZEL -e BAZEL_CONTAINER_ARGS" \
            SONIC_RUN_CMDS="bash artifacts/vs/check-swss-source.sh" \
            2>&1 | tee artifacts/vs/swss-source-validation.log

      - name: Prepare SWSS source artifact list
        id: swss_artifacts
        if: always()
        env:
          CI_JOB_STATUS: ${{ steps.swss_validation.outcome == 'success' && 'success' || 'failure' }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 -B tools/bazel/ci/public_artifacts.py source \
            --workspace "$PWD" --upload-root "$GITHUB_WORKSPACE" \
            --job-status "$CI_JOB_STATUS" --revision "$(git rev-parse HEAD)" \
            --architecture "amd64" \
            --head-sha "$CI_HEAD_SHA" --base-sha "$CI_BASE_SHA" \
            --github-output "$GITHUB_OUTPUT"

      - name: Upload public source layers and evidence
        if: always() && steps.swss_artifacts.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: swss-source-layers-amd64
          path: ${{ steps.swss_artifacts.outputs.paths }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 1

      - name: Validate Syncd source packages from the Make build
        id: syncd_validation
        if: ${{ !cancelled() && steps.vs_build.outcome == 'success' }}
        run: |
          mkdir -p artifacts/syncd-vs
          git rev-parse HEAD > artifacts/syncd-vs/revision.txt
          sha256sum platform/vs/docker-syncd-vs/bazel/apt.lock.json \
            platform/vs/docker-syncd-vs/BUILD.bazel > artifacts/syncd-vs/input-locks.sha256
          cat > artifacts/vs/check-syncd-source.sh <<'SH'
          set -euo pipefail
          option_lines=$(python3 tools/bazel/build_helpers.py options \
            --cache-directory="${BAZEL_CONTAINER_CACHE_DIR-${BAZEL_SWSS_CACHE_DIR:-}}" \
            --arguments="${BAZEL_CONTAINER_ARGS-${BAZEL_SWSS_ARGS:-}}")
          ci_options=()
          if test -n "$option_lines"; then
            while IFS= read -r option; do ci_options+=("--bazel-arg=$option"); done <<< "$option_lines"
          fi
          python3 -B tools/bazel/ci/container.py --reuse-build \
            --container //platform/vs/docker-syncd-vs --source-file platform/vs/docker-syncd-vs.mk \
            --bazel "$BAZEL" --artifacts artifacts/syncd-vs/bazel \
            --bazel-arg=--platforms=@sonic_build_infra//platforms:x86_64_trixie \
            --bazel-arg=--host_platform=@sonic_build_infra//platforms:x86_64_trixie \
            --bazel-arg=--config=syncd-dash "${ci_options[@]}"
          python3 -B tools/bazel/ci/bazel_commands.py \
            --bazel "$BAZEL" --bazel-arg=--config=syncd-dash "${ci_options[@]}" \
            --output artifacts/syncd-vs/p4-image-test-analysis.json \
            //tools/bazel/tests:syncd_p4_images_test
          SH
          make -f Makefile.work BLDENV=trixie sonic-slave-run \
            DOCKER_ROOT="$PWD/target/docker-source-validation" \
            SONIC_BUILDER_EXTRA_CMDLINE="--label $SONIC_CI_CONTAINER_LABEL -e BAZEL=$BAZEL -e BAZEL_CONTAINER_ARGS" \
            SONIC_RUN_CMDS="bash artifacts/vs/check-syncd-source.sh" \
            2>&1 | tee artifacts/vs/syncd-source-validation.log

      - name: Prepare Syncd source artifact list
        id: syncd_artifacts
        if: always()
        env:
          CI_JOB_STATUS: ${{ steps.syncd_validation.outcome == 'success' && 'success' || 'failure' }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 -B tools/bazel/ci/public_artifacts.py syncd \
            --workspace "$PWD" --upload-root "$GITHUB_WORKSPACE" \
            --job-status "$CI_JOB_STATUS" --revision "$(git rev-parse HEAD)" \
            --architecture "amd64" \
            --head-sha "$CI_HEAD_SHA" --base-sha "$CI_BASE_SHA" \
            --github-output "$GITHUB_OUTPUT"

      - name: Upload public contract evidence
        if: always() && steps.syncd_artifacts.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: syncd-vs-oci-contracts-amd64
          path: ${{ steps.syncd_artifacts.outputs.paths }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 1


      - name: Remove this job's remaining build containers
        if: always()
        timeout-minutes: 2
        working-directory: ${{ github.workspace }}
        env:
          VS_CHECKOUT: vs-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          # Killing a docker client does not stop its daemon-owned container.
          # Match this repository/run/attempt only; keep the bind-mounted logs.
          containers=$(docker ps --all --quiet --filter "label=$SONIC_CI_CONTAINER_LABEL")
          if test -n "$containers"; then
            readarray -t container_ids <<< "$containers"
            mkdir -p "$VS_CHECKOUT/artifacts/vs"
            for container_id in "${container_ids[@]}"; do
              docker logs "$container_id" > "$VS_CHECKOUT/artifacts/vs/container-$container_id.log" 2>&1 || true
            done
            if ! docker rm --force "${container_ids[@]}"; then
              # --rm containers can disappear between listing and removal.
              remaining=$(docker ps --all --quiet --filter "label=$SONIC_CI_CONTAINER_LABEL")
              test -z "$remaining"
            fi
          fi

      - name: Prepare public artifact list
        id: public_artifacts
        if: always()
        env:
          CI_JOB_STATUS: ${{ job.status }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 -B tools/bazel/ci/public_artifacts.py vs \
            --workspace "$PWD" --upload-root "$GITHUB_WORKSPACE" \
            --job-status "$CI_JOB_STATUS" --revision "$(git rev-parse HEAD)" \
            --architecture "amd64" \
            --head-sha "$CI_HEAD_SHA" --base-sha "$CI_BASE_SHA" \
            --github-output "$GITHUB_OUTPUT"

      - name: Upload public VS build summary
        if: always() && steps.public_artifacts.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonic-vs-build-diagnostics-amd64
          path: ${{ steps.public_artifacts.outputs.paths }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 1

      - name: Retain shared image validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonic-vs-image-validation-amd64
          path: |
            vs-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/vs/swss-images/
            vs-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/vs/syncd-p4-images/
            vs-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/vs/*-installed-images-policy.json
            vs-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/vs/installed-images.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload VS image and OCI container archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonic-vs-make-bazel-swss-amd64
          path: |
            vs-${{ github.run_id }}-${{ github.run_attempt }}/target/sonic-vs.bin
            vs-${{ github.run_id }}-${{ github.run_attempt }}/target/docker-orchagent.gz
            vs-${{ github.run_id }}-${{ github.run_attempt }}/target/docker-orchagent-dbg.gz
            vs-${{ github.run_id }}-${{ github.run_attempt }}/target/docker-syncd-vs.gz
            vs-${{ github.run_id }}-${{ github.run_attempt }}/target/docker-syncd-vs-dbg.gz
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  vs_container:
    name: VS installer in SONiC slave (AMD64)
    needs: [checks]
    if: >-
      github.head_ref != 'codex/registry-native-workers' &&
      github.head_ref != 'codex/framework-native-worker' &&
      github.head_ref != 'codex/orchagent-source-worker-current' &&
      github.head_ref != 'codex/source-image-worker-families' &&
      github.head_ref != 'codex/source-image-worker-p4rt-feature' &&
      github.head_ref != 'codex/image-environment' &&
      github.head_ref != 'codex/source-image-worker-dispatch' &&
      (github.event_name != 'workflow_dispatch' || inputs.source_image == 'none') &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && !inputs.skip_vs))
    runs-on: [self-hosted, linux, x64, sonic-slave-container]
    timeout-minutes: 720
    # The four registered slots share lgh4. Only one full native build may
    # consume its memory at a time; each worker still handles one job and exits.
    concurrency:
      group: sonic-slave-container-vs
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    env:
      EXPECTED_MANAGER_REVISION: 549469bac66bc9fad6bafcc8a39b946b5527dd40
      SONIC_BUILD_GIT_NAME: Guohan Lu
      SONIC_BUILD_GIT_EMAIL: securely1g@gmail.com
      PREFER_DEBIAN_REPO: "y"
      # Direct slave.mk bypasses the outer Make retry wrapper. Retry only
      # native Docker builds; strict APT refreshes keep failed indexes uncached.
      DOCKER_BUILD: ./scripts/run_with_retry docker build
      SONIC_BUILD_RETRY_COUNT: "2"
      SONIC_BUILD_RETRY_INTERVAL: "10"
      # Contain APT 3.0.3's delayed-retry warning queue (Debian #1117797).
      # The generator removes this temporary policy before image export.
      SONIC_DOCKER_APT_RETRIES: "0"
      BAZEL_CONTAINER_ARGS: >-
        --jobs=4 --local_resources=memory=12288
        --distdir=/bazel_cache/distdir/ape-1.0.1
        --distdir=/bazel_cache/distdir/download_utils-1.0.1
        --distdir=/bazel_cache/distdir/rules_coreutils-1.0.1
        --distdir=/bazel_cache/distdir/rules_gzip-1.0.0
        --distdir=/bazel_cache/distdir/toolchain_utils-1.0.2
    steps:
      - name: Checkout repository and pinned submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Download verified source archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bazel-repository-inputs
          path: artifacts/vs/repository-inputs

      - name: Prepare the privileged SONiC slave
        run: bash tools/bazel/ci/prepare_vs_slave.sh

      - name: Require the P4 source artifact from this producer job
        env:
          P4_SOURCES_ARTIFACT_ID: ${{ needs.checks.outputs.p4_sources_artifact_id }}
        run: '[[ "$P4_SOURCES_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]'

      - name: Download the pinned P4 source inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.checks.outputs.p4_sources_artifact_id }}
          merge-multiple: true
          path: artifacts/vs/p4-source-inputs

      - name: Verify P4 source bytes before native Make
        run: |
          python3 -B tools/ci/p4_source_inputs.py \
            --manifest src/p4lang/source-inputs.json \
            --directory artifacts/vs/p4-source-inputs/sources \
            --receipt artifacts/vs/p4-source-inputs-verified.json

      - name: Configure persistent caches
        env:
          BAZEL_REMOTE_AUTH: ${{ secrets.BAZEL_REMOTE_AUTH }}
        run: |
          python3 -B tools/bazel/ci/configure_runner_cache.py \
            --jobs=4 --local-memory-mb=12288
          python3 -B tools/bazel/gzip/source_archive.py \
            --archives-dir artifacts/vs/repository-inputs \
            --output /bazel_cache/distdir > artifacts/vs/source-download-receipt.json

      - name: Build sonic-vs.bin directly with slave.mk
        id: native_build
        env:
          BAZEL_REMOTE_AUTH: ${{ secrets.BAZEL_REMOTE_AUTH }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/sonic-vs-slave.env"
          cd /sonic
          git rev-parse HEAD > artifacts/vs/build-revision.txt
          make -f slave.mk target/sonic-vs.bin \
            P4LANG_SOURCE_BASE_URL=file:/sonic/artifacts/vs/p4-source-inputs/sources \
            BUILD_WITH_BAZEL_WHEN_AVAILABLE=y \
            INCLUDE_VS_DASH_SAI=y \
            INCLUDE_FIPS=y \
            ENABLE_ASAN=n \
            ENABLE_SYNCD_RPC=n 2>&1 | tee artifacts/vs/build.log
          test -s target/sonic-vs.bin
          test -s target/sonic-vs.bin.dockers
          test "$(git rev-parse HEAD)" = "$(cat artifacts/vs/build-revision.txt)"

      - name: Validate the installer and retained container pairs
        env:
          BAZEL_REMOTE_AUTH: ${{ secrets.BAZEL_REMOTE_AUTH }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/sonic-vs-slave.env"
          cd /sonic
          python3 -B scripts/validate_sonic_version.py target/sonic-vs.bin \
            --installer --secure-upgrade-mode no_sign \
            --expected-commit-id "$(git rev-parse --short HEAD)" \
            --json-output artifacts/vs/sonic-version.json
          python3 -B tools/bazel/ci/vs_archive_reuse.py capture-pairs \
            --workspace "$PWD" --receipt artifacts/vs/runtime-debug-pairs.json \
            --orchagent-receipt artifacts/vs/orchagent-reuse.json
          # Reuse this same slave and its Bazel server for the P4/debug checks.
          bash tools/bazel/ci/verify_vs_oci.sh make -f slave.mk \
            P4LANG_SOURCE_BASE_URL=file:/sonic/artifacts/vs/p4-source-inputs/sources \
            BUILD_WITH_BAZEL_WHEN_AVAILABLE=y INCLUDE_VS_DASH_SAI=y INCLUDE_FIPS=y \
            ENABLE_ASAN=n ENABLE_SYNCD_RPC=n 2>&1 | tee artifacts/vs/validation.log
          python3 -B tools/bazel/ci/vs_archive_reuse.py verify-pairs \
            --workspace "$PWD" --receipt artifacts/vs/runtime-debug-pairs.json \
            --orchagent-receipt artifacts/vs/orchagent-reuse.json
          sha256sum target/sonic-vs.bin target/docker-orchagent{,-dbg}.gz \
            target/docker-syncd-vs{,-dbg}.gz > artifacts/vs/outputs.sha256

      - name: Verify installed base, SWSS and Syncd images
        timeout-minutes: 20
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/sonic-vs-slave.env"
          cd /sonic
          # Reuse the worker-private daemon prepared before the native build.
          python3 -B tools/bazel/ci/validate_runtime.py \
            --images-policy artifacts/vs/swss-installed-images-policy.json \
            --images-policy artifacts/vs/syncd-installed-images-policy.json --target target \
            --output artifacts/vs/installed-images.json \
            2>&1 | tee artifacts/vs/installed-images.log

      - name: Publish the installer and matching container archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonic-vs-slave-amd64
          path: |
            target/sonic-vs.bin
            target/sonic-vs.bin.dockers
            target/docker-orchagent.gz
            target/docker-orchagent-dbg.gz
            target/docker-syncd-vs.gz
            target/docker-syncd-vs-dbg.gz
            artifacts/vs/outputs.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Preserve build receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonic-vs-slave-evidence-amd64
          path: |
            artifacts/vs/*.json
            artifacts/vs/*.txt
            artifacts/vs/*.sha256
            artifacts/vs/syncd-p4-images/validation.json
            MODULE.bazel.lock
          if-no-files-found: warn
          retention-days: 14

      - name: Retain shared image validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonic-vs-image-validation-amd64
          path: |
            artifacts/vs/swss-images/
            artifacts/vs/syncd-p4-images/
            artifacts/vs/*-installed-images-policy.json
            artifacts/vs/installed-images.json
          if-no-files-found: warn
          retention-days: 14

      - name: Stop this worker's private Docker daemon
        if: always()
        run: |
          if test -s "$RUNNER_TEMP/sonic-dockerd.pid"; then
            sudo -n kill -TERM "$(cat "$RUNNER_TEMP/sonic-dockerd.pid")"
          fi

  vs_cache_transport:
    name: Remote cache transport diagnostic (K3s)
    if: github.event_name == 'workflow_dispatch' && inputs.source_image == 'vs-cache-transport' && inputs.source_worker_pool == 'sonic-slave-container-k3s' && inputs.skip_vs && github.repository == 'securely1g/sonic-buildimage' && github.actor == 'securely1g' && github.triggering_actor == 'securely1g'
    runs-on: [self-hosted, linux, x64, sonic-slave-container-k3s]
    timeout-minutes: 5
    concurrency:
      group: vs-cache-transport-smoke-${{ github.run_id }}-${{ github.run_attempt }}
      cancel-in-progress: false
    steps:
      - name: Require separate transport scope and fresh paths
        id: paths
        env:
          EXPECTED_WORKER: ${{ runner.name }}
          SOURCE_REVISION: ${{ inputs.source_revision }}
          REGISTRY_REVISION: ${{ inputs.registry_revision }}
          SOURCE_CI_REQUEST: ${{ inputs.source_ci_request }}
          SOURCE_INPUTS_RUN: ${{ inputs.source_inputs_run }}
          REGISTRY_CONSUMER: ${{ inputs.registry_consumer }}
        run: |
          python3 - <<'PY_CACHE_SMOKE_PATHS'
          import os, re
          from pathlib import Path
          if any(os.environ.get(name) for name in ('SOURCE_REVISION', 'REGISTRY_REVISION', 'SOURCE_CI_REQUEST', 'SOURCE_INPUTS_RUN')) or os.environ['REGISTRY_CONSUMER'] != 'none':
              raise SystemExit('Cache transport diagnostic does not accept a native source request')
          run, attempt, worker = (os.environ[key] for key in ('GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'EXPECTED_WORKER'))
          if not all(re.fullmatch(r'[1-9][0-9]*', value) for value in (run, attempt)) or worker != os.environ['RUNNER_NAME'] or not re.fullmatch(r'ks-[a-z0-9](?:[a-z0-9-]{0,58}[a-z0-9])?', worker):
              raise SystemExit('Unexpected assigned runner identity')
          name = f'vs-cache-transport-control-{run}-{attempt}-{worker}'
          control = Path(os.environ['GITHUB_WORKSPACE']) / name
          native = control.with_name(control.name + '-native')
          receipt = Path(os.environ['RUNNER_TEMP']) / (name + '.json')
          private = Path(os.environ['RUNNER_TEMP']) / f'cache-transport-{run}-{attempt}'
          if any(os.path.lexists(path) for path in (control, native, receipt, private)):
              raise SystemExit('Preserve existing remote cache qualification paths')
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write(f'worker={worker}\ncontrol={control.name}\nnative={native.name}\nreceipt={receipt.name}\n')
          PY_CACHE_SMOKE_PATHS
      - name: Checkout the immutable transport observer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: ${{ steps.paths.outputs.control }}
          clean: false
          persist-credentials: false
      - name: Checkout the published native credential interface
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 4bf648e812f28b05a2683c6cf7559470b0883d2a
          path: ${{ steps.paths.outputs.native }}
          clean: false
          persist-credentials: false
      - name: Check source identities and fifteen pure transport fixtures
        env:
          CONTROL: ${{ steps.paths.outputs.control }}
          NATIVE: ${{ steps.paths.outputs.native }}
          GIT_NO_LAZY_FETCH: '1'
          GIT_NO_REPLACE_OBJECTS: '1'
          GIT_OPTIONAL_LOCKS: '0'
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          test "$(git -C "$GITHUB_WORKSPACE/$CONTROL" -c protocol.allow=never rev-parse HEAD)" = "$GITHUB_SHA"
          cd "$GITHUB_WORKSPACE/$NATIVE"
          test "$(git -c protocol.allow=never rev-parse HEAD)" = "4bf648e812f28b05a2683c6cf7559470b0883d2a"
          test -z "$(git -c protocol.allow=never status --porcelain --untracked-files=no)"
          printf '%s  %s\n' \
            679bda8f5a64ee00694968cc7f913ee694f792f0ad8094225a1da04b0be71237 tools/bazel/ci/remote_cache_smoke.py \
            ad7bd9fff7ea82d9639bf62f64b8e9ef046e0c0d8847eb8b3635c18edcdbf2bf tools/bazel/tests/remote_cache_smoke_test.py \
            6c491e3daf8cdbdcc64257703742763040d986ed5d69a89cdec5e3366263b26d tools/bazel/ci/source_image_worker.py \
            9e44e83bccea514eaeea0a162d67295bb00d9be1cca764681b967380c7e0f5b0 tools/bazel/cache/credentials.py | sha256sum --check --status
          printf '%s  %s\n' \
            9ffde2a7a08e5cb86bf9d91a05c6b462537fe9586c0576ca912f6983e49d9e9f tools/bazel/ci/source_worker_preflight.py | sha256sum --check --status
          cd "$GITHUB_WORKSPACE/$CONTROL"
          printf '%s  %s\n' \
            4fdf103fa9d4cca3279a6b8063789f995fd239267a57a3bc420c8ea454333a35 tools/bazel/ci/vs_cache_transport.py \
            e98f0c8a48d55f8e722cd4e5bef9da1179f82edc87d348a78dae8112cb2bec5f tools/bazel/tests/vs_cache_transport_test.py | sha256sum --check --status
          python3 -B -m unittest -v tools.bazel.tests.vs_cache_transport_test
      - name: Observe the existing probe transport once
        id: diagnostic
        env:
          CONTROL: ${{ steps.paths.outputs.control }}
          NATIVE: ${{ steps.paths.outputs.native }}
          RECEIPT: ${{ steps.paths.outputs.receipt }}
          BAZEL_REMOTE_AUTH: ${{ secrets.BAZEL_REMOTE_AUTH }}
        run: |
          set -euo pipefail
          python3 -I -S -B "$GITHUB_WORKSPACE/$CONTROL/tools/bazel/ci/vs_cache_transport.py" \
            --native-root "$GITHUB_WORKSPACE/$NATIVE" \
            --output "$RUNNER_TEMP/$RECEIPT"
      - name: Retain only the bounded public transport receipt
        if: always() && (steps.diagnostic.outcome == 'success' || steps.diagnostic.outcome == 'failure')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
