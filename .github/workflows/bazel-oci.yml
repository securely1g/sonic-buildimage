name: Bazel OCI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      source_image:
        description: Dedicated source-image worker task
        type: choice
        options: [none, preflight, sysmgr, dash-ha, orchagent, sflow, otel, syncd, gearbox, dash-engine, gnmi, gnmi-no-dialout, vs-reuse]
        default: none
      source_revision:
        description: Reviewed 40-character source commit for an image task
        type: string
        default: ''
      source_merge:
        description: Tested merge commit from the current VS native requests
        type: string
        default: ''
      reuse_inventory_revision:
        description: Immutable commit containing tools/bazel/ci/vs_reuse_inputs.json
        type: string
        default: ''
      reuse_inventory_sha256:
        description: Reviewed SHA256 of the original-input inventory
        type: string
        default: ''
      source_worker:
        description: Dedicated worker for an image pilot
        type: choice
        options: [sonic-slave-lgh114-1, sonic-slave-lgh114-2, sonic-slave-lgh114-3, sonic-slave-lgh114-4]
        default: sonic-slave-lgh114-1
      source_inputs_run:
        description: Optional successful source-download run in this repository
        type: string
        default: ''
      skip_vs:
        description: Skip the full VS image build
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  # Preserve long VS builds across source updates; same-revision reruns supersede.
  group: bazel-oci-${{ github.event.pull_request.number || github.ref }}-${{ github.sha }}-${{ inputs.source_image || 'none' }}-${{ inputs.source_revision }}
  cancel-in-progress: ${{ inputs.source_image != 'vs-reuse' }}

env:
  BAZEL: ${{ github.workspace }}/tools/bazel/ci/lldp_draft_bazel.sh

jobs:
  source_image_inputs:
    name: Fetch pinned source-image downloads
    if: github.event_name == 'workflow_dispatch' && contains(fromJSON('["sysmgr", "dash-ha", "orchagent", "sflow", "otel", "syncd", "gearbox", "dash-engine", "gnmi", "gnmi-no-dialout"]'), inputs.source_image) && inputs.source_inputs_run == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout reviewed source-download verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bazel for repository downloads only
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-version: 1.29.0
          bazelisk-cache: true
          repository-cache: true
          disk-cache: false
          cache-version: "8.5.1"
      - name: Retain the same verified GitLab sources used by the VS workflow
        run: |
          mkdir -p artifacts/source-image-inputs
          bazel fetch --repo=@@ape+ --repo=@@download_utils+ \
            --repo=@@rules_coreutils+ --repo=@@rules_gzip+ --repo=@@toolchain_utils+
          bazel mod graph --output=json > artifacts/source-image-inputs/module-graph.json
          python3 -B tools/bazel/gzip/source_archive.py \
            --repository-cache "$(bazel info repository_cache)" \
            --module-graph artifacts/source-image-inputs/module-graph.json \
            --output artifacts/source-image-inputs > artifacts/source-image-inputs/receipt.json
      - name: Upload verified source downloads
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-image-inputs
          path: |
            artifacts/source-image-inputs/*/src.tar.gz
            artifacts/source-image-inputs/receipt.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  source_image:
    needs: source_image_inputs
    name: Source image (${{ inputs.source_image }})
    if: always() && !cancelled() && (needs.source_image_inputs.result == 'success' || (needs.source_image_inputs.result == 'skipped' && inputs.source_inputs_run != '')) && github.event_name == 'workflow_dispatch' && contains(fromJSON('["sysmgr", "dash-ha", "orchagent", "sflow", "otel", "syncd", "gearbox", "dash-engine", "gnmi", "gnmi-no-dialout"]'), inputs.source_image)
    runs-on: [sonic-slave-container-dpool, '${{ inputs.source_worker }}']
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash
    env:
      SELECTED_IMAGE: ${{ inputs.source_image }}
      SOURCE_REVISION: ${{ inputs.source_revision }}
      SOURCE_INPUTS_RUN: ${{ inputs.source_inputs_run }}
    steps:
      - name: Checkout reviewed dispatcher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: control
          persist-credentials: false
      - name: Validate the fixed image selection
        run: |
          python3 -B control/tools/bazel/ci/source_image_worker.py selection \
            --image "$SELECTED_IMAGE" --revision "$SOURCE_REVISION" \
            --workspace "$GITHUB_WORKSPACE/source" --artifacts "$RUNNER_TEMP/source-image-artifacts"
      - name: Checkout the exact reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_revision }}
          path: source
          persist-credentials: false
      - name: Verify the existing successful source-download producer
        if: inputs.source_inputs_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -B control/tools/bazel/ci/source_image_worker.py verify-input-run \
            --image "$SELECTED_IMAGE" --revision "$SOURCE_REVISION" \
            --workspace "$GITHUB_WORKSPACE/source" --artifacts "$RUNNER_TEMP/source-image-artifacts"
      - name: Reuse the existing source-download artifact
        if: inputs.source_inputs_run != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bazel-repository-inputs
          run-id: ${{ inputs.source_inputs_run }}
          github-token: ${{ github.token }}
          repository: securely1g/sonic-buildimage
          path: ${{ runner.temp }}/source-image-inputs
      - name: Download the verified source archives
        if: inputs.source_inputs_run == ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: source-image-inputs
          path: ${{ runner.temp }}/source-image-inputs
      - name: Prepare private Docker and persistent worker caches
        id: prepare
        run: |
          python3 -B control/tools/bazel/ci/source_image_worker.py prepare \
            --image "$SELECTED_IMAGE" --revision "$SOURCE_REVISION" \
            --workspace "$GITHUB_WORKSPACE/source" --artifacts "$RUNNER_TEMP/source-image-artifacts"
      - name: Build source runtime and debug images
        run: |
          python3 -B control/tools/bazel/ci/source_image_worker.py build \
            --image "$SELECTED_IMAGE" --revision "$SOURCE_REVISION" \
            --workspace "$GITHUB_WORKSPACE/source" --artifacts "$RUNNER_TEMP/source-image-artifacts"
      - name: Validate image contents and symbols
        run: |
          python3 -B control/tools/bazel/ci/source_image_worker.py validate \
            --image "$SELECTED_IMAGE" --revision "$SOURCE_REVISION" \
            --workspace "$GITHUB_WORKSPACE/source" --artifacts "$RUNNER_TEMP/source-image-artifacts"
      - name: Verify incremental rebuild and restoration
        run: |
          python3 -B control/tools/bazel/ci/source_image_worker.py incremental \
            --image "$SELECTED_IMAGE" --revision "$SOURCE_REVISION" \
            --workspace "$GITHUB_WORKSPACE/source" --artifacts "$RUNNER_TEMP/source-image-artifacts"
      - name: Validate the installed services in private containers
        run: |
          python3 -B control/tools/bazel/ci/source_image_worker.py loaded \
            --image "$SELECTED_IMAGE" --revision "$SOURCE_REVISION" \
            --workspace "$GITHUB_WORKSPACE/source" --artifacts "$RUNNER_TEMP/source-image-artifacts"
      - name: Prepare declared artifacts and public evidence
        id: public_artifacts
        if: always() && steps.prepare.outcome != 'skipped'
        run: |
          python3 -B control/tools/bazel/ci/source_image_worker.py publish \
            --image "$SELECTED_IMAGE" --revision "$SOURCE_REVISION" \
            --workspace "$GITHUB_WORKSPACE/source" --artifacts "$RUNNER_TEMP/source-image-artifacts"
      - name: Upload source images and acceptance receipts
        if: always() && steps.public_artifacts.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-image-${{ inputs.source_image }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/source-image-artifacts/public/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Stop only this job's private Docker daemon
        if: always() && steps.prepare.outcome != 'skipped'
        run: |
          python3 -B control/tools/bazel/ci/source_image_worker.py stop \
            --image "$SELECTED_IMAGE" --revision "$SOURCE_REVISION" \
            --workspace "$GITHUB_WORKSPACE/source" --artifacts "$RUNNER_TEMP/source-image-artifacts"

  source_worker_preflight:
    name: Source worker preflight (${{ matrix.worker }})
    if: github.event_name == 'workflow_dispatch' && inputs.source_image == 'preflight'
    runs-on: [sonic-slave-container-dpool, '${{ matrix.worker }}']
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        worker: [sonic-slave-lgh114-1, sonic-slave-lgh114-2, sonic-slave-lgh114-3, sonic-slave-lgh114-4]
    steps:
      - name: Checkout dispatcher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Measure this worker's resources and namespace capabilities
        env:
          EXPECTED_WORKER: ${{ matrix.worker }}
        run: |
          python3 -B tools/bazel/ci/source_worker_preflight.py \
            --worker "$EXPECTED_WORKER" --output artifacts/source-worker/preflight.json
      - name: Retain measured resource evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-worker-${{ matrix.worker }}-${{ github.run_id }}
          path: artifacts/source-worker/preflight.json
          if-no-files-found: error
          retention-days: 14

  archive:
    if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.source_image == 'none') }}
    needs: [swss_layer_native, orchagent_native, sflow_native, otel_native, dash_ha_native, sysmgr_native, gearbox_native, dash_engine_native, p4rt_native, syncd_native, teamd_native]
    name: Container archive (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        # PR206 is AMD64-only; other PRs and events retain the existing matrix.
        include: >-
          ${{ fromJSON(
            github.repository == 'securely1g/sonic-buildimage' &&
            github.event_name == 'pull_request' && github.event.pull_request.number == 206 &&
            '[{"name":"AMD64","architecture":"amd64","bazelisk_version":"","machine":"x86_64","runner":"ubuntu-24.04","platform":"x86_64_trixie","disk_cache":"swss-layer-amd64","timeout":300}]' ||
            '[{"name":"AMD64","architecture":"amd64","bazelisk_version":"","machine":"x86_64","runner":"ubuntu-24.04","platform":"x86_64_trixie","disk_cache":"swss-layer-amd64","timeout":300},{"name":"ARM64","architecture":"arm64","bazelisk_version":"1.29.0","machine":"aarch64","runner":"ubuntu-24.04-arm","platform":"aarch64_trixie","disk_cache":"buildimage-gzip-arm64","timeout":60}]'
          ) }}
    container: &native_container
      image: debian:trixie-20260918@sha256:9cc080028c43b27d2074d63a5f9caf7166d731494965616c1a6d2827a004585c
      volumes:
        - /usr/local/lib/android:/runner-unused/android
        - /usr/share/dotnet:/runner-unused/dotnet
        - /opt/ghc:/runner-unused/ghc
    env: &native_bazel
      # Draft catalog for root-module resolution; the full Make VS job is separate.
      BAZEL: ${{ github.workspace }}/tools/bazel/ci/libteam_draft_bazel.sh
    defaults: &native_shell
      run:
        shell: bash
    steps:
      - name: Allocate source-build space on this disposable runner
        if: matrix.architecture == 'amd64'
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          df -h / "$GITHUB_WORKSPACE"
          du -sh /runner-unused/android /runner-unused/dotnet /runner-unused/ghc
          # These host SDKs are not inputs to the pinned Trixie build. Preserve
          # all Bazel caches, the workspace, retained outputs and execution tools.
          find /runner-unused/android /runner-unused/dotnet /runner-unused/ghc \
            -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          df -h / "$GITHUB_WORKSPACE"

      - name: Install execution tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            autoconf automake binutils binutils-gold build-essential busybox ca-certificates file gdb git j2cli jq libarchive-tools libtool libxml2 pkg-config python3 python3-jinja2 tar unzip zstd
          for tool in bsdtar gdb readelf objcopy; do command -v "$tool"; done

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

          fetch-depth: 64
      - name: Verify the tested PR source context
        id: source_context
        if: github.event_name == 'pull_request'
        run: |
          git config --global --add safe.directory "$PWD"
          python3 -B -m tools.bazel.ci.image_worker_receipt source-context --directory artifacts/source-context
      - name: Check native architecture and generated dependency state
        run: |
          test "$(uname -m)" = "${{ matrix.machine }}"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test ! -e MODULE.bazel.lock
          test -z "$(git ls-files -- MODULE.bazel.lock)"
          git check-ignore MODULE.bazel.lock

      - name: Initialize Sysmgr's pinned gNOI source
        run: git -c safe.directory="$GITHUB_WORKSPACE" submodule update --init -- src/sonic-sysmgr/gnoi
      - name: Initialize P4RT's pinned source owner
        if: matrix.architecture == 'amd64'
        run: git submodule update --init -- src/sonic-p4rt/sonic-pins

      - name: Install P4RT source execution dependencies
        if: matrix.architecture == 'amd64'
        run: |
          apt-get install -y --no-install-recommends bison flex libfl-dev libgmp-dev patch zip \
            libarchive-tools libhiredis-dev libnl-3-dev libnl-genl-3-dev libnl-nf-3-dev \
            libnl-route-3-dev libzmq3-dev libboost-serialization-dev nlohmann-json3-dev uuid-dev
          git config --global --add safe.directory "$GITHUB_WORKSPACE/src/sonic-p4rt/sonic-pins"

      - name: Check out the pinned GitHub input reader
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: securely1g/sonic-bazel-registry
          ref: 997796400cc3eefc1f0590b227cd9b74c2141424
          path: .bazel-inputs/github-reader
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            ci/github_sources.py
            ci/github_sources/bazelisk-1.29.0-linux-amd64.json
          persist-credentials: false

      - name: Prepare checksum-pinned Bazelisk
        id: bazelisk_bootstrap
        if: matrix.architecture == 'amd64'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          inputs=.bazel-inputs/github-reader/ci
          bin="$RUNNER_TEMP/sonic-bazelisk/bin"
          python3 -B "$inputs/github_sources.py" \
            --manifest "$inputs/github_sources/bazelisk-1.29.0-linux-amd64.json" \
            --distdir "$bin" --cache-dir "$HOME/.cache/sonic-github-sources" \
            --receipt artifacts/bazelisk-inputs/bazelisk-bootstrap.json \
            --github-token-env GITHUB_TOKEN
          python3 - <<'PYRECEIPT'
          from pathlib import Path
          from tools.bazel.ci.public_artifacts import load_json, safe_json
          safe_json(load_json(Path("artifacts/bazelisk-inputs/bazelisk-bootstrap.json").read_bytes()))
          PYRECEIPT
          chmod 0755 "$bin/bazel"
          printf '%s\n' "$bin" >> "$GITHUB_PATH"

      - name: Retain verified Bazelisk input provenance
        if: always() && matrix.architecture == 'amd64' && steps.bazelisk_bootstrap.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bazelisk-inputs-${{ github.job }}-${{ strategy.job-index || 0 }}-${{ github.run_attempt }}
          path: artifacts/bazelisk-inputs/bazelisk-bootstrap.json
          if-no-files-found: error
          retention-days: 14

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-version: ${{ matrix.bazelisk_version }}
          bazelisk-cache: true
          repository-cache: true
          disk-cache: ${{ matrix.disk_cache }}
          cache-version: "8.5.1"

      - name: Configure the verified source mirror
        run: |
          python3 - <<'PYCFG'
          import hashlib
          import os
          from pathlib import Path
          from urllib.request import urlopen
          # Load the merged registry configuration. Bazel verifies each archive against its pinned checksum.
          url = "https://raw.githubusercontent.com/securely1g/sonic-bazel-registry/97cc502556b7ec3435d2d67b105315bcc18bb47e/ci/source_mirrors.cfg"
          with urlopen(url, timeout=60) as response:
              data = response.read()
          expected = "ddd6f40504a30e138a62be0d728e1a352391d0f781c927eaf4ea45c44d8a0720"
          if hashlib.sha256(data).hexdigest() != expected:
              raise SystemExit("Source mirror configuration checksum mismatch")
          config = Path(os.environ["RUNNER_TEMP"]) / "sonic-source-mirrors.cfg"
          config.write_bytes(data)
          with Path(".bazelrc.user").open("a") as rc:
              rc.write("common --experimental_downloader_config=" + str(config) + "\n")
          PYCFG
      - name: Preserve configured caches for Draft validation
        run: python3 -B tools/bazel/ci/lldp_draft_cache.py

      - name: Prepare the checksum-pinned pigz source archive
        run: |
          mkdir -p artifacts/source-downloads
          python3 -B tools/bazel/gzip/prepare_pigz.py \
            --output "$PWD/artifacts/source-downloads" | tee artifacts/pigz-source.json
          # common.bazelrc imports this ignored file, including through Draft wrappers.
          printf 'common --distdir=%s\n' "$PWD/artifacts/source-downloads" >> .bazelrc.user
          # Draft wrappers disable the home rc; share setup-bazel caches with them.
          python3 - <<'PYCODE'
          from pathlib import Path
          home = Path.home() / '.bazelrc'
          cache_lines = [line for line in home.read_text().splitlines()
                         if line.startswith(('build --disk_cache=', 'common --repository_cache='))]
          assert len(cache_lines) == 2, 'setup-bazel cache settings are missing'
          user = Path('.bazelrc.user')
          user.write_text(user.read_text() + '\n'.join(cache_lines) + '\n')
          PYCODE

      - name: Prepare checksum-pinned Bazel rule archives
        id: rule_sources
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          inputs=.bazel-inputs/github-reader/ci
          python3 -B "$inputs/github_sources.py" \
            --manifest "tools/bazel/ci/sonic-buildimage-rule-inputs.json" \
            --distdir "$PWD/artifacts/source-downloads" \
            --repository-cache "$HOME/.cache/bazel-repo" \
            --cache-dir "$HOME/.cache/sonic-github-sources" \
            --receipt artifacts/rule-inputs/rule-sources.json \
            --github-token-env GITHUB_TOKEN

      - name: Retain verified Bazel rule input provenance
        if: always() && steps.rule_sources.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bazel-rule-inputs-${{ github.job }}-${{ strategy.job-index || 0 }}-${{ github.run_attempt }}
          path: artifacts/rule-inputs/rule-sources.json
          if-no-files-found: error
          retention-days: 14

      - name: Check Make OCI bases and reproducible Docker archives
        run: |
          set -euo pipefail
          mkdir -p artifacts/archive
          git rev-parse HEAD > artifacts/archive/revision.txt
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
          pull = event.get("pull_request", {})
          commit = subprocess.check_output(["git", "cat-file", "-p", "HEAD"], text=True)
          parents = [line.split()[1] for line in commit.split("\n\n", 1)[0].splitlines()
                     if line.startswith("parent ")]
          evidence = {
              "tested_head": Path("artifacts/archive/revision.txt").read_text().strip(),
              "tested_parents": parents,
              "github_sha": os.environ["GITHUB_SHA"],
              "pull_request_head": pull.get("head", {}).get("sha"),
              "pull_request_base": pull.get("base", {}).get("sha"),
              "architecture": "${{ matrix.architecture }}",
          }
          Path("artifacts/archive/revision.json").write_text(json.dumps(evidence, indent=2) + "\n")
          PY
          "$BAZEL" --version | tee artifacts/archive/bazel-version.txt
          test "$(cat artifacts/archive/bazel-version.txt)" = "bazel $(cat .bazelversion)"
          python3 -B tools/bazel/ci/bazel_commands.py --bazel "$BAZEL" \
            --bazel-arg=--platforms=@sonic_build_infra//platforms:${{ matrix.platform }} \
            --bazel-arg=--host_platform=@sonic_build_infra//platforms:${{ matrix.platform }} \
            --bazel-arg=--jobs=4 --bazel-arg=--local_resources=cpu=4 \
            --bazel-arg=--local_resources=memory=10000 \
            --output artifacts/archive/action-audit.json \
            //tools/bazel/tests:sonic_docker_archive_test \
            //tools/bazel/tests:oci_base_layout_test \
            //tools/bazel/tests:prepare_oci_base_test \
            //tools/bazel/tests:oci_base_consumer_test \
            //tools/bazel/tests:select_apt_payloads_test \
            //tools/bazel/tests:source_contract_test \
            //tools/bazel/tests:oci_license_filter_test \
            //tools/bazel/tests:test_dpkg_patterns_up_to_date \
            //tools/bazel/oci/tests:imported_symbols_test \
            //tools/bazel/oci/tests:native_symbols_test \
            //tools/bazel/oci/tests:normalize_layer_test \
            //tools/bazel/oci/tests:normalize_layer_rule_test \
            //tools/bazel/tests:archive-fixture.gz \
            //tools/bazel/tests:oci-consumer-first.gz
          "$BAZEL" test --platforms=@sonic_build_infra//platforms:${{ matrix.platform }} \
            --host_platform=@sonic_build_infra//platforms:${{ matrix.platform }} \
            --jobs=4 --local_resources=cpu=4 --local_resources=memory=10000 \
            --lockfile_mode=update --nocache_test_results --test_output=all \
            --build_event_json_file="$PWD/artifacts/archive/test-events.jsonl" \
            //tools/bazel/tests:sonic_docker_archive_test \
            //tools/bazel/tests:oci_base_layout_test \
            //tools/bazel/tests:prepare_oci_base_test \
            //tools/bazel/tests:oci_base_consumer_test \
            //tools/bazel/tests:select_apt_payloads_test \
            //tools/bazel/tests:source_contract_test \
            //tools/bazel/tests:oci_license_filter_test \
            //tools/bazel/tests:test_dpkg_patterns_up_to_date \
            //tools/bazel/oci/tests:imported_symbols_test \
            //tools/bazel/oci/tests:native_symbols_test \
            //tools/bazel/oci/tests:normalize_layer_test \
            //tools/bazel/oci/tests:normalize_layer_rule_test \
            2>&1 | tee artifacts/archive/test.log
          output=$("$BAZEL" cquery --platforms=@sonic_build_infra//platforms:${{ matrix.platform }} \
            --host_platform=@sonic_build_infra//platforms:${{ matrix.platform }} \
            --output=files //tools/bazel/tests:archive-fixture.gz)
          test -s "$output"
          cp "$output" artifacts/archive/archive-fixture.gz
          # The fixture test verifies that this payload equals the original Docker tar.
          python3 -c 'import gzip; from pathlib import Path; p = Path("artifacts/archive"); (p / "archive-fixture.tar").write_bytes(gzip.decompress((p / "archive-fixture.gz").read_bytes()))'
          sha256sum artifacts/archive/archive-fixture.* > artifacts/archive/archive-sha256.txt

      - name: Check shared Make rules with unrelated container targets
        env:
          SOURCE_ONLY_NO_DEBS: ${{ github.event_name == 'pull_request' && (github.event.pull_request.number == 5 || github.event.pull_request.number == 51 || github.event.pull_request.number == 61 || (github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'frr-native-bazel') || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/libteam-current-native-inputs') || (github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/dash-engine-review-catalog') || contains(fromJSON('["codex/image-environment","codex/config-engine-amd64","codex/swss-native-closure","codex/swss-layer-amd64","codex/bazel-snmp","codex/eventd-oci-amd64","codex/database-oci-amd64","codex/radv-oci-amd64","codex/lldp-oci-amd64","codex/frr-oci-amd64","codex/teamd-oci-amd64","codex/orchagent-source-amd64","codex/review-registry-catalog","codex/final23-integration-staging","codex/sflow-oci-amd64","codex/otel-oci-amd64","codex/dash-ha-oci-amd64","codex/sysmgr-source-image","codex/mux-oci-amd64","codex/gbsyncd-oci-amd64","codex/dash-engine-source-image","codex/gnmi-ci-wiring","codex/p4rt-source-image","codex/syncd-source-completion","codex/source-image-worker-dispatch","codex/mgmt-framework-image"]'), github.head_ref)) }}
        run: |
          # Source-only branches skip the DEB-generating kernel fixtures.
          if [[ "$SOURCE_ONLY_NO_DEBS" == true ]]; then
            for test in tools/bazel/tests/*_test.py; do
              case "$test" in
                */kernel_test.py|*/kernel_artifacts_test.py|*/kernel_sbom_test.py)
                  echo "Skip DEB-generating kernel fixtures: $test" ;;
                *) PYTHONPATH="$PWD" python3 -B -m unittest discover -s tools/bazel/tests -p "$(basename "$test")" ;;
              esac
            done
          else
            python3 -B -m unittest discover -s tools/bazel/tests -p '*_test.py'
          fi
          python3 -B tools/bazel/ci/verify_make_archive.py \
            --artifacts artifacts/archive/make-export \
            --bazel "$BAZEL" \
            --bazel-arg=--platforms=@sonic_build_infra//platforms:${{ matrix.platform }} \
            --bazel-arg=--host_platform=@sonic_build_infra//platforms:${{ matrix.platform }} \
            --bazel-arg=--jobs=4 \
            --bazel-arg=--local_resources=cpu=4 \
            --bazel-arg=--local_resources=memory=10000

      - name: Test Python packages and check startup generation
        run: |
          set -euo pipefail
          mkdir -p artifacts/config-engine
          # Render SWSS metadata on either host; this does not build an ARM64 image.
          make -f tools/bazel/prepare_manifests.mk \
            MANIFEST_METADATA=rules/docker-orchagent.mk \
            BUILD_WITH_BAZEL_WHEN_AVAILABLE=y BLDENV=trixie CONFIGURED_PLATFORM=vs \
            CONFIGURED_ARCH=amd64 ENABLE_ASAN=n DBG_IMAGE_MARK=dbg DOCKERS_PATH=dockers \
            2>&1 | tee artifacts/config-engine/make-manifests.log
          python3 -B tools/bazel/ci/bazel_commands.py --bazel "$BAZEL" \
            --bazel-arg=--platforms=@sonic_build_infra//platforms:${{ matrix.platform }} \
            --bazel-arg=--host_platform=@sonic_build_infra//platforms:${{ matrix.platform }} \
            --bazel-arg=--jobs=4 --bazel-arg=--local_resources=cpu=4 \
            --bazel-arg=--local_resources=memory=10000 \
            --output artifacts/config-engine/action-audit.json \
            //tools/bazel/tests:apt_selection_test \
            //tools/bazel/tests:sonic_py_common_test \
            //tools/bazel/tests:sonic_yang_mgmt_full_test \
            //tools/bazel/tests:sonic_yang_mgmt_wheel_test \
            //tools/bazel/tests:sonic_py_common_full_test \
            //tools/bazel/tests:sonic_config_engine_full_test \
            //tools/bazel/tests:sonic_python_wheels_test \
            //tools/bazel/tests:containercfgd_full_test \
            //tools/bazel/tests:containercfgd_wheel_test \
            //tools/bazel/tests:supervisor_python_full_test \
            //tools/bazel/tests:supervisor_python_wheel_test \
            //tools/bazel/tests:installed_wheel_fixture_test \
            //tools/bazel/tests:wheel_contract_test \
            //src/sonic-config-engine:sonic_cfggen_cli_test \
            //tools/bazel/tests:manifest_labels_test \
            //tools/bazel/tests:manifest_labels_action_test \
            //tools/bazel/tests:cfggen_template_test \
            //tools/bazel/tests:swss_render_test \
            //src/sonic-yang-mgmt:sonic_yang_mgmt_wheel \
            //src/sonic-py-common:sonic_py_common_wheel \
            //src/sonic-config-engine:sonic_config_engine_wheel \
            //src/sonic-containercfgd:sonic_containercfgd_wheel \
            //src/sonic-supervisord-utilities:sonic_supervisord_utilities_wheel \
            //dockers/docker-orchagent/config:docker_init
          "$BAZEL" test --platforms=@sonic_build_infra//platforms:${{ matrix.platform }} \
            --host_platform=@sonic_build_infra//platforms:${{ matrix.platform }} \
            --jobs=4 --local_resources=cpu=4 --local_resources=memory=10000 \
            --nocache_test_results --test_output=all \
            --build_event_json_file="$PWD/artifacts/config-engine/test-events.jsonl" \
            //tools/bazel/tests:apt_selection_test \
            //tools/bazel/tests:sonic_py_common_test \
            //tools/bazel/tests:sonic_yang_mgmt_full_test \
            //tools/bazel/tests:sonic_yang_mgmt_wheel_test \
            //tools/bazel/tests:sonic_py_common_full_test \
            //tools/bazel/tests:sonic_config_engine_full_test \
            //tools/bazel/tests:sonic_python_wheels_test \
            //tools/bazel/tests:containercfgd_full_test \
            //tools/bazel/tests:containercfgd_wheel_test \
            //tools/bazel/tests:supervisor_python_full_test \
            //tools/bazel/tests:supervisor_python_wheel_test \
            //tools/bazel/tests:installed_wheel_fixture_test \
            //tools/bazel/tests:wheel_contract_test \
            //src/sonic-config-engine:sonic_cfggen_cli_test \
            //tools/bazel/tests:manifest_labels_test \
            //tools/bazel/tests:manifest_labels_action_test \
            //tools/bazel/tests:cfggen_template_test \
            //tools/bazel/tests:swss_render_test \
            2>&1 | tee artifacts/config-engine/test.log
          output=$("$BAZEL" cquery --platforms=@sonic_build_infra//platforms:${{ matrix.platform }} \
            --host_platform=@sonic_build_infra//platforms:${{ matrix.platform }} \
            --output=files //dockers/docker-orchagent/config:docker_init)
          test -s "$output"
          bash -n "$output"
          cp "$output" artifacts/config-engine/docker-init.sh
          sha256sum artifacts/config-engine/docker-init.sh > artifacts/config-engine/sha256.txt
          git diff --exit-code

      - name: Retain wheels and required Python test evidence
        run: |
          python3 -B tools/bazel/ci/python_packages.py \
            --artifacts artifacts/config-engine \
            --revision artifacts/archive/revision.json \
            --architecture "${{ matrix.architecture }}" \
            --bazel "$BAZEL" \
            --bazel-arg=--platforms=@sonic_build_infra//platforms:${{ matrix.platform }} \
            --bazel-arg=--host_platform=@sonic_build_infra//platforms:${{ matrix.platform }} \
            --bazel-arg=--jobs=4 \
            --bazel-arg=--local_resources=cpu=4 \
            --bazel-arg=--local_resources=memory=10000
          git diff --exit-code

      - name: Check local cache reuse across fresh checkouts
        run: |
          python3 -B tools/bazel/ci/verify_agent_cache.py \
            --artifacts artifacts/archive/agent-cache \
            --bazel "$BAZEL" \
            --repository-cache "$("$BAZEL" info repository_cache)" \
            --bazel-arg=--platforms=@sonic_build_infra//platforms:${{ matrix.platform }} \
            --bazel-arg=--host_platform=@sonic_build_infra//platforms:${{ matrix.platform }} \
            --bazel-arg=--jobs=4 \
            --bazel-arg=--local_resources=cpu=4 \
            --bazel-arg=--local_resources=memory=10000

      - name: Retain generated module lock and graph
        run: |
          python3 -B - <<'PY'
          import json
          from pathlib import Path
          import os
          from tools.bazel.ci import resolution
          directory = Path("artifacts/archive").resolve()
          evidence = resolution.collect(Path.cwd(), directory, bazel=[os.environ["BAZEL"]])
          (directory / "resolution.json").write_text(json.dumps(evidence, indent=2) + "\n")
          PY

      - name: Prepare public artifact list
        id: public_artifacts
        if: always()
        env:
          CI_JOB_STATUS: ${{ job.status }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CI_BASE_SHA: ${{ steps.source_context.outputs.tested_base || github.event.pull_request.base.sha }}
        run: |
          python3 -B tools/bazel/ci/public_artifacts.py archive \
            --workspace "$PWD" --upload-root "$GITHUB_WORKSPACE" \
            --job-status "$CI_JOB_STATUS" --revision "$(git rev-parse HEAD)" \
            --architecture "${{ matrix.architecture }}" \
            --head-sha "$CI_HEAD_SHA" --base-sha "$CI_BASE_SHA" \
            --github-output "$GITHUB_OUTPUT"

      - name: Upload public archive evidence
        if: always() && steps.public_artifacts.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-archive-${{ matrix.architecture }}
          path: ${{ steps.public_artifacts.outputs.paths }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 1

      - name: Require every native image family to pass
        if: always() && matrix.architecture == 'amd64'
        env:
          NATIVE_RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          printf 'Native image job conclusions: %s\n' "$NATIVE_RESULTS"
          IFS=',' read -r -a results <<< "$NATIVE_RESULTS"
          test "${#results[@]}" -eq 11
          for result in "${results[@]}"; do
            test "$result" = success
          done

  # Keep each native family's output base, disk cache and staged archives on a
  # separate disposable runner. Runtime jobs wait for the artifacts they consume.
  # The existing archive checks run afterward and retain the required AMD64 gate.
      - name: Retain the tested PR source context
        if: always() && github.event_name == 'pull_request' && (steps.source_context.outcome == 'success')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: source-context-${{ github.job }}-${{ strategy.job-index || 0 }}-${{ github.run_attempt }}
          path: artifacts/source-context/context.json
          if-no-files-found: error
          retention-days: 14
  swss_layer_native:
    if: github.event_name != 'workflow_dispatch' || inputs.source_image == 'none'
    name: Build and inspect shared SWSS images (AMD64)
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    container: *native_container
    env: *native_bazel
    defaults: *native_shell
    steps:
      - &native_space
        name: Allocate source-build space on this disposable runner
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          df -h / "$GITHUB_WORKSPACE"
          du -sh /runner-unused/android /runner-unused/dotnet /runner-unused/ghc
          # These host SDKs are not inputs to the pinned Trixie build. Preserve
          # all Bazel caches, the workspace, retained outputs and execution tools.
          find /runner-unused/android /runner-unused/dotnet /runner-unused/ghc \
            -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          df -h / "$GITHUB_WORKSPACE"

      - &native_tools
        name: Install execution tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            autoconf automake binutils binutils-gold build-essential busybox ca-certificates file gdb git j2cli jq libarchive-tools libtool libxml2 pkg-config python3 python3-jinja2 tar unzip zstd
          for tool in bsdtar gdb readelf objcopy; do command -v "$tool"; done

      - &native_checkout
        name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - &native_architecture
        name: Check native architecture and generated dependency state
        run: |
          test "$(uname -m)" = "x86_64"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test ! -e MODULE.bazel.lock
          test -z "$(git ls-files -- MODULE.bazel.lock)"
          git check-ignore MODULE.bazel.lock

      - &native_gnoi
        name: Initialize Sysmgr's pinned gNOI source
        run: git -c safe.directory="$GITHUB_WORKSPACE" submodule update --init -- src/sonic-sysmgr/gnoi
      - &native_p4rt_owner
        name: Initialize P4RT's pinned source owner
        run: git submodule update --init -- src/sonic-p4rt/sonic-pins

      - &native_p4rt_tools
        name: Install P4RT source execution dependencies
        run: |
          apt-get install -y --no-install-recommends bison flex libfl-dev libgmp-dev patch zip \
            libarchive-tools libhiredis-dev libnl-3-dev libnl-genl-3-dev libnl-nf-3-dev \
            libnl-route-3-dev libzmq3-dev libboost-serialization-dev nlohmann-json3-dev uuid-dev
          git config --global --add safe.directory "$GITHUB_WORKSPACE/src/sonic-p4rt/sonic-pins"

      - name: Check out the pinned GitHub input reader
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: securely1g/sonic-bazel-registry
          ref: 997796400cc3eefc1f0590b227cd9b74c2141424
          path: .bazel-inputs/github-reader
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            ci/github_sources.py
            ci/github_sources/bazelisk-1.29.0-linux-amd64.json
          persist-credentials: false
      - name: Prepare checksum-pinned Bazelisk
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          inputs=.bazel-inputs/github-reader/ci
          bin="$RUNNER_TEMP/sonic-bazelisk/bin"
          python3 -B "$inputs/github_sources.py" \
            --manifest "$inputs/github_sources/bazelisk-1.29.0-linux-amd64.json" \
            --distdir "$bin" --cache-dir "$HOME/.cache/sonic-github-sources" \
            --receipt artifacts/swss-layer/bazelisk-bootstrap.json \
            --github-token-env GITHUB_TOKEN
          chmod 0755 "$bin/bazel"
          printf '%s\n' "$bin" >> "$GITHUB_PATH"

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          # Use the verified launcher prepared above.
          bazelisk-version: ""
          bazelisk-cache: true
          repository-cache: true
          disk-cache: oci-swss-layer-amd64
          cache-version: "8.5.1"

      - &native_mirror
        name: Configure the verified source mirror
        run: |
          python3 - <<'PYCFG'
          import hashlib
          import os
          from pathlib import Path
          from urllib.request import urlopen
          # Load the checksum-verified pinned configuration. Archive integrity checks remain unchanged.
          url = "https://raw.githubusercontent.com/securely1g/sonic-bazel-registry/997796400cc3eefc1f0590b227cd9b74c2141424/ci/source_mirrors.cfg"
          with urlopen(url, timeout=60) as response:
              data = response.read()
          expected = "a937b05d4197544bac965bb2b96634e12423c7f82b0fd6b13d894bcd087bce3b"
          if hashlib.sha256(data).hexdigest() != expected:
              raise SystemExit("Source mirror configuration checksum mismatch")
          config = Path(os.environ["RUNNER_TEMP"]) / "sonic-source-mirrors.cfg"
          config.write_bytes(data)
          with Path(".bazelrc.user").open("a") as rc:
              rc.write("common --experimental_downloader_config=" + str(config) + "\n")
          PYCFG
      - &native_caches
        name: Preserve configured caches for Draft validation
        run: python3 -B tools/bazel/ci/lldp_draft_cache.py

      - &native_pigz
        name: Prepare the checksum-pinned pigz source archive
        run: |
          mkdir -p artifacts/source-downloads
          python3 -B tools/bazel/gzip/prepare_pigz.py \
            --output "$PWD/artifacts/source-downloads" | tee artifacts/pigz-source.json
          # common.bazelrc imports this ignored file, including through Draft wrappers.
          printf 'common --distdir=%s\n' "$PWD/artifacts/source-downloads" >> .bazelrc.user
          # Draft wrappers disable the home rc; share setup-bazel caches with them.
          python3 - <<'PYCODE'
          from pathlib import Path
          home = Path.home() / '.bazelrc'
          cache_lines = [line for line in home.read_text().splitlines()
                         if line.startswith(('build --disk_cache=', 'common --repository_cache='))]
          assert len(cache_lines) == 2, 'setup-bazel cache settings are missing'
          user = Path('.bazelrc.user')
          user.write_text(user.read_text() + '\n'.join(cache_lines) + '\n')
          PYCODE

      - name: Prepare checksum-pinned Bazel rule archives
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          inputs=.bazel-inputs/github-reader/ci
          python3 -B "$inputs/github_sources.py" \
            --manifest "tools/bazel/ci/sonic-buildimage-rule-inputs.json" \
            --distdir "$PWD/artifacts/source-downloads" \
            --repository-cache "$HOME/.cache/bazel-repo" \
            --cache-dir "$HOME/.cache/sonic-github-sources" \
            --receipt artifacts/swss-layer/rule-sources.json \
            --github-token-env GITHUB_TOKEN
      - name: Build and inspect the shared runtime and symbols
        env:
          BAZELISK_GITHUB_TOKEN: ""
        run: |
          python3 -B tools/bazel/tests/swss_layer_payload_test.py
          python3 -B tools/bazel/ci/swss_layer.py --bazel "$BAZEL" --artifacts artifacts/swss-layer
      - name: Check cached no-op and source edit through the image
        env:
          BAZELISK_GITHUB_TOKEN: ""
        run: |
          python3 -B tools/bazel/ci/swss_rebuild.py --bazel "$BAZEL" \
            --runtime-target //dockers/docker-swss-layer-trixie:docker-swss-layer-trixie.gz \
            --symbols-target //dockers/docker-swss-layer-trixie:docker-swss-layer-trixie.debug_symbols \
            --additional-runtime-target //dockers/docker-swss-layer-trixie:source_runtime \
            --unchanged-target //dockers/docker-config-engine-trixie:docker-config-engine-trixie.gz \
            --output artifacts/swss-layer/rebuild
          git diff --exit-code
      - name: Prepare shared SWSS image evidence
        id: swss_layer_public
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, stat, tempfile
          from pathlib import Path
          from tools.bazel.ci.public_artifacts import safe_json, dependency_json, bep_summary, load_json
          root = Path('artifacts/swss-layer')
          # Preserve an already-generated lock even when the first analysis failed.
          source = Path('MODULE.bazel.lock')
          temporary = None
          try:
              destination = root / source.name
              for parent in (root, *root.parents):
                  if parent.is_symlink():
                      raise ValueError
              if destination.is_symlink() or (destination.exists() and not destination.is_file()):
                  raise ValueError
              if source.exists() or source.is_symlink():
                  identity = lambda info: (info.st_dev, info.st_ino, info.st_mode, info.st_size,
                                           info.st_mtime_ns, info.st_ctime_ns)
                  before = source.lstat()
                  maximum = 128 * 1024 * 1024
                  if not stat.S_ISREG(before.st_mode) or before.st_size > maximum:
                      raise ValueError
                  with os.fdopen(os.open(source, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK), 'rb') as stream:
                      if identity(os.fstat(stream.fileno())) != identity(before):
                          raise ValueError
                      data = stream.read(maximum + 1)
                      if len(data) != before.st_size or identity(os.fstat(stream.fileno())) != identity(before):
                          raise ValueError
                  dependency_json(load_json(data), 'lock')
                  if identity(source.lstat()) != identity(before):
                      raise ValueError
                  root.mkdir(parents=True, exist_ok=True)
                  with tempfile.NamedTemporaryFile(dir=root, prefix='.module-lock-', delete=False) as stream:
                      temporary = Path(stream.name)
                      stream.write(data)
                  temporary.replace(destination)
          except Exception:
              raise SystemExit('Root module lock is not safe to publish') from None
          finally:
              if temporary is not None:
                  temporary.unlink(missing_ok=True)
          root.mkdir(parents=True, exist_ok=True)
          if (root / 'receipt.json').exists():
              receipt = json.loads((root / 'receipt.json').read_text())
              public = {key: receipt[key] for key in ('status', 'architecture', 'revision', 'artifacts') if key in receipt}
              safe_json(public)
              (root / 'public-receipt.json').write_text(json.dumps(public, indent=2) + '\n')
          for name in ('validation.json', 'action-audit.json', 'apt-selection.json', 'packages.json', 'rebuild/rebuild.json', 'bazelisk-bootstrap.json', 'rule-sources.json'):
              path = root / name
              if path.exists():
                  safe_json(json.loads(path.read_text()))
          for name, kind in (('MODULE.bazel.lock', 'lock'), ('module-graph.json', 'graph')):
              path = root / name
              if path.exists():
                  dependency_json(json.loads(path.read_text()), kind)
          summary = {str(path.relative_to(root)): bep_summary(path.read_text().splitlines(), partial=True)
                     for path in root.rglob('*events.json*')}
          safe_json(summary)
          (root / 'build-summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          PY
      - name: Retain reviewed artifacts and receipts
        if: always() && steps.swss_layer_public.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: swss-layer-amd64
          path: |
            artifacts/swss-layer/docker-swss-layer-trixie.gz
            artifacts/swss-layer/source-runtime.tar
            artifacts/swss-layer/source-debug.tar
            artifacts/swss-layer/image-debug.tar
            artifacts/swss-layer/public-receipt.json
            artifacts/swss-layer/validation.json
            artifacts/swss-layer/action-audit.json
            artifacts/swss-layer/apt-selection.json
            artifacts/swss-layer/packages.json
            artifacts/swss-layer/build-summary.json
            artifacts/swss-layer/bazelisk-bootstrap.json
            artifacts/swss-layer/rule-sources.json
            artifacts/swss-layer/rebuild/rebuild.json
            artifacts/swss-layer/MODULE.bazel.lock
            artifacts/swss-layer/module-graph.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 1

  orchagent_native:
    if: github.event_name != 'workflow_dispatch' || inputs.source_image == 'none'
    name: Build and inspect Orchagent images (AMD64)
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    container: *native_container
    env: *native_bazel
    defaults: *native_shell
    steps:
      - *native_space
      - *native_tools
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 64
      - name: Verify the tested PR source context
        id: source_context
        if: github.event_name == 'pull_request'
        run: |
          git config --global --add safe.directory "$PWD"
          python3 -B -m tools.bazel.ci.image_worker_receipt source-context --directory artifacts/source-context
      - *native_architecture
      - *native_gnoi
      - *native_p4rt_owner
      - *native_p4rt_tools
      - &native_github_reader
        name: Check out the pinned GitHub input reader
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: securely1g/sonic-bazel-registry
          ref: 997796400cc3eefc1f0590b227cd9b74c2141424
          path: .bazel-inputs/github-reader
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            ci/github_sources.py
            ci/github_sources/bazelisk-1.29.0-linux-amd64.json
          persist-credentials: false
      - &native_bazelisk
        name: Prepare checksum-pinned Bazelisk
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_root="artifacts/${GITHUB_JOB%_native}"
          artifact_root="${artifact_root//_/-}"
          inputs=.bazel-inputs/github-reader/ci
          bin="$RUNNER_TEMP/sonic-bazelisk/bin"
          python3 -B "$inputs/github_sources.py" \
            --manifest "$inputs/github_sources/bazelisk-1.29.0-linux-amd64.json" \
            --distdir "$bin" --cache-dir "$HOME/.cache/sonic-github-sources" \
            --receipt "$artifact_root/bazelisk-bootstrap.json" \
            --github-token-env GITHUB_TOKEN
          chmod 0755 "$bin/bazel"
          printf '%s\n' "$bin" >> "$GITHUB_PATH"

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-version: ""
          bazelisk-cache: true
          repository-cache: true
          disk-cache: oci-orchagent-amd64
          cache-version: "8.5.1"

      - *native_mirror
      - *native_caches
      - *native_pigz
      - &native_rule_sources
        name: Prepare checksum-pinned Bazel rule archives
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_root="artifacts/${GITHUB_JOB%_native}"
          artifact_root="${artifact_root//_/-}"
          inputs=.bazel-inputs/github-reader/ci
          python3 -B "$inputs/github_sources.py" \
            --manifest "tools/bazel/ci/sonic-buildimage-rule-inputs.json" \
            --distdir "$PWD/artifacts/source-downloads" \
            --repository-cache "$HOME/.cache/bazel-repo" \
            --cache-dir "$HOME/.cache/sonic-github-sources" \
            --receipt "$artifact_root/rule-sources.json" \
            --github-token-env GITHUB_TOKEN
      - name: Build Orchagent variants from source owners
        id: orchagent_build
        env:
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_BASE_SHA: ${{ steps.source_context.outputs.tested_base || github.event.pull_request.base.sha }}
          SONIC_BAZEL_REGISTRY_REVISION: e6ef022c94dd2fdeeac364dfd591f9701cd37c29
          BAZELISK_GITHUB_TOKEN: ""
        run: python3 -B tools/bazel/ci/orchagent_image.py build --bazel "$BAZEL" --artifacts artifacts/orchagent
      - name: Validate installed Orchagent sources and Scapy wheel
        run: python3 -B tools/bazel/ci/orchagent_image.py validate --artifacts artifacts/orchagent
      - name: Validate Orchagent owner packages and original Scapy tests
        env:
          BAZELISK_GITHUB_TOKEN: ""
        run: |
          python3 -B tools/bazel/ci/container.py --container //dockers/docker-orchagent \
            --artifacts artifacts/orchagent-owner --bazel "$BAZEL" --reuse-build \
            --bazel-arg=--platforms=@sonic_build_infra//platforms:x86_64_trixie \
            --bazel-arg=--host_platform=@sonic_build_infra//platforms:x86_64_trixie \
            --bazel-arg=--jobs=2 --bazel-arg=--local_resources=memory=8000
      - name: Verify source edit and restored Orchagent archives
        env:
          BAZELISK_GITHUB_TOKEN: ""
        run: |
          python3 -B tools/bazel/ci/swss_rebuild.py --bazel "$BAZEL" \
            --runtime-target //dockers/docker-orchagent:docker-orchagent.gz \
            --additional-runtime-target //dockers/docker-orchagent:docker-orchagent-dbg.gz \
            --additional-runtime-target //dockers/docker-orchagent:rdeps \
            --symbols-target //dockers/docker-orchagent:rdeps_debug_symbols \
            --unchanged-target //dockers/docker-config-engine-trixie:docker-config-engine-trixie.gz \
            --unchanged-target @scapy//:wheel --output artifacts/orchagent/rebuild
          git diff --exit-code
      - name: Review public Orchagent evidence
        id: orchagent_public
        if: always() && steps.orchagent_build.outcome != 'skipped'
        run: |
          python3 - <<'PYORCH'
          import json
          from pathlib import Path
          from tools.bazel.ci.public_artifacts import safe_json, dependency_json, bep_summary
          root = Path('artifacts/orchagent')
          root.mkdir(parents=True, exist_ok=True)
          if (root / 'build-receipt.json').exists():
              receipt = json.loads((root / 'build-receipt.json').read_text())
              public = {key: receipt[key] for key in ('status', 'architecture', 'revision', 'artifacts') if key in receipt}
              safe_json(public)
              (root / 'public-receipt.json').write_text(json.dumps(public, indent=2) + '\n')
          for path in list(root.glob('*.validation.json')) + [root / name for name in ('bazelisk-bootstrap.json', 'rule-sources.json', 'validation.json', 'action-audit.json', 'runtime-apt.json', 'debug-apt.json', 'base.packages.json', 'config-engine.packages.json', 'rebuild/rebuild.json')]:
              if path.exists():
                  safe_json(json.loads(path.read_text()))
          for name, kind in (('MODULE.bazel.lock', 'lock'), ('module-graph.json', 'graph')):
              if (root / name).exists():
                  dependency_json(json.loads((root / name).read_text()), kind)
          owner_report = Path('artifacts/orchagent-owner/report.json')
          if owner_report.exists():
              safe_json(json.loads(owner_report.read_text()))
          summary = {str(path.relative_to(root)): bep_summary(path.read_text().splitlines(), partial=True) for path in root.rglob('*events.json*')}
          safe_json(summary)
          (root / 'build-summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          PYORCH
      - name: Retain Orchagent archives and source evidence
        if: always() && steps.orchagent_public.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: orchagent-source-amd64
          path: |
            artifacts/orchagent/bazelisk-bootstrap.json
            artifacts/orchagent/rule-sources.json
            artifacts/orchagent/*.gz
            artifacts/orchagent/*.tar
            artifacts/orchagent/*.whl
            artifacts/orchagent/debug.status
            artifacts/orchagent/debug.packages.json
            artifacts/orchagent/runtime-apt.json
            artifacts/orchagent/debug-apt.json
            artifacts/orchagent/base.packages.json
            artifacts/orchagent/config-engine.packages.json
            artifacts/orchagent/*.validation.json
            artifacts/orchagent/validation.json
            artifacts/orchagent/public-receipt.json
            artifacts/orchagent/action-audit.json
            artifacts/orchagent/build-summary.json
            artifacts/orchagent/rebuild/rebuild.json
            artifacts/orchagent/MODULE.bazel.lock
            artifacts/orchagent/module-graph.json
            artifacts/orchagent-owner/report.json
            artifacts/orchagent-owner/tests/**/test.xml
          if-no-files-found: error
          retention-days: 14
          compression-level: 1

      - name: Retain the tested PR source context
        if: always() && github.event_name == 'pull_request' && (steps.source_context.outcome == 'success')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: source-context-${{ github.job }}-${{ strategy.job-index || 0 }}-${{ github.run_attempt }}
          path: artifacts/source-context/context.json
          if-no-files-found: error
          retention-days: 14
