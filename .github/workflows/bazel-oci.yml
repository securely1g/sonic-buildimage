name: VS installer builder-cleanup benchmark

on:
  workflow_dispatch:
    inputs:
      cleanup_mode:
        description: Remove the installer builder on exit or in existing end-of-job cleanup
        type: choice
        required: true
        options:
          - control
          - deferred

permissions:
  actions: read
  contents: read

concurrency:
  group: vs-cleanup-benchmark-2174
  cancel-in-progress: false

jobs:
  vs_container:
    name: VS installer in SONiC slave (AMD64)
    outputs:
      containers: ${{ steps.bundles.outputs.matrix }}
      artifact_prefix: ${{ steps.bundles.outputs.prefix }}
      installer_artifact_id: ${{ steps.vs_installer_upload.outputs.artifact-id }}
      debug_layer: ${{ steps.bundles.outputs.debug_layer }}
    runs-on: [self-hosted, Linux, X64, vs, vs-cleanup-benchmark-2174]
    timeout-minutes: 720
    defaults:
      run:
        shell: bash
        working-directory: vs-${{ github.run_id }}-${{ github.run_attempt }}
    env:
      SONIC_CI_CONTAINER_LABEL: io.sonic-buildimage.ci-job=${{ github.repository }}:${{ github.run_id }}:${{ github.run_attempt }}:vs
      BAZEL: bazel
      CLEANUP_BENCHMARK_ARM: ${{ inputs.cleanup_mode }}
      # Use the explicitly selected gRPC service, not the legacy HTTPS override.
      BAZEL_REMOTE_AUTH: ""
      SONIC_BAZEL_REMOTE_CACHE: grpc://172.16.0.4:9092
      SONIC_BAZEL_REMOTE_UPLOAD: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && 'y' || 'n' }}
      SONIC_CONFIG_USE_DOCKER_CACHE: "y"
      SONIC_DPKG_CACHE_METHOD: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && 'rwcache' || 'rcache' }}
      SONIC_DPKG_CACHE_SOURCE: /nfs/dpkg_cache/vs
      SONIC_BUILD_JOBS: "1"
      SONIC_ENABLE_DEBUG_LAYER: ${{ inputs.enable_debug_layer && 'y' || 'n' }}
      ENABLE_DOCKER_BASE_PULL: "y"
      REGISTRY_SERVER: sonicdev-microsoft.azurecr.io
      ACR_REGISTRY_NAME: sonicdev
      AZURE_SUBSCRIPTION_ID: ${{ vars.ACR_SUBSCRIPTION_ID }}
      REGISTRY_PORT: "443"
      INCLUDE_FIPS: "y"
      SONIC_VERSION_CONTROL_COMPONENTS: py2,py3,web,git,docker
      MIRROR_SNAPSHOT: "y"
      SONIC_BUILD_SLAVE_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
      SONIC_BUILD_VARS: P4LANG_SOURCE_BASE_URL=file:/sonic/artifacts/vs/p4-source-inputs/sources
      PREFER_DEBIAN_REPO: "y"
      SONIC_VS_REUSE_BAZEL_PRODUCERS: "1"
      SONIC_VS_VALIDATION_BUNDLES: "1"
      # Make schedules one recipe; Bazel schedules all selected container targets.
      # Let Bazel choose its job count and CPU/memory scheduling budgets.
      BAZEL_CONTAINER_ARGS: >-
        --remote_local_fallback
        --incompatible_remote_local_fallback_for_remote_cache
        --experimental_remote_downloader=grpc://172.16.0.4:9092
        --experimental_remote_downloader_local_fallback
        --distdir=/bazel_cache/distdir/ape-1.0.1
        --distdir=/bazel_cache/distdir/download_utils-1.0.1
        --distdir=/bazel_cache/distdir/rules_coreutils-1.0.1
        --distdir=/bazel_cache/distdir/rules_gzip-1.0.0
        --distdir=/bazel_cache/distdir/toolchain_utils-1.0.2
    steps:
      - name: Confirm the selected benchmark machine and listener
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = sonic-baz00000B-vs-a9115f67
          [[ "$CLEANUP_BENCHMARK_ARM" == control || "$CLEANUP_BENCHMARK_ARM" == deferred ]]
          echo "VS_CLEANUP_BENCHMARK arm=$CLEANUP_BENCHMARK_ARM runner=$RUNNER_NAME boot_digest=$(sha256sum /proc/sys/kernel/random/boot_id | cut -d' ' -f1) docker=$(docker version --format '{{.Server.Version}}')"

      - name: Checkout repository and pinned submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: vs-${{ github.run_id }}-${{ github.run_attempt }}
          ref: 3bdfbe135e242832e04d499325211b55ded362de
          persist-credentials: false
          submodules: recursive

      - name: Download verified source archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: '44882879490'
          artifact-ids: '14698902033'
          merge-multiple: true
          path: vs-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/vs/repository-inputs

      - name: Initialize private Docker configuration
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/docker-config-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          set -euo pipefail
          install -d -m 0700 "$DOCKER_CONFIG"
          printf 'DOCKER_CONFIG=%s\n' "$DOCKER_CONFIG" >> "$GITHUB_ENV"

      - name: Configure Bazel action memory budget
        run: python3 -B tools/bazel/ci/resources.py --configure

      - name: Validate shared NFS package cache
        run: bash tools/ci/runner/nfs_package_cache.sh

      - name: Reclaim unused images and build cache
        run: |
          set -euo pipefail
          docker system df
          docker image prune --all --force
          docker builder prune --all --force
          docker system df

      - name: Reclaim local build caches
        run: python3 -B -m tools.bazel.ci.cleanup_runner_bazel_cache --runner-workspace "${{ runner.workspace }}" --remove-package-cache

      - name: Check host-agent build prerequisites
        run: python3 -B tools/ci/runner/preflight.py --host-agent --workspace "$PWD" --build-target sonic-vs.bin

      - name: Download the pinned P4 source inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: '44882879490'
          artifact-ids: '14698628647'
          merge-multiple: true
          path: vs-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/vs/p4-source-inputs

      - name: Verify P4 source bytes before native Make
        run: |
          python3 -B tools/ci/p4_source_inputs.py \
            --manifest src/p4lang/source-inputs.json \
            --directory artifacts/vs/p4-source-inputs/sources \
            --receipt artifacts/vs/p4-source-inputs-verified.json

      - name: Configure persistent caches
        env:
          SONIC_BAZEL_CACHE_SOURCE: ${{ runner.workspace }}/vs-cache/bazel
        run: |
          set -euo pipefail
          install -d -m 0700 "$SONIC_BAZEL_CACHE_SOURCE"
          test -w "$SONIC_BAZEL_CACHE_SOURCE"
          for cache in repository_cache disk_cache; do
            directory="$SONIC_BAZEL_CACHE_SOURCE/$cache"
            if test -d "$directory"; then
              blocked=$(find "$directory" -type d ! -writable -print -quit)
              if test -n "$blocked"; then
                printf 'Unwritable cache directory: %s\n' "$blocked" >&2
                exit 1
              fi
            fi
          done
          python3 -B tools/bazel/gzip/source_archive.py \
            --archives-dir artifacts/vs/repository-inputs \
            --output "$SONIC_BAZEL_CACHE_SOURCE/distdir" > artifacts/vs/source-download-receipt.json
          printf 'SONIC_BAZEL_CACHE_SOURCE=%s\nSONIC_DPKG_CACHE_SOURCE=%s\n' \
            "$SONIC_BAZEL_CACHE_SOURCE" "$SONIC_DPKG_CACHE_SOURCE" >> "$GITHUB_ENV"

      - name: Authenticate to the slave image registry
        env:
          AZURE_CONFIG_DIR: ${{ runner.temp }}/vs-azure-cli
        run: bash tools/ci/runner/azure_acr_login.sh "${ACR_REGISTRY_NAME:?}"

      - name: Prepare the host-driven SONiC slave
        run: |
          set -euo pipefail
          make init 2>&1 | tee artifacts/vs/init.log
          make configure PLATFORM=vs PLATFORM_ARCH=amd64 \
            SONIC_BUILDER_EXTRA_CMDLINE="--label $SONIC_CI_CONTAINER_LABEL" \
            2>&1 | tee artifacts/vs/configure.log
          for build_env in bookworm trixie; do
            make -f Makefile.work BLDENV="$build_env" docker-start \
              SONIC_BUILDER_EXTRA_CMDLINE="--label $SONIC_CI_CONTAINER_LABEL" \
              2>&1 | tee "artifacts/vs/docker-start-$build_env.log"
          done
          make -f Makefile.work BLDENV=trixie sonic-slave-run \
            SONIC_BUILDER_EXTRA_CMDLINE="--label $SONIC_CI_CONTAINER_LABEL" \
            SONIC_RUN_CMDS='python3 -B tools/bazel/ci/check_kernel_sandbox.py' \
            2>&1 | tee artifacts/vs/kernel-sandbox.log

      - name: Set the VS builder action memory budget
        run: |
          memory_option=$(python3 -B tools/bazel/ci/resources.py) || exit
          printf 'BAZEL_CONTAINER_ARGS=%s %s\n' "${BAZEL_CONTAINER_ARGS:-}" "$memory_option" >> "$GITHUB_ENV"

      - name: Build sonic-vs.bin through the host Make wrapper
        id: native_build
        env:
          # The labeled cleanup step removes the stopped builder after artifact publication.
          SONIC_VS_DEFER_BUILDER_CLEANUP: ${{ inputs.cleanup_mode == 'deferred' && 'y' || 'n' }}
          DOCKER_LOAD_ON_BOOT: "y"
          SONIC_VS_IMAGE_TIMINGS: "1"
          SONIC_VS_RETRY_GO_FETCH: "1"
          TERM: dumb
        run: |
          set -euo pipefail
          mkdir -p artifacts/vs/image-timings
          effective=${SONIC_VS_DEFER_BUILDER_CLEANUP:-n}
          case "$CLEANUP_BENCHMARK_ARM:$effective" in control:n|deferred:y) ;; *) exit 2 ;; esac
          receipt="$RUNNER_TEMP/vs-benchmark-main-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          (
            while true; do
              for id in $(docker ps --quiet --no-trunc --filter "label=$SONIC_CI_CONTAINER_LABEL"); do
                if docker inspect --format '{{json .Args}}' "$id" 2>/dev/null | grep -Fq 'SONIC_BUILD_TARGET=target/sonic-vs.bin'; then
                  test "$(docker inspect --format '{{ index .Config.Labels "io.sonic-buildimage.ci-job" }}' "$id")" = "${SONIC_CI_CONTAINER_LABEL#*=}"
                  details=$(docker inspect --format 'auto_remove={{.HostConfig.AutoRemove}} state={{.State.Status}}' "$id")
                  printf '%s\n' "$id" > "$receipt"
                  echo "VS_CLEANUP_BENCHMARK stage=builder-running id=$id $details"
                  exit 0
                fi
              done
              sleep 2
            done
          ) &
          trap 'kill %1 2>/dev/null || true' EXIT
          bash tools/bazel/ci/build_vs.sh 2>&1 | tee artifacts/vs/build.log
          if test -s "$receipt"; then
            id=$(cat "$receipt")
            state=$(docker inspect --format 'state={{.State.Status}} exit={{.State.ExitCode}} auto_remove={{.HostConfig.AutoRemove}}' "$id" 2>/dev/null || echo 'state=removed')
            echo "VS_CLEANUP_BENCHMARK stage=after-make id=$id $state"
          fi
          test -s target/sonic-vs.bin
          test -s target/sonic-vs.bin.dockers
          test "$(git rev-parse HEAD)" = "$(cat artifacts/vs/build-revision.txt)"

      - name: Summarize VS Bazel build timings
        if: always() && steps.native_build.outcome != 'skipped'
        continue-on-error: true
        run: |
          set -euo pipefail
          timings=artifacts/vs/image-timings
          if [[ -d "$timings" ]]; then
            python3 -B tools/bazel/ci/summarize_vs_image_timings.py "$timings" --github-actions
            cat "$timings/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Preserve VS Bazel profiles, timings and Make logs
        id: vs_image_timings_upload
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonic-vs-bazel-timings-amd64
          path: vs-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/vs/image-timings/
          if-no-files-found: warn
          retention-days: 14

      - name: Record checksums of installer deliverables
        run: |
          set -euo pipefail
          archives=(target/docker-orchagent.gz target/docker-syncd-vs.gz)
          if [[ $SONIC_ENABLE_DEBUG_LAYER == y ]]; then
            archives+=(target/docker-orchagent-dbg.gz target/docker-syncd-vs-dbg.gz)
          fi
          sha256sum target/sonic-vs.bin target/sonic-vs.bin.dockers "${archives[@]}" > artifacts/vs/outputs.sha256

      - name: Bind validation bundles to the VS build
        id: bundles
        run: |
          set -euo pipefail
          matrix=$(python3 -B tools/bazel/ci/vs_validation_bundles.py matrix \
            --directory artifacts/vs/containers --debug-layer "$SONIC_ENABLE_DEBUG_LAYER")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "debug_layer=$SONIC_ENABLE_DEBUG_LAYER" >> "$GITHUB_OUTPUT"
          echo "prefix=vs-container-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Publish the installer and matching container archives
        id: vs_installer_upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonic-vs-slave-amd64
          path: |
            vs-${{ github.run_id }}-${{ github.run_attempt }}/target/sonic-vs.bin
            vs-${{ github.run_id }}-${{ github.run_attempt }}/target/sonic-vs.bin.dockers
            vs-${{ github.run_id }}-${{ github.run_attempt }}/target/docker-orchagent.gz
            vs-${{ github.run_id }}-${{ github.run_attempt }}/target/docker-orchagent-dbg.gz
            vs-${{ github.run_id }}-${{ github.run_attempt }}/target/docker-syncd-vs.gz
            vs-${{ github.run_id }}-${{ github.run_attempt }}/target/docker-syncd-vs-dbg.gz
            vs-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/vs/outputs.sha256
            vs-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/vs/containers/selection.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Check the builder immediately after installer publication
        if: success()
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/vs-benchmark-main-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test -s "$receipt"
          id=$(cat "$receipt")
          [[ "$id" =~ ^[0-9a-f]{64}$ ]]
          remaining=$(docker ps --all --quiet --no-trunc --filter "id=$id" --filter "label=$SONIC_CI_CONTAINER_LABEL")
          if [[ $CLEANUP_BENCHMARK_ARM == control ]]; then
            test -z "$remaining"
            state=removed
          else
            test "$remaining" = "$id"
            state=$(docker inspect --format '{{.State.Status}}/{{.State.ExitCode}}/{{.HostConfig.AutoRemove}}' "$id")
            test "$state" = 'exited/0/false'
          fi
          echo "VS_CLEANUP_BENCHMARK stage=installer-published id=$id state=$state"

      - name: Preserve build receipts
        id: vs_receipts_upload
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonic-vs-slave-evidence-amd64
          path: |
            vs-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/vs/*.json
            vs-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/vs/*.txt
            vs-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/vs/*.sha256
            vs-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/vs/syncd-p4-images/validation.json
            vs-${{ github.run_id }}-${{ github.run_attempt }}/MODULE.bazel.lock
          if-no-files-found: warn
          retention-days: 14

      - name: Publish docker-base-trixie for validation
        if: contains(fromJSON(steps.bundles.outputs.matrix).include.*.image, 'docker-base-trixie')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.bundles.outputs.prefix }}-docker-base-trixie
          path: vs-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/vs/containers/docker-base-trixie/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

      - name: Publish docker-config-engine-trixie for validation
        if: contains(fromJSON(steps.bundles.outputs.matrix).include.*.image, 'docker-config-engine-trixie')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.bundles.outputs.prefix }}-docker-config-engine-trixie
          path: vs-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/vs/containers/docker-config-engine-trixie/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

      - name: Publish docker-dash-engine for validation
        if: contains(fromJSON(steps.bundles.outputs.matrix).include.*.image, 'docker-dash-engine')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.bundles.outputs.prefix }}-docker-dash-engine
          path: vs-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/vs/containers/docker-dash-engine/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

      - name: Publish docker-dash-ha for validation
        if: contains(fromJSON(steps.bundles.outputs.matrix).include.*.image, 'docker-dash-ha')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.bundles.outputs.prefix }}-docker-dash-ha
          path: vs-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/vs/containers/docker-dash-ha/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

      - name: Publish docker-database for validation
        if: contains(fromJSON(steps.bundles.outputs.matrix).include.*.image, 'docker-database')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.bundles.outputs.prefix }}-docker-database
          path: vs-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/vs/containers/docker-database/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

      - name: Publish docker-eventd for validation
        if: contains(fromJSON(steps.bundles.outputs.matrix).include.*.image, 'docker-eventd')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.bundles.outputs.prefix }}-docker-eventd
          path: vs-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/vs/containers/docker-eventd/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

      - name: Publish docker-fpm-frr for validation
        if: contains(fromJSON(steps.bundles.outputs.matrix).include.*.image, 'docker-fpm-frr')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.bundles.outputs.prefix }}-docker-fpm-frr
          path: vs-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/vs/containers/docker-fpm-frr/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

      - name: Publish docker-gbsyncd-vs for validation
        if: contains(fromJSON(steps.bundles.outputs.matrix).include.*.image, 'docker-gbsyncd-vs')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.bundles.outputs.prefix }}-docker-gbsyncd-vs
          path: vs-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/vs/containers/docker-gbsyncd-vs/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

      - name: Publish docker-lldp for validation
        if: contains(fromJSON(steps.bundles.outputs.matrix).include.*.image, 'docker-lldp')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.bundles.outputs.prefix }}-docker-lldp
          path: vs-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/vs/containers/docker-lldp/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

      - name: Publish docker-macsec for validation
        if: contains(fromJSON(steps.bundles.outputs.matrix).include.*.image, 'docker-macsec')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.bundles.outputs.prefix }}-docker-macsec
          path: vs-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/vs/containers/docker-macsec/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

      - name: Publish docker-mux for validation
        if: contains(fromJSON(steps.bundles.outputs.matrix).include.*.image, 'docker-mux')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.bundles.outputs.prefix }}-docker-mux
          path: vs-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/vs/containers/docker-mux/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

      - name: Publish docker-nat for validation
        if: contains(fromJSON(steps.bundles.outputs.matrix).include.*.image, 'docker-nat')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.bundles.outputs.prefix }}-docker-nat
          path: vs-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/vs/containers/docker-nat/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

      - name: Publish docker-orchagent for validation
        if: contains(fromJSON(steps.bundles.outputs.matrix).include.*.image, 'docker-orchagent')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.bundles.outputs.prefix }}-docker-orchagent
          path: vs-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/vs/containers/docker-orchagent/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

      - name: Publish docker-router-advertiser for validation
        if: contains(fromJSON(steps.bundles.outputs.matrix).include.*.image, 'docker-router-advertiser')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.bundles.outputs.prefix }}-docker-router-advertiser
          path: vs-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/vs/containers/docker-router-advertiser/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

      - name: Publish docker-sflow for validation
        if: contains(fromJSON(steps.bundles.outputs.matrix).include.*.image, 'docker-sflow')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.bundles.outputs.prefix }}-docker-sflow
          path: vs-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/vs/containers/docker-sflow/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

      - name: Publish docker-snmp for validation
        if: contains(fromJSON(steps.bundles.outputs.matrix).include.*.image, 'docker-snmp')
