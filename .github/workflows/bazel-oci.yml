              raise SystemExit('Unexpected current worker identity')
          workspace = Path(os.environ['GITHUB_WORKSPACE'])
          if workspace.resolve() != workspace or not workspace.is_relative_to('/actions/_work') or os.getuid() != 1000:
              raise SystemExit('Expected the current private K3s workspace')
          if shutil.disk_usage(workspace).free < 1024**3:
              raise SystemExit('Legacy metadata observation needs1GiB for source checkout and reports')
          name = f'vs-legacy-archives-{run}-{attempt}-{worker}'
          root = workspace / name
          if os.path.lexists(root):
              raise SystemExit('Preserve existing legacy observation work')
          root.mkdir(mode=0o700)
          for child in ('outputs', 'temporary'):
