          for name, identity in expected.items():
              path = root / name
              if path.is_symlink() or not path.is_file():
                  raise SystemExit('Unexpected policy caller file type')
              raw = path.read_bytes()
              if len(raw) != identity['bytes'] or hashlib.sha256(raw).hexdigest() != identity['sha256']:
