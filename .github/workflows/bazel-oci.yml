          env -i PATH=/usr/bin:/bin LANG=C.UTF-8 HOME="$OBS_ROOT/temporary" TMPDIR="$OBS_ROOT/temporary" \
            /usr/bin/python3 -I -S -B -c 'import sys,unittest; sys.path.insert(0,sys.argv[1]); suite=unittest.defaultTestLoader.loadTestsFromNames(["tools.bazel.tests.observe_original_socat_test"]); result=unittest.TextTestRunner(verbosity=2).run(suite); raise SystemExit(result.testsRun != 12 or not result.wasSuccessful())' "$OBS_ROOT/inspection"
      - name: Confirm immutable original artifact metadata
        id: artifacts
