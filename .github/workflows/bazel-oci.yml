        env:
          OBS_ROOT: ${{ steps.paths.outputs.root }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('node:fs');
            const root = process.env.OBS_ROOT;
            const plan = JSON.parse(fs.readFileSync(root + '/outputs/original-inputs.json', 'utf8'));
            const retained = [];
            for (const expected of plan.artifacts) {
              const response = await github.rest.actions.getArtifact({owner: 'securely1g', repo: 'sonic-buildimage', artifact_id: expected.id});
              const actual = response.data;
              if (actual.id !== expected.id || actual.name !== expected.name || actual.digest !== expected.digest || actual.size_in_bytes !== expected.size_in_bytes || actual.expired || actual.workflow_run.id !== expected.workflow_run.id || actual.workflow_run.head_sha !== expected.workflow_run.head_sha) throw new Error('Original artifact identity differs');
              retained.push(actual);
            }
            fs.writeFileSync(root + '/outputs/original-artifact-metadata.json', JSON.stringify(retained, null, 2) + '\n', {flag: 'wx'});
      - name: Read original host cache objects
        id: host_download
        timeout-minutes: 5
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          repository: securely1g/sonic-buildimage
          github-token: ${{ github.token }}
          run-id: 43415239936
          artifact-ids: '14030424431'
          path: ${{ steps.paths.outputs.root }}/inputs/host
          digest-mismatch: error
      - name: Compare only the three original Socat binaries without execution
        id: observation
        timeout-minutes: 11
        env:
          OBS_ROOT: ${{ steps.paths.outputs.root }}
        run: |
          env -i PATH=/usr/bin:/bin LANG=C.UTF-8 HOME="$OBS_ROOT/temporary" TMPDIR="$OBS_ROOT/temporary" \
            /usr/bin/python3 -I -S -B "$OBS_ROOT/inspection/tools/bazel/ci/observe_original_socat.py" \
            --manifest "$OBS_ROOT/inspection/tools/bazel/ci/vs_socat_original_binary_comparison.json" \
            --artifact "$OBS_ROOT/inputs/host" --scratch "$OBS_ROOT/host-scratch" \
            --report "$OBS_ROOT/outputs/socat-binary-comparison.json"
      - name: Retain only the small Socat comparison report
        if: always() && !cancelled() && steps.sources.outcome == 'success'
        timeout-minutes: 3
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vs-socat-binary-comparison-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.paths.outputs.root }}/outputs/*.json
          if-no-files-found: error
          retention-days: 30
