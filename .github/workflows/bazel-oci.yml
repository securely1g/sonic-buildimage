        github-token: ${{ github.token }}
        repository: securely1g/sonic-buildimage
        path: ${{ env.SONIC_RECEIPT_SCRATCH }}/gearbox-ci-evidence
    - name: Verify all original Gearbox acceptance checks
      working-directory: ${{ env.SONIC_RECEIPT_WORKSPACE }}
      if: env.GEARBOX_WORKER_RECEIPT == 'true'
      run: "python3 -B -m tools.bazel.ci.image_worker_receipt verify \\\n  --contract tools/bazel/ci/gearbox_worker_contract.json \\\n  --directory \"$SONIC_RECEIPT_SCRATCH/gearbox-ci-request\" \\\n  --public \"$SONIC_RECEIPT_SCRATCH/gearbox-ci-evidence\" \\\n  --output \"$SONIC_RECEIPT_SCRATCH/gearbox-ci-verified.json\"\n"
    - name: Retain the verified CI handoff summary
      if: env.GEARBOX_WORKER_RECEIPT == 'true'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: gearbox-ci-gearbox_native-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ env.SONIC_RECEIPT_SCRATCH }}/gearbox-ci-verified.json
        if-no-files-found: error
        retention-days: '14'
    - name: Allocate source-build space on this disposable runner
      run: "test \"$RUNNER_ENVIRONMENT\" = github-hosted\ndf -h / \"$GITHUB_WORKSPACE\"\ndu -sh /runner-unused/android /runner-unused/dotnet /runner-unused/ghc\n# These host SDKs are not inputs to the pinned Trixie build. Preserve\n# all Bazel caches, the workspace, retained outputs and execution tools.\nfind /runner-unused/android /runner-unused/dotnet /runner-unused/ghc \\\n  -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +\ndf -h / \"$GITHUB_WORKSPACE\"\n"
      if: env.GEARBOX_WORKER_RECEIPT != 'true'
    - name: Install execution tools
      run: "apt-get update\napt-get install -y --no-install-recommends \\\n  autoconf automake binutils binutils-gold build-essential busybox ca-certificates file gdb git j2cli jq libarchive-tools libtool libxml2 pkg-config python3 python3-jinja2 tar unzip zstd\nfor tool in bsdtar gdb readelf objcopy; do command -v \"$tool\"; done\n"
      if: env.GEARBOX_WORKER_RECEIPT != 'true'
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
