      - name: Authenticate the original verified source inputs
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          POLICY_ROOT: ${{ steps.paths.outputs.root }}
        with:
          script: |
            const fs = require('node:fs');
            const root = process.env.POLICY_ROOT;
            const plan = JSON.parse(fs.readFileSync(root + '/control/tools/bazel/ci/vs_swss_installed_policy_inputs.json', 'utf8'));
            const expected = plan.source_inputs;
            const owner = 'securely1g', repo = 'sonic-buildimage';
            const {data: artifact} = await github.rest.actions.getArtifact({owner, repo, artifact_id: expected.artifact_id});
            const {data: run} = await github.rest.actions.getWorkflowRun({owner, repo, run_id: expected.run_id});
            const {data: jobs} = await github.rest.actions.listJobsForWorkflowRun({owner, repo, run_id: expected.run_id, per_page: 100});
            const sourceHead = 'df17080469e74093c373e55522bf5c029d3451fc';
            if (artifact.id !== expected.artifact_id || artifact.name !== 'bazel-repository-inputs' ||
                artifact.digest !== expected.digest || artifact.size_in_bytes !== expected.zip_bytes || artifact.expired ||
                artifact.workflow_run.id !== expected.run_id || artifact.workflow_run.head_sha !== sourceHead ||
                run.id !== expected.run_id || run.head_sha !== sourceHead || run.repository.full_name !== owner + '/' + repo ||
                run.path !== '.github/workflows/bazel-oci.yml' || run.name !== 'Bazel OCI' ||
                artifact.workflow_run.repository_id !== run.repository.id || jobs.total_count > 100) {
              throw new Error('Original verified source-input identity differs');
            }
            const producers = jobs.jobs.filter(job => job.name === 'OCI regression checks (AMD64)' && job.conclusion === 'success');
            const requiredSteps = ['Retain the verified GitLab source downloads', 'Upload the source downloads for the VS job'];
            if (producers.length !== 1 || !requiredSteps.every(name =>
                producers[0].steps.some(step => step.name === name && step.conclusion === 'success'))) {
              throw new Error('The original source-input producer has not succeeded');
            }
            const retained = {repository: owner + '/' + repo, source_revision: sourceHead, run: run.id,
              run_attempt: run.run_attempt, producer_job: producers[0].id, artifact: artifact.id,
              artifact_name: artifact.name, artifact_bytes: artifact.size_in_bytes, artifact_digest: artifact.digest,
              verified_producer_steps: requiredSteps};
            fs.writeFileSync(root + '/evidence/original-source-input.json', JSON.stringify(retained, null, 2) + '\n', {flag: 'wx'});
      - name: Download only the original source-input artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
