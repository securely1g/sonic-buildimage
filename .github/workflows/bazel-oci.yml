            const expected = plan.source_inputs;
            const owner = 'securely1g', repo = 'sonic-buildimage';
            const {data: artifact} = await github.rest.actions.getArtifact({owner, repo, artifact_id: expected.artifact_id});
            const {data: run} = await github.rest.actions.getWorkflowRun({owner, repo, run_id: expected.run_id});
            const {data: jobs} = await github.rest.actions.listJobsForWorkflowRun({owner, repo, run_id: expected.run_id, per_page: 100});
            const sourceHead = 'df17080469e74093c373e55522bf5c029d3451fc';
            if (artifact.id !== expected.artifact_id || artifact.name !== 'bazel-repository-inputs' ||
