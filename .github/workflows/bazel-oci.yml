# Disposable backfill driver; do not merge this workflow into master.
name: Historical master VS installer backfill
run-name: VS installer backfill ${{ inputs.source_sha }}
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Original cancelled master revision (source remains unchanged)
        required: true
        type: choice
        options:
          - 8bf48af011622657a73570a54d1a660b821bb30a
          - 13d750dee1750ee1c325e0fea9b7b4eaaf10cb14
          - 2dc503aaecfb0d3c317608aaeabc68a108e32b97
          - c20b1d43e26c6eb2928191f041b78a60251ef9a0
permissions:
  contents: read
  actions: read
jobs:
  backfill:
    name: Historical VS installer in SONiC slave (AMD64)
    runs-on: [self-hosted, linux, x64, sonic-slave-container]
    timeout-minutes: 720
    # Each dispatch uses a separate native worker. The existing four-worker
    # pool supplies capacity; no job concurrency group serializes these builds.
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      SONIC_VS_SOURCE_WORKSPACE: ${{ github.workspace }}/vs-${{ github.run_id }}-${{ github.run_attempt }}
      EXPECTED_MANAGER_REVISION: 549469bac66bc9fad6bafcc8a39b946b5527dd40
      SONIC_BUILD_GIT_NAME: Guohan Lu
      SONIC_BUILD_GIT_EMAIL: securely1g@gmail.com
      # The preparation step selects the original revision-specific source mode.
      PREFER_DEBIAN_REPO: "n"
      DOCKER_BUILD: ./scripts/run_with_retry docker build
      SONIC_BUILD_RETRY_COUNT: "2"
      SONIC_BUILD_RETRY_INTERVAL: "10"
      BAZEL_CONTAINER_ARGS: >-
        --jobs=4 --local_resources=memory=12288
        --distdir=/bazel_cache/distdir/ape-1.0.1
        --distdir=/bazel_cache/distdir/download_utils-1.0.1
        --distdir=/bazel_cache/distdir/rules_coreutils-1.0.1
        --distdir=/bazel_cache/distdir/rules_gzip-1.0.0
        --distdir=/bazel_cache/distdir/toolchain_utils-1.0.2
    defaults:
      run:
        shell: bash
        working-directory: vs-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout the reviewed backfill driver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: control-${{ github.run_id }}-${{ github.run_attempt }}
          persist-credentials: false

      - name: Verify original run and pinned download artifact
        id: inputs
        working-directory: ${{ github.workspace }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 -B "control-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/tools/ci/historical_vs_backfill.py" inputs \
            --source-sha "$SOURCE_SHA" --output "evidence-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --github-output "$GITHUB_OUTPUT"

      - name: Checkout the exact historical source and pinned submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          path: vs-${{ github.run_id }}-${{ github.run_attempt }}
          persist-credentials: false
          submodules: recursive

      - name: Verify historical checkout identity
        run: |
          mkdir -p artifacts/vs
          python3 -B "$GITHUB_WORKSPACE/control-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/tools/ci/historical_vs_backfill.py" identity \
            --source-sha "$SOURCE_SHA" --workspace "$PWD" --output artifacts/vs/source-before.json
          test ! -e target/sonic-vs.bin

      - name: Prepare the native slave using separate current control helpers
        env:
          PREFER_DEBIAN_REPO: ${{ steps.inputs.outputs.prefer_debian_repo }}
        run: |
          bash "$GITHUB_WORKSPACE/control-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/tools/bazel/ci/prepare_vs_slave.sh"

      - name: Download the original run's verified source inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.inputs.outputs.artifact_id }}
          run-id: ${{ steps.inputs.outputs.run_id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: vs-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/vs/repository-inputs

      - name: Download c20's original pinned P4 input artifact
        if: steps.inputs.outputs.p4_artifact_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.inputs.outputs.p4_artifact_id }}
          run-id: ${{ steps.inputs.outputs.run_id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: vs-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/vs/p4-source-inputs

      - name: Verify P4 bytes using c20's original source manifest and helper
        if: steps.inputs.outputs.p4_artifact_id != ''
        run: |
          python3 -B tools/ci/p4_source_inputs.py \
            --manifest src/p4lang/source-inputs.json \
            --directory artifacts/vs/p4-source-inputs/sources \
            --receipt artifacts/vs/p4-source-inputs-verified.json

      - name: Configure caches and verify the historical source-download pins
        env:
          BAZEL_REMOTE_AUTH: ${{ secrets.BAZEL_REMOTE_AUTH }}
        run: |
          python3 -B "$GITHUB_WORKSPACE/control-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/tools/bazel/ci/configure_runner_cache.py" \
            --jobs=4 --local-memory-mb=12288
          python3 -B tools/bazel/gzip/source_archive.py \
            --archives-dir artifacts/vs/repository-inputs \
            --output /bazel_cache/distdir > artifacts/vs/source-download-receipt.json

      - name: Prepare older kernels with the existing worker Java trust store
        if: steps.inputs.outputs.p4_artifact_id == ''
        run: |
          source "$RUNNER_TEMP/sonic-vs-slave.env"
          cd /sonic
          python3 -B "$GITHUB_WORKSPACE/control-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/tools/ci/historical_vs_backfill.py" kernel \
            --source-sha "$SOURCE_SHA" --workspace "$PWD" --output artifacts/vs/kernel-trust-handoff.json \
            2>&1 | tee artifacts/vs/kernel-trust-handoff.log

      - name: Build the historical ONIE installer directly with slave.mk
        id: build
        env:
          BAZEL_REMOTE_AUTH: ${{ secrets.BAZEL_REMOTE_AUTH }}
          P4_SOURCES_ARTIFACT_ID: ${{ steps.inputs.outputs.p4_artifact_id }}
          SONIC_DOCKER_APT_RETRIES: ${{ steps.inputs.outputs.native_docker_apt_retries }}
        run: |
          source "$RUNNER_TEMP/sonic-vs-slave.env"
          cd /sonic
          # c20 supports its original verified file transport. The three older
          # source recipes retain their original URLs without an ignored override.
          p4_options=()
          if [[ -n "$P4_SOURCES_ARTIFACT_ID" ]]; then
            p4_options+=(P4LANG_SOURCE_BASE_URL=file:/sonic/artifacts/vs/p4-source-inputs/sources)
          fi
          make -f slave.mk target/sonic-vs.bin "${p4_options[@]}" \
            BUILD_WITH_BAZEL_WHEN_AVAILABLE=y INCLUDE_VS_DASH_SAI=y INCLUDE_FIPS=y \
            ENABLE_ASAN=n ENABLE_SYNCD_RPC=n \
            2>&1 | tee artifacts/vs/build.log
          test -s target/sonic-vs.bin
          test -s target/sonic-vs.bin.dockers
          sha256sum target/sonic-vs.bin > artifacts/vs/sonic-vs.bin.sha256

      - name: Verify the installer embeds the historical source identity
        run: |
          source "$RUNNER_TEMP/sonic-vs-slave.env"
          cd /sonic
          python3 -B "$GITHUB_WORKSPACE/control-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/scripts/validate_sonic_version.py" \
            --installer --expected-commit-id "$(git rev-parse --short HEAD)" --secure-upgrade-mode no_sign \
            --json-output artifacts/vs/sonic-version.json target/sonic-vs.bin \
            2>&1 | tee artifacts/vs/installer-version.log

      - name: Retain c20's original archive-pair and source-package validation
        if: steps.inputs.outputs.p4_artifact_id != ''
        env:
          BAZEL_REMOTE_AUTH: ${{ secrets.BAZEL_REMOTE_AUTH }}
          SONIC_DOCKER_APT_RETRIES: ${{ steps.inputs.outputs.native_docker_apt_retries }}
        run: |
          source "$RUNNER_TEMP/sonic-vs-slave.env"
          cd /sonic
          python3 -B tools/bazel/ci/vs_archive_reuse.py capture-pairs \
            --workspace "$PWD" --receipt artifacts/vs/runtime-debug-pairs.json \
            --orchagent-receipt artifacts/vs/orchagent-reuse.json
          bash tools/bazel/ci/verify_vs_oci.sh make -f slave.mk \
            P4LANG_SOURCE_BASE_URL=file:/sonic/artifacts/vs/p4-source-inputs/sources \
            BUILD_WITH_BAZEL_WHEN_AVAILABLE=y INCLUDE_VS_DASH_SAI=y INCLUDE_FIPS=y \
            ENABLE_ASAN=n ENABLE_SYNCD_RPC=n 2>&1 | tee artifacts/vs/validation.log
          python3 -B tools/bazel/ci/vs_archive_reuse.py verify-pairs \
            --workspace "$PWD" --receipt artifacts/vs/runtime-debug-pairs.json \
            --orchagent-receipt artifacts/vs/orchagent-reuse.json
          sha256sum target/sonic-vs.bin target/docker-orchagent{,-dbg}.gz \
            target/docker-syncd-vs{,-dbg}.gz > artifacts/vs/outputs.sha256

      - name: Verify source identity after the build
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          SONIC_DOCKER_APT_RETRIES: ${{ steps.inputs.outputs.native_docker_apt_retries }}
        run: |
          source "$RUNNER_TEMP/sonic-vs-slave.env"
          cd /sonic
          python3 -B "$GITHUB_WORKSPACE/control-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/tools/ci/historical_vs_backfill.py" identity \
            --source-sha "$SOURCE_SHA" --workspace "$PWD" --output artifacts/vs/source-after.json \
            --after-build
          printf '%s\n' 'Built target/sonic-vs.bin from the original source revision. This backfill does not create or boot a KVM disk, or claim the newer PR #54 runtime-validation coverage.' >> "$GITHUB_STEP_SUMMARY"
          printf 'Source: `%s`; driver: `%s`.\n' "$SOURCE_SHA" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the historical installer and checksum
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonic-vs-bin-${{ inputs.source_sha }}
          path: |
            vs-${{ github.run_id }}-${{ github.run_attempt }}/target/sonic-vs.bin
            vs-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/vs/sonic-vs.bin.sha256
            vs-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/vs/source-*.json
            vs-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/vs/sonic-version.json
            evidence-${{ github.run_id }}-${{ github.run_attempt }}/inputs.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload c20's matching runtime and debug container archives
        if: success() && steps.inputs.outputs.p4_artifact_id != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonic-vs-container-pairs-${{ inputs.source_sha }}
          path: |
            vs-${{ github.run_id }}-${{ github.run_attempt }}/target/docker-orchagent.gz
            vs-${{ github.run_id }}-${{ github.run_attempt }}/target/docker-orchagent-dbg.gz
            vs-${{ github.run_id }}-${{ github.run_attempt }}/target/docker-syncd-vs.gz
            vs-${{ github.run_id }}-${{ github.run_attempt }}/target/docker-syncd-vs-dbg.gz
            vs-${{ github.run_id }}-${{ github.run_attempt }}/target/sonic-vs.bin.dockers
            vs-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/vs/outputs.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Stop only this worker's private Docker daemon
        if: always()
        timeout-minutes: 2
        run: |
          if test -s "$RUNNER_TEMP/sonic-dockerd.pid"; then
            sudo -n kill -TERM "$(cat "$RUNNER_TEMP/sonic-dockerd.pid")"
          fi

      - name: Retain build evidence on success or failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonic-vs-backfill-evidence-${{ inputs.source_sha }}
          path: |
            evidence-${{ github.run_id }}-${{ github.run_attempt }}/
            vs-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/vs/*.json
            vs-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/vs/*.log
            vs-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/vs/*.txt
            vs-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/vs/*.sha256
            vs-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/vs/syncd-p4-images/validation.json
            vs-${{ github.run_id }}-${{ github.run_attempt }}/target/*.log
            vs-${{ github.run_id }}-${{ github.run_attempt }}/MODULE.bazel.lock
          if-no-files-found: error
          retention-days: 14
          compression-level: 1
