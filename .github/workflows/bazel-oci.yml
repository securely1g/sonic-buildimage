          for name, digest in expected.items():
              if hashlib.sha256(Path(name).read_bytes()).hexdigest() != digest:
                  raise SystemExit('Original inspection source binding differs')
          PY_SOURCE
          python3 -B -m unittest -v \
            tools.bazel.tests.native_payload_recovery_test \
