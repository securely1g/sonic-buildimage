    name: Inspect declared bitarray ABI and debug build (AMD64)
    if: github.event_name == 'workflow_dispatch' && inputs.source_image == 'vs-bitarray-abi-debug' && inputs.source_worker_pool == 'sonic-slave-container-k3s' && inputs.skip_vs && github.repository == 'securely1g/sonic-buildimage' && github.actor == 'securely1g' && github.triggering_actor == 'securely1g'
    runs-on: [self-hosted, linux, x64, sonic-slave-container-k3s]
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    concurrency:
      group: vs-bitarray-abi-debug-${{ github.run_id }}-${{ github.run_attempt }}
      cancel-in-progress: false
    steps:
      - name: Allocate fresh bitarray qualification scratch
        id: paths
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKER: ${{ runner.name }}
          INPUT_SOURCE_REVISION: ${{ inputs.source_revision }}
          INPUT_REGISTRY_REVISION: ${{ inputs.registry_revision }}
          INPUT_SOURCE_CI_REQUEST: ${{ inputs.source_ci_request }}
          INPUT_SOURCE_INPUTS_RUN: ${{ inputs.source_inputs_run }}
          INPUT_REGISTRY_CONSUMER: ${{ inputs.registry_consumer }}
        run: |
          python3 -I -S -B - <<'PYTHON'
          import os, re, shutil
          from pathlib import Path
          if any(os.environ.get(key) for key in ('INPUT_SOURCE_REVISION', 'INPUT_REGISTRY_REVISION',
                  'INPUT_SOURCE_CI_REQUEST', 'INPUT_SOURCE_INPUTS_RUN')):
              raise SystemExit('This fixed qualification job does not accept revision or source-input overrides')
          if os.environ.get('INPUT_REGISTRY_CONSUMER') != 'none':
              raise SystemExit('This job does not select a registry consumer')
          run, attempt, worker = (os.environ[key] for key in ('RUN_ID', 'RUN_ATTEMPT', 'WORKER'))
          if not all(re.fullmatch(r'[1-9][0-9]*', value) for value in (run, attempt)):
              raise SystemExit('Invalid run identity')
          if worker != os.environ.get('RUNNER_NAME') or not re.fullmatch(r'ks-[a-z0-9](?:[a-z0-9-]{0,58}[a-z0-9])?', worker):
              raise SystemExit('Unexpected K3s worker identity')
          workspace = Path(os.environ['GITHUB_WORKSPACE'])
          if workspace.resolve(strict=True) != workspace or not workspace.is_relative_to('/actions/_work') or os.getuid() != 1000:
              raise SystemExit('Unexpected worker workspace or user')
          if shutil.disk_usage(workspace).free < 90 * 1024**3:
              raise SystemExit('The qualification needs 90 GiB of free scratch')
          root = workspace / ('vs-bitarray-abi-debug-' + run + '-' + attempt + '-' + worker)
          if os.path.lexists(root):
              raise SystemExit('Qualification scratch already exists')
          root.mkdir(mode=0o700)
          for name in ('scratch', 'scratch/bazelisk', 'scratch/temporary', 'inputs', 'evidence', 'reports', 'baseline-reports', 'baseline-outputs'):
              (root / name).mkdir(mode=0o700)
          values = {'root': str(root)}
          values.update({name: str((root / name).relative_to(workspace)) for name in ('control', 'source', 'native', 'catalog', 'registry')})
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as stream:
              for name, value in values.items():
                  stream.write(name + '=' + value + '\n')
          PYTHON
