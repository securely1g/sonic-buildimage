name: Independent native VS configured-host builds
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
jobs:
  pair:
    runs-on:
    - self-hosted
    - linux
    - bazel-x64
    - vs
    name: Two clean native VS installers at different releases
    timeout-minutes: 300
    env:
      SONIC_CI_CONTAINER_LABEL: io.sonic-buildimage.ci-job=${{ github.repository }}:${{ github.run_id }}:${{ github.run_attempt }}:vs
      BAZEL: bazel
      BAZEL_REMOTE_AUTH: ''
      SONIC_BAZEL_REMOTE_CACHE: grpc://172.16.0.4:9092
      SONIC_BAZEL_REMOTE_UPLOAD: n
      SONIC_CONFIG_USE_DOCKER_CACHE: y
      SONIC_DPKG_CACHE_METHOD: rcache
      SONIC_DPKG_CACHE_SOURCE: /nfs/dpkg_cache/vs
      SONIC_BUILD_JOBS: '1'
      SONIC_ENABLE_DEBUG_LAYER: n
      ENABLE_DOCKER_BASE_PULL: y
      REGISTRY_SERVER: sonicdev-microsoft.azurecr.io
      ACR_REGISTRY_NAME: sonicdev
      AZURE_SUBSCRIPTION_ID: ${{ vars.ACR_SUBSCRIPTION_ID }}
      REGISTRY_PORT: '443'
      INCLUDE_FIPS: y
      SONIC_VERSION_CONTROL_COMPONENTS: py2,py3,web,git,docker
      MIRROR_SNAPSHOT: y
      SONIC_BUILD_SLAVE_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
      SONIC_BUILD_VARS: P4LANG_SOURCE_BASE_URL=file:/sonic/artifacts/vs/p4-source-inputs/sources sonic-device-data_1.0-1_all.deb_CACHE_OVERRIDE=none sonic-platform-vs_1.0_amd64.deb_CACHE_OVERRIDE=none -f /sonic/artifacts/vs/clean-observe.mk
      PREFER_DEBIAN_REPO: y
      SONIC_VS_REUSE_BAZEL_PRODUCERS: '1'
      SONIC_VS_VALIDATION_BUNDLES: '1'
      BAZEL_CONTAINER_ARGS: --repo_contents_cache=/bazel_repo_contents_cache --remote_local_fallback --incompatible_remote_local_fallback_for_remote_cache --experimental_remote_downloader=grpc://172.16.0.4:9092 --experimental_remote_downloader_local_fallback --distdir=/bazel_cache/distdir/ape-1.0.1 --distdir=/bazel_cache/distdir/download_utils-1.0.1 --distdir=/bazel_cache/distdir/rules_coreutils-1.0.1 --distdir=/bazel_cache/distdir/rules_gzip-1.0.0 --distdir=/bazel_cache/distdir/toolchain_utils-1.0.2
      PAIR_ROOT: ${{ github.workspace }}/clean-host-${{ github.run_id }}-${{ github.run_attempt }}
      PAIR_SHA: b9b024847e02491a1cb77c3345cc18f1610d2d05
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      name: Check out the immutable diagnostic verifier
      with:
        ref: ${{ github.sha }}
        path: clean-host-tools-${{ github.run_id }}-${{ github.run_attempt }}
        persist-credentials: false
        sparse-checkout-cone-mode: false
        sparse-checkout: |-
          /.github/clean-proof/verify.py
          /.github/clean-proof/errors.py
    - name: Allocate run-private transfer and evidence directories
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        mkdir -- "$PAIR_ROOT"
        mkdir -m 0700 -- "$PAIR_ROOT/handoff" "$PAIR_ROOT/evidence" "$PAIR_ROOT/a" "$PAIR_ROOT/b"
    - name: Seed A — Checkout repository and pinned submodules
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: clean-host-${{ github.run_id }}-${{ github.run_attempt }}/a/vs-${{ github.run_id }}-${{ github.run_attempt }}/source
        persist-credentials: false
        submodules: recursive
        ref: b9b024847e02491a1cb77c3345cc18f1610d2d05
    - name: Seed A — Prove build directories are fresh
      run: |
        set -euo pipefail
        scope=$(dirname "$PWD")
        test "$(git rev-parse HEAD)" = "$PAIR_SHA"
        test -z "$(git status --porcelain --untracked-files=normal)"
        for path in target fsroot-vs "$SONIC_BAZEL_CACHE_SOURCE" "$SONIC_HOSTBASE_CACHE_SOURCE" "$SONIC_BAZEL_REPO_CONTENTS_SOURCE"; do
          [[ ! -e $path && ! -L $path ]] || { echo "Unexpected build state in fresh checkout"; exit 1; }
        done
        [[ -z $(docker ps -aq --filter "label=$SONIC_CI_CONTAINER_LABEL") ]]
        install -d -m 0700 -- "$SONIC_BAZEL_CACHE_SOURCE" "$SONIC_HOSTBASE_CACHE_SOURCE" "$SONIC_BAZEL_REPO_CONTENTS_SOURCE" artifacts/vs
        cat > artifacts/vs/clean-observe.mk <<'MAKE'
        ifeq ($(CONFIGURED_PLATFORM):$(BLDENV),vs:trixie)
        target/sonic-vs.bin: private HEADER += $(file >artifacts/vs/clean-declared.txt,$^)
        endif
        MAKE
      working-directory: clean-host-${{ github.run_id }}-${{ github.run_attempt }}/a/vs-${{ github.run_id }}-${{ github.run_attempt }}/source
      shell: bash
      env:
        ROLE: a
        SONIC_IMAGE_VERSION: host-clean-a-b9b024847e02
        SONIC_CI_CONTAINER_LABEL: io.sonic-buildimage.ci-job=${{ github.repository }}:${{ github.run_id }}:${{ github.run_attempt }}:vs-clean-a
        SONIC_BAZEL_CACHE_SOURCE: ${{ github.workspace }}/clean-host-${{ github.run_id }}-${{ github.run_attempt }}/a/vs-${{ github.run_id }}-${{ github.run_attempt }}/bazel
        SONIC_HOSTBASE_CACHE_SOURCE: ${{ github.workspace }}/clean-host-${{ github.run_id }}-${{ github.run_attempt }}/a/vs-${{ github.run_id }}-${{ github.run_attempt }}/host
        SONIC_BAZEL_REPO_CONTENTS_SOURCE: ${{ github.workspace }}/clean-host-${{ github.run_id }}-${{ github.run_attempt }}/a/vs-${{ github.run_id }}-${{ github.run_attempt }}/contents
    - name: Seed A — Download verified source archives
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        path: clean-host-${{ github.run_id }}-${{ github.run_attempt }}/a/vs-${{ github.run_id }}-${{ github.run_attempt }}/source/artifacts/vs/repository-inputs
        github-token: ${{ github.token }}
        run-id: '45022469001'
        artifact-ids: '14754596632'
        merge-multiple: true
    - name: Seed A — Initialize private Docker configuration
      env:
        DOCKER_CONFIG: ${{ github.workspace }}/clean-host-${{ github.run_id }}-${{ github.run_attempt }}/a/vs-${{ github.run_id }}-${{ github.run_attempt }}/registry-login
        ROLE: a
        SONIC_IMAGE_VERSION: host-clean-a-b9b024847e02
        SONIC_CI_CONTAINER_LABEL: io.sonic-buildimage.ci-job=${{ github.repository }}:${{ github.run_id }}:${{ github.run_attempt }}:vs-clean-a
        SONIC_BAZEL_CACHE_SOURCE: ${{ github.workspace }}/clean-host-${{ github.run_id }}-${{ github.run_attempt }}/a/vs-${{ github.run_id }}-${{ github.run_attempt }}/bazel
        SONIC_HOSTBASE_CACHE_SOURCE: ${{ github.workspace }}/clean-host-${{ github.run_id }}-${{ github.run_attempt }}/a/vs-${{ github.run_id }}-${{ github.run_attempt }}/host
        SONIC_BAZEL_REPO_CONTENTS_SOURCE: ${{ github.workspace }}/clean-host-${{ github.run_id }}-${{ github.run_attempt }}/a/vs-${{ github.run_id }}-${{ github.run_attempt }}/contents
      run: |
        set -euo pipefail
        install -d -m 0700 "$DOCKER_CONFIG"
        printf 'DOCKER_CONFIG=%s\n' "$DOCKER_CONFIG" >> "$GITHUB_ENV"
      working-directory: clean-host-${{ github.run_id }}-${{ github.run_attempt }}/a/vs-${{ github.run_id }}-${{ github.run_attempt }}/source
      shell: bash
    - name: Seed A — Configure Bazel action memory budget
      run: python3 -B tools/bazel/ci/resources.py --configure
      working-directory: clean-host-${{ github.run_id }}-${{ github.run_attempt }}/a/vs-${{ github.run_id }}-${{ github.run_attempt }}/source
      shell: bash
      env:
        ROLE: a
        SONIC_IMAGE_VERSION: host-clean-a-b9b024847e02
        SONIC_CI_CONTAINER_LABEL: io.sonic-buildimage.ci-job=${{ github.repository }}:${{ github.run_id }}:${{ github.run_attempt }}:vs-clean-a
        SONIC_BAZEL_CACHE_SOURCE: ${{ github.workspace }}/clean-host-${{ github.run_id }}-${{ github.run_attempt }}/a/vs-${{ github.run_id }}-${{ github.run_attempt }}/bazel
        SONIC_HOSTBASE_CACHE_SOURCE: ${{ github.workspace }}/clean-host-${{ github.run_id }}-${{ github.run_attempt }}/a/vs-${{ github.run_id }}-${{ github.run_attempt }}/host
        SONIC_BAZEL_REPO_CONTENTS_SOURCE: ${{ github.workspace }}/clean-host-${{ github.run_id }}-${{ github.run_attempt }}/a/vs-${{ github.run_id }}-${{ github.run_attempt }}/contents
    - name: Seed A — Validate shared NFS package cache
      run: bash tools/ci/runner/nfs_package_cache.sh
      working-directory: clean-host-${{ github.run_id }}-${{ github.run_attempt }}/a/vs-${{ github.run_id }}-${{ github.run_attempt }}/source
      shell: bash
      env:
        ROLE: a
        SONIC_IMAGE_VERSION: host-clean-a-b9b024847e02
        SONIC_CI_CONTAINER_LABEL: io.sonic-buildimage.ci-job=${{ github.repository }}:${{ github.run_id }}:${{ github.run_attempt }}:vs-clean-a
        SONIC_BAZEL_CACHE_SOURCE: ${{ github.workspace }}/clean-host-${{ github.run_id }}-${{ github.run_attempt }}/a/vs-${{ github.run_id }}-${{ github.run_attempt }}/bazel
        SONIC_HOSTBASE_CACHE_SOURCE: ${{ github.workspace }}/clean-host-${{ github.run_id }}-${{ github.run_attempt }}/a/vs-${{ github.run_id }}-${{ github.run_attempt }}/host
        SONIC_BAZEL_REPO_CONTENTS_SOURCE: ${{ github.workspace }}/clean-host-${{ github.run_id }}-${{ github.run_attempt }}/a/vs-${{ github.run_id }}-${{ github.run_attempt }}/contents
    - name: Seed A — Reclaim unused images and build cache
      run: |
        set -euo pipefail
        docker system df
        docker image prune --all --force
        docker builder prune --all --force
        docker system df
      working-directory: clean-host-${{ github.run_id }}-${{ github.run_attempt }}/a/vs-${{ github.run_id }}-${{ github.run_attempt }}/source
      shell: bash
      env:
        ROLE: a
        SONIC_IMAGE_VERSION: host-clean-a-b9b024847e02
        SONIC_CI_CONTAINER_LABEL: io.sonic-buildimage.ci-job=${{ github.repository }}:${{ github.run_id }}:${{ github.run_attempt }}:vs-clean-a
        SONIC_BAZEL_CACHE_SOURCE: ${{ github.workspace }}/clean-host-${{ github.run_id }}-${{ github.run_attempt }}/a/vs-${{ github.run_id }}-${{ github.run_attempt }}/bazel
        SONIC_HOSTBASE_CACHE_SOURCE: ${{ github.workspace }}/clean-host-${{ github.run_id }}-${{ github.run_attempt }}/a/vs-${{ github.run_id }}-${{ github.run_attempt }}/host
        SONIC_BAZEL_REPO_CONTENTS_SOURCE: ${{ github.workspace }}/clean-host-${{ github.run_id }}-${{ github.run_attempt }}/a/vs-${{ github.run_id }}-${{ github.run_attempt }}/contents
    - name: Seed A — Check host-agent build prerequisites
      run: python3 -B tools/ci/runner/preflight.py --host-agent --workspace "$PWD" --build-target sonic-vs.bin
      working-directory: clean-host-${{ github.run_id }}-${{ github.run_attempt }}/a/vs-${{ github.run_id }}-${{ github.run_attempt }}/source
      shell: bash
      env:
        ROLE: a
        SONIC_IMAGE_VERSION: host-clean-a-b9b024847e02
        SONIC_CI_CONTAINER_LABEL: io.sonic-buildimage.ci-job=${{ github.repository }}:${{ github.run_id }}:${{ github.run_attempt }}:vs-clean-a
        SONIC_BAZEL_CACHE_SOURCE: ${{ github.workspace }}/clean-host-${{ github.run_id }}-${{ github.run_attempt }}/a/vs-${{ github.run_id }}-${{ github.run_attempt }}/bazel
        SONIC_HOSTBASE_CACHE_SOURCE: ${{ github.workspace }}/clean-host-${{ github.run_id }}-${{ github.run_attempt }}/a/vs-${{ github.run_id }}-${{ github.run_attempt }}/host
        SONIC_BAZEL_REPO_CONTENTS_SOURCE: ${{ github.workspace }}/clean-host-${{ github.run_id }}-${{ github.run_attempt }}/a/vs-${{ github.run_id }}-${{ github.run_attempt }}/contents
    - name: Seed A — Download the pinned P4 source inputs
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        artifact-ids: '14754900200'
        merge-multiple: true
        path: clean-host-${{ github.run_id }}-${{ github.run_attempt }}/a/vs-${{ github.run_id }}-${{ github.run_attempt }}/source/artifacts/vs/p4-source-inputs
        github-token: ${{ github.token }}
        run-id: '45022469001'
    - name: Seed A — Verify P4 source bytes before native Make
      run: |
        python3 -B tools/ci/p4_source_inputs.py \
          --manifest src/p4lang/source-inputs.json \
          --directory artifacts/vs/p4-source-inputs/sources \
          --receipt artifacts/vs/p4-source-inputs-verified.json
      working-directory: clean-host-${{ github.run_id }}-${{ github.run_attempt }}/a/vs-${{ github.run_id }}-${{ github.run_attempt }}/source
      shell: bash
      env:
        ROLE: a
        SONIC_IMAGE_VERSION: host-clean-a-b9b024847e02
        SONIC_CI_CONTAINER_LABEL: io.sonic-buildimage.ci-job=${{ github.repository }}:${{ github.run_id }}:${{ github.run_attempt }}:vs-clean-a
        SONIC_BAZEL_CACHE_SOURCE: ${{ github.workspace }}/clean-host-${{ github.run_id }}-${{ github.run_attempt }}/a/vs-${{ github.run_id }}-${{ github.run_attempt }}/bazel
        SONIC_HOSTBASE_CACHE_SOURCE: ${{ github.workspace }}/clean-host-${{ github.run_id }}-${{ github.run_attempt }}/a/vs-${{ github.run_id }}-${{ github.run_attempt }}/host
        SONIC_BAZEL_REPO_CONTENTS_SOURCE: ${{ github.workspace }}/clean-host-${{ github.run_id }}-${{ github.run_attempt }}/a/vs-${{ github.run_id }}-${{ github.run_attempt }}/contents
    - name: Seed A — Configure persistent caches
      env:
        SONIC_BAZEL_CACHE_SOURCE: ${{ github.workspace }}/clean-host-${{ github.run_id }}-${{ github.run_attempt }}/a/vs-${{ github.run_id }}-${{ github.run_attempt }}/bazel
        ROLE: a
        SONIC_IMAGE_VERSION: host-clean-a-b9b024847e02
        SONIC_CI_CONTAINER_LABEL: io.sonic-buildimage.ci-job=${{ github.repository }}:${{ github.run_id }}:${{ github.run_attempt }}:vs-clean-a
        SONIC_HOSTBASE_CACHE_SOURCE: ${{ github.workspace }}/clean-host-${{ github.run_id }}-${{ github.run_attempt }}/a/vs-${{ github.run_id }}-${{ github.run_attempt }}/host
        SONIC_BAZEL_REPO_CONTENTS_SOURCE: ${{ github.workspace }}/clean-host-${{ github.run_id }}-${{ github.run_attempt }}/a/vs-${{ github.run_id }}-${{ github.run_attempt }}/contents
      run: |
        set -euo pipefail
        test -d "$SONIC_BAZEL_CACHE_SOURCE"
        test -w "$SONIC_BAZEL_CACHE_SOURCE"
        for cache in repository_cache disk_cache; do
          directory="$SONIC_BAZEL_CACHE_SOURCE/$cache"
          if test -d "$directory"; then
            blocked=$(find "$directory" -type d ! -writable -print -quit)
            if test -n "$blocked"; then
              printf 'Unwritable cache directory: %s\n' "$blocked" >&2
              exit 1
            fi
          fi
        done
        python3 -B tools/bazel/gzip/source_archive.py \
          --archives-dir artifacts/vs/repository-inputs \
          --output "$SONIC_BAZEL_CACHE_SOURCE/distdir" > artifacts/vs/source-download-receipt.json
        printf 'SONIC_BAZEL_CACHE_SOURCE=%s\nSONIC_DPKG_CACHE_SOURCE=%s\n' \
          "$SONIC_BAZEL_CACHE_SOURCE" "$SONIC_DPKG_CACHE_SOURCE" >> "$GITHUB_ENV"
      working-directory: clean-host-${{ github.run_id }}-${{ github.run_attempt }}/a/vs-${{ github.run_id }}-${{ github.run_attempt }}/source
      shell: bash
    - name: Seed A — Authenticate to the slave image registry
      env:
        AZURE_CONFIG_DIR: ${{ runner.temp }}/vs-azure-cli
        ROLE: a
        SONIC_IMAGE_VERSION: host-clean-a-b9b024847e02
        SONIC_CI_CONTAINER_LABEL: io.sonic-buildimage.ci-job=${{ github.repository }}:${{ github.run_id }}:${{ github.run_attempt }}:vs-clean-a
        SONIC_BAZEL_CACHE_SOURCE: ${{ github.workspace }}/clean-host-${{ github.run_id }}-${{ github.run_attempt }}/a/vs-${{ github.run_id }}-${{ github.run_attempt }}/bazel
        SONIC_HOSTBASE_CACHE_SOURCE: ${{ github.workspace }}/clean-host-${{ github.run_id }}-${{ github.run_attempt }}/a/vs-${{ github.run_id }}-${{ github.run_attempt }}/host
        SONIC_BAZEL_REPO_CONTENTS_SOURCE: ${{ github.workspace }}/clean-host-${{ github.run_id }}-${{ github.run_attempt }}/a/vs-${{ github.run_id }}-${{ github.run_attempt }}/contents
      run: bash tools/ci/runner/azure_acr_login.sh "${ACR_REGISTRY_NAME:?}"
      working-directory: clean-host-${{ github.run_id }}-${{ github.run_attempt }}/a/vs-${{ github.run_id }}-${{ github.run_attempt }}/source
      shell: bash
    - name: Seed A — Prepare the host-driven SONiC slave
      run: |
        set -euo pipefail
        make init 2>&1 | tee artifacts/vs/init.log
        make configure PLATFORM=vs PLATFORM_ARCH=amd64 \
          SONIC_BUILDER_EXTRA_CMDLINE="--label $SONIC_CI_CONTAINER_LABEL" \
          2>&1 | tee artifacts/vs/configure.log
        for build_env in bookworm trixie; do
          make -f Makefile.work BLDENV="$build_env" docker-start \
            SONIC_BUILDER_EXTRA_CMDLINE="--label $SONIC_CI_CONTAINER_LABEL" \
            2>&1 | tee "artifacts/vs/docker-start-$build_env.log"
        done
        make -f Makefile.work BLDENV=trixie sonic-slave-run \
          SONIC_BUILDER_EXTRA_CMDLINE="--label $SONIC_CI_CONTAINER_LABEL" \
          SONIC_RUN_CMDS='python3 -B tools/bazel/ci/check_kernel_sandbox.py' \
          2>&1 | tee artifacts/vs/kernel-sandbox.log
      working-directory: clean-host-${{ github.run_id }}-${{ github.run_attempt }}/a/vs-${{ github.run_id }}-${{ github.run_attempt }}/source
      shell: bash
      env:
        ROLE: a
        SONIC_IMAGE_VERSION: host-clean-a-b9b024847e02
        SONIC_CI_CONTAINER_LABEL: io.sonic-buildimage.ci-job=${{ github.repository }}:${{ github.run_id }}:${{ github.run_attempt }}:vs-clean-a
        SONIC_BAZEL_CACHE_SOURCE: ${{ github.workspace }}/clean-host-${{ github.run_id }}-${{ github.run_attempt }}/a/vs-${{ github.run_id }}-${{ github.run_attempt }}/bazel
        SONIC_HOSTBASE_CACHE_SOURCE: ${{ github.workspace }}/clean-host-${{ github.run_id }}-${{ github.run_attempt }}/a/vs-${{ github.run_id }}-${{ github.run_attempt }}/host
        SONIC_BAZEL_REPO_CONTENTS_SOURCE: ${{ github.workspace }}/clean-host-${{ github.run_id }}-${{ github.run_attempt }}/a/vs-${{ github.run_id }}-${{ github.run_attempt }}/contents
    - name: Seed A — Set the VS builder action memory budget
      run: |
        memory_option=$(python3 -B tools/bazel/ci/resources.py) || exit
        printf 'BAZEL_CONTAINER_ARGS=%s %s\n' "${BAZEL_CONTAINER_ARGS:-}" "$memory_option" >> "$GITHUB_ENV"
      env:
        BAZEL_CONTAINER_ARGS: --repo_contents_cache=/bazel_repo_contents_cache --remote_local_fallback --incompatible_remote_local_fallback_for_remote_cache --experimental_remote_downloader=grpc://172.16.0.4:9092 --experimental_remote_downloader_local_fallback --distdir=/bazel_cache/distdir/ape-1.0.1 --distdir=/bazel_cache/distdir/download_utils-1.0.1 --distdir=/bazel_cache/distdir/rules_coreutils-1.0.1 --distdir=/bazel_cache/distdir/rules_gzip-1.0.0 --distdir=/bazel_cache/distdir/toolchain_utils-1.0.2
        ROLE: a
        SONIC_IMAGE_VERSION: host-clean-a-b9b024847e02
        SONIC_CI_CONTAINER_LABEL: io.sonic-buildimage.ci-job=${{ github.repository }}:${{ github.run_id }}:${{ github.run_attempt }}:vs-clean-a
        SONIC_BAZEL_CACHE_SOURCE: ${{ github.workspace }}/clean-host-${{ github.run_id }}-${{ github.run_attempt }}/a/vs-${{ github.run_id }}-${{ github.run_attempt }}/bazel
        SONIC_HOSTBASE_CACHE_SOURCE: ${{ github.workspace }}/clean-host-${{ github.run_id }}-${{ github.run_attempt }}/a/vs-${{ github.run_id }}-${{ github.run_attempt }}/host
        SONIC_BAZEL_REPO_CONTENTS_SOURCE: ${{ github.workspace }}/clean-host-${{ github.run_id }}-${{ github.run_attempt }}/a/vs-${{ github.run_id }}-${{ github.run_attempt }}/contents
      working-directory: clean-host-${{ github.run_id }}-${{ github.run_attempt }}/a/vs-${{ github.run_id }}-${{ github.run_attempt }}/source
      shell: bash
    - name: Seed A — Find the VS kernel index from a master push
      id: a_kernel_index_source
      continue-on-error: true
      timeout-minutes: 2
      env:
        GITHUB_TOKEN: ${{ github.token }}
        ROLE: a
        SONIC_IMAGE_VERSION: host-clean-a-b9b024847e02
        SONIC_CI_CONTAINER_LABEL: io.sonic-buildimage.ci-job=${{ github.repository }}:${{ github.run_id }}:${{ github.run_attempt }}:vs-clean-a
        SONIC_BAZEL_CACHE_SOURCE: ${{ github.workspace }}/clean-host-${{ github.run_id }}-${{ github.run_attempt }}/a/vs-${{ github.run_id }}-${{ github.run_attempt }}/bazel
        SONIC_HOSTBASE_CACHE_SOURCE: ${{ github.workspace }}/clean-host-${{ github.run_id }}-${{ github.run_attempt }}/a/vs-${{ github.run_id }}-${{ github.run_attempt }}/host
        SONIC_BAZEL_REPO_CONTENTS_SOURCE: ${{ github.workspace }}/clean-host-${{ github.run_id }}-${{ github.run_attempt }}/a/vs-${{ github.run_id }}-${{ github.run_attempt }}/contents
      run: |
        rm -rf -- artifacts/vs/kernel-cache-download
        python3 -B -m tools.bazel.ci.vs_kernel_cache_snapshot
      working-directory: clean-host-${{ github.run_id }}-${{ github.run_attempt }}/a/vs-${{ github.run_id }}-${{ github.run_attempt }}/source
      shell: bash
    - name: Seed A — Download the trusted VS kernel index
      id: a_kernel_index_download
      if: steps.a_kernel_index_source.outputs.artifact_id != ''
      continue-on-error: true
      timeout-minutes: 2
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        github-token: ${{ github.token }}
        run-id: ${{ steps.a_kernel_index_source.outputs.run_id }}
        artifact-ids: ${{ steps.a_kernel_index_source.outputs.artifact_id }}
        merge-multiple: true
        path: clean-host-${{ github.run_id }}-${{ github.run_attempt }}/a/vs-${{ github.run_id }}-${{ github.run_attempt }}/source/artifacts/vs/kernel-cache-download
    - name: Seed A — Prepare native installer inspection
      run: |
        set -euo pipefail
        if ! command -v unsquashfs >/dev/null || ! python3 -c 'import yaml'; then
          inspect="$PAIR_ROOT/inspection-tools"
          install -d -m 0700 "$inspect"
          (cd "$inspect" && apt-get download squashfs-tools python3-yaml)
          for deb in "$inspect"/*.deb; do dpkg-deb -x "$deb" "$inspect"; done
          echo "$inspect/usr/bin" >> "$GITHUB_PATH"
          echo "PYTHONPATH=$inspect/usr/lib/python3/dist-packages${PYTHONPATH:+:$PYTHONPATH}" >> "$GITHUB_ENV"
        fi
      working-directory: clean-host-${{ github.run_id }}-${{ github.run_attempt }}/a/vs-${{ github.run_id }}-${{ github.run_attempt }}/source
      shell: bash
      env:
        ROLE: a
        SONIC_IMAGE_VERSION: host-clean-a-b9b024847e02
        SONIC_CI_CONTAINER_LABEL: io.sonic-buildimage.ci-job=${{ github.repository }}:${{ github.run_id }}:${{ github.run_attempt }}:vs-clean-a
        SONIC_BAZEL_CACHE_SOURCE: ${{ github.workspace }}/clean-host-${{ github.run_id }}-${{ github.run_attempt }}/a/vs-${{ github.run_id }}-${{ github.run_attempt }}/bazel
