name: Debian cache connectivity probe

on:
  workflow_dispatch:

permissions: {}

jobs:
  probe:
    name: Cache connectivity probe (AMD64)
    runs-on: [self-hosted, linux, x64, debian-trixie-container]
    timeout-minutes: 5
    steps:
      - name: Report sanitized cache connectivity
        shell: python3 {0}
        run: |
          import json
          import socket
          import ssl
          import urllib.error
          import urllib.request

          host = 'lgh-bazel-87263989.eastus.cloudapp.azure.com'
          endpoint = 'https://' + host
          url = endpoint + '/cas/e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855'
          print('CACHE_CONNECTIVITY_SOURCE=42083755988-71da225b98bb8b6b57bfdf128c8ca06ecb0277db')
          report = {}
          try:
              socket.getaddrinfo(host, 443, type=socket.SOCK_STREAM)
              report['dns'] = {'reason_type': None, 'errno': None}
          except socket.gaierror as error:
              report['dns'] = {'reason_type': type(error).__name__, 'errno': error.errno}

          class NoRedirects(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          try:
              request = urllib.request.Request(url, method='HEAD')
              with urllib.request.build_opener(NoRedirects()).open(request, timeout=10) as response:
                  report['https'] = {'http_status': response.status}
          except urllib.error.HTTPError as error:
              report['https'] = {'reason_type': type(error).__name__, 'http_status': error.code}
          except urllib.error.URLError as error:
              reason = error.reason
              details = {'reason_type': type(reason).__name__}
              if isinstance(getattr(reason, 'errno', None), int):
                  details['errno'] = reason.errno
              if isinstance(reason, ssl.SSLCertVerificationError):
                  details['verify_code'] = reason.verify_code
                  details['verify_message'] = reason.verify_message
              report['https'] = details
          except OSError as error:
              report['https'] = {'reason_type': type(error).__name__, 'errno': error.errno}
          print(json.dumps(report, indent=2, sort_keys=True))
