name: Bazel LLDP images

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bazel-lldp-image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Build and inspect LLDP images (AMD64)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CI_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
    container: debian:trixie-20260918@sha256:9cc080028c43b27d2074d63a5f9caf7166d731494965616c1a6d2827a004585c
    defaults:
      run:
        shell: bash
    steps:
      - name: Install execution and verification tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends binutils build-essential ca-certificates gdb git j2cli jq libarchive-tools libxml2 python3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-version: 1.29.0
          bazelisk-cache: true
          repository-cache: true
          disk-cache: lldp-image-amd64
          cache-version: "8.5.1"
      - name: Prepare the verified compression source
        run: |
          mkdir -p artifacts/lldp
          python3 tools/bazel/gzip/prepare_pigz.py --output "$RUNNER_TEMP/pigz-distdir" > artifacts/lldp/pigz-source.json
          python3 - <<'PYCODE'
          import os
          from pathlib import Path
          home = Path.home() / '.bazelrc'
          cache_lines = [line for line in home.read_text().splitlines()
                         if line.startswith(('build --disk_cache=', 'common --repository_cache='))]
          assert len(cache_lines) == 2, 'setup-bazel cache settings are missing'
          user = Path('.bazelrc.user')
          current = user.read_text() if user.exists() else ''
          user.write_text(current + '\n' + '\n'.join(cache_lines) +
                          '\ncommon --distdir=' + os.environ['RUNNER_TEMP'] + '/pigz-distdir\n')
          PYCODE
      - name: Verify Make boundaries and shallow-checkout provenance
        run: |
          python3 -B tools/bazel/tests/lldp_make_test.py
          python3 -B tools/bazel/tests/lldp_identity_test.py
      - name: Build runtime and debug images from source owners
        env:
          BAZELISK_GITHUB_TOKEN: ""
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(uname -m)" = x86_64
          test "$(. /etc/os-release; echo "$VERSION_CODENAME")" = trixie
          test ! -e MODULE.bazel.lock
          python3 -B tools/bazel/ci/lldp_image.py build --artifacts artifacts/lldp
      - name: Validate completed image contents and source symbols
        run: python3 -B tools/bazel/ci/lldp_image.py validate --artifacts artifacts/lldp
      - name: Check incremental rebuild and restored image digests
        env:
          BAZELISK_GITHUB_TOKEN: ""
        run: |
          python3 -B tools/bazel/ci/lldp_image.py incremental --artifacts artifacts/lldp
          git diff --exit-code
      - name: Prepare reviewed public evidence
        id: public
        if: always()
        run: |
          python3 - <<'PYCODE'
          import json
          from pathlib import Path
          from tools.bazel.ci.public_artifacts import safe_json, dependency_json, bep_summary
          root = Path('artifacts/lldp')
          if (root / 'build-receipt.json').exists():
              receipt = json.loads((root / 'build-receipt.json').read_text())
              public = {key: receipt[key] for key in ('status', 'architecture', 'revision', 'tested_revision_parents', 'artifacts') if key in receipt}
              safe_json(public)
              (root / 'public-receipt.json').write_text(json.dumps(public, indent=2) + '\n')
          names = ['validation.json', 'action-audit.json', 'incremental.json']
          names += [path.name for path in root.glob('*.validation.json')]
          names += [path.name for path in root.glob('*packages.json')]
          for name in names:
              path = root / name
              if path.exists():
                  safe_json(json.loads(path.read_text()))
          for name, kind in (('MODULE.bazel.lock', 'lock'), ('module-graph.json', 'graph')):
              path = root / name
              if path.exists():
                  dependency_json(json.loads(path.read_text()), kind)
          summary = {str(path.relative_to(root)): bep_summary(path.read_text().splitlines(), partial=True)
                     for path in root.rglob('*events.json*')}
          safe_json(summary)
          (root / 'build-summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          PYCODE
      - name: Retain images and reviewed build evidence
        if: always() && steps.public.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lldp-image-amd64
          path: |
            artifacts/lldp/*.gz
            artifacts/lldp/*.tar
            artifacts/lldp/*.status
            artifacts/lldp/*packages.json
            artifacts/lldp/*.validation.json
            artifacts/lldp/validation.json
            artifacts/lldp/public-receipt.json
            artifacts/lldp/action-audit.json
            artifacts/lldp/incremental.json
            artifacts/lldp/build-summary.json
            artifacts/lldp/MODULE.bazel.lock
            artifacts/lldp/module-graph.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 1

  runtime:
    name: Run installed LLDP images (AMD64)
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lldp-image-amd64
          path: artifacts/lldp
      - name: Query private LLDP neighbors through the installed DBSyncd service
        run: python3 -B tools/bazel/ci/lldp_loaded.py --artifacts artifacts/lldp
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: lldp-runtime-amd64
          path: |
            artifacts/lldp/*.runtime.json
            artifacts/lldp/loaded-validation.json
          if-no-files-found: warn
          retention-days: 14
