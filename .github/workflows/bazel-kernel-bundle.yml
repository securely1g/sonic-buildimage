name: Bazel kernel DEBs

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      verify_cold_cache:
        description: Force an uncached kernel build and verify reuse with a disposable local cache
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: bazel-kernel-bundle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kernel-bundle:
    name: Kernel DEBs and Make handoff (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: [self-hosted, linux, bazel-x64]
            cache_sha256: 6a6b64666c2238ec6b49b7b29f5e41e4149de09417a0028897c9bffe40376876
          - arch: arm64
            runner: [self-hosted, linux, bazel-arm64]
            cache_sha256: 295e54fd58841211b00fb204cafc13affc6a13d8946a4520c0ecdce22626ef93
    # Keep the integration check scoped to the requested kernel PR.
    if: github.event_name != 'pull_request' || github.event.pull_request.number == 6 || github.event.pull_request.number == 198
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    env:
      KERNEL_REMOTE_CACHE: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_cold_cache && 'http://127.0.0.1:8080' || 'grpc://172.16.0.4:9092' }}
      UPLOAD_KERNEL_CACHE: ${{ (github.event_name == 'workflow_dispatch' && inputs.verify_cold_cache) || (github.event_name == 'push' && github.ref == 'refs/heads/master') }}
    steps:
      - name: Restore workspace access before checkout
        working-directory: ${{ runner.temp }}
        shell: bash
        env:
          RUNNER_PIPELINE_WORKSPACE: ${{ runner.workspace }}
        run: |
          set -euo pipefail
          repository="${GITHUB_REPOSITORY##*/}"
          pipeline_workspace="${RUNNER_PIPELINE_WORKSPACE%/}"
          expected="$pipeline_workspace/$repository"
          if [[ "$GITHUB_WORKSPACE" != "$expected" ]]; then
            printf 'Refusing permission repair: expected workspace %s, got %s.\n' \
              "$expected" "$GITHUB_WORKSPACE" >&2
            exit 1
          fi
          if [[ ! -e "$expected" && ! -L "$expected" ]]; then
            echo 'No existing workspace to repair.'
            exit 0
          fi
          work_root="$(realpath -e -- "$pipeline_workspace/..")"
          physical_workspace="$work_root/$repository/$repository"
          if [[ ! -d "$expected" || "$(realpath -e -- "$expected")" != "$physical_workspace" ]]; then
            echo 'Refusing permission repair on a redirected workspace.' >&2
            exit 1
          fi
          expected="$physical_workspace"
          owner="$(id -u):$(id -g)"
          sudo -n find -P "$expected" -xdev -type d \
            -exec chown --no-dereference -- "$owner" {} +
          sudo -n find -P "$expected" -xdev -type d \
            -exec chmod u+rwx -- {} +
          sudo -n find -P "$expected" -xdev -type f -links 1 \
            -exec chown --no-dereference -- "$owner" {} +
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Initialize the pinned kernel source
        run: git submodule update --init -- src/sonic-linux-kernel
      - name: Check the producer and artifact contracts
        run: |
          python3 -B tools/bazel/tests/kernel_test.py
          python3 -B tools/bazel/tests/kernel_make_mapping_test.py
          python3 -B tools/bazel/tests/kernel_sbom_test.py
          python3 -B tools/bazel/tests/public_artifacts_test.py
          python3 -B tools/bazel/tests/kernel_artifacts_test.py
      - name: Check available scratch space
        run: |
          python3 - <<'PY'
          import os, shutil
          if shutil.disk_usage(os.environ['RUNNER_TEMP']).free < 45 * 2**30:
              raise SystemExit('Kernel source validation requires 45 GiB free scratch space')
          PY
      - name: Require unprivileged Linux sandboxing
        run: |
          test "$(id -u)" -ne 0
          unshare --user --map-current-user --mount --pid --fork true
      - name: Allocate fresh kernel scratch directory
        id: kernel_scratch
        run: |
          set -euo pipefail
          umask 077
          scratch="$(mktemp -d "$RUNNER_TEMP/kernel-job.XXXXXXXX")"
          printf 'KERNEL_RUN_TEMP=%s\n' "$scratch" >> "$GITHUB_ENV"
          printf 'Kernel job scratch directory: %s\n' "$scratch"
      - name: Start a disposable cache for optional cold-build verification
        if: github.event_name == 'workflow_dispatch' && inputs.verify_cold_cache
        run: |
          umask 077
          mkdir -p "$KERNEL_RUN_TEMP/kernel-cache"
          curl --fail --location --retry 3 \
            "https://github.com/buchgr/bazel-remote/releases/download/v2.6.4/bazel-remote-2.6.4-linux-${{ matrix.arch }}" \
            --output "$KERNEL_RUN_TEMP/kernel-cache/bazel-remote"
          printf '%s  %s\n' '${{ matrix.cache_sha256 }}' "$KERNEL_RUN_TEMP/kernel-cache/bazel-remote" | sha256sum -c -
          chmod 700 "$KERNEL_RUN_TEMP/kernel-cache/bazel-remote"
          env -i RUNNER_TRACKING_ID="${RUNNER_TRACKING_ID:-}" \
            "$KERNEL_RUN_TEMP/kernel-cache/bazel-remote" --dir="$KERNEL_RUN_TEMP/kernel-cache/objects" \
            --max_size=8 --http_address=127.0.0.1:8080 --grpc_address=none \
            > "$KERNEL_RUN_TEMP/kernel-cache/server.log" 2>&1 &
          echo "$!" > "$KERNEL_RUN_TEMP/kernel-cache/server.pid"
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/status > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8080/status > /dev/null
      - name: Build and verify kernel DEBs in the normal package directory
        run: |
          umask 077
          cache_args=(--remote-cache "$KERNEL_REMOTE_CACHE")
          if [[ "$UPLOAD_KERNEL_CACHE" == true ]]; then
            cache_args+=(--upload-local-results)
          fi
          if python3 -B tools/bazel/kernel/prepare.py ensure --architecture "${{ matrix.arch }}" \
            --state-dir "$KERNEL_RUN_TEMP/kernel-bundle-state" \
            "${cache_args[@]}"; then
            test ! -e target/bazel-kernel-inputs
            test ! -e "$KERNEL_RUN_TEMP/kernel-bundle-state/bundle"
            echo 'Kernel DEBs verified in target/debs/trixie.'
          else
            status=$?
            echo "Kernel DEB build failed with exit code $status."
            exit "$status"
          fi
      - name: Verify a fresh output directory reuses the kernel action
        if: github.event_name == 'workflow_dispatch' && inputs.verify_cold_cache
        run: |
          umask 077
          python3 -B tools/bazel/kernel/prepare.py build --architecture "${{ matrix.arch }}" \
            --state-dir "$KERNEL_RUN_TEMP/kernel-cache-hit" \
            --remote-cache "$KERNEL_REMOTE_CACHE"
          python3 -B src/sonic-linux-kernel/tools/bazel/verify_cache.py \
            --architecture "${{ matrix.arch }}" \
            --cold "$KERNEL_RUN_TEMP/kernel-bundle-state/build" --hit "$KERNEL_RUN_TEMP/kernel-cache-hit/build" \
            --artifacts "$KERNEL_RUN_TEMP/kernel-cache-proof"
          echo 'Unprivileged linux-sandbox build and fresh-output remote cache hit verified.'
      - name: Reject an unsupported kernel configuration without replacing the DEBs
        run: |
          umask 077
          sha256sum target/debs/trixie/*.deb > "$KERNEL_RUN_TEMP/kernel-before-rejection.sha256"
          if python3 -B tools/bazel/kernel/prepare.py ensure --architecture "${{ matrix.arch }}" \
            --kernel-config SECURE_UPGRADE_MODE=unsupported \
            --state-dir "$KERNEL_RUN_TEMP/kernel-unsupported" \
            --remote-cache "$KERNEL_REMOTE_CACHE" > "$KERNEL_RUN_TEMP/kernel-unsupported.log" 2>&1; then
            echo 'An unsupported kernel setting was silently accepted.'
            exit 1
          fi
          cat "$KERNEL_RUN_TEMP/kernel-unsupported.log"
          grep -F 'Unsupported kernel configuration' "$KERNEL_RUN_TEMP/kernel-unsupported.log"
          if grep -Fq SONIC_KERNEL_COMPILATION_STARTED "$KERNEL_RUN_TEMP/kernel-unsupported.log"; then
            echo 'Unsupported settings reached kernel compilation.'
            exit 1
          fi
          sha256sum --check "$KERNEL_RUN_TEMP/kernel-before-rejection.sha256"
      - name: Repeat automatic preparation without rebuilding
        run: |
          umask 077
          python3 -B tools/bazel/kernel/prepare.py ensure --architecture "${{ matrix.arch }}" \
            > "$KERNEL_RUN_TEMP/kernel-bundle-stage.log"
          python3 -c 'import json,sys; assert json.load(open(sys.argv[1]))["reused"] is True' \
            "$KERNEL_RUN_TEMP/kernel-bundle-stage.log"
          python3 -B tools/bazel/kernel/prepare.py verify --architecture "${{ matrix.arch }}" \
            --debs-directory target/debs/trixie
      - name: Consume the normal DEB directory through Make without rebuilding or copying
        run: |
          python3 -B tools/bazel/ci/kernel_make_smoke.py --architecture "${{ matrix.arch }}"
      # Installation exercises APT hooks in a disposable Debian system after the
      # native unprivileged build/cache proof. This container never builds a kernel.
      - name: Validate already-built DEB installation, modules and initramfs
        run: |
          umask 077
          docker run --rm --platform "linux/${{ matrix.arch }}" \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/sonic,readonly" \
            --workdir /sonic \
            debian:trixie-20260918@sha256:9cc080028c43b27d2074d63a5f9caf7166d731494965616c1a6d2827a004585c \
            bash tools/bazel/ci/kernel_install_smoke.sh /sonic/target/debs/trixie
          echo 'Installed kernel DEB, external module and initramfs checks passed.'
      - name: Select verified DEBs and a public validation summary
        id: artifacts
        run: |
          umask 077
          python3 -B tools/bazel/ci/kernel_artifacts.py --architecture "${{ matrix.arch }}" \
            --state-dir "$KERNEL_RUN_TEMP/${{ github.event_name == 'workflow_dispatch' && inputs.verify_cold_cache && 'kernel-cache-hit' || 'kernel-bundle-state' }}" \
            --output "$KERNEL_RUN_TEMP/kernel-bundle-artifacts"
      - name: Retain verified DEBs and the validation summary
        if: success() && steps.artifacts.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kernel-source-packages-${{ matrix.arch }}
          retention-days: 7
          if-no-files-found: error
          path: ${{ env.KERNEL_RUN_TEMP }}/kernel-bundle-artifacts
      - name: Stop the disposable verification cache
        id: kernel_cache_stop
        if: always() && github.event_name == 'workflow_dispatch' && inputs.verify_cold_cache
        run: |
          if [[ -n "${KERNEL_RUN_TEMP:-}" && -f "$KERNEL_RUN_TEMP/kernel-cache/server.pid" ]]; then
            pid="$(cat "$KERNEL_RUN_TEMP/kernel-cache/server.pid")"
            kill "$pid"
            for attempt in $(seq 1 30); do
              if ! kill -0 "$pid" 2>/dev/null; then break; fi
              sleep 1
            done
            if kill -0 "$pid" 2>/dev/null; then
              echo 'Verification cache did not stop; retaining its scratch directory.' >&2
              exit 1
            fi
          fi
      - name: Clean this job's kernel scratch directory
        if: always() && steps.kernel_scratch.outcome == 'success' && (steps.kernel_cache_stop.outcome == 'success' || steps.kernel_cache_stop.outcome == 'skipped')
        run: |
          set -euo pipefail
          if [[ -z "${KERNEL_RUN_TEMP:-}" ]]; then
            echo 'No kernel scratch directory was allocated.'
            exit 0
          fi
          python3 -B - <<'PY'
          import os
          from pathlib import Path
          import re
          from tools.bazel.kernel.prepare import remove_build_tree, require

          scratch = Path(os.environ["KERNEL_RUN_TEMP"])
          require(scratch.is_absolute() and not scratch.is_symlink(),
                  "refusing redirected kernel scratch directory")
          require(re.fullmatch(r"kernel-job\.[A-Za-z0-9]{8}", scratch.name),
                  "refusing unexpected kernel scratch directory name")
          scratch = scratch.resolve()
          require(scratch.parent == Path(os.environ["RUNNER_TEMP"]).resolve(strict=True),
                  "kernel scratch directory must be directly under RUNNER_TEMP")
          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve(strict=True)
          require(scratch != workspace and scratch not in workspace.parents,
                  "kernel scratch directory must not contain the workspace")
          mounts = [
              Path(re.sub(r'\\([0-7]{3})', lambda match: chr(int(match[1], 8)), line.split()[4]))
              for line in Path("/proc/self/mountinfo").read_text().splitlines()
          ]
          require(not any(mount == scratch or scratch in mount.parents for mount in mounts),
                  "refusing mounted kernel scratch directory")
          require(not scratch.exists() or scratch.is_dir(),
                  "kernel scratch path must be a directory")
          if scratch.exists():
              print("Removing this job's kernel scratch directory: " + str(scratch), flush=True)
              remove_build_tree(scratch)
          PY
