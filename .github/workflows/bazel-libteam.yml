name: Bazel libteam and SWSS consumers

on:
  pull_request:
    paths:
      - src/libteam/**
      - tools/bazel/0001-sonic-swss-libteam.patch
      - tools/bazel/0001-sonic-swss-common-zmq.patch
      - MODULE.bazel
      - .bazelrc
      - tools/bazel/common.bazelrc
      - tools/bazel/ci/artifact_validation.py
      - tools/bazel/ci/libteam_draft_bazel.sh
      - tools/bazel/oci/runtime_smoke.py
      - .github/workflows/bazel-libteam.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Native libteam and SWSS consumers (${{ matrix.architecture }}, ${{ matrix.distribution }})
    strategy:
      fail-fast: false
      matrix:
        distribution: [trixie]
        architecture: [amd64, arm64]
        include:
          - architecture: amd64
            cpu: x86_64
            runner: ubuntu-24.04
          - architecture: arm64
            cpu: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    container: debian:trixie-20260918@sha256:9cc080028c43b27d2074d63a5f9caf7166d731494965616c1a6d2827a004585c
    defaults:
      run:
        shell: bash
    steps:
      - name: Install execution tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends autoconf automake binutils binutils-gold build-essential busybox ca-certificates curl file gdb git libtool patch pkg-config python3 tar unzip zstd
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-version: 1.29.0
          bazelisk-cache: true
          repository-cache: true
          disk-cache: libteam-${{ matrix.architecture }}-${{ matrix.distribution }}
          cache-version: "8.5.1"
      - name: Configure the verified source mirror
        run: |
          python3 - <<'PYCFG'
          import hashlib
          import os
          from pathlib import Path
          from urllib.request import urlopen
          # Load the merged registry configuration. Bazel verifies each archive against its pinned checksum.
          url = "https://raw.githubusercontent.com/securely1g/sonic-bazel-registry/97cc502556b7ec3435d2d67b105315bcc18bb47e/ci/source_mirrors.cfg"
          with urlopen(url, timeout=60) as response:
              data = response.read()
          expected = "ddd6f40504a30e138a62be0d728e1a352391d0f781c927eaf4ea45c44d8a0720"
          if hashlib.sha256(data).hexdigest() != expected:
              raise SystemExit("Source mirror configuration checksum mismatch")
          config = Path(os.environ["RUNNER_TEMP"]) / "sonic-source-mirrors.cfg"
          config.write_bytes(data)
          with Path(".bazelrc.user").open("a") as rc:
              rc.write("common --experimental_downloader_config=" + str(config) + "\n")
          PYCFG
      - name: Build source outputs and execute native tests
        env:
          BAZELISK_GITHUB_TOKEN: ""
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_ARCHITECTURE: ${{ matrix.architecture }}
          CI_CPU: ${{ matrix.cpu }}
          CI_DISTRIBUTION: ${{ matrix.distribution }}
          # Draft validation only; replace with canonical main after prerequisites land.
          SONIC_BAZEL_REGISTRY_REVISION: adce859db70592be89112c6af19ea0b25deef367
          BAZEL: ${{ github.workspace }}/tools/bazel/ci/libteam_draft_bazel.sh
        run: |
          set -euo pipefail
          mkdir -p artifacts
          test "$(dpkg --print-architecture)" = "$CI_ARCHITECTURE"
          test "$(uname -m)" = "$CI_CPU"
          printf '%s\n' "$(uname -m)" "$(dpkg --print-architecture)" > artifacts/architecture.txt
          git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD > artifacts/checkout-sha.txt
          git -c safe.directory="$GITHUB_WORKSPACE" cat-file -p HEAD > artifacts/checkout.txt
          printf '%s\n' "$CI_HEAD_SHA" "$CI_BASE_SHA" "$CI_ARCHITECTURE" "$CI_DISTRIBUTION" "$SONIC_BAZEL_REGISTRY_REVISION" > artifacts/inputs.txt
          options=(
            "--host_platform=@sonic_build_infra//platforms:${CI_CPU}_trixie"
            "--platforms=@sonic_build_infra//platforms:${CI_CPU}_${CI_DISTRIBUTION}"
            --jobs=2
          )
          run_bazel() {
            local command="$1"
            shift
            "$BAZEL" "$command" "${options[@]}" "$@"
          }
          python3 tools/bazel/gzip/prepare_pigz.py --output "$PWD/.cache/bazel-distdir" > artifacts/pigz-source.json
          options+=("--distdir=$PWD/.cache/bazel-distdir")
          targets=(
            //src/libteam:libteam_runtime
            //src/libteam:libteam_runtime.debug_symbols
            //src/libteam:libteamdctl_runtime
            //src/libteam:libteamdctl_runtime.debug_symbols
            //src/libteam:libteam_utils_runtime
            //src/libteam:libteam_utils_runtime.debug_symbols
            //src/libteam:libteam_dev
            //src/libteam:runtime_packages.json
            @libnl3//:libnl-3-dev_files
            @sonic_swss//teamsyncd:teamsyncd
            @sonic_swss//tlm_teamd:tlm_teamd
          )
          run_bazel build --build_event_json_file="$PWD/artifacts/build-events.json" "${targets[@]}" 2>&1 | tee artifacts/build.log
          run_bazel cquery "set(${targets[*]})" --output=files > artifacts/outputs.txt
          test -s artifacts/outputs.txt
          while IFS= read -r output; do
            test -f "$output"
            cp --parents "$output" artifacts/
            sha256sum "$output" >> artifacts/SHA256SUMS
          done < artifacts/outputs.txt
          cp MODULE.bazel.lock artifacts/
          run_bazel test --nocache_test_results --build_event_json_file="$PWD/artifacts/test-events.json" \
            @libteam//:consumer_test \
            2>&1 | tee artifacts/test.log
          if [[ "$CI_ARCHITECTURE" == amd64 ]]; then
            output() { run_bazel cquery "//src/libteam:$1" --output=files; }
            python3 -B src/libteam/verify_runtime.py \
              --libteam "$(output libteam_runtime)" \
              --libteam-symbols "$(output libteam_runtime.debug_symbols)" \
              --libteamdctl "$(output libteamdctl_runtime)" \
              --libteamdctl-symbols "$(output libteamdctl_runtime.debug_symbols)" \
              --libteam-utils "$(output libteam_utils_runtime)" \
              --libteam-utils-symbols "$(output libteam_utils_runtime.debug_symbols)" \
              --development "$(output libteam_dev)" \
              --dependency-development "$(run_bazel cquery @libnl3//:libnl-3-dev_files --output=files)" \
              --output artifacts/installed-runtime.json
            # Resolve the selected owner's probe in this same Bazel execution
            # root; cquery's external/ path is not relative to the Git checkout.
            probe_bazel="$PWD/tools/bazel/ci/libteam_draft_bazel.sh"
            probe_flags=(
              "--host_platform=@sonic_build_infra//platforms:${CI_CPU}_trixie"
              "--platforms=@sonic_build_infra//platforms:${CI_CPU}_${CI_DISTRIBUTION}"
              "--distdir=$PWD/.cache/bazel-distdir"
            )
            # Bazel 8.5.1 Bzlmod uses the standard output_base/execroot/_main.
            # Unlike info execution_root, output_base needs no platform configuration.
            output_base="$("$probe_bazel" info "${probe_flags[@]}" output_base)"
            if [[ "$output_base" != /* || "$output_base" == *$'\n'* ]]; then
              printf 'Invalid Bazel output base: %s\n' "$output_base" >&2
              exit 1
            fi
            execution_root="$output_base/execroot/_main"
            if [[ ! -d "$execution_root" ]]; then
              printf 'Missing Bazel 8.5.1 Bzlmod execution root: %s\n' "$execution_root" >&2
              exit 1
            fi
            probe_file="$("$probe_bazel" cquery "${probe_flags[@]}" @libteam//:bazel/verify_rebuild.py --output=files)"
            test -n "$probe_file"
            [[ "$probe_file" != *$'\n'* ]]
            case "$probe_file" in
              /*) owner_probe="$probe_file" ;;
              *) owner_probe="$execution_root/$probe_file" ;;
            esac
            test -f "$owner_probe"
            python3 -B "$owner_probe" \
              --bazel "$probe_bazel" \
              --bazel-arg="--host_platform=@sonic_build_infra//platforms:${CI_CPU}_trixie" \
              --bazel-arg="--platforms=@sonic_build_infra//platforms:${CI_CPU}_${CI_DISTRIBUTION}" \
              --bazel-arg="--distdir=$PWD/.cache/bazel-distdir" \
              --output artifacts/rebuild
          fi
          git -c safe.directory="$GITHUB_WORKSPACE" diff --exit-code
      - name: Upload source outputs and validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: libteam-${{ matrix.architecture }}-${{ matrix.distribution }}
          path: artifacts
          if-no-files-found: error
          retention-days: 14
          compression-level: 1
