name: Bazel SNMP image

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bazel-snmp-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Build and inspect SNMP images (AMD64)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container: debian:trixie-20260918@sha256:9cc080028c43b27d2074d63a5f9caf7166d731494965616c1a6d2827a004585c
    defaults:
      run:
        shell: bash
    steps:
      - name: Install execution and verification tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends binutils build-essential ca-certificates gdb git j2cli jq libarchive-tools libxml2 python3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-version: 1.29.0
          bazelisk-cache: true
          repository-cache: true
          disk-cache: snmp-image-amd64
          cache-version: "8.5.1"
      - name: Prepare the verified compression source
        run: |
          mkdir -p artifacts/snmp
          python3 tools/bazel/gzip/prepare_pigz.py --output "$RUNNER_TEMP/pigz-distdir" > artifacts/snmp/pigz-source.json
          printf 'common --distdir=%s\n' "$RUNNER_TEMP/pigz-distdir" > .bazelrc.user
      - name: Build runtime and debug images from source owners
        env:
          BAZELISK_GITHUB_TOKEN: ""
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(uname -m)" = x86_64
          test "$(. /etc/os-release; echo "$VERSION_CODENAME")" = trixie
          test ! -e MODULE.bazel.lock
          python3 -B tools/bazel/ci/snmp_image.py build --artifacts artifacts/snmp
      - name: Validate completed image contents and source symbols
        run: python3 -B tools/bazel/ci/snmp_image.py validate --artifacts artifacts/snmp
      - name: Check incremental rebuild and restored image digests
        env:
          BAZELISK_GITHUB_TOKEN: ""
        run: |
          python3 -B tools/bazel/ci/snmp_image.py incremental --artifacts artifacts/snmp
          git diff --exit-code
      - name: Retain images and exact build evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: snmp-image-amd64
          path: artifacts/snmp
          if-no-files-found: error
          retention-days: 14
          compression-level: 1

  runtime:
    name: Run installed SNMP images (AMD64)
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: snmp-image-amd64
          path: artifacts/snmp
      - name: Verify and load only this run's images
        run: |
          python3 - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          directory=Path('artifacts/snmp')
          receipt=json.loads((directory/'validation.json').read_text())
          assert receipt['status']=='passed' and receipt['architecture']=='amd64'
          assert receipt['revision']==subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          for name in ['docker-snmp','docker-snmp-dbg']:
              path=directory/(name+'.gz')
              assert hashlib.sha256(path.read_bytes()).hexdigest()==receipt['artifacts'][path.name]['sha256']
              subprocess.run(['docker','load','--input',str(path)],check=True)
              actual=json.loads(subprocess.check_output(['docker','image','inspect',name+':latest']))[0]
              expected=json.loads((directory/(name+'.validation.json')).read_text())
              assert actual['Os']=='linux' and actual['Architecture']=='amd64'
              assert actual['RootFS']['Layers']==expected['rootfs']['diff_ids']
              meaningful=lambda values:{k:v for k,v in values.items() if v not in (None,'',[],{},False)}
              assert meaningful(actual['Config'])==meaningful(expected['config'])
          assert hashlib.sha256((directory/'test-redis.tar').read_bytes()).hexdigest()==receipt['artifacts']['test-redis.tar']['sha256']
          PY
          mkdir -p artifacts/snmp/redis-fixture
          tar --no-same-owner -xf artifacts/snmp/test-redis.tar -C artifacts/snmp/redis-fixture
      - name: Query installed runtime and debug subagents
        run: |
          set -euo pipefail
          for image in docker-snmp docker-snmp-dbg; do
            docker run --rm --network=none --cap-drop=ALL --security-opt=no-new-privileges \
              --read-only --user=101:102 --pids-limit=128 --memory=4g --cpus=2 \
              --tmpfs /tmp:rw,nosuid,nodev,noexec,size=256m \
              --mount "type=bind,src=$PWD/dockers/docker-snmp/bazel/runtime_probe.py,dst=/probe/runtime_probe.py,readonly" \
              --mount "type=bind,src=$PWD/artifacts/snmp/redis-fixture,dst=/probe/redis,readonly" \
              --entrypoint /usr/bin/python3 "$image:latest" -B /probe/runtime_probe.py \
              | tee "artifacts/snmp/$image.runtime.json"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: snmp-runtime-amd64
          path: artifacts/snmp/*.runtime.json
          if-no-files-found: warn
          retention-days: 14
