name: Bazel SNMP image

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bazel-snmp-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Build and inspect SNMP images (AMD64)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container: debian:trixie-20260918@sha256:9cc080028c43b27d2074d63a5f9caf7166d731494965616c1a6d2827a004585c
    defaults:
      run:
        shell: bash
    steps:
      - name: Install execution and verification tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends binutils build-essential ca-certificates gdb git j2cli jq libarchive-tools libxml2 python3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-version: 1.29.0
          bazelisk-cache: true
          repository-cache: true
          disk-cache: snmp-image-amd64
          cache-version: "8.5.1"
      - name: Prepare the verified compression source
        run: |
          mkdir -p artifacts/snmp
          python3 tools/bazel/gzip/prepare_pigz.py --output "$RUNNER_TEMP/pigz-distdir" > artifacts/snmp/pigz-source.json
          printf 'common --distdir=%s\n' "$RUNNER_TEMP/pigz-distdir" > .bazelrc.user
      - name: Configure verified Debian payload transport
        run: |
          python3 - <<'PYCFG'
          import hashlib
          import os
          from pathlib import Path
          from urllib.request import urlopen
          url = "https://raw.githubusercontent.com/securely1g/sonic-bazel-registry/6e305126f13965fd01b6b3aa06e98d4595832d39/ci/source_mirrors.cfg"
          with urlopen(url, timeout=60) as response:
              data = response.read()
          if hashlib.sha256(data).hexdigest() != "e9f004bfce0501f998c7d624d028d40c72eabddc12c1f7b34fc474f14042d6a8":
              raise SystemExit("Source mirror configuration checksum mismatch")
          config = Path(os.environ["RUNNER_TEMP"]) / "base-source-mirrors.cfg"
          config.write_bytes(data)
          with Path(".bazelrc.user").open("a") as rc:
              rc.write("common --experimental_downloader_config=" + str(config) + "\n")
          PYCFG
      - name: Build runtime and debug images from source owners
        env:
          BAZELISK_GITHUB_TOKEN: ""
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(uname -m)" = x86_64
          test "$(. /etc/os-release; echo "$VERSION_CODENAME")" = trixie
          test ! -e MODULE.bazel.lock
          python3 -B tools/bazel/ci/snmp_image.py build --bazel "$GITHUB_WORKSPACE/tools/bazel/ci/libteam_draft_bazel.sh" --artifacts artifacts/snmp
      - name: Validate completed image contents and source symbols
        run: python3 -B tools/bazel/ci/snmp_image.py validate --artifacts artifacts/snmp
      - name: Check incremental rebuild and restored image digests
        env:
          BAZELISK_GITHUB_TOKEN: ""
        run: |
          python3 -B tools/bazel/ci/snmp_image.py incremental --bazel "$GITHUB_WORKSPACE/tools/bazel/ci/libteam_draft_bazel.sh" --artifacts artifacts/snmp
          git diff --exit-code
      - name: Retain images and exact build evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: snmp-image-amd64
          path: artifacts/snmp
          if-no-files-found: error
          retention-days: 14
          compression-level: 1

  runtime:
    name: Run installed SNMP images (AMD64)
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: snmp-image-amd64
          path: artifacts/snmp
      - name: Verify and query installed runtime and debug subagents
        run: python3 -B tools/bazel/ci/snmp_loaded.py --artifacts artifacts/snmp
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: snmp-runtime-amd64
          path: artifacts/snmp/*.runtime.json
          if-no-files-found: warn
          retention-days: 14
