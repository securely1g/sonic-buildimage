name: Bazel radv images

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      source_revision:
        description: Reviewed immutable source SHA (blank uses this workflow revision)
        type: string
        default: ''
      registry_revision:
        description: Reviewed immutable registry SHA (required with source_revision)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: bazel-radv-${{ github.event.pull_request.number || github.ref }}-${{ inputs.source_revision }}-${{ inputs.registry_revision }}
  cancel-in-progress: true

jobs:
  native:
    name: Build Router Advertiser OCI images and symbols (AMD64)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: debian:trixie-20260918@sha256:9cc080028c43b27d2074d63a5f9caf7166d731494965616c1a6d2827a004585c
      volumes:
        - /usr/local/lib/android:/host-unused-sdk/android
        - /usr/share/dotnet:/host-unused-sdk/dotnet
        - /opt/ghc:/host-unused-sdk/ghc
        - /usr/local/.ghcup:/host-unused-sdk/ghcup
    defaults:
      run:
        shell: bash
    env:
      BAZEL: ${{ inputs.registry_revision && 'tools/bazel/ci/review_bazel.sh' || 'bazel' }}
      SONIC_BAZEL_REGISTRY_REVISION: ${{ inputs.registry_revision }}
      BAZELISK_GITHUB_TOKEN: ""
    steps:
      - name: Validate the optional reviewed Radv source selection
        if: github.event_name == 'workflow_dispatch'
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
          REGISTRY_REVISION: ${{ inputs.registry_revision }}
        run: |
          if [[ -n "$SOURCE_REVISION$REGISTRY_REVISION" ]]; then
            [[ "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]] &&
              [[ "$REGISTRY_REVISION" =~ ^[0-9a-f]{40}$ ]] || {
                echo 'Select paired immutable source and registry SHAs.' >&2
                exit 2
              }
          fi
      - name: Allocate space on this disposable hosted runner
        if: inputs.source_revision != ''
        run: |
          set -euo pipefail
          [[ "${RUNNER_ENVIRONMENT:-}" == github-hosted ]] || {
            echo 'SDK cleanup requires a disposable GitHub-hosted runner.' >&2
            exit 1
          }
          for sdk in /host-unused-sdk/android /host-unused-sdk/dotnet \
                     /host-unused-sdk/ghc /host-unused-sdk/ghcup; do
            find "$sdk" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          done
          df -h /github/home
          available_bytes=$(df --output=avail --block-size=1 /github/home | tail -n 1)
          (( available_bytes >= 45 * 1024 * 1024 * 1024 )) || {
            echo 'Source image validation requires 45 GiB of free build space.' >&2
            exit 1
          }
      - name: Install execution and inspection tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends binutils binutils-gold build-essential ca-certificates gdb git j2cli jq libarchive-tools libxml2 python3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_revision || github.sha }}
          persist-credentials: false
      - name: Initialize the reviewed source's pinned gNOI dependency
        if: inputs.source_revision != ''
        run: git -c safe.directory="$GITHUB_WORKSPACE" submodule update --init -- src/sonic-sysmgr/gnoi
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-version: 1.29.0
          bazelisk-cache: true
          repository-cache: true
          disk-cache: radv-image-amd64
          cache-version: "8.5.1"
      - name: Preserve caches and verified transport for the reviewed source
        if: inputs.source_revision != ''
        run: |
          python3 -B tools/bazel/ci/lldp_draft_cache.py
          python3 - <<'PYCFG'
          import hashlib
          import os
          from pathlib import Path
          from urllib.request import urlopen
          inputs = [
              ("https://raw.githubusercontent.com/securely1g/sonic-bazel-registry/6974c594c5403db3f2ad2abbc850068114f4479d/ci/source_mirrors.cfg",
               "8a61da28325afa7c488843f98a59ba5c7eccb71a2a0300657a58510105692b18"),
              ("https://raw.githubusercontent.com/securely1g/sonic-buildimage/ba746670df1c30d0e6913d018ef0ff88d5b88679/tools/bazel/debian-pool.cfg",
               "43dce3f1b98b76ffa9db403e47139497dfb702126282747446463356c58133ee"),
          ]
          parts = []
          for url, expected in inputs:
              with urlopen(url, timeout=60) as response:
                  data = response.read()
              if hashlib.sha256(data).hexdigest() != expected:
                  raise SystemExit("Reviewed downloader configuration checksum mismatch")
              parts.append(data.rstrip(b"\n") + b"\n")
          config = Path(os.environ["RUNNER_TEMP"]) / "reviewed-radv-downloads.cfg"
          config.write_bytes(b"".join(parts))
          with Path(".bazelrc.user").open("a") as rc:
              rc.write("common --experimental_downloader_config=" + str(config) + "\n")
          PYCFG
      - name: Prepare the verified compression source and caches
        run: |
          mkdir -p artifacts/source-downloads
          python3 -B tools/bazel/gzip/prepare_pigz.py --output "$PWD/artifacts/source-downloads"
          printf 'common --distdir=%s\n' "$PWD/artifacts/source-downloads" >> .bazelrc.user
      - name: Validate Make handoff and version inputs
        run: python3 -B tools/bazel/tests/radv_make_test.py
      - name: Build runtime and debug images from owner TARs
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test ! -e MODULE.bazel.lock
          python3 -B tools/bazel/ci/radv_image.py build --bazel "$BAZEL" --artifacts artifacts/radv
      - name: Validate completed image contents and matching source symbols
        run: python3 -B tools/bazel/ci/radv_image.py validate --artifacts artifacts/radv
      - name: Verify no-op and restored image hashes
        run: |
          python3 -B tools/bazel/ci/radv_image.py incremental --bazel "$BAZEL" --artifacts artifacts/radv
          git diff --exit-code
      - name: Bind the completed Radv artifacts to the reviewed source
        if: inputs.source_revision != ''
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
          REGISTRY_REVISION: ${{ inputs.registry_revision }}
        run: |
          python3 - <<'PYBIND'
          import hashlib, json, os, subprocess
          from pathlib import Path
          expected = os.environ['SOURCE_REVISION']
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == expected
          subprocess.run(['git', 'diff', '--exit-code', 'HEAD', '--'], check=True)
          root = Path('artifacts/radv')
          for name, status in [('build-receipt.json', 'built'), ('validation.json', 'passed')]:
              value = json.loads((root / name).read_text())
              assert value['revision'] == expected and value['status'] == status
          value = {'source_revision': expected, 'registry_revision': os.environ['REGISTRY_REVISION'],
                   'control_revision': os.environ['GITHUB_SHA'],
                   'loaded_driver_sha256': hashlib.sha256(Path('tools/bazel/ci/radv_loaded.py').read_bytes()).hexdigest()}
          (root / 'reviewed-selection.json').write_text(json.dumps(value, indent=2) + '\n')
          PYBIND
      - name: Prepare public evidence
        id: public_evidence
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from tools.bazel.ci.public_artifacts import safe_json, dependency_json, bep_summary
          root = Path('artifacts/radv')
          root.mkdir(parents=True, exist_ok=True)
          if (root / 'build-receipt.json').exists():
              receipt = json.loads((root / 'build-receipt.json').read_text())
              public = {key: receipt[key] for key in ('status', 'architecture', 'revision', 'image_version', 'artifacts') if key in receipt}
              safe_json(public)
              (root / 'public-receipt.json').write_text(json.dumps(public, indent=2) + '\n')
          for name in ('validation.json', 'incremental.json', 'action-audit.json', 'debug-packages.json'):
              path = root / name
              if path.exists():
                  safe_json(json.loads(path.read_text()))
          for name, kind in (('MODULE.bazel.lock', 'lock'), ('module-graph.json', 'graph')):
              path = root / name
              if path.exists():
                  dependency_json(json.loads(path.read_text()), kind)
          if (root / 'build-events.jsonl').exists():
              value = bep_summary((root / 'build-events.jsonl').read_text().splitlines(), partial=True)
              (root / 'build-summary.json').write_text(json.dumps(value, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.public_evidence.outcome == 'success'
        with:
          name: radv-image-amd64
          path: |
            artifacts/radv/*.gz
            artifacts/radv/*.tar
            artifacts/radv/public-receipt.json
            artifacts/radv/reviewed-selection.json
            artifacts/radv/validation.json
            artifacts/radv/incremental.json
            artifacts/radv/action-audit.json
            artifacts/radv/debug-packages.json
            artifacts/radv/build-summary.json
            artifacts/radv/MODULE.bazel.lock
            artifacts/radv/module-graph.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 1

  runtime:
    name: Run installed Router Advertiser images (AMD64)
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Validate the optional reviewed Radv source selection
        if: github.event_name == 'workflow_dispatch'
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
          REGISTRY_REVISION: ${{ inputs.registry_revision }}
        run: |
          if [[ -n "$SOURCE_REVISION$REGISTRY_REVISION" ]]; then
            [[ "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]] &&
              [[ "$REGISTRY_REVISION" =~ ^[0-9a-f]{40}$ ]] || {
                echo 'Select paired immutable source and registry SHAs.' >&2
                exit 2
              }
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_revision || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: radv-image-amd64
          path: artifacts/radv
      - name: Verify the selected source against the downloaded Radv evidence
        if: inputs.source_revision != ''
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
          REGISTRY_REVISION: ${{ inputs.registry_revision }}
        run: |
          python3 - <<'PYBIND'
          import hashlib, json, os, subprocess
          from pathlib import Path
          root = Path('artifacts/radv')
          value = json.loads((root / 'reviewed-selection.json').read_text())
          assert value['source_revision'] == os.environ['SOURCE_REVISION']
          assert value['registry_revision'] == os.environ['REGISTRY_REVISION']
          assert value['control_revision'] == os.environ['GITHUB_SHA']
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == value['source_revision']
          assert hashlib.sha256(Path('tools/bazel/ci/radv_loaded.py').read_bytes()).hexdigest() == value['loaded_driver_sha256']
          for name in ['public-receipt.json', 'validation.json']:
              assert json.loads((root / name).read_text())['revision'] == value['source_revision']
          PYBIND
      - name: Verify loaded archives and installed router advertisement and VLAN readiness
        run: python3 -B tools/bazel/ci/radv_loaded.py --artifacts artifacts/radv
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: radv-runtime-amd64
          path: |
            artifacts/radv/*.runtime.json
            artifacts/radv/loaded-validation.json
          if-no-files-found: warn
          retention-days: 14

  acceptance:
    name: Router Advertiser acceptance (AMD64)
    if: always()
    needs: [native, runtime]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require both image construction and installed-service checks
        env:
          BUILD_RESULT: ${{ needs.native.result }}
          RUNTIME_RESULT: ${{ needs.runtime.result }}
        run: |
          test "$BUILD_RESULT" = success
          test "$RUNTIME_RESULT" = success
