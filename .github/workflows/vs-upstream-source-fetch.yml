name: Fetch exact upstream P4 source packages
"on":
  push:
    branches:
      - codex/vs-upstream-source-fetch-20261021
permissions:
  contents: read
jobs:
  fetch-sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Verify repository metadata and fetch source packages only
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/fetch_obs_sources.py" <<'OBS_SOURCE_FETCH_PYTHON'
          #!/usr/bin/env python3
          """Fetch authenticated OBS source packages only. Never execute or extract their contents."""
          import argparse
          from datetime import datetime, timezone
          import hashlib
          import json
          import os
          from pathlib import Path, PurePosixPath
          import re
          import resource
          import subprocess
          import tempfile
          import time
          from urllib.parse import quote, urlsplit
          
          BASES = (
              'https://download.opensuse.org/repositories/home:/p4lang/Debian_11/',
              'https://downloadcontent.opensuse.org/repositories/home:/p4lang/Debian_11/',
          )
          PACKAGES = {'p4lang-pi': '0.1.3-2', 'p4lang-bmv2': '1.15.0-9', 'p4lang-p4c': '1.2.4.2-3'}
          MIB = 1024 * 1024
          SOURCE_LIMIT = 256 * MIB
          TOTAL_LIMIT = 512 * MIB
          SHA256 = re.compile(r'[0-9a-f]{64}\Z')
          
          
          def require(condition, message):
              if not condition:
                  raise ValueError(message)
          
          
          def digest(path):
              with path.open('rb') as stream:
                  return hashlib.file_digest(stream, 'sha256').hexdigest()
          
          
          def paragraphs(text):
              result, fields, current = [], {}, None
              for line in text.splitlines() + ['']:
                  if not line:
                      if fields:
                          result.append(fields)
                      fields, current = {}, None
                  elif line[:1].isspace():
                      require(current is not None, 'orphan metadata continuation')
                      fields[current] += '\n' + line.strip()
                  else:
                      key, separator, value = line.partition(':')
                      require(separator and re.fullmatch(r'[A-Za-z][A-Za-z0-9-]*', key) and key not in fields,
                              'invalid or duplicate metadata field')
                      fields[key] = value.strip()
                      current = key
              return result
          
          
          def checksums(value):
              result = {}
              for line in value.strip().splitlines():
                  parts = line.split()
                  require(len(parts) == 3 and SHA256.fullmatch(parts[0]) and parts[1].isdigit(), 'invalid SHA256 record')
                  sha, size, name = parts
                  require(name not in result, 'duplicate checksum record')
                  result[name] = {'sha256': sha, 'size': int(size)}
              require(result, 'empty SHA256 list')
              return result
          
          
          def safe_directory(value):
              path = PurePosixPath(value)
              require(value and not path.is_absolute() and '..' not in path.parts and
                      re.fullmatch(r'[A-Za-z0-9_./+:-]+', value), 'unsafe source directory')
              return path
          
          
          def source_records(text):
              selected = {}
              for entry in paragraphs(text):
                  package = entry.get('Package')
                  if package not in PACKAGES or entry.get('Version') != PACKAGES[package]:
                      continue
                  require(package not in selected, 'duplicate exact source package')
                  version = PACKAGES[package]
                  upstream = version.rsplit('-', 1)[0]
                  files = checksums(entry.get('Checksums-Sha256', ''))
                  descriptor = package + '_' + version + '.dsc'
                  orig = re.compile(re.escape(package + '_' + upstream) + r'\.orig(?:-[A-Za-z0-9+.-]+)?\.tar\.(?:gz|xz|bz2|zst)\Z')
                  debian = re.compile(re.escape(package + '_' + version) + r'\.debian\.tar\.(?:gz|xz|bz2|zst)\Z')
                  require(3 <= len(files) <= 12 and descriptor in files and
                          sum(bool(debian.fullmatch(name)) for name in files) == 1 and
                          any(orig.fullmatch(name) for name in files), 'incomplete source archive set')
                  require(all(name == descriptor or orig.fullmatch(name) or debian.fullmatch(name) for name in files),
                          'non-source or unexpected file in selected package')
                  require(files[descriptor]['size'] <= MIB and all(0 < v['size'] <= SOURCE_LIMIT for v in files.values()),
                          'source package exceeds per-file limits')
                  selected[package] = {'version': version, 'directory': str(safe_directory(entry.get('Directory', '.'))),
                                       'descriptor': descriptor, 'files': files}
              require(set(selected) == set(PACKAGES), 'signed Sources lacks one or more exact requested versions')
              require(sum(v['size'] for p in selected.values() for v in p['files'].values()) <= TOTAL_LIMIT,
                      'source selection exceeds total download limit')
              return selected
          
          
          def descriptor_fields(text):
              if text.startswith('-----BEGIN PGP SIGNED MESSAGE-----\n'):
                  _, separator, text = text.partition('\n\n')
                  require(separator, 'malformed clearsigned descriptor')
                  text, separator, _ = text.partition('\n-----BEGIN PGP SIGNATURE-----')
                  require(separator, 'malformed clearsigned descriptor signature')
                  text = '\n'.join(line[2:] if line.startswith('- ') else line for line in text.splitlines())
              entries = paragraphs(text)
              require(len(entries) == 1, 'descriptor must contain exactly one paragraph')
              return entries[0]
          
          
          def verify_descriptor(path, package, record):
              fields = descriptor_fields(path.read_text())
              require(fields.get('Source') == package and fields.get('Version') == record['version'], 'descriptor identity differs')
              expected = {name: value for name, value in record['files'].items() if name != record['descriptor']}
              require(checksums(fields.get('Checksums-Sha256', '')) == expected,
                      'descriptor archive checksums differ from signed Sources')
          
          
          def verify_release(key, inrelease, scratch, metadata):
              keyring = scratch / 'obs-keyring.gpg'
              home = scratch / 'gpg-home'
              home.mkdir(mode=0o700)
              commands = [
                  ['gpg', '--batch', '--no-options', '--homedir', str(home), '--dearmor', '--output', str(keyring), str(key)],
                  ['gpg', '--batch', '--no-options', '--homedir', str(home), '--with-colons', '--show-keys', str(key)],
                  ['gpgv', '--homedir', str(home), '--keyring', str(keyring), '--status-fd', '1',
                   '--output', str(metadata / 'Release'), str(inrelease)],
              ]
              output = []
              for index, argv in enumerate(commands):
                  result = subprocess.run(argv, capture_output=True, text=True, timeout=30)
                  (metadata / f'gpg-{index}.stdout.txt').write_text(result.stdout)
                  (metadata / f'gpg-{index}.stderr.txt').write_text(result.stderr)
                  require(result.returncode == 0, 'repository signing-key or Release signature verification failed')
                  output.append(result.stdout)
              keys = [line.split(':')[9] for line in output[1].splitlines() if line.startswith('fpr:')]
              statuses = [line.split() for line in output[2].splitlines() if line.startswith('[GNUPG:] ')]
              forbidden = {'BADSIG', 'ERRSIG', 'NO_PUBKEY', 'REVKEYSIG', 'EXPSIG', 'EXPKEYSIG'}
              valid = [line[2] for line in statuses if line[1] == 'VALIDSIG']
              require(valid and all(key in keys for key in valid) and not any(line[1] in forbidden for line in statuses),
                      'no acceptable Release signature')
              fields = paragraphs((metadata / 'Release').read_text())
              require(len(fields) == 1, 'signed Release must contain one paragraph')
              entries = checksums(fields[0].get('SHA256', ''))
              require('Sources' in entries and 0 < entries['Sources']['size'] <= 8 * MIB, 'signed Release lacks bounded plain Sources')
              return {'signing_fingerprints': valid, 'key_fingerprints': keys, 'sources': entries['Sources'],
                      'release_fields': {key: fields[0].get(key) for key in ('Origin', 'Label', 'Date', 'Suite', 'Codename')}}
          
          
          class Downloader:
              def __init__(self, scratch, diagnostics, receipt):
                  self.scratch, self.diagnostics, self.receipt = scratch, diagnostics, receipt
                  self.deadline = time.monotonic() + 600
          
              def fetch(self, relative, destination, limit, expected=None):
                  safe_directory(relative)
                  for base in BASES:
                      remaining = int(self.deadline - time.monotonic())
                      require(remaining > 0, 'source-fetch time budget exhausted')
                      number = len(self.receipt['requests'])
                      partial = self.scratch / f'download-{number}.partial'
                      url = base + quote(relative, safe='/+:.-_')
                      timeout = min(120 if expected else 45, remaining)
                      argv = ['curl', '--disable', '--fail', '--silent', '--show-error', '--location', '--max-redirs', '4',
                              '--proto', '=https', '--proto-redir', '=https', '--tlsv1.2', '--connect-timeout', '8',
                              '--max-time', str(timeout), '--max-filesize', str(limit), '--output', str(partial),
                              '--write-out', '%{json}', url]
                      start = time.monotonic()
                      # Also bound chunked responses independently of curl's Content-Length checks.
                      def file_limit():
                          resource.setrlimit(resource.RLIMIT_FSIZE, (limit, limit))
                          resource.setrlimit(resource.RLIMIT_CORE, (0, 0))
                      result = subprocess.run(argv, capture_output=True, text=True, timeout=timeout + 5, preexec_fn=file_limit)
                      detail = json.loads(result.stdout) if result.stdout.strip().startswith('{') else {}
                      attempt = {'url': url, 'effective_url': detail.get('url_effective'), 'exit_code': result.returncode,
                                 'http_code': detail.get('http_code'), 'ssl_verify_result': detail.get('ssl_verify_result'),
                                 'elapsed_seconds': time.monotonic() - start, 'limit_bytes': limit}
                      self.receipt['requests'].append(attempt)
                      (self.diagnostics / f'curl-{number}.stderr.txt').write_text(result.stderr)
                      if result.returncode != 0:
                          partial.unlink(missing_ok=True)
                          continue
                      require(detail.get('http_code') == 200 and detail.get('ssl_verify_result') == 0 and
                              urlsplit(detail.get('url_effective', '')).scheme == 'https', 'download transport was not verified HTTPS')
                      size = partial.stat().st_size
                      sha = digest(partial)
                      require(0 < size <= limit, 'download exceeds its size bound or is empty')
                      attempt.update(size=size, sha256=sha)
                      if expected and (size != expected['size'] or sha != expected['sha256']):
                          attempt['verification_error'] = 'size or SHA256 differs from authenticated metadata'
                          partial.unlink()
                          continue
                      destination.parent.mkdir(parents=True, exist_ok=True)
                      partial.replace(destination)
                      return {'path': str(destination), 'size': size, 'sha256': sha, 'url': url,
                              'effective_url': attempt['effective_url']}
                  raise ValueError('both official source endpoints failed: ' + relative)
          
          
          def main():
              parser = argparse.ArgumentParser(description=__doc__)
              parser.add_argument('--output', required=True, type=Path)
              args = parser.parse_args()
              require(not args.output.exists(), 'refusing to reuse an artifact directory')
              output = args.output.resolve()
              metadata, diagnostics = output / 'metadata', output / 'diagnostics'
              metadata.mkdir(parents=True)
              diagnostics.mkdir()
              receipt = {'schema': 1, 'started_at': datetime.now(timezone.utc).isoformat(), 'status': 'running',
                         'purpose': 'Exact official OBS source acquisition; no extraction, compilation or binary package downloads',
                         'requested_packages': PACKAGES, 'requests': [], 'sources': {},
                         'trust_bootstrap': 'OBS Release.key downloaded via verified HTTPS from the official repository URL; key fingerprints recorded',
                         'workflow_commit': os.environ.get('GITHUB_SHA'), 'workflow_ref': os.environ.get('GITHUB_REF'),
                         'workflow_run_id': os.environ.get('GITHUB_RUN_ID'), 'script_sha256': digest(Path(__file__)),
                         'binary_packages_downloaded': False, 'source_code_executed': False}
              exit_code = 0
              try:
                  with tempfile.TemporaryDirectory(prefix='obs-source-fetch-') as temporary:
                      scratch = Path(temporary)
                      download = Downloader(scratch, diagnostics, receipt)
                      receipt['release_key'] = download.fetch('Release.key', metadata / 'Release.key', 128 * 1024)
                      receipt['inrelease'] = download.fetch('InRelease', metadata / 'InRelease', 512 * 1024)
                      receipt['signature'] = verify_release(metadata / 'Release.key', metadata / 'InRelease', scratch, metadata)
                      expected = receipt['signature']['sources']
                      receipt['sources_index'] = download.fetch('Sources', metadata / 'Sources', expected['size'], expected)
                      selected = source_records((metadata / 'Sources').read_text())
                      receipt['selected_records'] = selected
                      for package, record in selected.items():
                          folder = output / 'sources' / package
                          descriptor = record['descriptor']
                          order = [descriptor, *sorted(name for name in record['files'] if name != descriptor)]
                          receipt['sources'][package] = {}
                          for name in order:
                              expected = record['files'][name]
                              relative = str(PurePosixPath(record['directory']) / name)
                              info = download.fetch(relative, folder / name, expected['size'], expected)
                              receipt['sources'][package][name] = info
                              if name == descriptor:
                                  verify_descriptor(folder / name, package, record)
                      receipt['status'] = 'verified_exact_official_sources'
              except Exception as error:
                  receipt['status'] = 'failed'
                  receipt['error'] = str(error)
                  exit_code = 1
              finally:
                  receipt['finished_at'] = datetime.now(timezone.utc).isoformat()
                  (output / 'receipt.json').write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
                  print(json.dumps({'status': receipt['status'], 'error': receipt.get('error'), 'artifact_directory': str(output)}))
              raise SystemExit(exit_code)
          
          
          if __name__ == '__main__':
              main()
          OBS_SOURCE_FETCH_PYTHON
          python3 -I -S -B "$RUNNER_TEMP/fetch_obs_sources.py" --output "$GITHUB_WORKSPACE/source-fetch-artifact"
      - name: Retain verified sources and diagnostic receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: exact-p4-source-fetch-${{ github.run_id }}
          path: source-fetch-artifact/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
