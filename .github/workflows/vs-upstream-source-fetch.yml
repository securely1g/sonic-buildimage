name: Acquire immutable OBS source package diagnostics
"on":
  push:
    branches:
      - codex/vs-upstream-source-fetch-20261021
permissions:
  contents: read
jobs:
  fetch-sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Acquire checksum-verified original source package without extraction
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/fetch_obs_original_v4.py" <<'OBS_ORIGINAL_SOURCE_PYTHON'
          #!/usr/bin/env python3
          """Acquire public immutable OBS source bytes only; never extract, execute or build them."""
          import argparse
          from datetime import datetime, timezone
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import resource
          import subprocess
          import tempfile
          import time
          from urllib.parse import quote, urlsplit
          import xml.etree.ElementTree as ET
          
          API = 'https://api.opensuse.org/public/source/home:p4lang/p4lang-p4c'
          REVISION = '7e6643c47b3eaf7b403cc3988d80d12c'
          PACKAGE, VERSION = 'p4lang-p4c', '1.2.4.2-3'
          ORIG = 'p4lang-p4c_1.2.4.2.orig.tar.gz'
          DSC = 'p4lang-p4c_1.2.4.2-3.dsc'
          DEBIAN = 'p4lang-p4c_1.2.4.2-3.debian.tar.xz'
          PINNED_DIRECTORY = {
              ORIG: {'md5': '98b03592b7a6cf4ed2150463fd757e0e', 'size': 173758549},
              DSC: {'md5': 'fc74d6c8fa31a35e603411b6f813c75e', 'size': 2463},
              DEBIAN: {'md5': '8784e34246857089e2e0137f2e59acca', 'size': 2804},
          }
          PUBLISHED_ORIG = {'md5': 'fdcae6fb4befe90f75d531301f73248c', 'size': 173765465,
                            'sha256': '61251b9cf6dc4025e5bd7ec66c3387850962afad91f21754ec0e583f23c1953a'}
          MIB, BUDGET = 1024 * 1024, 512 * 1024 * 1024
          
          
          def require(condition, message):
              if not condition:
                  raise ValueError(message)
          
          
          def hashes(path):
              sha, md5 = hashlib.sha256(), hashlib.md5()
              with path.open('rb') as stream:
                  for chunk in iter(lambda: stream.read(MIB), b''):
                      sha.update(chunk)
                      md5.update(chunk)
              return {'size': path.stat().st_size, 'sha256': sha.hexdigest(), 'md5': md5.hexdigest()}
          
          
          def directory(data, expected_revision=None):
              require(len(data) <= 2 * MIB and b'<!DOCTYPE' not in data.upper() and b'<!ENTITY' not in data.upper(),
                      'unsupported or oversized directory XML')
              tree = ET.fromstring(data)
              require(tree.tag == 'directory' and tree.get('name') == PACKAGE and
                      re.fullmatch(r'[0-9a-f]{32}', tree.get('srcmd5', '')), 'unexpected OBS directory identity')
              if expected_revision is not None:
                  require(tree.get('srcmd5') == expected_revision, 'OBS immutable source revision differs')
              entries = {}
              for child in tree:
                  name, md5, size = child.get('name', ''), child.get('md5', ''), child.get('size', '')
                  require(child.tag == 'entry' and re.fullmatch(r'[A-Za-z0-9_.+-]+', name) and name not in entries and
                          name not in ('.', '..') and re.fullmatch(r'[0-9a-f]{32}', md5) and size.isdigit(),
                          'invalid or duplicate OBS directory entry')
                  entries[name] = {'md5': md5, 'size': int(size)}
              return {'srcmd5': tree.get('srcmd5'), 'rev': tree.get('rev'), 'entries': entries}
          
          
          def descriptor(data):
              text = data.decode('utf-8').replace('\r\n', '\n')
              if text.startswith('-----BEGIN PGP SIGNED MESSAGE-----\n'):
                  _, sep, text = text.partition('\n\n')
                  require(sep, 'invalid signed descriptor header')
                  text, sep, _ = text.partition('\n-----BEGIN PGP SIGNATURE-----')
                  require(sep, 'invalid signed descriptor body')
                  text = '\n'.join(line[2:] if line.startswith('- ') else line for line in text.splitlines())
              fields, current = {}, None
              for line in text.strip().splitlines():
                  if line[:1].isspace():
                      require(current is not None, 'orphan descriptor continuation')
                      fields[current] += '\n' + line.strip()
                  else:
                      key, sep, value = line.partition(':')
                      require(sep and re.fullmatch(r'[A-Za-z][A-Za-z0-9-]*', key) and key not in fields,
                              'invalid descriptor field')
                      fields[key], current = value.strip(), key
              require(fields.get('Source') == PACKAGE and fields.get('Version') == VERSION, 'immutable DSC package/version differs')
              sums = {}
              for line in fields.get('Checksums-Sha256', '').strip().splitlines():
                  pieces = line.split()
                  require(len(pieces) == 3 and re.fullmatch(r'[0-9a-f]{64}', pieces[0]) and pieces[1].isdigit(),
                          'invalid descriptor SHA256 entry')
                  sha, size, name = pieces
                  require(name in (ORIG, DEBIAN) and name not in sums and 0 < int(size) <= 256 * MIB,
                          'unexpected, duplicate or oversized source archive')
                  sums[name] = {'sha256': sha, 'size': int(size)}
              require(set(sums) == {ORIG, DEBIAN}, 'DSC must reference exactly the original and Debian source archives')
              return sums
          
          
          class Fetcher:
              def __init__(self, scratch, diagnostic, requests):
                  self.scratch, self.diagnostic, self.requests = scratch, diagnostic, requests
                  self.deadline, self.bytes_used = time.monotonic() + 600, 0
          
              def fetch(self, url, output, limit, *, expected=None, metadata=False):
                  require(url.startswith(API + '?') or url.startswith(API + '/'), 'request is outside the exact public OBS source API')
                  require(limit > 0 and limit <= BUDGET - self.bytes_used, '512 MiB transfer budget exhausted')
                  remaining = int(self.deadline - time.monotonic())
                  require(remaining > 0, '10 minute acquisition budget exhausted')
                  seconds = min(10 if metadata else 180, remaining)
                  partial = self.scratch / f'payload-{len(self.requests)}'
                  def limits():
                      resource.setrlimit(resource.RLIMIT_FSIZE, (limit, limit))
                      resource.setrlimit(resource.RLIMIT_CORE, (0, 0))
                  argv = ['curl', '--disable', '--fail', '--silent', '--show-error', '--location', '--max-redirs', '3',
                          '--proto', '=https', '--proto-redir', '=https', '--tlsv1.2', '--connect-timeout', '8', '--max-time', str(seconds),
                          '--max-filesize', str(limit), '--output', str(partial), '--write-out', '%{json}', url]
                  row = {'url': url, 'limit_bytes': limit, 'timeout_seconds': seconds}
                  self.requests.append(row)
                  try:
                      result = subprocess.run(argv, capture_output=True, text=True, timeout=seconds + 5, preexec_fn=limits)
                      detail = json.loads(result.stdout) if result.stdout.startswith('{') else {}
                      row.update(exit_code=result.returncode, effective_url=detail.get('url_effective'),
                                 http_code=detail.get('http_code'), ssl_verify_result=detail.get('ssl_verify_result'))
                      (self.diagnostic / f'curl-{len(self.requests)}.stderr.txt').write_text(result.stderr)
                      require(result.returncode == 0 and detail.get('http_code') == 200 and detail.get('ssl_verify_result') == 0 and
                              urlsplit(detail.get('url_effective', '')).scheme == 'https', 'verified HTTPS fetch failed')
                      actual = hashes(partial)
                      require(0 < actual['size'] <= limit, 'empty or oversized response')
                      row.update(actual)
                      if expected:
                          require(all(actual[key] == value for key, value in expected.items()), 'source digest or size mismatch')
                      output.parent.mkdir(parents=True, exist_ok=True)
                      partial.replace(output)
                      return {'path': str(output), 'url': url, **actual}
                  finally:
                      self.bytes_used += partial.stat().st_size if partial.exists() else row.get('size', 0)
                      partial.unlink(missing_ok=True)
                      row['cumulative_bytes'] = self.bytes_used
          
          
          def file_url(name, revision):
              require(name in PINNED_DIRECTORY and re.fullmatch(r'[0-9a-f]{32}', revision), 'invalid source file request')
              return API + '/' + quote(name, safe='._-') + '?rev=' + revision
          
          
          def main():
              parser = argparse.ArgumentParser(description=__doc__)
              parser.add_argument('--output', required=True, type=Path)
              args = parser.parse_args()
              require(not args.output.exists(), 'refusing to reuse an artifact directory')
              output = args.output.resolve()
              diagnostic = output / 'diagnostics'
              diagnostic.mkdir(parents=True)
              original = output / 'original-obs-source'
              original.mkdir()
              report = {'schema': 3, 'status': 'running', 'started_at': datetime.now(timezone.utc).isoformat(),
                        'script_sha256': hashes(Path(__file__))['sha256'], 'workflow_commit': os.environ.get('GITHUB_SHA'),
                        'workflow_run_id': os.environ.get('GITHUB_RUN_ID'), 'workflow_ref': os.environ.get('GITHUB_REF'),
                        'scope': 'Source acquisition and diagnostics only; no extraction, source execution or package build',
                        'requests': [], 'historical_directories': [], 'published_orig': {'status': 'not_found', 'expected': PUBLISHED_ORIG},
                        'immutable_package': {'status': 'pending', 'revision': REVISION, 'package': PACKAGE, 'version': VERSION,
                            'published_sources_equivalence': False,
                            'trust_basis': 'Verified HTTPS official OBS API, immutable srcmd5 identifier, directory MD5/size and DSC SHA256 references; distinct from the signed published repository'}}
              code = 1
              try:
                  with tempfile.TemporaryDirectory(prefix='obs-original-source-') as temporary:
                      fetch = Fetcher(Path(temporary), diagnostic, report['requests'])
                      matches = []
                      for rev in (11, 10, 9):
                          observation = {'requested_rev': rev}
                          report['historical_directories'].append(observation)
                          try:
                              path = diagnostic / f'revision-{rev}.xml'
                              observation['file'] = fetch.fetch(API + '?rev=' + str(rev), path, 2 * MIB, metadata=True)
                              value = directory(path.read_bytes())
                              require(value['rev'] == str(rev), 'OBS returned a different historical revision')
                              observation['directory'] = value
                              if value['entries'].get(ORIG) == {key: PUBLISHED_ORIG[key] for key in ('md5', 'size')}:
                                  matches.append(value['srcmd5'])
                          except Exception as error:
                              observation['error'] = str(error)
                      package = report['immutable_package']
                      dirpath = original / 'directory.xml'
                      package['directory_file'] = fetch.fetch(API + '?rev=' + REVISION, dirpath, 2 * MIB, metadata=True)
                      listing = directory(dirpath.read_bytes(), REVISION)
                      require(listing['rev'] in ('12', REVISION) and all(listing['entries'].get(name) == expected for name, expected in PINNED_DIRECTORY.items()),
                              'immutable revision 12 directory differs from the observed exact source package')
                      package['directory'] = listing
                      package['files'] = {}
                      package['files'][DSC] = fetch.fetch(file_url(DSC, REVISION), original / DSC,
                                                           PINNED_DIRECTORY[DSC]['size'], expected=PINNED_DIRECTORY[DSC])
                      sums = descriptor((original / DSC).read_bytes())
                      require(all(sums[name]['size'] == PINNED_DIRECTORY[name]['size'] for name in sums), 'DSC and directory sizes differ')
                      package['dsc_checksums_sha256'] = sums
                      for name in (DEBIAN, ORIG):
                          expected = {**PINNED_DIRECTORY[name], **sums[name]}
                          package['files'][name] = fetch.fetch(file_url(name, REVISION), original / name, expected['size'], expected=expected)
                      package['status'] = 'verified_immutable_obs_source_package'
                      (original / 'receipt.json').write_text(json.dumps(package, indent=2) + '\n')
                      # Optional search result remains separate and cannot replace the complete original package.
                      if matches:
                          revision = matches[0]
                          report['published_orig'].update(status='candidate_found', revision=revision)
                          try:
                              info = fetch.fetch(file_url(ORIG, revision), output / 'published-sources-match' / ORIG,
                                                 PUBLISHED_ORIG['size'], expected=PUBLISHED_ORIG)
                              report['published_orig'].update(status='matches_previously_authenticated_published_sha256', file=info)
                          except Exception as error:
                              report['published_orig'].update(status='candidate_rejected', error=str(error))
                      report['status'] = 'verified_immutable_obs_source_package'
                      code = 0
              except Exception as error:
                  report.update(status='failed', error=str(error))
              finally:
                  report['finished_at'] = datetime.now(timezone.utc).isoformat()
                  (output / 'receipt.json').write_text(json.dumps(report, indent=2, sort_keys=True) + '\n')
                  print(json.dumps({'status': report['status'], 'error': report.get('error'),
                                    'published_orig': report['published_orig']['status']}))
              raise SystemExit(code)
          
          
          if __name__ == '__main__':
              main()
          OBS_ORIGINAL_SOURCE_PYTHON
          python3 -I -S -B "$RUNNER_TEMP/fetch_obs_original_v4.py" --output "$GITHUB_WORKSPACE/source-fetch-artifact"
      - name: Retain separate original sources and diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: exact-p4-source-fetch-${{ github.run_id }}
          path: source-fetch-artifact/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
