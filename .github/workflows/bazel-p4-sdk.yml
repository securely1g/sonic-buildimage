name: Bazel cached P4 SDK

on:
  pull_request:
    paths:
      - .github/workflows/bazel-p4-sdk.yml
      - .bazelrc
      - MODULE.bazel
      - dockers/docker-base-trixie/bazel/draft_sources.json
      - tools/bazel/ci/prepare_draft_sources.py
      - tools/bazel/p4/**
      - tools/bazel/ci/**
  push:
    branches: [master]
    paths:
      - .github/workflows/bazel-p4-sdk.yml
      - .bazelrc
      - MODULE.bazel
      - dockers/docker-base-trixie/bazel/draft_sources.json
      - tools/bazel/ci/prepare_draft_sources.py
      - tools/bazel/p4/**
      - tools/bazel/ci/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bazel-p4-sdk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sdk:
    name: Source Syncd with cached DASH SDK (AMD64)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container: debian:trixie-20260918@sha256:9cc080028c43b27d2074d63a5f9caf7166d731494965616c1a6d2827a004585c
    defaults:
      run:
        shell: bash
    steps:
      - name: Install native tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends binutils build-essential ca-certificates curl gdb git patch python3

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-version: 1.29.0
          bazelisk-cache: true
          repository-cache: true
          disk-cache: ${{ github.workflow }}-AMD64
          cache-version: "8.5.1"

      - name: Prepare the reviewed dependency sources
        run: |
          python3 -B tools/bazel/ci/prepare_draft_sources.py \
            --manifest dockers/docker-base-trixie/bazel/draft_sources.json \
            --output "$RUNNER_TEMP/base-source-dependencies" \
            --receipt artifacts/dependencies/draft-sources.json \
            --bazelrc-output .bazelrc.user

      - name: Retain reviewed source provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ github.job }}-draft-sources-${{ strategy.job-index }}
          path: artifacts/dependencies/draft-sources.json
          if-no-files-found: error
          retention-days: 14


      - name: Verify native Trixie and clean dependency state
        run: |
          test "$(uname -m)" = x86_64
          test "$(dpkg --print-architecture)" = amd64
          . /etc/os-release
          test "$ID" = debian
          test "$VERSION_CODENAME" = trixie
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test ! -e MODULE.bazel.lock
          test -z "$(git ls-files -- MODULE.bazel.lock)"

      - name: Audit and test source runtime and debug packages
        run: |
          set -euo pipefail
          python3 -B tools/bazel/tests/artifact_validation_test.py
          flags=(--jobs=4
            --@sonic_sairedis//:enable_dashsai=true
            --@sonic_sairedis//:dash_sai=//tools/bazel/p4/sdk:dash_sai)
          targets=(//tools/bazel/p4/sdk:sdk_runtime_test //tools/bazel/p4/sdk:packages_test)
          audit_flags=()
          for flag in "${flags[@]}"; do audit_flags+=("--bazel-arg=$flag"); done
          python3 tools/bazel/ci/bazel_commands.py "${audit_flags[@]}" \
            --output artifacts/p4-sdk/action-audit.json "${targets[@]}"
          bazel test "${flags[@]}" --test_output=errors "${targets[@]}"
          mkdir -p artifacts/p4-sdk
          cp MODULE.bazel.lock artifacts/p4-sdk/MODULE.bazel.lock
          cp -aL bazel-testlogs/tools/bazel/p4/sdk artifacts/p4-sdk/tests
          git diff --exit-code

      - name: Retain SDK and source package evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: p4-sdk-source-syncd-amd64
          path: artifacts/p4-sdk/
          if-no-files-found: error
          retention-days: 14
