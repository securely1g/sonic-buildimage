# This workflow will merge pull requests automatically
#

name: automerge
on:
  check_suite:
    types:
      - completed

jobs:
  automerge:
    # Temporary: PR #64 runs only the native installer until it passes.
    if: ${{ github.head_ref != 'codex/vs-oci-build-session' && github.ref != 'refs/heads/codex/vs-oci-build-session' && (github.event.check_suite.app.name == 'Azure Pipelines' &&  github.event.check_suite.conclusion == 'success' && false) }}
    # Disable workflow. Use automerge_scan instead to have the same behaviour.
    runs-on: ubuntu-latest
    steps:
    - name: automerge
      uses: 'pascalgn/automerge-action@v0.15.5'
      env:
        GITHUB_TOKEN: '${{ secrets.TOKEN }}'
        MERGE_LABELS: 'automerge'
        MERGE_METHOD: 'squash'
        MERGE_FILTER_AUTHOR: 'mssonicbld'
        MERGE_DELETE_BRANCH: true
        LOG: "TRACE"
