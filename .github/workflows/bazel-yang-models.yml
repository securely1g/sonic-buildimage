name: Bazel YANG models

on:
  pull_request:
    paths:
      - 'MODULE.bazel'
      - '.bazelrc'
      - 'tools/bazel/common.bazelrc'
      - 'tools/bazel/ci/bazel_commands.py'
      - 'tools/bazel/ci/libteam_draft_bazel.sh'
      - 'tools/bazel/ci/preserve_setup_bazel_cache.py'
      - 'src/sonic-yang-models/**'
      - '.github/workflows/bazel-yang-models.yml'
  push:
    branches: [master]
    paths:
      - 'MODULE.bazel'
      - '.bazelrc'
      - 'tools/bazel/common.bazelrc'
      - 'tools/bazel/ci/bazel_commands.py'
      - 'tools/bazel/ci/libteam_draft_bazel.sh'
      - 'tools/bazel/ci/preserve_setup_bazel_cache.py'
      - 'src/sonic-yang-models/**'
      - '.github/workflows/bazel-yang-models.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: YANG model distribution (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: [self-hosted, linux, bazel-x64]
            machine: x86_64
          - architecture: arm64
            runner: [self-hosted, linux, bazel-arm64]
            machine: aarch64
    steps:
      - name: Restore workspace access before checkout
        working-directory: ${{ runner.temp }}
        shell: bash
        env:
          RUNNER_PIPELINE_WORKSPACE: ${{ runner.workspace }}
        run: |
          set -euo pipefail
          repository="${GITHUB_REPOSITORY##*/}"
          pipeline_workspace="${RUNNER_PIPELINE_WORKSPACE%/}"
          expected="$pipeline_workspace/$repository"
          if [[ "$GITHUB_WORKSPACE" != "$expected" ]]; then
            printf 'Refusing permission repair: expected workspace %s, got %s.\n' \
              "$expected" "$GITHUB_WORKSPACE" >&2
            exit 1
          fi
          if [[ ! -e "$expected" && ! -L "$expected" ]]; then
            echo 'No existing workspace to repair.'
            exit 0
          fi
          work_root="$(realpath -e -- "$pipeline_workspace/..")"
          physical_workspace="$work_root/$repository/$repository"
          if [[ ! -d "$expected" || "$(realpath -e -- "$expected")" != "$physical_workspace" ]]; then
            echo 'Refusing permission repair on a redirected workspace.' >&2
            exit 1
          fi
          expected="$physical_workspace"
          owner="$(id -u):$(id -g)"
          sudo -n find -P "$expected" -xdev -type d \
            -exec chown --no-dereference -- "$owner" {} +
          sudo -n find -P "$expected" -xdev -type d \
            -exec chmod u+rwx -- {} +
          sudo -n find -P "$expected" -xdev -type f -links 1 \
            -exec chown --no-dereference -- "$owner" {} +
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Initialize Sysmgr's pinned gNOI source
        run: git -c safe.directory="$GITHUB_WORKSPACE" submodule update --init -- src/sonic-sysmgr/gnoi
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-version: 1.29.0
          bazelisk-cache: true
          repository-cache: true
          disk-cache: yang-models-${{ matrix.architecture }}
      - name: Preserve setup-bazel caches for the image-root query
        run: python3 tools/bazel/ci/preserve_setup_bazel_cache.py --private-remote-cache
      - name: Configure the verified source mirror
        shell: bash
        run: |
          python3 - <<'PYCFG'
          import hashlib
          import os
          from pathlib import Path
          from urllib.request import urlopen
          # Pin the transport fallback; Bazel still verifies BCR integrity.
          url = "https://raw.githubusercontent.com/securely1g/sonic-bazel-registry/97cc502556b7ec3435d2d67b105315bcc18bb47e/ci/source_mirrors.cfg"
          with urlopen(url, timeout=60) as response:
              data = response.read()
          expected = "ddd6f40504a30e138a62be0d728e1a352391d0f781c927eaf4ea45c44d8a0720"
          if hashlib.sha256(data).hexdigest() != expected:
              raise SystemExit("Source mirror configuration checksum mismatch")
          config = Path(os.environ["RUNNER_TEMP"]) / "sonic-source-mirrors.cfg"
          config.write_bytes(data)
          with Path(".bazelrc.user").open("a") as rc:
              rc.write("common --experimental_downloader_config=" + str(config) + "\n")
          PYCFG
      - name: Build and verify the installed source distribution
        working-directory: src/sonic-yang-models
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = '${{ matrix.machine }}'
          test ! -e MODULE.bazel.lock
          git check-ignore MODULE.bazel.lock
          registry=https://raw.githubusercontent.com/securely1g/sonic-bazel-registry/main
          options=(--registry="$registry" --registry=https://bcr.bazel.build --lockfile_mode=update)
          mkdir -p artifacts
          # The standalone module and image root use the same maintained registry.
          (cd ../.. && tools/bazel/ci/libteam_draft_bazel.sh cquery --lockfile_mode=update \
            //src/sonic-yang-models:yang_models_package_test) > artifacts/image-root-targets.txt
          git rev-parse HEAD > artifacts/revision.txt
          uname -m > artifacts/execution-machine.txt
          python3 ../../tools/bazel/ci/bazel_commands.py --output artifacts/action-audit.json \
            --bazel-arg="--registry=$registry" --bazel-arg=--registry=https://bcr.bazel.build \
            //:yang_models_package_test //:yang_models_wheel //:yang_models_pkg
          bazel test "${options[@]}" --test_output=all //:yang_models_package_test
          bazel build "${options[@]}" //:yang_models_wheel //:yang_models_pkg
          bazel mod graph "${options[@]}" > artifacts/module-graph.txt
          cp MODULE.bazel.lock artifacts/
          for target in yang_models_wheel yang_models_pkg; do
            output=$(bazel cquery "${options[@]}" --output=files "//:$target")
            test -f "$output"
            cp "$output" artifacts/
          done
          cp bazel-testlogs/yang_models_package_test/test.xml artifacts/
          sha256sum artifacts/*.whl artifacts/*.tar > artifacts/SHA256SUMS
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: yang-models-${{ matrix.architecture }}
          path: src/sonic-yang-models/artifacts/
