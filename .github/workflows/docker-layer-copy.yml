name: Docker layer copy

on:
  pull_request:
    paths:
      - dockers/dockerfile-macros.j2
      - dockers/tests/test_rsync_builder_stage.py
      - .github/workflows/docker-layer-copy.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  copy:
    name: Preserve Docker network mounts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: debian:trixie-20260918@sha256:9cc080028c43b27d2074d63a5f9caf7166d731494965616c1a6d2827a004585c
    steps:
      - name: Install test tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates python3 python3-jinja2 rsync
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Copy a layer with different Docker-managed network files
        run: python3 dockers/tests/test_rsync_builder_stage.py -v
