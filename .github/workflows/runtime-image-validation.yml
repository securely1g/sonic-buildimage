name: Installed-image validator

on:
  pull_request:
    paths:
      - tools/bazel/ci/validate_runtime.py
      - tools/bazel/tests/runtime_validation_test.py
      - tools/bazel/tests/installed_images_test.py
      - tools/bazel/tests/image_workflow_test.py
      - tools/bazel/ci/verify_vs_oci.sh
      - tools/bazel/tests/vs_oci_session_test.py
      - tools/bazel/oci/oci_inventory.py
      - tools/bazel/tests/integration/oci_inventory_test.py
      - tools/bazel/tests/integration/oci_image_test.py
      - .github/workflows/bazel-oci.yml
      - .github/workflows/bazel-base-images.yml
      - tools/bazel/oci/runtime_smoke.py
      - tools/bazel/oci/tests/runtime_smoke_test.py
      - tools/bazel/oci/RUNTIME_VALIDATION.md
      - .github/workflows/runtime-image-validation.yml
  push:
    branches: [master]
    paths:
      - tools/bazel/ci/validate_runtime.py
      - tools/bazel/tests/runtime_validation_test.py
      - tools/bazel/tests/installed_images_test.py
      - tools/bazel/tests/image_workflow_test.py
      - tools/bazel/ci/verify_vs_oci.sh
      - tools/bazel/tests/vs_oci_session_test.py
      - tools/bazel/oci/oci_inventory.py
      - tools/bazel/tests/integration/oci_inventory_test.py
      - tools/bazel/tests/integration/oci_image_test.py
      - .github/workflows/bazel-oci.yml
      - .github/workflows/bazel-base-images.yml
      - tools/bazel/oci/runtime_smoke.py
      - tools/bazel/oci/tests/runtime_smoke_test.py
      - tools/bazel/oci/RUNTIME_VALIDATION.md
      - .github/workflows/runtime-image-validation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-tests:
    name: Native validator tests (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: [self-hosted, linux, bazel-x64]
            machine: x86_64
          - arch: arm64
            runner: [self-hosted, linux, bazel-arm64]
            machine: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    container: debian:trixie-20260918@sha256:9cc080028c43b27d2074d63a5f9caf7166d731494965616c1a6d2827a004585c
    defaults:
      run:
        shell: bash
    steps:
      - name: Install native validator test tools
        run: |
          test "$(uname -m)" = "${{ matrix.machine }}"
          apt-get update
          apt-get install -y --no-install-recommends build-essential ca-certificates gdb git python3-yaml
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check loading, matching debug symbols and container guards
        run: |
          for tool in cc objcopy readelf gdb; do command -v "$tool"; done
          env -u PYTHONSAFEPATH /usr/bin/python3 -B -m unittest \
            tools.bazel.oci.tests.runtime_smoke_test \
            tools.bazel.tests.runtime_validation_test \
            tools.bazel.tests.installed_images_test \
            tools.bazel.tests.vs_oci_session_test \
            tools.bazel.tests.integration.oci_inventory_test \
            tools.bazel.tests.integration.oci_image_test \
            tools.bazel.tests.image_workflow_test -v
          /usr/bin/python3 -B tools/bazel/ci/validate_runtime.py --help
