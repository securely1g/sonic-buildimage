name: Bazel eventd images

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bazel-eventd-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Build Eventd OCI images and symbols (AMD64)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container: debian:trixie-20260918@sha256:9cc080028c43b27d2074d63a5f9caf7166d731494965616c1a6d2827a004585c
    defaults:
      run:
        shell: bash
    env:
      BAZEL: bazel
      BAZELISK_GITHUB_TOKEN: ""
    steps:
      - name: Install execution and inspection tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends binutils binutils-gold build-essential ca-certificates gdb git j2cli jq libarchive-tools libxml2 python3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-version: 1.29.0
          bazelisk-cache: true
          repository-cache: true
          disk-cache: eventd-image-amd64
          cache-version: "8.5.1"
      - name: Prepare the verified compression source and caches
        run: |
          mkdir -p artifacts/source-downloads
          python3 -B tools/bazel/gzip/prepare_pigz.py --output "$PWD/artifacts/source-downloads"
          printf 'common --distdir=%s\n' "$PWD/artifacts/source-downloads" >> .bazelrc.user
      - name: Validate Make handoff and version inputs
        run: python3 -B tools/bazel/tests/eventd_make_test.py
      - name: Build runtime and debug images from owner TARs
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test ! -e MODULE.bazel.lock
          python3 -B tools/bazel/ci/eventd_image.py build --bazel "$BAZEL" --artifacts artifacts/eventd
      - name: Validate completed image contents and matching source symbols
        run: python3 -B tools/bazel/ci/eventd_image.py validate --artifacts artifacts/eventd
      - name: Verify no-op and restored image hashes
        run: |
          python3 -B tools/bazel/ci/eventd_image.py incremental --bazel "$BAZEL" --artifacts artifacts/eventd
          git diff --exit-code
      - name: Prepare public evidence
        id: public_evidence
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from tools.bazel.ci.public_artifacts import safe_json, dependency_json, bep_summary
          root = Path('artifacts/eventd')
          root.mkdir(parents=True, exist_ok=True)
          if (root / 'build-receipt.json').exists():
              receipt = json.loads((root / 'build-receipt.json').read_text())
              public = {key: receipt[key] for key in ('status', 'architecture', 'revision', 'image_version', 'artifacts') if key in receipt}
              safe_json(public)
              (root / 'public-receipt.json').write_text(json.dumps(public, indent=2) + '\n')
          for name in ('validation.json', 'incremental.json', 'action-audit.json', 'debug-packages.json'):
              path = root / name
              if path.exists():
                  safe_json(json.loads(path.read_text()))
          for name, kind in (('MODULE.bazel.lock', 'lock'), ('module-graph.json', 'graph')):
              path = root / name
              if path.exists():
                  dependency_json(json.loads(path.read_text()), kind)
          if (root / 'build-events.jsonl').exists():
              value = bep_summary((root / 'build-events.jsonl').read_text().splitlines(), partial=True)
              (root / 'build-summary.json').write_text(json.dumps(value, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.public_evidence.outcome == 'success'
        with:
          name: eventd-image-amd64
          path: |
            artifacts/eventd/*.gz
            artifacts/eventd/*.tar
            artifacts/eventd/public-receipt.json
            artifacts/eventd/validation.json
            artifacts/eventd/incremental.json
            artifacts/eventd/action-audit.json
            artifacts/eventd/debug-packages.json
            artifacts/eventd/build-summary.json
            artifacts/eventd/MODULE.bazel.lock
            artifacts/eventd/module-graph.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 1

  runtime:
    name: Run installed Eventd images (AMD64)
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: eventd-image-amd64
          path: artifacts/eventd
      - name: Verify loaded archives and installed event publishing and database delivery
        run: python3 -B tools/bazel/ci/eventd_loaded.py --artifacts artifacts/eventd
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: eventd-runtime-amd64
          path: |
            artifacts/eventd/*.runtime.json
            artifacts/eventd/loaded-validation.json
          if-no-files-found: warn
          retention-days: 14

  acceptance:
    name: Source Docker acceptance (AMD64)
    if: always()
    needs: [native, runtime]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require both image construction and installed-service checks
        env:
          BUILD_RESULT: ${{ needs.native.result }}
          RUNTIME_RESULT: ${{ needs.runtime.result }}
        run: |
          test "$BUILD_RESULT" = success
          test "$RUNTIME_RESULT" = success
