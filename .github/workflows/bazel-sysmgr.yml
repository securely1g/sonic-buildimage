name: Bazel Sysmgr source packages

on:
  pull_request:
    paths:
      - src/sonic-sysmgr/**
      - tools/bazel/ci/bazel_commands.py
      - tools/bazel/ci/source_image_worker.py
      - .github/workflows/bazel-oci.yml
      - tools/bazel/ci/sonic-buildimage-rule-inputs.json
      - .github/workflows/bazel-sysmgr.yml
  push:
    branches: [master]
    paths:
      - src/sonic-sysmgr/**
      - tools/bazel/ci/bazel_commands.py
      - tools/bazel/ci/source_image_worker.py
      - .github/workflows/bazel-oci.yml
      - tools/bazel/ci/sonic-buildimage-rule-inputs.json
      - .github/workflows/bazel-sysmgr.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Native Sysmgr packages (amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: debian:trixie-20260918@sha256:9cc080028c43b27d2074d63a5f9caf7166d731494965616c1a6d2827a004585c
      # Nested Linux sandboxes must remount /proc; Docker's masked system paths
      # otherwise prevent Bazel from registering the required sandbox strategy.
      options: --cap-add=SYS_ADMIN --security-opt seccomp=unconfined --security-opt apparmor=unconfined --security-opt systempaths=unconfined
    defaults:
      run:
        shell: bash
    steps:
      - name: Install execution tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends binutils binutils-gold build-essential ca-certificates curl file git python3 tar unzip zstd
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check out the owner's pinned gNOI messages
        run: git -c safe.directory="$GITHUB_WORKSPACE" submodule update --init -- src/sonic-sysmgr/gnoi
      - name: Check out the pinned GitHub input reader
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: securely1g/sonic-bazel-registry
          ref: 997796400cc3eefc1f0590b227cd9b74c2141424
          path: .bazel-inputs/github-reader
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            ci/github_sources.py
            ci/github_sources/bazelisk-1.29.0-linux-amd64.json
            ci/github_sources/cosmos-4.0.2.json
            ci/source_mirrors.cfg
          persist-credentials: false
      - name: Prepare checksum-pinned Bazelisk
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          inputs=.bazel-inputs/github-reader/ci
          bin="$RUNNER_TEMP/sonic-bazelisk/bin"
          python3 -B "$inputs/github_sources.py" \
            --manifest "$inputs/github_sources/bazelisk-1.29.0-linux-amd64.json" \
            --distdir "$bin" --cache-dir "$HOME/.cache/sonic-github-sources" \
            --receipt artifacts/sysmgr/bazelisk-bootstrap.json \
            --github-token-env GITHUB_TOKEN
          chmod 0755 "$bin/bazel"
          printf '%s\n' "$bin" >> "$GITHUB_PATH"
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          module-root: src/sonic-sysmgr
          bazelisk-version: ""
          bazelisk-cache: true
          repository-cache: true
          disk-cache: sysmgr-amd64
          cache-version: "8.5.1"
      - name: Prepare verified GitHub build inputs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          inputs="$RUNNER_TEMP/sysmgr-github-inputs"
          reader=.bazel-inputs/github-reader/ci
          mkdir -p "$inputs" artifacts/sysmgr
          python3 -B "$reader/github_sources.py" \
            --manifest "$reader/github_sources/cosmos-4.0.2.json" \
            --distdir "$inputs/distdir" \
            --repository-cache "$HOME/.cache/bazel-repo" \
            --cache-dir "$HOME/.cache/sonic-github-sources" \
            --receipt "$PWD/artifacts/sysmgr/github-sources.json" \
            --github-token-env GITHUB_TOKEN
          # The driver applies explicit startup RCs to query, audit and build.
          python3 - <<'PYCONFIG'
          import hashlib
          import os
          from pathlib import Path
          inputs = Path(os.environ["RUNNER_TEMP"]) / "sysmgr-github-inputs"
          data = Path(".bazel-inputs/github-reader/ci/source_mirrors.cfg").read_bytes()
          if hashlib.sha256(data).hexdigest() != "a937b05d4197544bac965bb2b96634e12423c7f82b0fd6b13d894bcd087bce3b":
              raise SystemExit("Source mirror configuration checksum mismatch")
          config = inputs / "source-mirrors.cfg"
          config.write_bytes(data)
          (inputs / "downloads.bazelrc").write_text(
              "common --distdir=" + str(inputs / "distdir") + "\n"
              "common --experimental_downloader_config=" + str(config) + "\n"
          )
          PYCONFIG
      - name: Prepare checksum-pinned Bazel rule archives
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          inputs=.bazel-inputs/github-reader/ci
          python3 -B "$inputs/github_sources.py" \
            --manifest "tools/bazel/ci/sonic-buildimage-rule-inputs.json" \
            --distdir "$RUNNER_TEMP/sysmgr-github-inputs/distdir" \
            --repository-cache "$HOME/.cache/bazel-repo" \
            --cache-dir "$HOME/.cache/sonic-github-sources" \
            --receipt artifacts/sysmgr/rule-sources.json \
            --github-token-env GITHUB_TOKEN
      - name: Audit, build and validate installed packages and original tests
        env:
          BAZELISK_GITHUB_TOKEN: ""
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p artifacts/sysmgr
          registry="$(python3 - <<'PYCATALOG'
          from pathlib import Path
          from tools.bazel.ci.source_image_worker import catalog_for
          print("https://raw.githubusercontent.com/securely1g/sonic-bazel-registry/" +
                catalog_for("sysmgr", Path.cwd()))
          PYCATALOG
          )"
          python3 -B src/sonic-sysmgr/bazel/ci.py \
            --registry="$registry" \
            --startup-arg="--bazelrc=$RUNNER_TEMP/sysmgr-github-inputs/downloads.bazelrc" \
            --artifacts artifacts/sysmgr 2>&1 | tee artifacts/sysmgr/ci.log
      - name: Validate public download receipts
        id: download_receipts
        if: always()
        run: |
          python3 - <<'PYRECEIPTS'
          from pathlib import Path
          from tools.bazel.ci.public_artifacts import load_json, safe_json
          for name in ('bazelisk-bootstrap.json', 'rule-sources.json', 'github-sources.json'):
              path = Path('artifacts/sysmgr') / name
              if path.exists():
                  safe_json(load_json(path.read_bytes()))
          PYRECEIPTS
      - name: Upload packages, original XML and installed-package evidence
        if: always() && steps.download_receipts.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sysmgr-amd64
          path: artifacts/sysmgr
          if-no-files-found: error
          retention-days: 14
          compression-level: 1
