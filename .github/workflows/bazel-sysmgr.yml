name: Bazel Sysmgr source packages

on:
  pull_request:
    paths:
      - src/sonic-sysmgr/**
      - tools/bazel/ci/bazel_commands.py
      - tools/bazel/debian_mirrors.cfg
      - .github/workflows/bazel-sysmgr.yml
  push:
    branches: [master]
    paths:
      - src/sonic-sysmgr/**
      - tools/bazel/ci/bazel_commands.py
      - tools/bazel/debian_mirrors.cfg
      - .github/workflows/bazel-sysmgr.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Native Sysmgr packages (amd64)
    runs-on: [self-hosted, Linux, X64, debian-trixie-container]
    timeout-minutes: 45
    defaults:
      run:
        shell: sonic-ci-shell {0}
    env:
      SONIC_CI_ARCH: amd64
    steps:
      - name: Install execution tools
        run: |
          sudo -n apt-get update
          sudo -n apt-get install -y --no-install-recommends binutils binutils-gold build-essential ca-certificates curl file git python3 tar unzip zstd
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check out the owner's pinned gNOI messages
        run: git -c safe.directory="$GITHUB_WORKSPACE" submodule update --init -- src/sonic-sysmgr/gnoi
      - name: Audit, build and validate installed packages and original tests
        env:
          BAZELISK_GITHUB_TOKEN: ""
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p artifacts/sysmgr
          # The standalone audit ignores workspace/system rc files; pass only
          # the worker resource defaults and checksum-preserving download mirrors.
          printf 'import /etc/bazel.bazelrc\ncommon --downloader_config=%s\n' \
            "$GITHUB_WORKSPACE/tools/bazel/debian_mirrors.cfg" > "$RUNNER_TEMP/sysmgr-worker.bazelrc"
          python3 -B src/sonic-sysmgr/bazel/ci.py \
            --startup-arg="--bazelrc=$RUNNER_TEMP/sysmgr-worker.bazelrc" --jobs 2 \
            --registry https://raw.githubusercontent.com/securely1g/sonic-bazel-registry/main \
            --artifacts artifacts/sysmgr 2>&1 | tee artifacts/sysmgr/ci.log
      - name: Upload packages, original XML and installed-package evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sysmgr-amd64
          path: artifacts/sysmgr
          if-no-files-found: error
          retention-days: 14
          compression-level: 1
