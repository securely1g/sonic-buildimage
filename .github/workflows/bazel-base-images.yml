name: Bazel source base images

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      source_revision:
        description: Reviewed immutable source SHA (blank uses this workflow revision)
        type: string
        default: ''
      registry_revision:
        description: Reviewed immutable registry SHA (required with source_revision)
        type: string
        default: ''
      architecture:
        description: Native architectures for this manual run
        type: choice
        options: [all, amd64]
        default: all

permissions:
  contents: read

concurrency:
  group: bazel-base-images-${{ github.event.pull_request.number || github.ref }}-${{ inputs.source_revision }}-${{ inputs.registry_revision }}-${{ inputs.architecture }}
  cancel-in-progress: true

env:
  BAZEL: ${{ inputs.registry_revision && 'tools/bazel/ci/review_bazel.sh' || 'bazel' }}
  SONIC_BAZEL_REGISTRY_REVISION: ${{ inputs.registry_revision }}

jobs:
  native:
    name: Build and inspect source base (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.architecture == 'amd64' && '[{"architecture":"amd64","runner":"ubuntu-24.04"}]' || '[{"architecture":"amd64","runner":"ubuntu-24.04"},{"architecture":"arm64","runner":"ubuntu-24.04-arm"}]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    container:
      image: debian:trixie-20260918@sha256:9cc080028c43b27d2074d63a5f9caf7166d731494965616c1a6d2827a004585c
      # Bind disposable host SDKs so cleanup frees the disk used by /github/home.
      volumes:
        - /usr/local/lib/android:/host-unused-sdk/android
        - /usr/share/dotnet:/host-unused-sdk/dotnet
        - /opt/ghc:/host-unused-sdk/ghc
        - /usr/local/.ghcup:/host-unused-sdk/ghcup
    defaults:
      run:
        shell: bash
    steps:
      - name: Validate the optional reviewed source and registry selection
        if: github.event_name == 'workflow_dispatch'
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
          REGISTRY_REVISION: ${{ inputs.registry_revision }}
          SELECTED_ARCHITECTURE: ${{ inputs.architecture }}
        run: |
          if [[ -n "$SOURCE_REVISION$REGISTRY_REVISION" ]]; then
            [[ "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]] &&
              [[ "$REGISTRY_REVISION" =~ ^[0-9a-f]{40}$ ]] &&
              [[ "$SELECTED_ARCHITECTURE" == amd64 ]] || {
                echo 'Select paired immutable source/registry SHAs and AMD64.' >&2
                exit 2
              }
          fi
      - name: Allocate space on this disposable hosted runner
        run: |
          set -euo pipefail
          [[ "${RUNNER_ENVIRONMENT:-}" == github-hosted ]] || {
            echo 'SDK cleanup requires a disposable GitHub-hosted runner.' >&2
            exit 1
          }
          for sdk in /host-unused-sdk/android /host-unused-sdk/dotnet \
                     /host-unused-sdk/ghc /host-unused-sdk/ghcup; do
            find "$sdk" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          done
          df -h /github/home
          available_bytes=$(df --output=avail --block-size=1 /github/home | tail -n 1)
          (( available_bytes >= 45 * 1024 * 1024 * 1024 )) || {
            echo 'Source image validation requires 45 GiB of free build space.' >&2
            exit 1
          }
      - name: Install execution and verification tools
        run: |
          apt-get update
          # SymCrypt's scoped LLVM linker needs libxml2 on the execution host.
          apt-get install -y --no-install-recommends binutils build-essential ca-certificates gdb git j2cli jq libarchive-tools libxml2 python3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_revision || github.sha }}
          persist-credentials: false
      - name: Initialize the reviewed source's pinned gNOI dependency
        if: inputs.source_revision != ''
        run: git -c safe.directory="$GITHUB_WORKSPACE" submodule update --init -- src/sonic-sysmgr/gnoi
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-version: 1.29.0
          bazelisk-cache: true
          repository-cache: true
          disk-cache: base-images-${{ matrix.architecture }}
          cache-version: "8.5.1"
      - name: Preserve caches and verified transport for the reviewed source
        if: inputs.registry_revision != ''
        run: |
          python3 -B tools/bazel/ci/lldp_draft_cache.py
          python3 - <<'PYCFG'
          import hashlib
          import os
          from pathlib import Path
          from urllib.request import urlopen
          inputs = [
              ("https://raw.githubusercontent.com/securely1g/sonic-bazel-registry/6974c594c5403db3f2ad2abbc850068114f4479d/ci/source_mirrors.cfg",
               "8a61da28325afa7c488843f98a59ba5c7eccb71a2a0300657a58510105692b18"),
              ("https://raw.githubusercontent.com/securely1g/sonic-buildimage/ba746670df1c30d0e6913d018ef0ff88d5b88679/tools/bazel/debian-pool.cfg",
               "43dce3f1b98b76ffa9db403e47139497dfb702126282747446463356c58133ee"),
          ]
          parts = []
          for url, expected in inputs:
              with urlopen(url, timeout=60) as response:
                  data = response.read()
              if hashlib.sha256(data).hexdigest() != expected:
                  raise SystemExit("Reviewed downloader configuration checksum mismatch")
              parts.append(data.rstrip(b"\n") + b"\n")
          config = Path(os.environ["RUNNER_TEMP"]) / "reviewed-parent-downloads.cfg"
          config.write_bytes(b"".join(parts))
          with Path(".bazelrc.user").open("a") as rc:
              rc.write("common --experimental_downloader_config=" + str(config) + "\n")
          PYCFG
          mkdir -p artifacts/base-images
          cp "$RUNNER_TEMP/reviewed-parent-downloads.cfg" artifacts/base-images/downloader.cfg
      - name: Prepare the checksum-pinned pigz source archive
        run: |
          mkdir -p artifacts/source-downloads
          python3 -B tools/bazel/gzip/prepare_pigz.py \
            --output "$PWD/artifacts/source-downloads" | tee artifacts/pigz-source.json
          # common.bazelrc imports this ignored file, including through Draft wrappers.
          printf 'common --distdir=%s\n' "$PWD/artifacts/source-downloads" >> .bazelrc.user

      - name: Check clean dependency inputs
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test ! -e MODULE.bazel.lock
      - name: Build and inspect runtime images and matching symbols
        env:
          # Bazel records its client environment in retained build events.
          BAZELISK_GITHUB_TOKEN: ""
        run: |
          acceptance=()
          if [[ '${{ matrix.architecture }}' == amd64 ]]; then
            acceptance+=(--config-engine-acceptance)
          fi
          python3 -B tools/bazel/ci/base_images.py --bazel "$BAZEL" \
            --architecture '${{ matrix.architecture }}' --artifacts artifacts/base-images "${acceptance[@]}"
          git diff --exit-code
      - name: Verify config-engine no-op and template rebuilds
        if: matrix.architecture == 'amd64'
        env:
          BAZELISK_GITHUB_TOKEN: ""
        run: |
          python3 -B tools/bazel/ci/config_engine_rebuild.py --bazel "$BAZEL" \
            --output artifacts/base-images/config-engine-rebuild.json
          git diff --exit-code
      - name: Retain images, symbols and build evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-base-${{ matrix.architecture }}
          path: |
            artifacts/base-images/*.gz
            artifacts/base-images/*.debug.tar
            artifacts/base-images/*.json
            artifacts/base-images/*.jsonl
            artifacts/base-images/*.log
            artifacts/base-images/MODULE.bazel.lock
            artifacts/base-images/downloader.cfg
          if-no-files-found: error
          retention-days: 14
          compression-level: 1

  runtime:
    name: Run the installed base image (${{ matrix.architecture }})
    needs: native
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.architecture == 'amd64' && '[{"architecture":"amd64","runner":"ubuntu-24.04"}]' || '[{"architecture":"amd64","runner":"ubuntu-24.04"},{"architecture":"arm64","runner":"ubuntu-24.04-arm"}]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - name: Validate the optional reviewed source and registry selection
        if: github.event_name == 'workflow_dispatch'
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
          REGISTRY_REVISION: ${{ inputs.registry_revision }}
          SELECTED_ARCHITECTURE: ${{ inputs.architecture }}
        run: |
          if [[ -n "$SOURCE_REVISION$REGISTRY_REVISION" ]]; then
            [[ "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]] &&
              [[ "$REGISTRY_REVISION" =~ ^[0-9a-f]{40}$ ]] &&
              [[ "$SELECTED_ARCHITECTURE" == amd64 ]] || {
                echo 'Select paired immutable source/registry SHAs and AMD64.' >&2
                exit 2
              }
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_revision || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: source-base-${{ matrix.architecture }}
          path: artifacts/base-images
      - name: Load only this run's verified image
        env:
          EXPECTED_ARCH: ${{ matrix.architecture }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          directory = Path('artifacts/base-images')
          receipt = json.loads((directory / 'receipt.json').read_text())
          assert receipt['status'] == 'passed' and receipt['architecture'] == os.environ['EXPECTED_ARCH']
          assert receipt['revision'] == subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert hashlib.sha256((directory / 'installed-images-policy.json').read_bytes()).hexdigest() == receipt['installed_images_policy_sha256']
          for name in ('docker-base-trixie.gz', 'docker-config-engine-trixie.gz'):
              with (directory / name).open('rb') as archive:
                  actual = hashlib.file_digest(archive, 'sha256').hexdigest()
              assert actual == receipt['artifacts'][name]['sha256'], name
          PY
          python3 -B tools/bazel/ci/validate_runtime.py \
            --images-policy artifacts/base-images/installed-images-policy.json \
            --target artifacts/base-images \
            --output artifacts/base-images/installed-images.json
      - name: Exercise installed source programs and Python packages
        run: |
          set -o pipefail
          docker run --rm --network=none --cap-drop=ALL --security-opt=no-new-privileges \
            --read-only --pids-limit=128 --memory=4g --cpus=2 \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=128m \
            --mount "type=bind,src=$PWD/tools/bazel/oci/base_runtime_smoke.py,dst=/probe/smoke.py,readonly" \
            --mount "type=bind,src=$PWD/artifacts/base-images/docker-config-engine-trixie.validation.json,dst=/probe/validation.json,readonly" \
            --entrypoint /usr/bin/python3 docker-config-engine-trixie:latest \
            -B /probe/smoke.py /probe/validation.json | tee artifacts/base-images/runtime-smoke.json
      - name: Require the installed-image smoke receipt
        if: always()
        run: |
          set -euo pipefail
          test -e artifacts/base-images/runtime-smoke.json
      - name: Retain installed-image validation
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-base-runtime-${{ matrix.architecture }}
          path: |
            artifacts/base-images/installed-images.json
            artifacts/base-images/runtime-smoke.json
          if-no-files-found: error
          retention-days: 14
