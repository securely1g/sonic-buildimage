name: Bazel event services

on:
  pull_request:
    paths:
      - src/sonic-eventd/**
      - MODULE.bazel
      - tools/bazel/common.bazelrc
      - tools/bazel/ci/check_eventd_install.sh
      - .github/workflows/bazel-eventd.yml
  push:
    branches: [master]
    paths:
      - src/sonic-eventd/**
      - MODULE.bazel
      - tools/bazel/common.bazelrc
      - tools/bazel/ci/check_eventd_install.sh
      - .github/workflows/bazel-eventd.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Native event services (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    container: debian:trixie-20260918@sha256:9cc080028c43b27d2074d63a5f9caf7166d731494965616c1a6d2827a004585c
    defaults:
      run:
        shell: bash
    steps:
      - name: Install execution tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends autoconf automake binutils binutils-gold build-essential busybox ca-certificates curl file git libtool patch pkg-config python3 tar unzip zstd
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Draft validation keeps the default registry on maintained main.
      - name: Check out the owned multiarch header patch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: securely1g/sonic-build-infra
          ref: 0b76749e7297476c5bfde0f0b3572ddf96052d01
          path: _eventd_dependencies/multiarch
          persist-credentials: false
      - name: Check out the existing pkg-config whitespace patch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: securely1g/sonic-build-infra
          ref: 0b76749e7297476c5bfde0f0b3572ddf96052d01
          path: _eventd_dependencies/pkgconfig
          persist-credentials: false
      - name: Prepare the exact Distroless source candidate
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/distroless.tar.gz" \
            https://github.com/bazel-contrib/rules_distroless/releases/download/v0.9.4/rules_distroless-v0.9.4.tar.gz
          echo "5d43f4f44f0f0fb614194a07a6dcf7b29338cfc8ab7f6129ad1e4403c1ad1c73  $RUNNER_TEMP/distroless.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/distroless-eventd"
          tar -xzf "$RUNNER_TEMP/distroless.tar.gz" --strip-components=1 -C "$RUNNER_TEMP/distroless-eventd"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/include-fragments.patch" \
            https://raw.githubusercontent.com/securely1g/sonic-bazel-registry/19f060dda00ce7140eae3af4e9a637f9cfeb5034/modules/rules_distroless/0.9.4.sonic.1/patches/0002-include-fragments.patch
          echo "88da687bfa7ecef1de6c0a309dc1abb8712d10f48caec22e9c74df30d64e639a  $RUNNER_TEMP/include-fragments.patch" | sha256sum --check --strict
          patch -d "$RUNNER_TEMP/distroless-eventd" -p1 < "$RUNNER_TEMP/include-fragments.patch"
          patch -d "$RUNNER_TEMP/distroless-eventd" -p1 < _eventd_dependencies/pkgconfig/third_party/rules_distroless/0002-pkgconfig-whitespace.patch
          patch -d "$RUNNER_TEMP/distroless-eventd" -p1 < _eventd_dependencies/multiarch/third_party/rules_distroless/0003-multiarch-headers.patch
          mkdir -p artifacts/eventd
          sha256sum "$RUNNER_TEMP/distroless.tar.gz" "$RUNNER_TEMP/include-fragments.patch" \
            _eventd_dependencies/pkgconfig/third_party/rules_distroless/0002-pkgconfig-whitespace.patch \
            _eventd_dependencies/multiarch/third_party/rules_distroless/0003-multiarch-headers.patch \
            > artifacts/eventd/distroless-inputs.sha256

      - name: Check out the reviewed Debian producer tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: securely1g/sonic-build-infra
          ref: 7339c0da8283fdc43dc90feb48136c9b574ee3e7
          path: _eventd_dependencies/package-infra
          persist-credentials: false
      - name: Check out Common's reviewed library metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: securely1g/sonic-swss-common
          ref: e4db486d14b726af21ad14a85334a60add07ec22
          path: _eventd_dependencies/common
          persist-credentials: false

      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-version: 1.29.0
          bazelisk-cache: true
          repository-cache: true
          disk-cache: eventd-${{ matrix.architecture }}
          cache-version: "8.5.1"
      - name: Select the reviewed Draft package registry
        run: |
          python3 - <<'PYCODE'
          import os, shlex, shutil, subprocess
          from pathlib import Path
          branch = 'codex/image-package-gcc-integration'
          observed = subprocess.check_output(['git', 'ls-remote', 'https://github.com/securely1g/sonic-bazel-registry.git', 'refs/heads/' + branch], text=True).split()[0]
          assert observed == '068ad4135ca46145071ad0321211125f0adf2074'
          directory = Path(os.environ['RUNNER_TEMP']) / 'package-registry'
          directory.mkdir()
          rc = directory / 'effective.bazelrc'
          rc.write_text(Path('.bazelrc').read_text().replace(
              'https://raw.githubusercontent.com/securely1g/sonic-bazel-registry/main',
              'https://raw.githubusercontent.com/securely1g/sonic-bazel-registry/' + branch))
          binary = shutil.which('bazel')
          assert binary
          wrapper = directory / 'bazel'
          wrapper.write_text('#!/bin/sh\nexec ' + shlex.quote(binary) + ' --noworkspace_rc --bazelrc=' + shlex.quote(str(rc)) + ' "$@"\n')
          wrapper.chmod(0o755)
          with open(os.environ['GITHUB_PATH'], 'a') as output: output.write(str(directory) + '\n')
          with open(os.environ['GITHUB_ENV'], 'a') as output: output.write('SONIC_NATIVE_BAZEL=' + binary + '\n')
          PYCODE

      - name: Audit, build and run all original suites with private Redis
        env:
          # Bazel records its client environment in retained build events.
          BAZELISK_GITHUB_TOKEN: ""
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 -B src/sonic-eventd/bazel/ci.py --architecture '${{ matrix.architecture }}' --artifacts artifacts/eventd \
            --bazel-arg="--override_module=rules_distroless=$RUNNER_TEMP/distroless-eventd" \
            --bazel-arg="--override_module=sonic-build-infra=$GITHUB_WORKSPACE/_eventd_dependencies/package-infra" \
            --bazel-arg="--override_module=sonic-swss-common=$GITHUB_WORKSPACE/_eventd_dependencies/common" \
            --bazel-arg="--override_module=sonic-rust-deps=$GITHUB_WORKSPACE/_eventd_dependencies/package-infra/rust/deps"
          git -c safe.directory="$GITHUB_WORKSPACE" diff --exit-code
      - name: Build and inspect Debian packages
        run: |
          set -euo pipefail
          machine=$(uname -m)
          flags=(--jobs=4
            "--platforms=@sonic_build_infra//platforms:${machine}_trixie"
            "--host_platform=@sonic_build_infra//platforms:${machine}_trixie"
            "--override_module=rules_distroless=$RUNNER_TEMP/distroless-eventd"
            "--override_module=sonic-build-infra=$GITHUB_WORKSPACE/_eventd_dependencies/package-infra"
            "--override_module=sonic-swss-common=$GITHUB_WORKSPACE/_eventd_dependencies/common"
            "--override_module=sonic-rust-deps=$GITHUB_WORKSPACE/_eventd_dependencies/package-infra/rust/deps")
          targets=(//src/sonic-eventd/debian:eventd_package_check
            //src/sonic-eventd/debian:rsyslog_plugin_package_check
            //src/sonic-eventd/debian:sonic_eventd_deb
            //src/sonic-eventd/debian:sonic_rsyslog_plugin_deb)
          mkdir -p artifacts/eventd/debian
          bazel aquery "${flags[@]}" --output=jsonproto \
            'mnemonic("DebAssemble", deps(//src/sonic-eventd/debian:eventd_package_check + //src/sonic-eventd/debian:rsyslog_plugin_package_check))' \
            > artifacts/eventd/debian/assembly-actions.json
          bazel build "${flags[@]}" "${targets[@]}"
          for target in "${targets[@]}"; do
            output=$(bazel cquery "${flags[@]}" --output=files "$target")
            cp "$output" artifacts/eventd/debian/
          done
          git -C _eventd_dependencies/package-infra rev-parse HEAD > artifacts/eventd/debian/tools-revision.txt
          git -C _eventd_dependencies/common rev-parse HEAD > artifacts/eventd/debian/common-revision.txt
          cp MODULE.bazel.lock artifacts/eventd/debian/MODULE.bazel.lock
          git -c safe.directory="$GITHUB_WORKSPACE" diff --exit-code
      - name: Build the real Common dependency package
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/artifacts/eventd/debian/dependencies"
          mkdir -p "$evidence"
          cd _eventd_dependencies/common
          # Validate pending producer registrations without changing the tracked main RC.
          python3 - "$RUNNER_TEMP/common-package.bazelrc" <<'PYCODE'
          import sys
          from pathlib import Path
          config = Path('.bazelrc').read_text().replace(
              'https://raw.githubusercontent.com/securely1g/sonic-bazel-registry/main',
              'https://raw.githubusercontent.com/securely1g/sonic-bazel-registry/codex/image-package-gcc-integration')
          Path(sys.argv[1]).write_text('\n'.join(line for line in config.splitlines() if not line.startswith('try-import ')) + '\n')
          PYCODE
          observed=$(git ls-remote https://github.com/securely1g/sonic-bazel-registry.git refs/heads/codex/image-package-gcc-integration | cut -f1)
          test "$observed" = 068ad4135ca46145071ad0321211125f0adf2074
          printf '%s\n' "$observed" > "$evidence/registry-revision.txt"
          cp "$RUNNER_TEMP/common-package.bazelrc" "$evidence/effective.bazelrc"
          machine=$(uname -m)
          startup=(--output_base="$RUNNER_TEMP/common-debian" --noworkspace_rc --bazelrc="$RUNNER_TEMP/common-package.bazelrc")
          flags=(--jobs=4 "--platforms=@sonic_build_infra//platforms:${machine}_trixie"
            "--host_platform=@sonic_build_infra//platforms:${machine}_trixie")
          "$SONIC_NATIVE_BAZEL" "${startup[@]}" build "${flags[@]}" \
            //debian:libswsscommon_check //debian:libswsscommon_deb @libyang//:libyang3_deb
          for target in //debian:libswsscommon_check //debian:libswsscommon_deb @libyang//:libyang3_deb; do
            output=$("$SONIC_NATIVE_BAZEL" "${startup[@]}" cquery "${flags[@]}" --output=files "$target")
            cp "$output" "$evidence/"
          done
          cp MODULE.bazel.lock "$evidence/MODULE.bazel.lock"

      - name: Upload native packages and test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eventd-${{ matrix.architecture }}
          path: artifacts/eventd
          if-no-files-found: error
          retention-days: 14
          compression-level: 1

  installed-package:
    name: Installed eventd packages (${{ matrix.architecture }})
    needs: native
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: debian:trixie-20260918@sha256:9cc080028c43b27d2074d63a5f9caf7166d731494965616c1a6d2827a004585c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: eventd-${{ matrix.architecture }}
          path: packages
      - name: Install, reinstall, remove and purge with real dependencies
        env:
          SONIC_DEB_TEST_CONTAINER: 1
        run: bash tools/bazel/ci/check_eventd_install.sh packages/debian
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: eventd-installation-${{ matrix.architecture }}
          path: packages/debian/installation.json
          if-no-files-found: warn
