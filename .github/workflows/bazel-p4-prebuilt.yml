name: Bazel P4 package imports

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bazel-p4-prebuilt-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  import:
    name: P4 DEB repository cache (AMD64)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: debian:trixie-20260918@sha256:9cc080028c43b27d2074d63a5f9caf7166d731494965616c1a6d2827a004585c
    defaults:
      run:
        shell: bash
    steps:
      - name: Install package inspection tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git make python3 unzip zstd

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify native architecture and clean dependency state
        run: |
          test "$(uname -m)" = x86_64
          test "$(dpkg --print-architecture)" = amd64
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test ! -e MODULE.bazel.lock
          test -z "$(git ls-files -- MODULE.bazel.lock)"
          git check-ignore MODULE.bazel.lock

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-version: 1.29.0
          bazelisk-cache: true
          repository-cache: false
          disk-cache: false
          cache-version: "8.5.1"

      - name: Test package import and Make selection
        run: python3 -B -m unittest discover -s tools/bazel/p4/tests -p '*_test.py' -v

      - name: Verify fresh checkouts and offline repository-cache reuse
        run: |
          test "$(bazel --version)" = "bazel $(cat .bazelversion)"
          python3 -B tools/bazel/p4/verify_cache.py \
            --artifacts artifacts/p4-repository-cache \
            --work-directory "$RUNNER_TEMP" \
            --bazel bazel
          git diff --exit-code

      - name: Retain cache and package verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: p4-package-import-amd64
          path: artifacts/p4-repository-cache/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
