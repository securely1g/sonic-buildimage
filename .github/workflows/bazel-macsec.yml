name: Bazel MACsec images

on:
  pull_request:
    paths:
      - .github/workflows/bazel-macsec.yml
      - .github/workflows/bazel-oci.yml
      - MODULE.bazel
      - .bazelrc
      - .bazelversion
      - dockers/docker-macsec/**
      - dockers/docker-swss-layer-trixie/**
      - dockers/docker-config-engine-trixie/**
      - dockers/docker-base-trixie/**
      - rules/docker-macsec.mk
      - tools/bazel/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bazel-macsec-image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SONIC_BAZEL_REGISTRY_REVISION: 7340f9b25dff81bdad9120231b578b66e754fd03

jobs:
  native:
    name: Build and inspect MACsec images (AMD64)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container: debian:trixie-20260918@sha256:9cc080028c43b27d2074d63a5f9caf7166d731494965616c1a6d2827a004585c
    defaults:
      run:
        shell: bash
    steps:
      - name: Install execution and verification tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends binutils build-essential ca-certificates file gdb git j2cli jq libarchive-tools libxml2 python3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out the pinned GitHub input reader
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: securely1g/sonic-bazel-registry
          ref: 997796400cc3eefc1f0590b227cd9b74c2141424
          path: .bazel-inputs/github-reader
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            ci/github_sources.py
            ci/github_sources/bazelisk-1.29.0-linux-amd64.json
          persist-credentials: false
      - name: Prepare checksum-pinned Bazelisk
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          inputs=.bazel-inputs/github-reader/ci
          bin="$RUNNER_TEMP/sonic-bazelisk/bin"
          python3 -B "$inputs/github_sources.py" \
            --manifest "$inputs/github_sources/bazelisk-1.29.0-linux-amd64.json" \
            --distdir "$bin" --cache-dir "$HOME/.cache/sonic-github-sources" \
            --receipt artifacts/macsec/bazelisk-bootstrap.json \
            --github-token-env GITHUB_TOKEN
          chmod 0755 "$bin/bazel"
          printf '%s\n' "$bin" >> "$GITHUB_PATH"
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-version: ""
          bazelisk-cache: true
          repository-cache: true
          disk-cache: macsec-image-amd64
          cache-version: "8.5.1"
      - name: Prepare the verified compression source
        run: |
          mkdir -p artifacts/macsec
          python3 tools/bazel/gzip/prepare_pigz.py --output "$RUNNER_TEMP/pigz-distdir" > artifacts/macsec/pigz-source.json
          python3 - <<'PYCODE'
          import os
          from pathlib import Path
          home = Path.home() / '.bazelrc'
          cache_lines = [line for line in home.read_text().splitlines()
                         if line.startswith(('build --disk_cache=', 'common --repository_cache='))]
          assert len(cache_lines) == 2, 'setup-bazel cache settings are missing'
          user = Path('.bazelrc.user')
          current = user.read_text() if user.exists() else ''
          user.write_text(current + '\n' + '\n'.join(cache_lines) +
                          '\ncommon --distdir=' + os.environ['RUNNER_TEMP'] + '/pigz-distdir\n')
          PYCODE
      - name: Prepare checksum-pinned Bazel rule archives
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          inputs=.bazel-inputs/github-reader/ci
          python3 -B "$inputs/github_sources.py" \
            --manifest "tools/bazel/ci/sonic-buildimage-rule-inputs.json" \
            --distdir "$RUNNER_TEMP/pigz-distdir" \
            --repository-cache "$HOME/.cache/bazel-repo" \
            --cache-dir "$HOME/.cache/sonic-github-sources" \
            --receipt artifacts/macsec/rule-sources.json \
            --github-token-env GITHUB_TOKEN
      - name: Configure the verified source mirror
        run: |
          python3 - <<'PYCFG'
          import hashlib
          import os
          from pathlib import Path
          from urllib.request import urlopen
          # Load the checksum-verified pinned configuration. Archive integrity checks remain unchanged.
          url = "https://raw.githubusercontent.com/securely1g/sonic-bazel-registry/997796400cc3eefc1f0590b227cd9b74c2141424/ci/source_mirrors.cfg"
          with urlopen(url, timeout=60) as response:
              data = response.read()
          expected = "a937b05d4197544bac965bb2b96634e12423c7f82b0fd6b13d894bcd087bce3b"
          if hashlib.sha256(data).hexdigest() != expected:
              raise SystemExit("Source mirror configuration checksum mismatch")
          config = Path(os.environ["RUNNER_TEMP"]) / "sonic-source-mirrors.cfg"
          config.write_bytes(data)
          with Path(".bazelrc.user").open("a") as rc:
              rc.write("common --experimental_downloader_config=" + str(config) + "\n")
          PYCFG
      - name: Build runtime and debug images from source owners
        env:
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          BAZELISK_GITHUB_TOKEN: ""
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(uname -m)" = x86_64
          test "$(. /etc/os-release; echo "$VERSION_CODENAME")" = trixie
          test ! -e MODULE.bazel.lock
          python3 -B tools/bazel/ci/macsec_image.py build --artifacts artifacts/macsec
      - name: Validate completed image contents and source symbols
        env:
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: python3 -B tools/bazel/ci/macsec_image.py validate --artifacts artifacts/macsec
      - name: Check incremental rebuild and restored image digests
        env:
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          BAZELISK_GITHUB_TOKEN: ""
        run: |
          python3 -B tools/bazel/ci/macsec_image.py incremental --artifacts artifacts/macsec
          git diff --exit-code
      - name: Prepare reviewed public evidence
        id: public
        if: always()
        run: |
          python3 - <<'PYCODE'
          import json
          from pathlib import Path
          from tools.bazel.ci.public_artifacts import safe_json, dependency_json, bep_summary
          root = Path('artifacts/macsec')
          if (root / 'build-receipt.json').exists():
              receipt = json.loads((root / 'build-receipt.json').read_text())
              public = {key: receipt[key] for key in ('status', 'architecture', 'revision', 'artifacts') if key in receipt}
              safe_json(public)
              (root / 'public-receipt.json').write_text(json.dumps(public, indent=2) + '\n')
          names = ['validation.json', 'action-audit.json', 'incremental.json', 'runtime-apt.json', 'debug-apt.json']
          names += [path.name for path in root.glob('*.validation.json')]
          names += [path.name for path in root.glob('*.packages.json')]
          for name in names:
              path = root / name
              if path.exists():
                  safe_json(json.loads(path.read_text()))
          for name, kind in (('MODULE.bazel.lock', 'lock'), ('module-graph.json', 'graph')):
              path = root / name
              if path.exists():
                  dependency_json(json.loads(path.read_text()), kind)
          summary = {str(path.relative_to(root)): bep_summary(path.read_text().splitlines(), partial=True)
                     for path in root.rglob('*events.json*')}
          safe_json(summary)
          (root / 'build-summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          PYCODE
      - name: Validate public download receipts
        id: download_receipts
        if: always()
        run: |
          python3 - <<'PYRECEIPTS'
          from pathlib import Path
          from tools.bazel.ci.public_artifacts import load_json, safe_json
          for name in ('bazelisk-bootstrap.json', 'rule-sources.json'):
              path = Path('artifacts/macsec') / name
              if path.exists():
                  safe_json(load_json(path.read_bytes()))
          PYRECEIPTS
      - name: Retain images and reviewed build evidence
        if: always() && steps.download_receipts.outcome == 'success' && steps.public.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macsec-image-amd64
          path: |
            artifacts/macsec/bazelisk-bootstrap.json
            artifacts/macsec/rule-sources.json
            artifacts/macsec/*.gz
            artifacts/macsec/*.tar
            artifacts/macsec/*.status
            artifacts/macsec/*.packages.json
            artifacts/macsec/*.validation.json
            artifacts/macsec/validation.json
            artifacts/macsec/public-receipt.json
            artifacts/macsec/runtime-apt.json
            artifacts/macsec/debug-apt.json
            artifacts/macsec/action-audit.json
            artifacts/macsec/incremental.json
            artifacts/macsec/build-summary.json
            artifacts/macsec/MODULE.bazel.lock
            artifacts/macsec/module-graph.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 1

  runtime:
    name: Run installed MACsec images (AMD64)
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macsec-image-amd64
          path: artifacts/macsec
      - name: Exercise installed MACsec manager and actual WPA child
        env:
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: python3 -B tools/bazel/ci/macsec_loaded.py --artifacts artifacts/macsec
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: macsec-runtime-amd64
          path: artifacts/macsec/*.runtime.json
          if-no-files-found: warn
          retention-days: 14
