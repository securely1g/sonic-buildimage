name: Daily VS remote-cache probe

on:
  push:
    branches:
      - ci/vs-daily-cache-report
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: vs-remote-cache-daily
  cancel-in-progress: false

jobs:
  sources:
    name: Prepare pinned source inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: debian:trixie-20260918@sha256:9cc080028c43b27d2074d63a5f9caf7166d731494965616c1a6d2827a004585c
      options: --init
    env:
      BAZEL: ${{ github.workspace }}/tools/bazel/ci/libteam_draft_bazel.sh
    defaults:
      run:
        shell: bash
    steps:
      - name: Install source-resolution tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl git python3 python3-yaml tar unzip zstd
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: bash tools/bazel/ci/prepare_image_submodules.sh
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-version: 1.29.0
          bazelisk-cache: true
          repository-cache: true
          disk-cache: false
          cache-version: "8.5.1"
      - run: python3 -B tools/bazel/ci/resources.py --configure
      - run: python3 -B tools/bazel/ci/preserve_setup_bazel_cache.py --repository-only
      - name: Prepare download mirrors and verified archives
        run: |
          set -euo pipefail
          mkdir -p artifacts/vs-cache-inputs/repositories
          python3 -B tools/bazel/ci/source_mirrors.py --output "$RUNNER_TEMP/source-mirrors.cfg"
          printf 'common --downloader_config=%s\n' "$RUNNER_TEMP/source-mirrors.cfg" >> .bazelrc.user
          test "$("$BAZEL" --version)" = "bazel $(cat .bazelversion)"
          "$BAZEL" fetch --repo=@@ape+ --repo=@@download_utils+ \
            --repo=@@rules_coreutils+ --repo=@@rules_gzip+ --repo=@@toolchain_utils+
          python3 - <<'PY'
          import os
          from pathlib import Path
          from tools.bazel.ci import resolution
          resolution.collect(Path.cwd(), Path("artifacts/vs-cache-inputs/repositories"),
                             bazel=[os.environ["BAZEL"]])
          PY
          python3 -B tools/bazel/gzip/source_archive.py \
            --repository-cache "$("$BAZEL" info repository_cache)" \
            --module-graph artifacts/vs-cache-inputs/repositories/module-graph.json \
            --output artifacts/vs-cache-inputs/repositories \
            > artifacts/vs-cache-inputs/repositories/receipt.json
          python3 -B tools/ci/p4_source_inputs.py --fetch \
            --manifest src/p4lang/source-inputs.json \
            --directory artifacts/vs-cache-inputs/p4/sources \
            --receipt artifacts/vs-cache-inputs/p4/receipt.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vs-cache-probe-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/vs-cache-inputs/repositories/*/src.tar.gz
            artifacts/vs-cache-inputs/repositories/receipt.json
            artifacts/vs-cache-inputs/p4/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  first:
    name: First fresh VS build (seed cache)
    needs: sources
    uses: ./.github/workflows/bazel-vs-cache-pass.yml
    with:
      revision: ${{ github.sha }}
      pass_number: 1
      upload_cache: true

  second:
    name: Second fresh VS build (read cache)
    needs: [sources, first]
    if: ${{ !cancelled() && needs.sources.result == 'success' }}
    uses: ./.github/workflows/bazel-vs-cache-pass.yml
    with:
      revision: ${{ github.sha }}
      pass_number: 2
      upload_cache: false

  report:
    name: Compare cache outcomes
    needs: [first, second]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: vs-cache-probe-pass-*-${{ github.run_id }}-${{ github.run_attempt }}
          merge-multiple: true
          path: reports
      - name: Report second-pass executions and observed remote hits
        if: always()
        run: |
          python3 -B tools/bazel/ci/vs_cache_report.py compare \
            --first reports/cache-pass-1.json --second reports/cache-pass-2.json \
            --output reports/comparison.json --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: vs-cache-probe-comparison-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/comparison.json
          if-no-files-found: error
          retention-days: 14
