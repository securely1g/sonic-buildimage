name: Bazel management-framework images

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bazel-mgmt-framework-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SONIC_BAZEL_REGISTRY_REVISION: 28bd77d92d8d28f100ca328489a49f3b025e1a65

jobs:
  native:
    name: Build Framework OCI images and symbols (AMD64)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container: debian:trixie-20260918@sha256:9cc080028c43b27d2074d63a5f9caf7166d731494965616c1a6d2827a004585c
    defaults:
      run:
        shell: bash
    env:
      BAZEL: ${{ github.workspace }}/tools/bazel/ci/review_bazel.sh
      BAZELISK_GITHUB_TOKEN: ""
      CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Install execution and inspection tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends binutils binutils-gold build-essential ca-certificates gdb git j2cli jq libarchive-tools libxml2 python3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-version: 1.29.0
          bazelisk-cache: true
          repository-cache: true
          disk-cache: management-framework-image-amd64
          cache-version: "8.5.1"
      - name: Configure the verified source mirror
        run: |
          python3 - <<'PYCFG'
          import hashlib
          import os
          from pathlib import Path
          from urllib.request import urlopen
          # Registry #228 changes transport; Bazel still verifies package/source integrity.
          url = "https://raw.githubusercontent.com/securely1g/sonic-bazel-registry/6e305126f13965fd01b6b3aa06e98d4595832d39/ci/source_mirrors.cfg"
          with urlopen(url, timeout=60) as response:
              data = response.read()
          expected = "e9f004bfce0501f998c7d624d028d40c72eabddc12c1f7b34fc474f14042d6a8"
          if hashlib.sha256(data).hexdigest() != expected:
              raise SystemExit("Source mirror configuration checksum mismatch")
          config = Path(os.environ["RUNNER_TEMP"]) / "sonic-source-mirrors.cfg"
          config.write_bytes(data)
          with Path(".bazelrc.user").open("a") as rc:
              rc.write("common --experimental_downloader_config=" + str(config) + "\n")
          PYCFG
      - name: Preserve restored Bazel caches
        run: |
          python3 - <<'PY'
          from pathlib import Path
          lines = [line for line in (Path.home() / '.bazelrc').read_text().splitlines()
                   if line.startswith(('build --disk_cache=', 'common --repository_cache='))]
          assert len(lines) == 2
          with Path('.bazelrc.user').open('a') as output:
              output.write('\n'.join(lines) + '\n')
          PY
      - name: Check original-service fixture and image contracts
        run: python3 -B -m unittest discover -s tools/bazel/tests -p 'mgmt_framework*_test.py'
      - name: Build runtime and debug images from owner TARs
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test ! -e MODULE.bazel.lock
          python3 -B tools/bazel/ci/mgmt_framework_image.py build --bazel "$BAZEL" --artifacts artifacts/mgmt-framework
      - name: Validate completed image contents and matching source symbols
        run: python3 -B tools/bazel/ci/mgmt_framework_image.py validate --artifacts artifacts/mgmt-framework
      - name: Verify no-op and restored image hashes
        run: |
          python3 -B tools/bazel/ci/mgmt_framework_image.py incremental --bazel "$BAZEL" --artifacts artifacts/mgmt-framework
          git diff --exit-code
      - name: Prepare public evidence
        id: public_evidence
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from tools.bazel.ci.public_artifacts import safe_json, dependency_json, bep_summary
          root = Path('artifacts/mgmt-framework')
          root.mkdir(parents=True, exist_ok=True)
          if (root / 'build-receipt.json').exists():
              receipt = json.loads((root / 'build-receipt.json').read_text())
              public = {key: receipt[key] for key in ('status', 'architecture', 'revision', 'tested_revision_parents', 'review_registry_revision', 'artifacts') if key in receipt}
              safe_json(public)
              (root / 'public-receipt.json').write_text(json.dumps(public, indent=2) + '\n')
          for name in ('validation.json', 'incremental.json', 'action-audit.json', 'packages.json', 'debug-packages.json', 'base-packages.json', 'config-engine-packages.json'):
              path = root / name
              if path.exists():
                  safe_json(json.loads(path.read_text()))
          for name, kind in (('MODULE.bazel.lock', 'lock'), ('module-graph.json', 'graph')):
              path = root / name
              if path.exists():
                  dependency_json(json.loads(path.read_text()), kind)
          if (root / 'build-events.jsonl').exists():
              value = bep_summary((root / 'build-events.jsonl').read_text().splitlines(), partial=True)
              (root / 'build-summary.json').write_text(json.dumps(value, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.public_evidence.outcome == 'success'
        with:
          name: mgmt-framework-image-amd64
          path: |
            artifacts/mgmt-framework/*.gz
            artifacts/mgmt-framework/*.tar
            artifacts/mgmt-framework/public-receipt.json
            artifacts/mgmt-framework/validation.json
            artifacts/mgmt-framework/incremental.json
            artifacts/mgmt-framework/action-audit.json
            artifacts/mgmt-framework/packages.json
            artifacts/mgmt-framework/debug-packages.json
            artifacts/mgmt-framework/base-packages.json
            artifacts/mgmt-framework/config-engine-packages.json
            artifacts/mgmt-framework/installed.status
            artifacts/mgmt-framework/debug.status
            artifacts/mgmt-framework/build-summary.json
            artifacts/mgmt-framework/MODULE.bazel.lock
            artifacts/mgmt-framework/module-graph.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 1

  runtime:
    name: Run installed Framework images (AMD64)
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mgmt-framework-image-amd64
          path: artifacts/mgmt-framework
      - name: Verify loaded archives and installed REST and CLI behavior
        run: python3 -B tools/bazel/ci/mgmt_framework_loaded.py --artifacts artifacts/mgmt-framework
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mgmt-framework-runtime-amd64
          path: |
            artifacts/mgmt-framework/*.runtime.json
            artifacts/mgmt-framework/loaded-validation.json
          if-no-files-found: warn
          retention-days: 14

  acceptance:
    name: Source Docker acceptance (AMD64)
    if: always()
    needs: [native, runtime]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require both image construction and installed-service checks
        env:
          BUILD_RESULT: ${{ needs.native.result }}
          RUNTIME_RESULT: ${{ needs.runtime.result }}
        run: |
          test "$BUILD_RESULT" = success
          test "$RUNTIME_RESULT" = success
