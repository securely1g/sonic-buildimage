# Standard pinned GitHub commit archives: original filename, then official delivery host.
# Preserve owner, repository, full commit and each caller's original integrity.
# Exclude tags, branches, short SHAs, other formats, query strings and API URLs.
# Bazel infers an untyped archive's filename from the first rewritten URL,
# including cache hits. Keep .tar.gz first; a failed download still tries codeload.
rewrite ^github\.com/([A-Za-z0-9][A-Za-z0-9-]*)/([A-Za-z0-9][A-Za-z0-9_.-]*)/archive/([0-9a-f]{40})\.tar\.gz$ https://github.com/$1/$2/archive/$3.tar.gz
