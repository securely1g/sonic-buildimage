# Try the original pinned snapshot first; the SONiC mirror can return 503.
rewrite snapshot\.debian\.org/(.*) https://snapshot.debian.org/$1
# Keep SONiC mirrors as package fallbacks without changing locked checksums.
# Package indexes must retain their original snapshot timestamp.
rewrite snapshot\.debian\.org/archive/debian/20260727T143429Z/(pool/.*) https://packages.trafficmanager.net/snapshot/debian/20260727T000818Z/$1
rewrite snapshot\.debian\.org/archive/debian-security/20260726T121236Z/(pool/.*) https://packages.trafficmanager.net/snapshot/debian-security/20260727T000824Z/$1
# Normalize the mirror URLs already recorded in the image locks.
rewrite packages\.trafficmanager\.net/snapshot/debian/20260727T000818Z/(.*) https://packages.trafficmanager.net/snapshot/debian/20260727T000818Z/$1
rewrite packages\.trafficmanager\.net/snapshot/debian-security/20260726T000750Z/(.*) https://packages.trafficmanager.net/snapshot/debian-security/20260727T000824Z/$1

